<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/Yang-City/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 · 这一段城界不存在 — 杨城</title>
<style>
  :root{--bg:#070a10;--panel:#0d131c;--line:#1b2534;--tx:#dfe9f5;--tx2:#8fa3ba;--tx3:#5d7089;--ac:#5fd0e8;--gold:#e2b96a;
        --mono:"Consolas","ui-monospace","SF Mono",monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:32px 20px;background:var(--bg);color:var(--tx);
       font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       background-image:radial-gradient(ellipse 900px 520px at 50% -10%,rgba(95,208,232,.10),transparent 68%),
                        radial-gradient(ellipse 760px 460px at 50% 112%,rgba(226,185,106,.07),transparent 70%)}
  .wrap{width:100%;max-width:660px}
  .kicker{font:600 9.5px/1 var(--mono);letter-spacing:3px;color:var(--tx3);display:flex;align-items:center;gap:9px}
  .kicker i{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(226,185,106,.16)}
  .code{font:800 64px/1 var(--mono);color:var(--gold);letter-spacing:4px;margin:18px 0 6px}
  h1{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:.5px;margin:0 0 12px}
  .lede{font-size:13px;line-height:2;color:var(--tx2);max-width:56ch;margin-bottom:24px}
  .lede b{color:var(--tx)}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{display:block;padding:14px 16px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid var(--line);
        background:linear-gradient(150deg,rgba(255,255,255,.045),transparent 70%);transition:border-color .16s,transform .16s}
  .card:hover{border-color:rgba(95,208,232,.42);transform:translateY(-2px)}
  .card b{display:block;font-size:14px;margin-bottom:4px}
  .card span{font-size:11.5px;color:var(--tx2);line-height:1.7}
  .note{margin-top:24px;padding-top:15px;border-top:1px solid var(--line);font:400 11.5px/1.9 var(--mono);color:var(--tx3)}
  .note code{color:var(--gold);word-break:break-all}
  @media(max-width:560px){.links{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker"><i></i>YANGCHENG · 404</div>
  <div class="code">404</div>
  <h1>这一段城界不存在</h1>
  <p class="lede">
    你要的地址没有被这座城登记。<b>城市只保证已收录的街区与六个馆可通行</b>，
    其余路径一律回退到这里——这不是你的错，也不是城的错，只是没有登记。
  </p>
  <div class="links">
    <a class="card" href="/Yang-City/yangcheng/index.html">
      <b>17 区导览总图 →</b>
      <span>平面总览，点击区域进入三维街区</span>
    </a>
    <a class="card" href="/Yang-City/yangcheng/map.html">
      <b>全城鸟瞰 →</b>
      <span>三维城市，六馆与公共证据厅全入口</span>
    </a>
  </div>
  <div class="note">
    请求的路径：<code id="path">—</code><br>
    老馆固定地址为 /Yang-City/h1-lab.html，不在此页兜底范围内。
  </div>
</div>
<script>
  document.getElementById("path").textContent = decodeURI(location.pathname + location.search);
</script>
</body>
</html>
