<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预算塔 · 十层 — 杨城 H6 潜能与预算博物馆</title>
<meta name="description" content="十层塔，每层一个指标门槛。每层只能用一次「加倍采样 / 调温 / 检修」，十次机会走完，多一次都没有。">
<link rel="stylesheet" href="shared/yc-core.css">
<link rel="stylesheet" href="shared/yc-deep.css">
<link rel="stylesheet" href="shared/yc-cast.css">
<style>
/* ==========================================================================
   H6 精英挑战 · 预算塔 · 十层
   与 H2 案卷、H3 迷宫、H4 净化车间、H5 预报台都不同：
   这是**竖向塔层**的构筑式解谜 —— 左边一座塔，右边一台读数仪。
   所有类名 tw- 前缀。
   ========================================================================== */
:root{
  --tw-bg:#060a14;
  --tw-bg2:#0a1120;
  --tw-panel:rgba(14,22,40,.9);
  --tw-line:rgba(109,155,255,.16);
  --tw-line2:rgba(109,155,255,.34);
  --tw-tx:#e2ecff;
  --tw-tx2:#93a6c8;
  --tw-tx3:#5d6d8c;
  --tw-ac:#6d9bff;
  --tw-gold:#c9a227;
  --tw-green:#a3e34a;
  --tw-red:#ff6b8a;
  --tw-mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* 覆盖 yc-core.css 的固定视口：body{overflow:hidden} 会传播到视口，滚轮全废。
   本页在 1280×720 下内容 818px > 视口，底部会被切掉且够不着。
   1440×900 下不出现滚动条（刚好装得下），只有视口更矮时才靠它兜底。 */
html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{height:auto;overflow:visible}
body{
  background:
    radial-gradient(ellipse 64% 44% at 20% -8%,rgba(109,155,255,.14),transparent 66%),
    radial-gradient(ellipse 50% 40% at 88% 104%,rgba(163,227,74,.07),transparent 70%),
    linear-gradient(180deg,#060a14 0%,#0a1120 56%,#04070e 100%);
  color:var(--tw-tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg,rgba(109,155,255,.022) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(109,155,255,.016) 0 1px,transparent 1px 4px);
}
.twwrap{position:relative;z-index:1;max-width:1340px;margin:0 auto;padding:0 20px 56px}

/* ---------------- 顶栏 ---------------- */
.twbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:13px 0 12px;border-bottom:1px solid var(--tw-line2);
}
.twbar .bk{
  color:var(--tw-ac);text-decoration:none;font-size:13px;
  border:1px solid var(--tw-line2);border-radius:7px;padding:6px 11px;
  transition:background .16s;
}
.twbar .bk:hover{background:rgba(109,155,255,.1)}
.twttl b{display:block;font-size:16px;letter-spacing:.5px}
.twttl span{
  display:block;font-family:var(--tw-mono);font-size:10.5px;letter-spacing:2.4px;
  color:var(--tw-tx3);margin-top:3px;
}
.twbar .sp{flex:1}
.twrep{display:flex;align-items:center;gap:8px}
.twrep .lb{font-size:11.5px;color:var(--tw-tx3)}
.twrep .pips{display:flex;gap:4px}
.twrep .pips i{
  width:11px;height:11px;border-radius:50%;
  background:rgba(163,227,74,.14);border:1px solid rgba(163,227,74,.28);
  transition:all .2s;
}
.twrep .pips i.on{background:var(--tw-green);border-color:var(--tw-green);box-shadow:0 0 9px rgba(163,227,74,.6)}
.twrep .pips i.off{background:rgba(255,107,138,.14);border-color:rgba(255,107,138,.3)}
.twfloornow{
  font-family:var(--tw-mono);font-size:12px;color:var(--tw-tx3);
}
.twfloornow b{color:var(--tw-ac);font-size:17px}

/* ---------------- 主栅格 ---------------- */
.twmain{
  display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;
  margin-top:18px;align-items:start;
}

/* ---------------- 左：塔 ---------------- */
.twtower{display:flex;flex-direction:column-reverse;gap:5px}
.twlv{
  position:relative;display:flex;align-items:center;gap:9px;
  padding:9px 11px;border-radius:8px;
  background:rgba(109,155,255,.035);border:1px solid var(--tw-line);
  transition:all .22s;
}
.twlv .no{
  font-family:var(--tw-mono);font-size:10px;color:var(--tw-tx3);width:18px;flex:none;
}
.twlv .nm{font-size:11.5px;color:var(--tw-tx3);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.twlv .st{font-family:var(--tw-mono);font-size:10px;color:var(--tw-tx3);flex:none}
.twlv.past{background:rgba(163,227,74,.06);border-color:rgba(163,227,74,.24)}
.twlv.past .nm{color:var(--tw-tx2)}
.twlv.past .st{color:var(--tw-green)}
.twlv.fail{background:rgba(255,107,138,.07);border-color:rgba(255,107,138,.28)}
.twlv.fail .st{color:var(--tw-red)}
.twlv.now{
  background:rgba(109,155,255,.16);border-color:var(--tw-ac);
  box-shadow:0 0 0 1px rgba(109,155,255,.3) inset,0 0 22px rgba(109,155,255,.18);
  transform:translateX(4px);
}
.twlv.now .no{color:var(--tw-ac)}
.twlv.now .nm{color:var(--tw-tx);font-weight:600}
.twlv.now .st{color:var(--tw-ac)}
.twlv.lock{opacity:.42}

/* ---------------- 右：读数与行动 ---------------- */
.twright{display:flex;flex-direction:column;gap:13px;min-width:0}

.twgoal{
  padding:15px 18px;border-radius:12px;
  background:linear-gradient(180deg,rgba(14,24,44,.95),rgba(7,13,26,.95));
  border:1px solid var(--tw-line2);position:relative;overflow:hidden;
}
.twgoal::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 60% at 20% 0%,rgba(109,155,255,.1),transparent 70%);
}
.twgoal .gk{
  font-family:var(--tw-mono);font-size:10px;letter-spacing:2.2px;
  color:var(--tw-ac);margin-bottom:7px;
}
.twgoal .gt{font-size:19px;font-weight:700;letter-spacing:.4px;margin-bottom:6px;position:relative}
.twgoal .gd{font-size:12.5px;color:var(--tw-tx2);line-height:1.8;position:relative}
.twgoal .gd b{color:var(--tw-tx)}

/* HUD */
.twhud{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.twhud .c{
  background:rgba(109,155,255,.05);border:1px solid var(--tw-line);
  border-radius:9px;padding:10px 11px;
}
.twhud .c .l{font-size:10.5px;color:var(--tw-tx3);margin-bottom:5px}
.twhud .c .v{font-family:var(--tw-mono);font-size:18px;line-height:1.1}
.twhud .c .n{font-size:9.5px;color:var(--tw-tx3);margin-top:4px;font-family:var(--tw-mono)}
.twhud .c.hi .v{color:var(--tw-ac)}
.twhud .c.warn .v{color:var(--tw-gold)}
.twhud .c.bad .v{color:var(--tw-red)}

/* 行动 */
.twacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.twact{
  text-align:left;cursor:pointer;padding:12px 13px;border-radius:10px;
  background:rgba(109,155,255,.055);border:1px solid rgba(109,155,255,.22);
  color:var(--tw-tx);transition:all .16s;position:relative;
}
.twact:hover:not(:disabled){background:rgba(109,155,255,.14);border-color:var(--tw-ac);transform:translateY(-1px)}
.twact:disabled{opacity:.32;cursor:not-allowed;transform:none}
.twact .ah{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.twact .ah .ic{font-size:14px}
.twact .ah .nm{font-size:13px;font-weight:600}
.twact .ah .df{
  margin-left:auto;font-family:var(--tw-mono);font-size:10.5px;color:var(--tw-gold);
  border:1px solid rgba(201,162,39,.3);border-radius:5px;padding:1px 6px;
}
.twact .ap{
  font-family:var(--tw-mono);font-size:10.5px;color:var(--tw-tx3);line-height:1.9;
}
.twact .ap b{color:var(--tw-tx2)}
.twact .ap .up{color:var(--tw-green)}
.twact .ap .dn{color:var(--tw-red)}
.twact.fix{grid-column:span 2}

/* 行动记录 */
.twlog{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
.twlog .r{
  display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:center;
  padding:7px 10px;border-radius:7px;font-size:11.5px;
  background:rgba(109,155,255,.035);border:1px solid var(--tw-line);
}
.twlog .r .n{font-family:var(--tw-mono);font-size:10px;color:var(--tw-tx3)}
.twlog .r .d{color:var(--tw-tx2)}
.twlog .r .d b{color:var(--tw-tx)}
.twlog .r .v{font-family:var(--tw-mono);font-size:10.5px}
.twlog .r .v.ok{color:var(--tw-green)}
.twlog .r .v.no{color:var(--tw-red)}
.twlog .none{font-size:12px;color:var(--tw-tx3);text-align:center;padding:12px 0}

/* 卡面 */
.twcard{
  padding:13px 16px;border-radius:11px;
  background:var(--tw-panel);border:1px solid var(--tw-line);
}
.twcard>.hd{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.twcard>.hd h3{margin:0;font-size:13px;letter-spacing:.6px}
.twcard>.hd .k{
  margin-left:auto;font-family:var(--tw-mono);font-size:9.5px;
  letter-spacing:1.6px;color:var(--tw-tx3);
}

/* 结算 */
.twend{
  margin-top:14px;padding:24px;border-radius:14px;
  background:linear-gradient(180deg,rgba(201,162,39,.09),rgba(7,13,26,.95));
  border:1px solid rgba(201,162,39,.34);
}
.twend .eh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.twend .eh h2{margin:0;font-size:22px;letter-spacing:.6px}
.twend .eh .sc{font-family:var(--tw-mono);font-size:30px;color:var(--tw-gold);margin-left:auto}
.twend .eh .sc small{font-size:13px;color:var(--tw-tx3)}
.twend .es{font-size:13px;color:var(--tw-tx2);line-height:1.9;margin-bottom:16px}
.twend .parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.twend .parts .p{
  background:rgba(109,155,255,.05);border:1px solid var(--tw-line);
  border-radius:9px;padding:11px 12px;
}
.twend .parts .p .pl{font-size:10.5px;color:var(--tw-tx3);margin-bottom:5px}
.twend .parts .p .pv{font-family:var(--tw-mono);font-size:18px}
.twend .parts .p .pn{font-size:10px;color:var(--tw-tx3);margin-top:4px}
.twend .certbox{
  border-radius:11px;padding:16px;border:1px dashed rgba(201,162,39,.4);
  background:rgba(201,162,39,.05);
}
.twend .certbox .ct{font-size:14px;font-weight:700;color:var(--tw-gold);margin-bottom:6px}
.twend .certbox .cd{font-size:12.5px;color:var(--tw-tx2);line-height:1.8}
.twend .certbox .cn{
  font-family:var(--tw-mono);font-size:12px;color:var(--tw-gold);
  margin-top:9px;letter-spacing:.5px;
}
.twend .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.twend .btnrow button{
  padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;
  background:var(--tw-gold);border:none;color:#1a1405;font-weight:700;
}
.twend .btnrow button.ghost{background:transparent;border:1px solid var(--tw-line2);color:var(--tw-tx2);font-weight:500}

/* ---------------- 窄屏 ---------------- */
@media (max-width:1040px){
  .twmain{grid-template-columns:1fr}
  .twtower{
    flex-direction:row;overflow-x:auto;padding-bottom:6px;
  }
  .twlv{flex-direction:column;min-width:76px;text-align:center;gap:3px;padding:8px 6px}
  .twlv.now{transform:none;box-shadow:0 0 0 1px rgba(109,155,255,.4) inset}
  .twlv .nm{white-space:normal;font-size:10px}
  .twhud{grid-template-columns:repeat(3,minmax(0,1fr))}
  .twend .parts{grid-template-columns:1fr}
}
@media (max-width:640px){
  .twwrap{padding:0 12px 40px}
  .twacts{grid-template-columns:1fr}
  .twact.fix{grid-column:span 1}
  .twhud{grid-template-columns:1fr 1fr}
  .twend{padding:16px}
  .twend .eh .sc{font-size:24px}
}
</style>
</head>
<div class="twwrap">

  <header class="twbar">
    <a class="bk" href="h6-budget.html">← 回预算馆</a>
    <div class="twttl">
      <b>预算塔 · 十层</b>
      <span>BUDGET TOWER · H6 ANNEX · 精英挑战</span>
    </div>
    <div class="sp"></div>
    <div class="twrep">
      <span class="lb">信誉</span>
      <span class="pips" id="rep"></span>
    </div>

  </header>

  <div class="twmain">

    <!-- ==================== 左：塔 ==================== -->
    <div class="twtower" id="tower"></div>

    <!-- ==================== 右：读数与行动 ==================== -->
    <div class="twright">

      <div class="twgoal" id="goal"></div>

      <div class="twhud" id="hud"></div>

      <div class="twcard">
        <div class="hd"><h3>本层行动 · 只能选一个</h3><span class="k">ACTION</span></div>
        <div class="twacts" id="acts"></div>
      </div>

      <div class="twcard">
        <div class="hd"><h3>登塔记录</h3><span class="k">LOG</span></div>
        <div class="twlog" id="log"><div class="none">还没有记录。</div></div>
      </div>

    </div>
  </div>

  <div id="endBox"></div>
</div>
<script>
/* ============================================================
   yc-dome.js — H6 潜能与预算博物馆 · 预算穹顶引擎  v0.1.0
   ------------------------------------------------------------
   问题：加预算，买到的是能力，还是买到了「至少有一次」？

   这一版不画「一条随预算上升的曲线」。它做四件别处没做的事：

   ① 把失败拆成三种互不相同的病
      reach  可达但稀有 —— 正确答案在支持集里，只是概率低
      near   近失 —— 产出了「差一步」的答案，被严格判分判成错
      void   不可达 —— 正确答案根本不在支持集里，采样多少次都是 0
      只看 pass@k 会把三者混成一个数；而它们的处方完全不同：
      加预算治 reach，改判分口径治 near，换模型才治 void。

   ② 区分「名义预算」与「有效预算」
      k 次采样不一定是 k 份独立证据。若 k 次里只有 d 个不同答案，
      有效预算就是 d 而不是 k。leak = 1 - d/k 是预算泄漏率。
      预算泄漏高的时候，「加预算」只是把同一个答案又抽了一遍。

   ③ 把 oracle 和现实分开报
      pass@k 假设你有一个完美的选择器：k 个里有一个对就算对。
      现实里你必须挑一个。vote@k 是多数表决，greedy@1 是直接取最高概率。
      三者之间的差是「选择器赤字」—— 它随 k 变大，不随 k 变小。

   ④ 给出可被自己证伪的归因
      若预算真的只治 reach，那么八倍预算带来的提升应当**全部**落在
      reach 任务上，而不可达任务的命中率提升必须**严格等于 0**。
      这一条能被推翻：只要不可达任务多命中一次，归因就错。

   随机数用 mulberry32（H4 教训：xorshift32 前一两百个输出对低位有偏）。
   ============================================================ */
(function (root) {
  "use strict";

  var VERSION = "0.1.0";
  var KMAX = 256;
  var LADDER = [1, 2, 4, 8, 16, 32, 64, 128, 256];
  var DEF = { seed: 20311101, k: 32, tau: 1.0 };

  function mulberry32(a) {
    a = (a >>> 0) || 0x9e3779b9;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }
  function mean(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s / a.length; }

  /* ---------------- 世界：一批任务，每个任务一个「能说出什么」的支持集 ---------------- */
  function buildWorld(opt) {
    opt = opt || {};
    var seed = opt.seed == null ? DEF.seed : opt.seed;
    var nReach = opt.nReach == null ? 80 : opt.nReach;
    var nVoid = opt.nVoid == null ? 40 : opt.nVoid;
    var forceP = opt.forceP == null ? null : opt.forceP;   // 负例用：把可达任务的命中概率钉死
    var rnd = mulberry32(seed);
    var tasks = [];
    var total = nReach + nVoid;

    for (var i = 0; i < total; i++) {
      var reach = i < nReach;
      var g = 100 + Math.floor(rnd() * 900);
      var nDis = 3 + Math.floor(rnd() * 10);              // 3—12 个干扰答案
      var sup = [];
      // 不可达任务分两种：会给出「差一步」的答案，或压根不靠近。
      // 这个区别很重要 —— 沉默的模型和自信地答错的模型，处方不一样。
      var hasNear = !reach && rnd() < 0.62;

      if (reach) {
        // 两类任务：一类「首选就常对」，一类「会说但很少先说」
        // 真实模型就是这样分层的，而不是所有任务都同样稀薄
        var pw;
        if (forceP == null) {
          pw = rnd() < 0.45
            ? 0.55 + rnd() * 0.45                       // 首选正确：greedy 就能拿到
            : 0.0025 * Math.pow(2, rnd() * 4.8);        // 稀有正确：只能靠采样碰
        } else pw = forceP;
        sup.push({ v: g, w: pw });
      }

      for (var j = 0; j < nDis; j++) {
        // 只有「不可达且不靠近」的任务才强制偏移 ≥2，其余任务都可以有近邻
        var step = (reach || hasNear) ? (1 + Math.floor(rnd() * 3)) : (2 + Math.floor(rnd() * 2));
        var sign = rnd() < 0.5 ? 1 : -1;
        var v = g + sign * step;
        if (v === g) v = g + 9;
        var dup = false;
        for (var q = 0; q < sup.length; q++) if (sup[q].v === v) { dup = true; break; }
        if (dup) v = g + 11 + j;
        sup.push({ v: v, w: (0.05 + rnd() * 0.45) / (1 + j * 0.22) });
      }

      // 会「差一步」的不可达任务：保证至少有一个近邻存在
      if (hasNear) {
        var ok = false;
        for (var z = 0; z < sup.length; z++) if (Math.abs(sup[z].v - g) === 1) { ok = true; break; }
        if (!ok) sup.push({ v: g + 1, w: 0.10 + rnd() * 0.25 });
      }

      tasks.push({ id: i, kind: reach ? "reach" : "void", g: g, sup: sup, hasNear: hasNear });
    }

    return { seed: seed, tasks: tasks, nReach: nReach, nVoid: nVoid, total: total };
  }

  /* ---------------- 温度：w^(1/τ) 归一化 ---------------- */
  function probs(task, tau) {
    var t = Math.max(0.05, tau);
    var inv = 1 / t, s = 0, i;
    var w = new Array(task.sup.length);
    for (i = 0; i < task.sup.length; i++) { w[i] = Math.pow(Math.max(1e-9, task.sup[i].w), inv); s += w[i]; }
    for (i = 0; i < w.length; i++) w[i] /= s;
    return w;
  }

  function pTruth(task, tau) {
    if (task.kind !== "reach") return 0;
    var w = probs(task, tau);
    for (var i = 0; i < task.sup.length; i++) if (task.sup[i].v === task.g) return w[i];
    return 0;
  }

  /* ---------------- 采样：一次抽满 KMAX，用前缀保证 pass@k 单调 ---------------- */
  function drawTask(task, tau, rnd) {
    var w = probs(task, tau);
    var cum = new Array(w.length), c = 0, i;
    for (i = 0; i < w.length; i++) { c += w[i]; cum[i] = c; }
    var out = new Array(KMAX);
    for (var n = 0; n < KMAX; n++) {
      var u = rnd(), lo = 0, hi = cum.length - 1;
      while (lo < hi) { var mid = (lo + hi) >> 1; if (u <= cum[mid]) hi = mid; else lo = mid + 1; }
      out[n] = task.sup[lo].v;
    }
    return { vals: out, p: w };
  }

  /* ---------------- 主运行 ---------------- */
  function run(opt) {
    opt = opt || {};
    var world = opt.world || buildWorld(opt);
    var k = clamp(Math.round(opt.k == null ? DEF.k : opt.k), 1, KMAX);
    var tau = opt.tau == null ? DEF.tau : opt.tau;
    // 种子只依赖 τ，不依赖 k —— 这样「同一批采样、只改预算」是严格的嵌套对照
    var rnd = mulberry32((world.seed ^ 0x5bf03635 ^ (Math.round(tau * 1000) * 2654435761)) >>> 0);

    var L = LADDER.slice();
    if (L.indexOf(k) < 0) { L.push(k); L.sort(function (a, b) { return a - b; }); }

    var perTask = [];
    var agg = {};
    L.forEach(function (kk) {
      agg[kk] = { hit: 0, nearOnly: 0, cold: 0, vote: 0, reachHit: 0, voidHit: 0,
                  nReach: 0, nVoid: 0, eff: 0, greedy: 0 };
    });

    for (var ti = 0; ti < world.tasks.length; ti++) {
      var task = world.tasks[ti];
      var d = drawTask(task, tau, rnd);
      var counts = {}, distinct = 0;
      var hit = false, near = false;
      var li = 0;
      var snap = {};

      var greedyOK = false;
      var bestI = 0;
      for (var gi = 1; gi < d.p.length; gi++) if (d.p[gi] > d.p[bestI]) bestI = gi;
      greedyOK = (task.sup[bestI].v === task.g);

      for (var n = 0; n < KMAX; n++) {
        var v = d.vals[n];
        if (counts[v] == null) { counts[v] = 1; distinct++; } else counts[v]++;
        if (v === task.g) hit = true;
        if (Math.abs(v - task.g) === 1) near = true;

        while (li < L.length && L[li] === n + 1) {
          var kk = L[li];
          var modeV = null, modeC = -1;
          for (var key in counts) { if (counts[key] > modeC) { modeC = counts[key]; modeV = key; } }
          snap[kk] = { hit: hit, near: near, distinct: distinct, mode: modeV, modeC: modeC };
          li++;
        }
      }

      perTask.push({
        id: task.id, kind: task.kind, g: task.g, nSup: task.sup.length,
        pTruth: pTruth(task, tau), greedyOK: greedyOK,
        hit: snap[k].hit, near: snap[k].near, distinct: snap[k].distinct,
        mode: snap[k].mode, modeC: snap[k].modeC,
        vals: d.vals.slice(0, k)
      });

      L.forEach(function (kk) {
        var s = snap[kk], a = agg[kk];
        if (s.hit) a.hit++;
        else if (s.near) a.nearOnly++;
        else a.cold++;
        if (String(s.mode) === String(task.g)) a.vote++;
        if (task.kind === "reach") { a.nReach++; if (s.hit) a.reachHit++; }
        else { a.nVoid++; if (s.hit) a.voidHit++; }
        a.eff += s.distinct;
        if (greedyOK) a.greedy++;
      });
    }

    var T = world.tasks.length;
    function norm(kk) {
      var a = agg[kk];
      return {
        k: kk,
        pass: a.hit / T,
        nearOnly: a.nearOnly / T,
        cold: a.cold / T,
        vote: a.vote / T,
        greedy: a.greedy / T,
        reachHit: a.nReach ? a.reachHit / a.nReach : 0,
        voidHit: a.nVoid ? a.voidHit / a.nVoid : 0,
        nEff: a.eff / T,
        leak: 1 - (a.eff / T) / kk
      };
    }

    var now = norm(k);
    var at1 = norm(1);
    var atMax = norm(KMAX);
    var unreachable = world.nVoid / T;
    var ceiling = world.nReach / T;

    now.gain = now.pass - at1.pass;
    now.deficit = now.pass - now.vote;
    now.unreachable = unreachable;
    now.ceiling = ceiling;
    now.headroom = ceiling - now.pass;
    now.at1 = at1;
    now.atMax = atMax;
    now.ladder = L.map(norm);
    now.tasks = perTask;
    now.world = { seed: world.seed, total: T, nReach: world.nReach, nVoid: world.nVoid };
    now.tau = tau;

    /* ---- 判定：三件事分开报，不合并成一个数 ---- */
    var v = { verdict: "supported", subtype: "gain", why: "" };

    if (T < 24) {
      v.verdict = "undetermined"; v.subtype = "few";
      v.why = "任务只有 " + T + " 条，不到 24 条。任务太少时，pass@k 的抖动与任务之间的差异混在一起，无法判断是预算起作用还是这一批任务恰好容易。";
    } else if (k < 8) {
      v.verdict = "undetermined"; v.subtype = "short";
      v.why = "预算只有 " + k + " 次。八次以下连「稀有但可达」的任务都还没抽到，此时报「预算无效」是把预算不足误读成能力不足。";
    } else if (now.nEff <= 1.6) {
      v.verdict = "undetermined"; v.subtype = "leak";
      v.why = "名义预算 " + k + " 次，实际只说出 " + now.nEff.toFixed(1) + " 个不同答案。采样几乎全落在同一个答案上，这时「加预算」只是把同一个答案又抽了一遍，谈预算效果没有意义——先把多样性修好。";
    } else if (now.gain < 0.02) {
      v.verdict = "refuted"; v.subtype = "flat";
      v.why = "从 1 次加到 " + k + " 次，命中率只动了 " + (now.gain * 100).toFixed(1) + " 个百分点。这批任务不需要更多采样——它们要么本来就会，要么怎么抽都不会。";
    } else if (now.headroom > 0.10) {
      v.verdict = "supported"; v.subtype = "gain";
      v.why = "预算有效：命中率从 " + (at1.pass * 100).toFixed(1) + "% 抬到 " + (now.pass * 100).toFixed(1) + "%。但天花板是 " + (ceiling * 100).toFixed(1) + "%，还差 " + (now.headroom * 100).toFixed(1) + " 个百分点要靠继续加预算去够。";
    } else {
      v.verdict = "supported"; v.subtype = "saturate";
      v.why = "预算已经饱和：命中率 " + (now.pass * 100).toFixed(1) + "%，与可达上限 " + (ceiling * 100).toFixed(1) + "% 只差 " + (now.headroom * 100).toFixed(1) + " 个百分点。再加预算不会更好了——剩下 " + (unreachable * 100).toFixed(1) + "% 的任务根本不在支持集里。";
    }

    v.ceiling = ceiling;
    v.unreachable = unreachable;
    v.deficit = now.deficit;
    v.gain = now.gain;

    return {
      k: k, tau: tau, verdict: v.verdict, subtype: v.subtype, why: v.why,
      pass: now.pass, vote: now.vote, greedy: now.greedy, nEff: now.nEff, leak: now.leak,
      nearOnly: now.nearOnly, cold: now.cold, reachHit: now.reachHit, voidHit: now.voidHit,
      gain: now.gain, deficit: now.deficit, ceiling: ceiling, unreachable: unreachable,
      headroom: now.headroom,
      ladder: now.ladder, tasks: perTask, world: now.world,
      at1: at1, atMax: atMax
    };
  }

  /* ---------------- 归因：同一批任务，只改预算与多样性 ---------------- */
  function decompose(opt) {
    opt = opt || {};
    var world = opt.world || buildWorld(opt);
    var A = run({ world: world, k: 8, tau: 1.0 });
    var B = run({ world: world, k: 64, tau: 1.0 });
    var C = run({ world: world, k: 8, tau: 2.2 });
    var D = run({ world: world, k: 64, tau: 2.2 });

    var preds = [
      {
        id: "budget",
        label: "八倍预算会抬高命中率",
        detail: "A(k=8) → B(k=64)：命中率至少 +0.10",
        pass: (B.pass - A.pass) >= 0.10,
        got: "A " + (A.pass * 100).toFixed(1) + "% → B " + (B.pass * 100).toFixed(1) + "%（+" + ((B.pass - A.pass) * 100).toFixed(1) + "pp）"
      },
      {
        id: "void",
        label: "提升全部来自可达任务，不可达任务一次都不多",
        detail: "B.voidHit − A.voidHit 必须严格等于 0，同时 B.reachHit − A.reachHit > 0.20",
        pass: (Math.abs(B.voidHit - A.voidHit) < 1e-12) && (B.reachHit - A.reachHit > 0.20),
        got: "不可达 " + (A.voidHit * 100).toFixed(2) + "% → " + (B.voidHit * 100).toFixed(2) + "%，可达 " + (A.reachHit * 100).toFixed(1) + "% → " + (B.reachHit * 100).toFixed(1) + "%"
      },
      {
        id: "diversity",
        label: "同样的预算，提高多样性会抬高有效预算",
        detail: "D(k=64, τ=2.2) 的有效预算必须高于 B(k=64, τ=1.0)",
        pass: D.nEff > B.nEff,
        got: "有效预算 B " + B.nEff.toFixed(2) + " → D " + D.nEff.toFixed(2)
      }
    ];

    return {
      arms: [
        { id: "A", label: "基线", k: A.k, tau: A.tau, pass: A.pass, vote: A.vote, nEff: A.nEff, leak: A.leak, deficit: A.deficit },
        { id: "B", label: "八倍预算", k: B.k, tau: B.tau, pass: B.pass, vote: B.vote, nEff: B.nEff, leak: B.leak, deficit: B.deficit },
        { id: "C", label: "八倍多样性", k: C.k, tau: C.tau, pass: C.pass, vote: C.vote, nEff: C.nEff, leak: C.leak, deficit: C.deficit },
        { id: "D", label: "两者都加", k: D.k, tau: D.tau, pass: D.pass, vote: D.vote, nEff: D.nEff, leak: D.leak, deficit: D.deficit }
      ],
      preds: preds,
      allPass: preds.every(function (p) { return p.pass; })
    };
  }

  /* ---------------- 温度扫描：多样性与精度是一对 ---------------- */
  function sweepTau(opt) {
    opt = opt || {};
    var world = opt.world || buildWorld(opt);
    var k = opt.k == null ? 32 : opt.k;
    var taus = [0.3, 0.5, 0.7, 1.0, 1.4, 1.9, 2.6, 3.4];
    return taus.map(function (t) {
      var r = run({ world: world, k: k, tau: t });
      return { tau: t, pass: r.pass, vote: r.vote, nEff: r.nEff, leak: r.leak, deficit: r.deficit };
    });
  }

  /* ---------------- 自检：仪器先把自己验回来 ---------------- */
  function selfCheck() {
    var out = [];

    // 1. 吸收性：不可达任务在任何预算下都不可能命中
    var w1 = buildWorld({ seed: 20311101 });
    var r1 = run({ world: w1, k: 256, tau: 1.0 });
    var zero = 0, tot = 0;
    r1.tasks.forEach(function (t) { if (t.kind === "void") { tot++; if (!t.hit) zero++; } });
    out.push({
      id: "absorb", name: "吸收性",
      pass: zero === tot && tot > 0,
      detail: "不可达任务在 256 次采样下命中 0 次：" + zero + "/" + tot,
      note: "支持集里没有正确答案，采样再多也不该撞上。这条不成立，说明判分或采样有 bug。"
    });

    // 2. 单调性：pass@k 必须随预算非减
    var mono = true, bad = 0;
    for (var i = 1; i < r1.ladder.length; i++) {
      if (r1.ladder[i].pass + 1e-12 < r1.ladder[i - 1].pass) { mono = false; bad++; }
    }
    out.push({
      id: "mono", name: "单调性",
      pass: mono,
      detail: "阶梯 " + r1.ladder.length + " 级，逆序 " + bad + " 处",
      note: "「k 个里有一个对」是累积事件，预算变多不可能让命中率下降。用嵌套前缀采样保证这条。"
    });

    // 3. 饱和性：足够常见的可达任务，在 256 次里几乎必中
    var rare = r1.tasks.filter(function (t) { return t.kind === "reach" && t.pTruth >= 0.03; });
    var hit = rare.filter(function (t) { return t.hit; }).length;
    out.push({
      id: "sat", name: "饱和性",
      pass: rare.length > 0 && hit === rare.length,
      detail: "p≥0.03 的可达任务在 256 次下全部命中：" + hit + "/" + rare.length,
      note: "如果连常见任务都抽不到，问题不在预算，在采样器。"
    });

    // 4. 无泄漏极限：温度压到极低时，一个任务几乎只会说同一个答案
    var w4 = buildWorld({ seed: 20311101 });
    var r4 = run({ world: w4, k: 64, tau: 0.05 });
    var eff4 = r4.nEff;
    out.push({
      id: "collapse", name: "无泄漏极限",
      pass: eff4 <= 1.6,
      detail: "τ=0.05 时每任务有效答案 " + eff4.toFixed(2) + " 个（应 ≈1）",
      note: "温度趋零时分布退化成单点，有效预算必须是 1。这条是「有效预算」这个量本身的校准。"
    });

    // 5. 投票上界：oracle 选择不可能比多数表决更差
    var ok5 = r1.ladder.every(function (p) { return p.vote <= p.pass + 1e-12; });
    out.push({
      id: "upper", name: "投票上界",
      pass: ok5,
      detail: "阶梯 " + r1.ladder.length + " 级，vote@k ≤ pass@k 全部成立",
      note: "k 个里有对的，就一定存在一种选择方式能选中它；多数表决只是其中一种，不可能更好。"
    });

    return out;
  }

  /* ---------------- 负例：每条拒判线都要有真实触发 ---------------- */
  function negatives() {
    var cases = [
      {
        id: "few", label: "任务太少", opt: { nReach: 10, nVoid: 6, k: 32 },
        check: function (r) {
          return { pass: r.verdict === "undetermined" && r.subtype === "few", got: r.verdict + "/" + r.subtype };
        }
      },
      {
        id: "short", label: "预算太小", opt: { k: 4 },
        check: function (r) {
          return { pass: r.verdict === "undetermined" && r.subtype === "short", got: r.verdict + "/" + r.subtype };
        }
      },
      {
        id: "leak", label: "预算泄漏", opt: { k: 64, tau: 0.05 },
        check: function (r) {
          return { pass: r.verdict === "undetermined" && r.subtype === "leak", got: r.verdict + "/" + r.subtype + "（有效预算 " + r.nEff.toFixed(1) + "）" };
        }
      },
      {
        id: "flat", label: "预算无效", opt: { k: 64, forceP: 120 },
        check: function (r) {
          return { pass: r.verdict === "refuted" && r.subtype === "flat", got: r.verdict + "/" + r.subtype + "（增益 " + (r.gain * 100).toFixed(1) + "pp）" };
        }
      },
      {
        id: "nofloor", label: "没有不可达任务", opt: { nVoid: 0, k: 32 },
        check: function (r) {
          // 世界里没有不可达任务时，天花板必须被测成 100%，且不许出现「永远到不了」的结论
          return {
            pass: Math.abs(r.ceiling - 1) < 1e-12 && r.unreachable === 0 && r.verdict === "supported",
            got: "天花板 " + (r.ceiling * 100).toFixed(0) + "% / 不可达 " + (r.unreachable * 100).toFixed(0) + "% / " + r.verdict + "/" + r.subtype
          };
        }
      }
    ];
    return cases.map(function (c) {
      var w = buildWorld({ seed: 20311101, nReach: c.opt.nReach, nVoid: c.opt.nVoid, forceP: c.opt.forceP });
      var r = run({ world: w, k: c.opt.k, tau: c.opt.tau == null ? 1.0 : c.opt.tau });
      var res = c.check(r);
      return { id: c.id, label: c.label, pass: res.pass, got: res.got, why: r.why };
    });
  }

  var API = {
    VERSION: VERSION, KMAX: KMAX, LADDER: LADDER, DEFAULTS: DEF,
    world: buildWorld, probs: probs, pTruth: pTruth,
    run: run, decompose: decompose, sweepTau: sweepTau,
    selfCheck: selfCheck, negatives: negatives, mean: mean
  };

  root.YCDome = API;
  if (typeof module !== "undefined" && module.exports) module.exports = API;
})(typeof window !== "undefined" ? window : globalThis);

<script>
/* ==========================================================================
   YC-Deep 1.0 · 杨城深度层
   --------------------------------------------------------------------------
   五馆共用：展品长廊（8 件）· 两级证书（参观 / 精英）· 进度
   零依赖。Node 可直接 require（DOM 部分自动跳过）。

(function (root, factory) {
  var api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  if (root) root.YCDeep = api;
})(typeof window !== "undefined" ? window : this, function () {
  "use strict";

  var VERSION = "1.0.0";
  var KEY = "yc.deep.v1";
  var HALLS = ["H2", "H3", "H4", "H5", "H6"];

  /* ---------------- 存储 ---------------- */
  function readAll() {
    try {
      var raw = (typeof localStorage !== "undefined") ? localStorage.getItem(KEY) : null;
      var o = raw ? JSON.parse(raw) : null;
      return (o && typeof o === "object") ? o : {};
    } catch (e) { return {}; }
  }
  function writeAll(o) {
    try {
      if (typeof localStorage !== "undefined") localStorage.setItem(KEY, JSON.stringify(o));
    } catch (e) { /* 配额满或隐私模式：静默失败，不影响参观 */ }
    return o;
  }
  function st(hall) {
    var all = readAll();
    if (!all[hall]) all[hall] = { seen: {}, quiz: {}, elite: null, certs: {}, play: {} };
    var s = all[hall];
    s.seen = s.seen || {}; s.quiz = s.quiz || {}; s.certs = s.certs || {}; s.play = s.play || {};
    return s;
  }
  function commit(hall, s) {
    var all = readAll();
    all[hall] = s;
    return writeAll(all);
  }

  /* ---------------- 展品登记 ---------------- */
  var SPECS = {};

  function register(hall, spec) {
    spec = spec || {};
    var prev = SPECS[hall] || {};
    /* 合并而不是覆盖：馆主页注册完整展品表，玩法页只补一个 name，
       两边谁先加载都不该把对方的内容抹掉。 */
    SPECS[hall] = {
      hall: hall,
      name: spec.name || prev.name || hall,
      items: spec.items || prev.items || [],
      game: spec.game || prev.game || null
    };
    return SPECS[hall];
  }
  function specOf(hall) { return SPECS[hall] || null; }
  function itemsOf(hall) { var s = SPECS[hall]; return s ? s.items : []; }

  /* ---------------- 进度 ---------------- */
  function progress(hall) {
    var s = st(hall), items = itemsOf(hall);
    var seen = 0, passed = 0;
    items.forEach(function (it) {
      if (s.seen[it.id]) seen++;
      if (s.quiz[it.id]) passed++;
    });
    var total = items.length || 8;
    return {
      hall: hall,
      total: total,
      seen: seen,
      passed: passed,
      pct: total ? Math.round((passed / total) * 100) : 0,
      visitorReady: total > 0 && passed >= total,
      elite: s.elite || null
    };
  }
  /* 驻馆人需要知道「你干了什么」——不然他只能站着。
     这里只广播事件，不关心谁在听：没人听时零成本，有人听时人就活了。 */
  function ping(hall, ev, data) {
    try {
      window.dispatchEvent(new CustomEvent("yc:deep", { detail: { hall: hall, ev: ev, data: data || {} } }));
    } catch (e) {}
  }
  function markSeen(hall, id) {
    var s = st(hall);
    var fresh = !s.seen[id];
    if (fresh) { s.seen[id] = Date.now(); commit(hall, s); }
    if (fresh) ping(hall, "seen", { id: id });
    return progress(hall);
  }
  function markQuiz(hall, id, ok) {
    var s = st(hall);
    var fresh = !s.seen[id];
    if (ok) s.quiz[id] = Date.now();
    if (fresh) s.seen[id] = Date.now();
    commit(hall, s);
    if (fresh && !ok) ping(hall, "seen", { id: id });
    ping(hall, ok ? "pass" : "fail", { id: id });
    return progress(hall);
  }

  /* ---------------- 证书 ---------------- */
  /* 编号规则：YC-<HALL>-<V|E>-<YYMMDD>-<6位>   */
  function rnd6() {
    var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "";
    for (var i = 0; i < 6; i++) s += a.charAt(Math.floor(Math.random() * a.length));
    return s;
  }
  function fnv(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ("00000000" + h.toString(16)).slice(-8);
  }
  function today() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return { iso: d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()), short: String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) };
  }

  var TIER = {
    visitor: { code: "V", cn: "参观证书", en: "CERTIFICATE OF VISIT", rank: 1 },
    elite: { code: "E", cn: "精英证书", en: "CERTIFICATE OF MASTERY", rank: 2 }
  };

  function issueCert(hall, tier, meta) {
    meta = meta || {};
    var t = TIER[tier] || TIER.visitor;
    var d = today();
    var cert = {
      protocol: "YC-Cert 1.0",
      hall: hall,
      hallName: (SPECS[hall] && SPECS[hall].name) || hall,
      tier: tier,
      tierName: t.cn,
      holder: meta.holder || "参观者",
      no: "YC-" + hall + "-" + t.code + "-" + d.short + "-" + rnd6(),
      date: d.iso,
      play: meta.play || null,       /* 玩法名 */
      score: meta.score != null ? meta.score : null,
      detail: meta.detail || [],
      checksum: ""
    };
    cert.checksum = fnv([cert.no, cert.hall, cert.tier, cert.date, cert.holder, String(cert.score)].join("|"));
    var s = st(hall);
    s.certs[tier] = cert;
    if (tier === "elite") s.elite = { at: Date.now(), play: cert.play, score: cert.score, detail: cert.detail };
    commit(hall, s);
    ping(hall, tier === "elite" ? "elite" : "visit", { no: cert.no, play: cert.play, score: cert.score });
    return cert;
  }
  function getCert(hall, tier) { return st(hall).certs[tier] || null; }
  function allCerts() {
    var all = readAll(), out = [];
    Object.keys(all).forEach(function (h) {
      var c = (all[h].certs || {});
      if (c.visitor) out.push(c.visitor);
      if (c.elite) out.push(c.elite);
    });
    return out;
  }
  function eliteCount() {
    return allCerts().filter(function (c) { return c.tier === "elite"; }).length;
  }

  /* ---------------- 证书 SVG ---------------- */
  /* 深色烫金 / 浅色纸本两套皮，按馆配色传入 accent */
  function certSVG(cert, opt) {
    opt = opt || {};
    var accent = opt.accent || "#c9a227";
    var ink = opt.ink || "#f2ece0";
    var paper = opt.paper || "#0e1218";
    var elite = cert.tier === "elite";
    var W = 900, H = 620;
    var esc = function (s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
      });
    };
    var detail = (cert.detail || []).slice(0, 4);
    var rows = detail.map(function (d, i) {
      return '<text x="110" y="' + (430 + i * 30) + '" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="' +
        esc(ink) + '" opacity="0.78">· ' + esc(d) + '</text>';
    }).join("");
    var seal = elite
      ? '<circle cx="760" cy="500" r="58" fill="none" stroke="' + accent + '" stroke-width="2.5" opacity="0.9"/>' +
        '<circle cx="760" cy="500" r="48" fill="none" stroke="' + accent + '" stroke-width="1" opacity="0.55"/>' +
        '<text x="760" y="494" text-anchor="middle" font-size="20" font-weight="700" fill="' + accent + '">精英</text>' +
        '<text x="760" y="518" text-anchor="middle" font-size="11" letter-spacing="2" fill="' + accent + '" opacity="0.85">MASTERY</text>'
      : '<circle cx="760" cy="500" r="58" fill="none" stroke="' + accent + '" stroke-width="1.6" opacity="0.55"/>' +
        '<text x="760" y="496" text-anchor="middle" font-size="18" font-weight="600" fill="' + accent + '" opacity="0.85">参观</text>' +
        '<text x="760" y="518" text-anchor="middle" font-size="10" letter-spacing="2" fill="' + accent + '" opacity="0.6">VISIT</text>';

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' +
      '<defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + paper + '"/><stop offset="1" stop-color="' + paper + '" stop-opacity="0.86"/></linearGradient></defs>' +
      '<rect width="' + W + '" height="' + H + '" fill="url(#cg)"/>' +
      '<rect x="26" y="26" width="' + (W - 52) + '" height="' + (H - 52) + '" fill="none" stroke="' + accent + '" stroke-width="' + (elite ? 2.4 : 1.2) + '" opacity="' + (elite ? 0.85 : 0.45) + '"/>' +
      '<rect x="36" y="36" width="' + (W - 72) + '" height="' + (H - 72) + '" fill="none" stroke="' + accent + '" stroke-width="0.8" opacity="0.28"/>' +
      (elite ? '<path d="M26 26 L120 26 L26 120 Z" fill="' + accent + '" opacity="0.18"/>' : "") +
      '<text x="' + (W / 2) + '" y="108" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="6" fill="' + accent + '" opacity="0.9">' + TIER[cert.tier].en + '</text>' +
      '<text x="' + (W / 2) + '" y="176" text-anchor="middle" font-family="Songti SC,SimSun,serif" font-size="44" font-weight="700" fill="' + ink + '">' + esc(cert.tierName) + '</text>' +
      '<text x="' + (W / 2) + '" y="212" text-anchor="middle" font-family="Songti SC,SimSun,serif" font-size="17" fill="' + ink + '" opacity="0.66">' + esc(cert.hallName) + ' · 杨城</text>' +
      '<line x1="150" y1="244" x2="' + (W - 150) + '" y2="244" stroke="' + accent + '" stroke-width="1" opacity="0.4"/>' +
      '<text x="110" y="300" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.55">兹证明</text>' +
      '<text x="180" y="304" font-family="Songti SC,SimSun,serif" font-size="26" font-weight="600" fill="' + ink + '">' + esc(cert.holder) + '</text>' +
      '<text x="110" y="348" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.72">' +
      (elite ? '已完成本馆的精英挑战「' + esc(cert.play || "未命名") + '」，' : '已逐件看完本馆八件展品并答对全部现场问题，') + '</text>' +
      '<text x="110" y="378" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.72">' +
      (elite ? '并能说明每一步判断所依据的判据。' : '能说出每件展品失效的机制与判据。') + '</text>' +
      rows +
      seal +
      '<text x="110" y="556" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">编号 ' + esc(cert.no) + '</text>' +
      '<text x="' + (W - 110) + '" y="556" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">' + esc(cert.date) + ' · 校验 ' + esc(cert.checksum) + '</text>' +
      (cert.score != null ? '<text x="110" y="' + (430 + detail.length * 30 + 6) + '" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="' + accent + '">得分 ' + cert.score + '</text>' : "") +
      '</svg>';
  }

  function download(cert, opt) {
    if (typeof document === "undefined") return null;
    var svg = certSVG(cert, opt);
    var blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = cert.no + ".svg";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
    return a.download;
  }

  /* ---------------- 展品长廊（DOM） ---------------- */
  /* 结构：8 张卡，点开变详情；每张卡带一道现场题，答对才算「看过」 */
  function mountGallery(box, hall, opt) {
    if (!box) return null;
    opt = opt || {};
    var items = itemsOf(hall);
    var cur = -1;
    var accent = opt.accent || "#8fb7ff";

    function paint() {
      /* 每次重绘都重新读一遍存储。挂载时缓存的 s 是快照，
         答完题不会回写到它 —— 那样卡片永远停在「待识破」。 */
      var s = st(hall);
      var p = progress(hall);
      var H = [];
      H.push('<div class="dpg-head">' +
        '<div class="dpg-t">展品长廊 <em>' + p.passed + ' / ' + p.total + ' 已答对</em></div>' +
        '<div class="dpg-bar"><i style="width:' + p.pct + '%;background:' + accent + '"></i></div>' +
        '<div class="dpg-note">' + (p.visitorReady ? '八件全通 · 可领参观证书' : '逐件点开，答对现场题才算看过') + '</div>' +
        '</div>');

      H.push('<div class="dpg-grid">');
      items.forEach(function (it, i) {
        var done = !!s.quiz[it.id];
        H.push('<button class="dpg-c' + (done ? " done" : "") + (cur === i ? " on" : "") + '" data-i="' + i + '"' +
          ' style="--ac:' + accent + '">' +
          '<span class="dpg-no">' + it.no + '</span>' +
          '<span class="dpg-ic">' + (it.icon || "◆") + '</span>' +
          '<span class="dpg-nm">' + esc(it.name) + '</span>' +
          '<span class="dpg-sy">' + esc(it.symptom) + '</span>' +
          '<span class="dpg-st">' + (done ? "✓ 已识破" : "待识破") + '</span>' +
          '</button>');
      });
      H.push('</div>');

      H.push('<div class="dpg-detail" id="dpgDetail">');
      if (cur < 0) {
        H.push('<div class="dpg-empty">选一件展品。<b>八件展品对应本馆的八个失效侧面</b>——它们不是八个知识点，' +
          '是同一台仪器能做出的八种不同诊断。答对现场题，进度才往前走。</div>');
      } else {
        var it = items[cur];
        var q = it.quiz;
        var answered = !!s.quiz[it.id];
        H.push('<div class="dpg-dh"><span class="dpg-dno">' + it.no + '</span>' +
          '<span class="dpg-dnm">' + esc(it.name) + '</span>' +
          '<span class="dpg-dsy">' + esc(it.symptom) + '</span></div>');
        H.push('<div class="dpg-cols">');
        H.push('<div class="dpg-col"><h4>机制</h4><p>' + it.mech + '</p></div>');
        H.push('<div class="dpg-col"><h4>判据</h4><p>' + it.judge + '</p></div>');
        H.push('<div class="dpg-col"><h4>真实案例</h4><p>' + it.real + '</p></div>');
        H.push('</div>');
        if (it.verify) {
          H.push('<div class="dpg-verify"><button class="dpg-vb" data-v="' + cur + '">▶ 现场验证这件展品</button>' +
            '<span class="dpg-vr" id="dpgVr">点一下，用本馆内核当场跑一次对照。</span></div>');
        }
        if (q) {
          H.push('<div class="dpg-quiz"><div class="dpg-qt">现场题 · ' + esc(q.q) + '</div>');
          H.push('<div class="dpg-opts">');
          q.opts.forEach(function (o, k) {
            H.push('<button class="dpg-opt' + (answered && k === q.a ? " ok" : "") + '" data-o="' + k + '">' +
              String.fromCharCode(65 + k) + '　' + esc(o) + '</button>');
          });
          H.push('</div>');
          H.push('<div class="dpg-qr" id="dpgQr">' + (answered ? "✓ 已答对。这一件算识破。" : "") + '</div>');
          H.push('</div>');
        }
        H.push('</div>');
      }
      box.innerHTML = H.join("");
    }

    box.addEventListener("click", function (e) {
      var c = e.target.closest(".dpg-c");
      if (c) { cur = +c.dataset.i; markSeen(hall, items[cur].id); paint(); return; }
      var vb = e.target.closest(".dpg-vb");
      if (vb) {
        var it = items[+vb.dataset.v];

        try { out = it.verify ? it.verify() : null; } catch (err) { out = { label: "验证失败", value: "—", note: String(err && err.message || err) }; }
        var vr = box.querySelector("#dpgVr");

          vr.innerHTML = '<b style="color:' + accent + '">' + esc(out.label) + '</b>　<span class="dpg-vv">' +
            esc(out.value) + '</span>' + (out.note ? '　<span class="dpg-vn">' + esc(out.note) + '</span>' : "");
        }
        return;
      }
      var o = e.target.closest(".dpg-opt");
      if (o) {
        var it2 = items[cur], k = +o.dataset.o, ok = (k === it2.quiz.a);
        var qr = box.querySelector("#dpgQr");
        var all = box.querySelectorAll(".dpg-opt");
        for (var i = 0; i < all.length; i++) all[i].classList.remove("ok", "no");
        o.classList.add(ok ? "ok" : "no");
        if (ok) {
          markQuiz(hall, it2.id, true);
          if (qr) qr.innerHTML = "✓ 正确。" + (it2.quiz.why ? " " + esc(it2.quiz.why) : "");
          var nm = box.querySelector('.dpg-c[data-i="' + cur + '"]');
          if (nm) { nm.classList.add("done"); nm.querySelector(".dpg-st").textContent = "✓ 已识破"; }
          var p = progress(hall);
          var t = box.querySelector(".dpg-t em");
          if (t) t.textContent = p.passed + " / " + p.total + " 已答对";
          var bar = box.querySelector(".dpg-bar i");
          if (bar) bar.style.width = p.pct + "%";
          var note = box.querySelector(".dpg-note");
          if (note) note.textContent = p.visitorReady ? "八件全通 · 可领参观证书" : "逐件点开，答对现场题才算看过";
          if (opt.onProgress) { try { opt.onProgress(p); } catch (e2) {} }
        } else {
          if (qr) qr.innerHTML = '<span style="color:#ff8f8f">再想想。' +
            (it2.quiz.hint ? " 提示：" + esc(it2.quiz.hint) : "") + '</span>';
        }
        return;
      }
    });

    paint();
    return { repaint: paint, progress: function () { return progress(hall); } };
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  /* ---------------- 证书面板（DOM） ---------------- */
  function mountCerts(box, hall, opt) {
    if (!box) return null;
    opt = opt || {};
    var accent = opt.accent || "#c9a227";
    var paper = opt.paper || "#0e1218";
    var ink = opt.ink || "#f2ece0";

    function paint() {
      var p = progress(hall);
      var v = getCert(hall, "visitor"), e2 = getCert(hall, "elite");
      var H = [];
      H.push('<div class="dpc-wrap">');

      H.push('<div class="dpc-card' + (v ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">一级</span><span class="dpc-n">参观证书</span></div>' +
        '<div class="dpc-d">看完八件展品并答对全部现场题即可领取。' +
        (v ? '' : '当前进度 ' + p.passed + ' / ' + p.total + '。') + '</div>' +
        '<div class="dpc-act">' +
        (v ? '<span class="dpc-no">' + esc(v.no) + '</span><button class="dpc-b" data-dl="visitor">下载</button>'
          : (p.visitorReady
            ? '<button class="dpc-b" data-get="visitor">领取参观证书</button>'
            : '<button class="dpc-b" data-get="visitor" disabled>还差 ' + (p.total - p.passed) + ' 件</button>')) +
        '</div></div>');

      H.push('<div class="dpc-card elite' + (e2 ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">二级</span><span class="dpc-n">精英证书</span></div>' +
        '<div class="dpc-d">' + esc((opt.game && opt.game.brief) || "完成本馆的精英挑战。") + '</div>' +
        '<div class="dpc-act">' +
        (e2 ? '<span class="dpc-no">' + esc(e2.no) + '</span><button class="dpc-b" data-dl="elite">下载</button>'
          : '<button class="dpc-b" data-go="1">进入挑战 →</button>') +
        '</div></div>');

      H.push('</div>');
      box.innerHTML = H.join("");
    }

    box.addEventListener("click", function (e) {
      var g = e.target.closest("[data-get]");
      if (g && !g.disabled) {
        var c = issueCert(hall, g.dataset.get, { holder: opt.holder || "参观者" });
        paint();
        if (opt.onIssue) opt.onIssue(c);
        return;
      }
      var d = e.target.closest("[data-dl]");
      if (d) { var cert = getCert(hall, d.dataset.dl); if (cert) download(cert, { accent: accent, paper: paper, ink: ink }); return; }
      var go = e.target.closest("[data-go]");
      if (go && opt.gameHref) location.href = opt.gameHref;
    });

    paint();
    return { repaint: paint };
  }

  return {
    VERSION: VERSION,
    HALLS: HALLS,
    TIER: TIER,
    register: register,
    specOf: specOf,
    itemsOf: itemsOf,
    progress: progress,
    markSeen: markSeen,
    markQuiz: markQuiz,
    issueCert: issueCert,
    getCert: getCert,
    allCerts: allCerts,
    eliteCount: eliteCount,
    certSVG: certSVG,
    download: download,
    mountGallery: mountGallery,
    mountCerts: mountCerts,
    checksum: fnv
  };
});
</script>
<script>
/* ============================================================
   shared/yc-port.js — 驻馆人立绘引擎 · Portrait 2.0
   ------------------------------------------------------------
   为什么推翻重写
   ------------------------------------------------------------
   1.0 的画法是「一根根线」：五官全是半透明 stroke，没有面。
   放大看是线框图，缩到 52px 就糊成一团灰。十个人只能靠
   「圆脸 / 方脸」两个变量区分，谁都不像谁，也确实不好看。

   2.0 换成赛璐璐上色（cel-shading），五件事：

     一、统一光源。左上 45°，高光永远在左上，暗部永远在右下。
         一旦每个人的光向不一样，十张脸放在一起就会「贴纸感」。
     二、以色块为主、线为辅。色块缩小仍然可读，线缩小就消失。
     三、五官分层。眼睛七层、头发四层、皮肤三层，不是一笔画完。
     四、唯一 id 前缀。SVG 的渐变 / 滤镜 id 是全局的，十个立绘
         同页时必须隔离，否则所有人都会用第一个人的渐变 ——
         这是这类系统最容易踩、也最难查的坑。
     五、成人骨相。脸宽 96 / 脸长 152（1 : 1.58），眼距 = 一个眼宽，
         鼻底到嘴 20、嘴到下巴 26。娃娃脸是脸宽 ≈ 脸长、眼睛占半张脸，
         一眼就像玩具。这一版所有比例按成人头骨重算。

   坐标系 200×240（胸像）
   ------------------------------------------------------------
     发顶 16 / 发际 76 / 眉 96 / 眼 110 / 鼻尖 136
     嘴 156 / 下巴 182 / 颈 176-206 / 肩 206-240

   两种输出
   ------------------------------------------------------------
     bust   —— 完整胸像，全部图层，用在档案卡左栏（约 220×264）
     avatar —— 只取头部，跳过柔光滤镜与发丝高光，用在 26—84px 的小头像
               小尺寸下滤镜只会变成脏灰，去掉反而更清楚
   ============================================================ */
(function () {
  "use strict";

  var N = 0;
  function uid() { return "yp" + (++N).toString(36); }
  function n(v) { return Math.round(v * 100) / 100; }

  /* 两个十六进制色按比例混。用来把配置里给的「发丝高光色」
     往发色里压回去一点 —— 原样拿去铺渐变的亮端，
     在 300px 的胸像上会横出一道浅色斜带，看着像秃了一块。 */
  function mix(a, b, t) {
    function p(h) { h = h.replace("#", ""); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
    var A = p(a), B = p(b);
    var o = A.map(function (v, i) { return Math.round(v + (B[i] - v) * t); });

  }

  /* ---------------- 肤色 ----------------

  var SKIN = {
    a: { base: "#e3a97f", lit: "#fbd4b2", sh: "#b87a5a", deep: "#8a4c36", line: "#63352a", blush: "#cd6652", lip: "#b25c49", lipd: "#873d30" },
    b: { base: "#d69a72", lit: "#f0c49c", sh: "#ac7049", deep: "#81472f", line: "#5a3226", blush: "#bd5c49", lip: "#a85544", lipd: "#7c382b" },
    c: { base: "#ecc09a", lit: "#ffdfc4", sh: "#c58f6a", deep: "#975c42", line: "#6d3f2e", blush: "#d47b61", lip: "#bd6750", lipd: "#904638" },
    d: { base: "#ca9470", lit: "#ecc09d", sh: "#a16b48", deep: "#77432d", line: "#532d21", blush: "#b9604d", lip: "#a3523e", lipd: "#763627" },
    e: { base: "#dfa57c", lit: "#f6ceaa", sh: "#b57756", deep: "#874a34", line: "#613426", blush: "#c96450", lip: "#af5945", lipd: "#833b2d" }
  };

  /* ---------------- 骨相 ----------------

     这是「认得出是谁」的第一层，比换发型更有效。
     脸宽统一 96，脸长 152（成人比例 1 : 1.58）。 */
  var FACES = {
    /* 鹅蛋：颧骨最宽，下颌收得干净 */

    /* 方脸：下颌角外扩，下巴平 */

    defs += '<linearGradient id="' + u + 'hk" gradientUnits="userSpaceOnUse" x1="44" y1="14" x2="150" y2="170">' +

      '<stop offset="1" stop-color="' + hd + '"/></linearGradient>';
    defs += '<linearGradient id="' + u + 'cl" gradientUnits="userSpaceOnUse" x1="30" y1="192" x2="180" y2="240">' +

      '<stop offset="0" stop-color="' + k.blush + '" stop-opacity=".34"/>' +
      '<stop offset="1" stop-color="' + k.blush + '" stop-opacity="0"/></radialGradient>';

    /* 鬓角：盖住耳前那一小块，是「头发长在头上」而不是「戴上去」的关键。
       不描边，否则两缕鬓角会各自变成一条深色贴片。 */
    s += hairShape(u, h.side, hd, detail, true, F_HK);
    /* 前发：压住额头，才有「发型」而不是「光头戴假发」 */
    s += hairShape(u, h.front, hd, detail, false, F_HK);
    /* 碎发：从发块内部垂下来的发缕。只填色、不描边 ——
       一旦每缕都描边，它们就又变回一片片贴纸了。 */
    if (h.fringe && h.fringe.length) {
      s += '<g>' + h.fringe.map(function (d) {
        return '<path d="' + d + '" fill="' + F_HK + '"/>';
      }).join("") + "</g>";

    s += hairHi(h.hi, hl, detail);

    /* 道具：眼镜、护目镜、口罩、疤、耳饰，由人物自己给 */
    if (cfg.prop) s += cfg.prop;

    return '<defs>' + defs + "</defs>" + s;
  }

  /* ---------------- 对外 ---------------- */
  var AVB = "12 10 176 176";   /* 头像取景：留一点边，下巴不贴边 */
  var BUB = "0 0 200 240";

  function wrap(cfg, mood, detail, vb, cls) {
    return '<svg viewBox="' + vb + '" class="' + (cls || "") + '" aria-hidden="true" ' +
      'preserveAspectRatio="xMidYMid meet">' + figure(cfg, mood, detail) + "</svg>";
  }

  window.YCPort = {
    version: "2.1.0",
    figure: figure,
    lock: lock,
    SKIN: SKIN,
    FACES: FACES,
    avatar: function (cfg, mood) { return wrap(cfg, mood, 1, AVB, "yp-av"); },
    bust: function (cfg, mood) { return wrap(cfg, mood, 2, BUB, "yp-bust"); },
    raw: function (cfg, mood, detail) { return figure(cfg, mood, detail || 2); }
  };
})();

<script>
/* ============================================================
   yc-cast.js — 杨城「驻馆人」系统 · 引擎
   ------------------------------------------------------------
   老馆有四位导游，但他们是「同一个声音的四个语气」：
   单向广播、不记得你、不互相冲突。

   这一层解决三件事，缺一件人就是死的：
     1) 立场 —— 每馆两人，对同一个问题主张相反，你必须选边
     2) 记忆 —— 信任度 bond 持久化，他对你的态度随你做过的事变
     3) 对话 —— 不是播报，是能追问的来回；他会主动来找你

   数据在 src/hX/07-cast.js（每馆一份，含 SVG 立绘）。
   本文件只做引擎，不含任何具体人物的内容。
   ------------------------------------------------------------
   对外 API
     YCCast.register(hall, spec)     注册一馆（页面载入即自动挂载）
     YCCast.state()                  读全部状态
     YCCast.bondOf(id)               某人当前信任值
     YCCast.tierOf(id)               某人当前档位名
     YCCast.say(hall, ev, data)      手动触发一句（游戏内核可用）
     YCCast.openPanel(hall, chId)    打开搭话面板
     YCCast.openCard(hall, chId)     打开人物档案
     YCCast.roster()                 今日值守（城市页用）
     YCCast.mount(hall)              手动挂载
   ============================================================ */
window.YCCast = (function () {
  "use strict";

  var VERSION = "1.0.0";
  var KEY = "yc.cast.v1";

  /* ==========================================================
     0 · 基础设施
     ========================================================== */
  function read() {
    try {
      var raw = (typeof localStorage !== "undefined") ? localStorage.getItem(KEY) : null;
      var o = raw ? JSON.parse(raw) : null;
      if (o && typeof o === "object") {
        o.bond = o.bond || {}; o.camp = o.camp || {}; o.met = o.met || {};
        o.oral = o.oral || {}; o.said = o.said || {}; o.flag = o.flag || {};
        return o;
      }
    } catch (e) {}
    return { bond: {}, camp: {}, met: {}, oral: {}, said: {}, flag: {} };
  }
  function write(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  var S = read();

  function num(v, d) { return typeof v === "number" && isFinite(v) ? v : d; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ==========================================================
     1 · 信任度
     ========================================================== */
  var TIERS = [
    { min: 0,  key: "cold",  cn: "生分", note: "公事公办" },
    { min: 25, key: "warm",  cn: "熟络", note: "愿意多说两句" },
    { min: 50, key: "open",  cn: "交底", note: "开始讲自己的事" },
    { min: 75, key: "trust", cn: "托付", note: "把没写进档案的话给你" }
  ];

  function bondOf(id) { return clamp(num(S.bond[id], 0), 0, 100); }
  function tierIdx(v) {
    var i = 0;
    for (var k = 0; k < TIERS.length; k++) if (v >= TIERS[k].min) i = k;
    return i;
  }
  function tierOf(id) { return TIERS[tierIdx(bondOf(id))]; }

  function addBond(id, delta, why) {
    if (!id || !delta) return;
    var before = bondOf(id);
    var after = clamp(before + delta, 0, 100);
    if (after === before) return;
    S.bond[id] = after;
    write(S);
    var b0 = tierIdx(before), b1 = tierIdx(after);
    if (b1 > b0) {
      /* 升档：人物会主动交代一句 */
      var ch = findChar(id);
      if (ch) {
        setTimeout(function () {
          toast(ch, TIERS[b1].cn === "托付"
            ? "有些话我本来不打算跟参观的人说。你现在可以问了。"
            : "……行吧，你问的东西越来越像内行了。");

      }

  }

  /* ==========================================================
     2 · 注册表
     ========================================================== */
  var SPECS = {};

  function register(hall, spec) {
    spec.hall = hall;
    spec.cast = spec.cast || [];

    } else {

    }

  function specOf(hall) { return SPECS[hall] || null; }
  function findChar(id) { return CHARMAP[id] || null; }

  /* ==========================================================
     3 · 立绘
     ----------------------------------------------------------
     不用 emoji。emoji 是「图标」，不是「人」——十个人共用一套
     表情符号，看上去就是同一个人换了十件衣服。
     这里给每人一段手绘 SVG：头型、眉眼、嘴、配饰各自不同，
     三种情绪（calm/up/down）只改眉与嘴，其余保持可辨认。

    bust: function (c, d) {
      d = d || "";
      return '<path d="M11 64c0-11.6 9.4-18.4 21-18.4S53 52.4 53 64" fill="' + c +

      if (m === "down") return '<path d="M' + (cx - w / 2) + " " + (cy + 1.8) + " Q" + cx + " " + (cy - 2.6) + " " + (cx + w / 2) + " " + (cy + 1.8) + '" ' + st + "/>";
      return '<path d="M' + (cx - w / 2) + " " + cy + " L" + (cx + w / 2) + " " + cy + '" ' + st + "/>";
    },
    /* 眉：随情绪抬/压 */
    brow: function (m, c, y, spread) {
      y = y || 20.5; spread = spread || 6;
      var dy = m === "up" ? -1.6 : (m === "down" ? 1.5 : 0);
      var tilt = m === "down" ? 1.4 : 0;
      var st = 'fill="none" stroke="' + c + '" stroke-width="1.7" stroke-linecap="round" opacity=".85"';
      return '<path d="M' + (32 - spread - 3.4) + " " + (y + dy + tilt) + " L" + (32 - spread + 2.4) + " " + (y + dy - tilt) + '" ' + st + "/>" +
        '<path d="M' + (32 + spread - 2.4) + " " + (y + dy - tilt) + " L" + (32 + spread + 3.4) + " " + (y + dy + tilt) + '" ' + st + "/>";
    },
    /* 眼：dot=圆点，line=细线，wide=睁大 */
    eye: function (k, c, y, spread) {
      y = y || 26; spread = spread || 6;
      var L = 32 - spread, R = 32 + spread;
      if (k === "line") {
        var st = 'fill="none" stroke="' + c + '" stroke-width="1.8" stroke-linecap="round"';
        return '<path d="M' + (L - 2.6) + " " + y + " L" + (L + 2.6) + " " + y + '" ' + st + "/>" +

      }
      if (k === "wide") {

          '<circle cx="' + R + '" cy="' + y + '" r="2.5" fill="' + c + '"/>' +
          '<circle cx="' + L + '" cy="' + y + '" r="1" fill="#080b10"/>' +
          '<circle cx="' + R + '" cy="' + y + '" r="1" fill="#080b10"/>';
      }

  function bustHTML(ch, mood) {

    try { inner = window.YCPort.raw(ch.port, mood || "calm", 2); } catch (e) { inner = ""; }
    return '<div class="cstc-por" aria-hidden="true">' +
      '<div class="cstc-portag">PROFILE · 档案</div>' +
      '<div class="cstc-porwm">' + esc(ch.name) + "</div>" +
      '<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet">' + inner + "</svg>" +
      '<div class="cstc-porname">' + esc(ch.name) + '<em>' + esc(ch.role) + "</em></div>" +

  /* ==========================================================
     4 · 说话（打字机）
     ========================================================== */
  var typeTimers = {};

  function typeInto(el, text, done) {

    var key = el.id || "anon";
    clearTimeout(typeTimers[key]);

    var i = 0;
    var caret = document.createElement("i");
    caret.className = "cst-caret";
    function tick() {
      if (i >= text.length) {
        if (caret.parentNode) caret.parentNode.removeChild(caret);
        if (done) done();
        return;
      }
      i++;
      el.textContent = text.slice(0, i);
      el.appendChild(caret);
      typeTimers[key] = setTimeout(tick, 18 + (text.charCodeAt(i) % 3) * 9);
    }
    tick();
  }

  /* 富文本：把 **xx** 变成 <em>，<b> 原样保留 */
  function rich(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<em>$1</em>").replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");

  /* ==========================================================
     5 · 事件台词

      /* 兜底：跨人物通用，避免某一事件没写就哑了 */

    var n = num(S.said[ch.id + ":" + ev], 0);

  }
