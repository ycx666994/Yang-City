<style>
/* ===== 杨城首页：时间感知城市 ===== */
html,body{height:100%;overflow:hidden}
body{
  background:#0a1524;color:#eaf4ff;
  font-family:var(--sans);
}
#cityCv{
  position:fixed;inset:0;width:100%;height:100%;display:block;
  z-index:0;
}
/* 上下压暗，保证浮层文字可读 */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(4,12,24,.62) 0%,rgba(4,12,24,.18) 16%,transparent 34%,transparent 62%,rgba(4,10,20,.42) 86%,rgba(3,8,16,.72) 100%);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:70px;z-index:20;
  display:flex;align-items:center;gap:26px;padding:0 26px;
}
.brand{
  display:flex;align-items:baseline;gap:10px;
  font-size:22px;font-weight:800;letter-spacing:5px;
  text-shadow:0 2px 18px rgba(0,0,0,.75);
}
.brand em{
  font-family:var(--mono);font-style:normal;font-size:9px;font-weight:600;
  letter-spacing:2.4px;color:rgba(200,232,255,.62);
}
.brand::after{
  content:"";width:1px;height:26px;margin-left:4px;
  background:linear-gradient(180deg,transparent,rgba(160,215,255,.5),transparent);
}

.clock{display:flex;align-items:baseline;gap:12px}
#clkTime{
  font-family:var(--mono);font-size:clamp(22px,2.6vw,32px);font-weight:600;
  letter-spacing:1.5px;line-height:1;
  font-variant-numeric:tabular-nums;
  color:#f2fbff;text-shadow:0 0 26px rgba(90,200,255,.55),0 2px 12px rgba(0,0,0,.8);
}
#clkPhase{
  font-size:11px;letter-spacing:1.6px;color:rgba(196,226,255,.78);
  padding:3px 9px;border-radius:99px;
  border:1px solid rgba(140,200,255,.26);
  background:rgba(10,26,44,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
}

.topnav{margin-left:auto;display:flex;gap:8px}
.topnav a{
  font-size:11.5px;letter-spacing:.8px;color:rgba(214,236,255,.86);
  padding:7px 13px;border-radius:8px;text-decoration:none;
  border:1px solid rgba(150,205,255,.20);
  background:rgba(8,20,36,.46);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.22s;
}
.topnav a:hover{border-color:rgba(120,225,255,.62);background:rgba(14,40,64,.7);color:#fff}

/* ---------- 左栏读数 ---------- */
.hudleft{
  position:fixed;left:26px;top:96px;z-index:15;
  width:172px;padding:13px 14px;border-radius:12px;
  border:1px solid rgba(150,205,255,.16);
  background:rgba(6,16,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(13px);
  box-shadow:0 18px 44px -22px rgba(0,0,0,.85);
}
.hudleft .ht{
  font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(160,196,226,.6);margin-bottom:9px;
}
.hudrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.hudrow span{font-size:10.5px;color:rgba(196,220,244,.8)}
.hudrow b{
  font-family:var(--mono);font-size:14px;font-weight:600;color:#eaf6ff;
  font-variant-numeric:tabular-nums;
}
.hudrow b small{font-size:9px;color:rgba(170,200,226,.62);font-weight:400}

/* ---------- 中央 CTA ---------- */
.cta{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  z-index:22;display:flex;flex-direction:column;align-items:center;gap:11px;
}
.maphint{
  position:relative;
  font-size:12px;letter-spacing:.5px;color:#0a1a2c;
  padding:7px 15px;border-radius:99px;
  background:linear-gradient(180deg,#eaf8ff,#c9e9ff);
  box-shadow:0 10px 30px -10px rgba(0,20,40,.7);
  white-space:nowrap;
  animation:hintFloat 3.2s ease-in-out infinite;
  transition:opacity .45s,transform .45s;
}
.maphint::after{
  content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
  width:10px;height:10px;background:#c9e9ff;border-radius:2px;
}
.maphint.gone{opacity:0;transform:translateY(6px);pointer-events:none}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.mapbtn{
  position:relative;display:flex;align-items:center;gap:13px;
  padding:14px 30px 14px 24px;border-radius:14px;text-decoration:none;
  color:#04141f;
  background:linear-gradient(135deg,#8fe9ff 0%,#4fc8f0 42%,#d9b364 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.42) inset,
    0 18px 42px -14px rgba(40,160,220,.85),
    0 0 58px -12px rgba(120,225,255,.55);
  transition:transform .26s cubic-bezier(.3,1.4,.5,1),box-shadow .26s;
  overflow:hidden;
}
.mapbtn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);
  transform:translateX(-120%);
  animation:sheen 4.6s ease-in-out infinite;
}
@keyframes sheen{0%,62%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.mapbtn:hover{
  transform:translateY(-3px) scale(1.024);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.6) inset,
    0 24px 54px -14px rgba(40,160,220,.95),
    0 0 82px -8px rgba(120,225,255,.7);
}
.mapbtn svg{width:26px;height:26px;flex:none;position:relative;z-index:1}
.mapbtn .mbt{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;text-align:left}
.mapbtn .mbt b{font-size:15.5px;font-weight:800;letter-spacing:2px;line-height:1.15}
.mapbtn .mbt i{
  font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;
  color:rgba(4,20,31,.62);font-weight:600;
}

/* ---------- 底栏 ---------- */
.botbar{
  position:fixed;left:0;right:0;bottom:0;height:52px;z-index:20;
  display:flex;align-items:center;gap:16px;padding:0 26px;
  font-family:var(--mono);font-size:9px;letter-spacing:1.2px;
  color:rgba(178,206,232,.66);
  border-top:1px solid rgba(140,196,240,.14);
  background:linear-gradient(180deg,transparent,rgba(3,10,20,.62));
}
.botbar .sep{color:rgba(140,180,214,.34)}
.botbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.botbar kbd{
  font-family:var(--mono);font-size:8.5px;padding:1.5px 5px;border-radius:4px;
  border:1px solid rgba(150,200,240,.28);color:rgba(206,230,250,.86);
}

/* ---------- 时段说明（右下） ---------- */
.phaseNote{
  position:fixed;right:26px;bottom:74px;z-index:15;
  max-width:236px;text-align:right;
  font-size:10.5px;line-height:1.75;color:rgba(200,224,246,.72);
  text-shadow:0 1px 10px rgba(0,0,0,.9);
  transition:opacity .5s;
}
.phaseNote b{color:#dff1ff;font-weight:600}

/* ---------- 今日值守（驻馆人轮值） ---------- */
.duty{
  position:fixed;right:26px;top:96px;z-index:15;width:238px;
  padding:13px 14px 11px;border-radius:12px;
  border:1px solid rgba(150,205,255,.16);
  background:rgba(6,16,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(13px);
  box-shadow:0 18px 44px -22px rgba(0,0,0,.85);
}
.duty-h{
  font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(160,196,226,.6);margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.duty-h::after{content:"";flex:1;height:1px;background:rgba(150,205,255,.14)}
.duty-p{
  display:flex;align-items:center;gap:8px;padding:5px 0;
  text-decoration:none;color:inherit;border-radius:8px;
  transition:.18s;
}
.duty-p:hover{background:rgba(150,205,255,.06)}
.duty-p .dn{min-width:0;flex:1}
.duty-p .dn b{display:block;font-size:12.5px;color:rgba(226,240,255,.95);font-weight:700;letter-spacing:.3px}
.duty-p .dn i{
  display:block;font-style:normal;font-size:9.5px;font-family:var(--mono);
  color:rgba(160,196,226,.68);letter-spacing:.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.duty-p .db{
  flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.4px;
  color:rgba(150,186,218,.5);
}
.duty-p .db.hot{color:#d9b364}
.duty-f{
  margin-top:9px;padding-top:8px;border-top:1px solid rgba(150,205,255,.12);
  font-size:9.5px;font-family:var(--mono);letter-spacing:.5px;
  color:rgba(150,186,218,.55);line-height:1.7;
}
.duty-f b{color:rgba(226,240,255,.9);font-weight:700}
.duty-f .mine{color:#d9b364}

/* ---------- 窄屏 ---------- */
@media (max-width:900px){
  .topbar{height:58px;padding:0 16px;gap:14px}
  .brand{font-size:17px;letter-spacing:3px}
  .brand em{display:none}
  #clkTime{font-size:20px}
  .hudleft{display:none}
  .duty{display:none}
  .phaseNote{display:none}
  .cta{bottom:72px}
  .mapbtn{padding:12px 22px 12px 18px}
  .mapbtn .mbt b{font-size:13.5px;letter-spacing:1px}
  .topnav a{padding:6px 10px;font-size:10.5px}
  .botbar{padding:0 14px;font-size:8px;gap:9px}
  .botbar .hide-sm{display:none}
}
@media (max-width:520px){
  .topnav a:first-child{display:none}
  .maphint{font-size:11px;padding:6px 12px}
}
</style>

    L.push("- 接触历史：" + (s.contactHistory || "-"));

    L.push("## 运行");

    L.push("- 种子：" + (r.seed != null ? r.seed : "-"));
    L.push("- 参数：" + JSON.stringify(r.params || {}));
    L.push("- 代码版本：" + (r.codeVersion || "-"));

    L.push("## 统计");

    L.push("- 重采样单位：" + (st.resampleUnit || "-"));
    L.push("- 效应：" + (st.effect != null ? st.effect : "-"));
    L.push("- 区间：" + (st.interval || "-"));
    L.push("- 缺失/失败：" + (st.missing || "-") + " / " + (st.failures || "-"));
    L.push("");
    L.push("## 结论");

    L.push("");
    L.push("被支持的范围：");
    (c.supported || []).forEach(function (x) { L.push("- " + x); });
    L.push("");
    L.push("替代解释：");
    (c.alternatives || []).forEach(function (x) { L.push("- " + x); });
    L.push("");
    L.push("未被支持的推断：");
    (c.unsupported || []).forEach(function (x) { L.push("- " + x); });
    L.push("");
    L.push("下一步所需数据：");

  function exportBundle() {
    var arr = readAll();

    AXES: AXES,

    var d = "M" + n(x0) + " " + n(y0 - t0) +
      "Q" + n(mx) + " " + n(my - t1 * 0.5) + " " + n(x1) + " " + n(y1 - t1 * 0.5) +
      "L" + n(x1) + " " + n(y1 + t1 * 0.5) +
      "Q" + n(mx) + " " + n(my + t1 * 0.56) + " " + n(x0) + " " + n(y0 + t0) + "Z";

  /* --- 眼 ---

    var p = eyePath(cx, out, w, cy, h);
    var s = "";

    if (detail >= 2) {
      s += '<ellipse cx="' + n(cx) + '" cy="' + n(cy - h * 0.6) + '" rx="' + n(w * 1.16) +

    s += '<g clip-path="url(#' + u + (out < 0 ? "el" : "er") + ')">' +
      /* 虹膜半径要够大。偏小的时候上下都留一圈白，

      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) + '" fill="' + (o.irisFill || ("url(#" + u + "ir)")) + '"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) +
        '" fill="none" stroke="' + ir.deep + '" stroke-width="1.1" stroke-opacity=".75"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.29) + '" fill="#100906"/>' +
      '<circle cx="' + n(cx - w * 0.22) + '" cy="' + n(cy - h * 0.42) + '" r="' + n(w * 0.17) + '" fill="#fff" opacity=".95"/>' +
      '<circle cx="' + n(cx + w * 0.28) + '" cy="' + n(cy + h * 0.42) + '" r="' + n(w * 0.08) + '" fill="#fff" opacity=".5"/>' +

    s += '<path d="M' + n(cx + out * w * 0.98) + " " + n(cy - h * 0.26) +
      "C" + n(cx + out * w * 0.7) + " " + n(lidY - h * 0.12) + " " +
            n(cx + out * w * 0.24) + " " + n(lidY - h * 0.26) + " " +
            n(cx) + " " + n(lidY - h * 0.08) +
      "C" + n(cx - out * w * 0.24) + " " + n(lidY - h * 0.26) + " " +
            n(cx - out * w * 0.68) + " " + n(cy - h * 0.8) + " " +
            n(cx - out * w) + " " + n(cy + h * 0.32) +
      '" fill="none" stroke="#241409" stroke-width="' + (o.lash === false ? 2 : 3.1) +
      '" stroke-linecap="round" stroke-opacity=".9"/>';

    if (o.lash !== false) {
      s += '<path d="M' + n(cx + out * w * 0.94) + " " + n(cy - h * 0.4) +
        "L" + n(cx + out * w * 1.22) + " " + n(cy - h * 0.92) +
        '" stroke="#241409" stroke-width="2" stroke-linecap="round" opacity=".78"/>';
      s += '<path d="M' + n(cx + out * w * 0.68) + " " + n(cy - h * 0.98) +

  /* --- 鼻 ---

    s += '<ellipse cx="' + n(cx - 7.4) + '" cy="' + n(cy + 1.4) + '" rx="2.6" ry="1.7" fill="' +

  /* --- 嘴 ---
     上唇暗、下唇亮、中间一条缝。笑是「嘴角抬、缝中段下沉」，

            n(cx - hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +

            n(cx + hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +

      "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +

      s += '<path d="M' + L + " " + y0 + "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +

  /* --- 颈 ---

  /* --- 衣 ---

    var s = "";

    /* 衣身：肩宽 200，是头宽的 2 倍。窄了就像小孩穿大人衣服 */

      s += '<path d="M87 194L100 222L113 194L128 201L100 240H72L72 201Z" fill="#d9d3c9" opacity=".9"/>';
      s += '<path d="M87 194L100 222L113 194L104 191L100 197L96 191Z" fill="' + k.deep + '" opacity=".34"/>';
      s += '<path d="M100 198L93.5 207L100 213.5L106.5 207Z" fill="' + ac + '" opacity=".95"/>';
      s += '<path d="M100 213.5L94 231L100 240L106 231Z" fill="' + ac + '" opacity=".78"/>';
      if (detail >= 2) {
        s += '<path d="M87 194L76 207L73 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".55"/>';
        s += '<path d="M113 194L124 207L127 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".55"/>';
        s += '<path d="M100 222V240" stroke="' + k.deep + '" stroke-width="1.2" opacity=".18"/>';
      }
    } else if (type === "coat") {
      /* 大衣：大翻领，左右各一片，压出厚度 */
      s += '<path d="M100 196L72 189L48 215L76 240H100Z" fill="' + hi + '"/>';
      s += '<path d="M100 196L128 189L152 215L124 240H100Z" fill="' + hi + '"/>';
      s += '<path d="M100 196L72 189L56 216L100 240Z" fill="' + dp + '" opacity=".5"/>';
      s += '<path d="M100 196L128 189L144 216L100 240Z" fill="' + dp + '" opacity=".36"/>';

      if (detail >= 2) {

  /* --- 发 ---
     四层：后发（衬在脸后）、鬓角（盖住耳前）、主发块、发丝高光。

  /* --- 发缕 ---

     所以起笔点必须落在发块内部（被发块盖住），只有收尖的末梢露出来。

  /* ============================================================
     总装

  function figure(cfg, mood, detail) {

    var k = SKIN[cfg.skin || "a"];

    var ery = (cfg.eye && cfg.eye.ry) || 5.8;

    var solid = detail < 2;

    var defs = "";
    defs += '<linearGradient id="' + u + 'sk" gradientUnits="userSpaceOnUse" x1="52" y1="34" x2="156" y2="188">' +

      '<stop offset="0" stop-color="' + ir.lit + '"/><stop offset=".5" stop-color="' + ir.base + '"/>' +
      '<stop offset="1" stop-color="' + ir.deep + '"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bl" cx=".5" cy=".5" r=".5">' +
      '<stop offset="0" stop-color="' + k.blush + '" stop-opacity=".34"/>' +
      '<stop offset="1" stop-color="' + k.blush + '" stop-opacity="0"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bg" cx=".5" cy=".36" r=".72">' +
      '<stop offset="0" stop-color="' + ac + '" stop-opacity=".2"/>' +
      '<stop offset=".6" stop-color="' + ac + '" stop-opacity=".05"/>' +
      '<stop offset="1" stop-color="' + ac + '" stop-opacity="0"/></radialGradient>';
    if (detail >= 2) {
      defs += '<filter id="' + u + 'sf" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="4"/></filter>';
      defs += '<filter id="' + u + 'sf2" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="2.2"/></filter>';

<script>
/* ============================================================
   yc-cast.js — 杨城「驻馆人」系统 · 引擎
   ------------------------------------------------------------
   老馆有四位导游，但他们是「同一个声音的四个语气」：
   单向广播、不记得你、不互相冲突。

   这一层解决三件事，缺一件人就是死的：
     1) 立场 —— 每馆两人，对同一个问题主张相反，你必须选边
     2) 记忆 —— 信任度 bond 持久化，他对你的态度随你做过的事变
     3) 对话 —— 不是播报，是能追问的来回；他会主动来找你

   数据在 src/hX/07-cast.js（每馆一份，含 SVG 立绘）。
   本文件只做引擎，不含任何具体人物的内容。
   ------------------------------------------------------------
   对外 API
     YCCast.register(hall, spec)     注册一馆（页面载入即自动挂载）
     YCCast.state()                  读全部状态
     YCCast.bondOf(id)               某人当前信任值
     YCCast.tierOf(id)               某人当前档位名
     YCCast.say(hall, ev, data)      手动触发一句（游戏内核可用）
     YCCast.openPanel(hall, chId)    打开搭话面板
     YCCast.openCard(hall, chId)     打开人物档案
     YCCast.roster()                 今日值守（城市页用）
     YCCast.mount(hall)              手动挂载
   ============================================================ */
window.YCCast = (function () {
  "use strict";

  var VERSION = "1.0.0";
  var KEY = "yc.cast.v1";

  /* ==========================================================
     0 · 基础设施
     ========================================================== */
  function read() {
    try {
      var raw = (typeof localStorage !== "undefined") ? localStorage.getItem(KEY) : null;
      var o = raw ? JSON.parse(raw) : null;
      if (o && typeof o === "object") {
        o.bond = o.bond || {}; o.camp = o.camp || {}; o.met = o.met || {};
        o.oral = o.oral || {}; o.said = o.said || {}; o.flag = o.flag || {};
        return o;
      }
    } catch (e) {}
    return { bond: {}, camp: {}, met: {}, oral: {}, said: {}, flag: {} };
  }
  function write(o) {
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  var S = read();

  function num(v, d) { return typeof v === "number" && isFinite(v) ? v : d; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ==========================================================
     1 · 信任度
     ========================================================== */
  var TIERS = [
    { min: 0,  key: "cold",  cn: "生分", note: "公事公办" },
    { min: 25, key: "warm",  cn: "熟络", note: "愿意多说两句" },
    { min: 50, key: "open",  cn: "交底", note: "开始讲自己的事" },
    { min: 75, key: "trust", cn: "托付", note: "把没写进档案的话给你" }
  ];

  function bondOf(id) { return clamp(num(S.bond[id], 0), 0, 100); }
  function tierIdx(v) {
    var i = 0;
    for (var k = 0; k < TIERS.length; k++) if (v >= TIERS[k].min) i = k;
    return i;
  }
  function tierOf(id) { return TIERS[tierIdx(bondOf(id))]; }

  function addBond(id, delta, why) {
    if (!id || !delta) return;
    var before = bondOf(id);
    var after = clamp(before + delta, 0, 100);
    if (after === before) return;
    S.bond[id] = after;
    write(S);
    var b0 = tierIdx(before), b1 = tierIdx(after);
    if (b1 > b0) {
      /* 升档：人物会主动交代一句 */
      var ch = findChar(id);
      if (ch) {
        setTimeout(function () {
          toast(ch, TIERS[b1].cn === "托付"
            ? "有些话我本来不打算跟参观的人说。你现在可以问了。"
            : "……行吧，你问的东西越来越像内行了。");
        }, 700);
      }
    }
    return after;
  }

  /* ==========================================================
     2 · 注册表
     ========================================================== */
  var SPECS = {};
  var CHARMAP = {};

  function register(hall, spec) {
    spec.hall = hall;
    spec.cast = spec.cast || [];
    spec.accent = spec.accent || "#46d3e8";
    SPECS[hall] = spec;
    spec.cast.forEach(function (c) {
      c.hall = hall;
      c.accent = c.color || spec.accent;
      /* 立绘配置也要拿到强调色：轮廓光、领带、工装拉链都用它，
         不然同一个人在小坞和档案卡里会串色。 */
      if (c.port) c.port.accent = c.accent;
      CHARMAP[c.id] = c;
    });
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () { autoMount(hall); });
    } else {
      autoMount(hall);
    }
    return spec;
  }
  function specOf(hall) { return SPECS[hall] || null; }
  function findChar(id) { return CHARMAP[id] || null; }

  /* ==========================================================
     3 · 立绘
     ----------------------------------------------------------
     不用 emoji。emoji 是「图标」，不是「人」——十个人共用一套
     表情符号，看上去就是同一个人换了十件衣服。
     这里给每人一段手绘 SVG：头型、眉眼、嘴、配饰各自不同，
     三种情绪（calm/up/down）只改眉与嘴，其余保持可辨认。
     ========================================================== */

  /* 画法公共件：各馆文件用 YCCast.svg.* 拼自己的立绘 */
  var svg = {
    /* 胸肩：所有立绘共用，保证十个人站在同一条基线上 */
    bust: function (c, d) {
      d = d || "";
      return '<path d="M11 64c0-11.6 9.4-18.4 21-18.4S53 52.4 53 64" fill="' + c +
        '1f" stroke="' + c + '" stroke-width="1.6" stroke-linejoin="round"/>' + d;
    },
    /* 脖子 */
    neck: function (c) {
      return '<rect x="28.4" y="35.5" width="7.2" height="10" rx="2" fill="' + c + '30"/>';
    },
    /* 嘴：up=笑，down=皱眉，calm=平 */
    mouth: function (m, c, cx, cy, w) {
      cx = cx || 32; cy = cy || 36; w = w || 9;
      var st = 'fill="none" stroke="' + c + '" stroke-width="1.7" stroke-linecap="round"';
      if (m === "up") return '<path d="M' + (cx - w / 2) + " " + cy + " Q" + cx + " " + (cy + 3.6) + " " + (cx + w / 2) + " " + cy + '" ' + st + "/>";
      if (m === "down") return '<path d="M' + (cx - w / 2) + " " + (cy + 1.8) + " Q" + cx + " " + (cy - 2.6) + " " + (cx + w / 2) + " " + (cy + 1.8) + '" ' + st + "/>";
      return '<path d="M' + (cx - w / 2) + " " + cy + " L" + (cx + w / 2) + " " + cy + '" ' + st + "/>";
    },
    /* 眉：随情绪抬/压 */
    brow: function (m, c, y, spread) {
      y = y || 20.5; spread = spread || 6;
      var dy = m === "up" ? -1.6 : (m === "down" ? 1.5 : 0);
      var tilt = m === "down" ? 1.4 : 0;
      var st = 'fill="none" stroke="' + c + '" stroke-width="1.7" stroke-linecap="round" opacity=".85"';
      return '<path d="M' + (32 - spread - 3.4) + " " + (y + dy + tilt) + " L" + (32 - spread + 2.4) + " " + (y + dy - tilt) + '" ' + st + "/>" +
        '<path d="M' + (32 + spread - 2.4) + " " + (y + dy - tilt) + " L" + (32 + spread + 3.4) + " " + (y + dy + tilt) + '" ' + st + "/>";
    },
    /* 眼：dot=圆点，line=细线，wide=睁大 */
    eye: function (k, c, y, spread) {
      y = y || 26; spread = spread || 6;
      var L = 32 - spread, R = 32 + spread;
      if (k === "line") {
        var st = 'fill="none" stroke="' + c + '" stroke-width="1.8" stroke-linecap="round"';
        return '<path d="M' + (L - 2.6) + " " + y + " L" + (L + 2.6) + " " + y + '" ' + st + "/>" +
          '<path d="M' + (R - 2.6) + " " + y + " L" + (R + 2.6) + " " + y + '" ' + st + "/>";
      }
      if (k === "wide") {
        return '<circle cx="' + L + '" cy="' + y + '" r="2.5" fill="' + c + '"/>' +
          '<circle cx="' + R + '" cy="' + y + '" r="2.5" fill="' + c + '"/>' +
          '<circle cx="' + L + '" cy="' + y + '" r="1" fill="#080b10"/>' +
          '<circle cx="' + R + '" cy="' + y + '" r="1" fill="#080b10"/>';
      }
      return '<circle cx="' + L + '" cy="' + y + '" r="1.9" fill="' + c + '"/>' +
        '<circle cx="' + R + '" cy="' + y + '" r="1.9" fill="' + c + '"/>';
    }
  };

  /* Portrait 2.0 的取景框：留一点边，下巴不贴边 */
  var PORT_VB = "12 10 176 176";

  function hasPort(ch) { return !!(ch && ch.port && window.YCPort); }

  function faceHTML(ch, mood, cls) {
    mood = mood || "calm";
    var inner = "", vb = "0 0 64 64", ring = "";
    if (hasPort(ch)) {
      try { inner = window.YCPort.raw(ch.port, mood, 1); } catch (e) { inner = ""; }
      vb = PORT_VB;
    } else {
      try { inner = ch.art ? ch.art(mood, ch.color) : ""; } catch (e) { inner = ""; }
      ring = '<circle cx="32" cy="32" r="31" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="1.4"/>';
    }
    return '<button class="cst-face ' + (cls || "") + '" data-ch="' + ch.id +
      '" title="' + esc(ch.name) + "（" + esc(ch.role) + '）" style="--cst-pc:' + (ch.color || "#46d3e8") + '">' +
      '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
      ring + inner +
      "</svg></button>";
  }

  /* 档案卡左栏的大幅胸像。这是全站唯一能看清五官的地方，
     也是 Portrait 2.0 存在的理由 —— 小头像只需要认得出是谁，
     大图才需要「像个人」。 */
  function bustHTML(ch, mood) {
    if (!hasPort(ch)) return faceHTML(ch, mood, "on");
    var inner = "";
    try { inner = window.YCPort.raw(ch.port, mood || "calm", 2); } catch (e) { inner = ""; }
    return '<div class="cstc-por" aria-hidden="true">' +
      '<div class="cstc-portag">PROFILE · 档案</div>' +
      '<div class="cstc-porwm">' + esc(ch.name) + "</div>" +
      '<svg viewBox="0 0 200 240" preserveAspectRatio="xMidYMax meet">' + inner + "</svg>" +
      '<div class="cstc-porname">' + esc(ch.name) + '<em>' + esc(ch.role) + "</em></div>" +
      "</div>";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ==========================================================
     4 · 说话（打字机）
     ========================================================== */
  var typeTimers = {};

  function typeInto(el, text, done) {
    if (!el) return;
    var key = el.id || "anon";
    clearTimeout(typeTimers[key]);
    el.textContent = "";
    var i = 0;
    var caret = document.createElement("i");
    caret.className = "cst-caret";
    function tick() {
      if (i >= text.length) {
        if (caret.parentNode) caret.parentNode.removeChild(caret);
        if (done) done();
        return;
      }
      i++;
      el.textContent = text.slice(0, i);
      el.appendChild(caret);
      typeTimers[key] = setTimeout(tick, 18 + (text.charCodeAt(i) % 3) * 9);
    }
    tick();
  }

  /* 富文本：把 **xx** 变成 <em>，<b> 原样保留 */
  function rich(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<em>$1</em>").replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
  }

  /* ==========================================================
     5 · 事件台词
     ========================================================== */
  function ctxOf(spec, ch) {
    var D = window.YCDeep;
    var prog = { seen: 0, passed: 0, total: 8 };
    if (D && D.progress) { try { prog = D.progress(spec.hall); } catch (e) {} }
    var elite = false, visit = false;
    if (D && D.getCert) {
      try { elite = !!D.getCert(spec.hall, "elite"); visit = !!D.getCert(spec.hall, "visitor"); } catch (e) {}
    }
    return {
      hall: spec.hall, hallName: spec.name,
      ch: ch, other: otherOf(spec, ch),
      bond: bondOf(ch.id), tier: tierOf(ch.id),
      progress: prog, elite: elite, visit: visit,
      camp: S.camp[spec.hall] || null,
      mine: S.camp[spec.hall] === ch.id
    };
  }
  function otherOf(spec, ch) {
    for (var i = 0; i < spec.cast.length; i++) if (spec.cast[i].id !== ch.id) return spec.cast[i];
    return null;
  }

  function pickLine(ch, ev, ctx) {
    var pool = ch.lines && ch.lines[ev];
    if (typeof pool === "function") { try { pool = pool(ctx); } catch (e) { pool = null; } }
    if (!pool) {
      /* 兜底：跨人物通用，避免某一事件没写就哑了 */
      var G = GENERIC[ev];
      if (typeof G === "function") pool = G(ctx);
      else pool = G;
    }
    if (!pool || !pool.length) return null;
    var n = num(S.said[ch.id + ":" + ev], 0);
    S.said[ch.id + ":" + ev] = n + 1;
    write(S);
    return pool[n % pool.length];
  }

  var GENERIC = {
    greet: function (c) { return ["我是" + c.ch.name + "，" + c.ch.role + "。这一馆由我盯着。"]; },
    idle: function (c) { return ["还在看？不急，我先不说话。", "需要我讲点什么的时候，点「搭话」。"]; },
    seen: function (c) { return ["这一件看完了。记一句就够了：" + (c.ch.lesson || "别只看数字。")]; },
    /* 换房间：他跟着你走。这是「有人在」最便宜也最有效的证据 */
    zone: function (c) {
      var n = (c.data && c.data.name) || "这一间";
      var L = c.ch.lesson || "慢慢看，别急着下结论。";
      return [
        "「" + n + "」。" + L,
        "进了「" + n + "」。这一间我只提醒一句：" + L
      ];
    },
    pass: function (c) { return ["对了。别急着高兴，换个参数再跑一遍看看还成不成立。"]; },
    fail: function (c) { return ["错了不要紧。先问自己：你凭什么这么判？"]; },
    streak: function (c) { return ["连着错三次了。我换个说法——先别看答案，看条件。"]; },
    elite: function (c) { return ["证书签了。但你自己知道，你刚才每一步为什么对。"]; },
    visit: function (c) { return ["参观证书拿到了。这算见过，还不算懂。"]; },
    enterDeep: function (c) { return ["进了这一步，就没有旁观的位置了。"]; },
    campWin: function (c) { return ["你站我这边。那我把话说透一点。"]; },
    campLose: function (c) { return ["你信他。行，我不争——数据会替我说。"]; }
  };

  /* ==========================================================
     6 · 驻馆坞
     ========================================================== */
  var DOCK = null, DOCK_HALL = null, CUR = null, MOOD = "calm";
  var lastSay = 0, idleTimer = null, probeTimer = null, probeSnap = null;
  var SAYFN = null, PAINTFN = null;

  function isGamePage() {
    var p = (location.pathname || "").split("/").pop() || "";
    return /-(case|maze|purge|forecast|tower)\.html$/.test(p);
  }

  function autoMount(hall) {
    var spec = SPECS[hall];
    if (!spec) return;
    /* 一页只挂一馆；若页面已挂过别的馆，先拆 */
    if (DOCK_HALL && DOCK_HALL !== hall) unmount();
    if (DOCK_HALL === hall) return;
    mount(hall);
  }

  function unmount() {
    if (DOCK) { DOCK.parentNode && DOCK.parentNode.removeChild(DOCK); DOCK = null; }
    clearInterval(probeTimer); probeTimer = null;
    clearTimeout(idleTimer); idleTimer = null;
    DOCK_HALL = null; CUR = null;
  }

  function mount(hall) {
    var spec = SPECS[hall];
    if (!spec || !spec.cast.length) return null;
    DOCK_HALL = hall;

    var saved = null;
    try { saved = localStorage.getItem("yc.cast.cur." + hall); } catch (e) {}
    CUR = (saved && CHARMAP[saved] && CHARMAP[saved].hall === hall) ? saved : spec.cast[0].id;

    var folded = false;
    try { folded = localStorage.getItem("yc.cast.fold." + hall) === "1"; } catch (e) {}

    var el = document.createElement("div");
    el.className = "castdock cst-root" + (folded ? " cst-fold" : "");
    el.style.setProperty("--cst-ac", spec.accent);
    el.setAttribute("data-hall", hall);
    el.innerHTML =
      '<div class="cst-mini">' +
        '<div class="cst-faces"></div>' +
        '<span>' + esc(spec.shortName || "驻馆人") + '</span>' +
      "</div>" +
      '<div class="cst-head">' +
        '<i class="cst-live"></i><b>驻馆人</b>' +
        '<span class="cst-where">' + esc(spec.hall) + " · " + esc(spec.roomName || spec.name) + "</span>" +
        '<button class="cst-min" title="收起">–</button>' +
      "</div>" +
      '<div class="cst-row">' +
        '<div class="cst-faces"></div>' +
        '<div class="cst-who"></div>' +
      "</div>" +
      '<div class="cst-say" id="cstSay"></div>' +
      '<div class="cst-acts">' +
        '<button class="cst-btn pri" data-a="talk">搭话</button>' +
        '<button class="cst-btn" data-a="card">档案</button>' +
        (isGamePage() && typeof spec.hint === "function"
          ? '<button class="cst-btn" data-a="hint" title="花信任度换一句真提示">求提示</button>'
          : '<button class="cst-btn" data-a="switch">换人</button>') +
      "</div>";
    document.body.appendChild(el);
    DOCK = el;

    /* 头像渲染 */
    function paintFaces() {
      var big = el.querySelector(".cst-row .cst-faces");
      var mini = el.querySelector(".cst-mini .cst-faces");
      var html = spec.cast.map(function (c) {
        var cls = c.id === CUR ? "on" : (S.camp[hall] && S.camp[hall] !== c.id ? "cold" : "");
        return faceHTML(c, c.id === CUR ? MOOD : "calm", cls);
      }).join("");
      if (big) big.innerHTML = html;
      if (mini) mini.innerHTML = html;
    }

    function paintWho() {
      var ch = CHARMAP[CUR], o = otherOf(spec, ch);
      var who = el.querySelector(".cst-who");
      if (!who || !ch) return;
      var t = tierOf(ch.id), b = bondOf(ch.id);
      var mine = S.camp[hall] === ch.id;
      var segs = "";
      for (var i = 0; i < 10; i++) segs += '<i class="' + (b >= (i + 1) * 10 ? "on" : "") + '"></i>';
      who.innerHTML =
        '<div class="cst-nm">' + esc(ch.name) +
          "<small>" + esc(ch.role) + "</small></div>" +
        '<div class="cst-tag">' +
          '<span class="cst-camp' + (mine ? " mine" : "") + '">「' + esc(ch.camp) + "」</span>" +
          "<span>" + esc(t.cn) + " · " + esc(t.note) + "</span>" +
        "</div>" +
        '<div class="cst-bond">' +
          '<span class="cst-bseg">' + segs + "</span>" +
          "<b>" + b + "</b>" +
        "</div>";
    }

    function paint() { paintFaces(); paintWho(); }
    SAYFN = sayNow; PAINTFN = paint;

    /* 切换当前说话人 */
    function setCur(id, quiet) {
      if (!CHARMAP[id]) return;
      CUR = id; MOOD = "calm";
      try { localStorage.setItem("yc.cast.cur." + hall, id); } catch (e) {}
      paint();
      if (!quiet) {
        var ch = CHARMAP[id];
        sayNow(pickLine(ch, "switchIn", ctxOf(spec, ch)) ||
          "我来说吧。他刚才那套，我有一半不同意。");
      }
    }

    function sayNow(text) {
      var say = el.querySelector("#cstSay");
      if (!say || !text) return;
      lastSay = Date.now();
      typeInto(say, "", null);
      say.innerHTML = "";
      typeText(say, text);
    }
    /* 支持 **强调** */
    function typeText(host, text) {
      clearTimeout(typeTimers["cstSay"]);
      host.textContent = "";
      var caret = document.createElement("i");
      caret.className = "cst-caret";
      var plain = String(text);
      var i = 0;
      function tick() {
        if (i >= plain.length) {
          if (caret.parentNode) caret.parentNode.removeChild(caret);
          host.innerHTML = rich(plain);
          return;
        }
        i++;
        host.textContent = plain.slice(0, i);
        host.appendChild(caret);
        typeTimers["cstSay"] = setTimeout(tick, 18 + (plain.charCodeAt(i) % 3) * 9);
      }
      tick();
    }

    /* ---- 事件 ---- */
    el.addEventListener("click", function (ev) {
      var f = ev.target.closest(".cst-face");
      if (f) { setCur(f.getAttribute("data-ch")); return; }
      var b = ev.target.closest("[data-a]");
      if (b) {
        var a = b.getAttribute("data-a");
        if (a === "talk") openPanel(hall, CUR);
        else if (a === "card") openCard(hall, CUR);
        else if (a === "hint") doHint(hall, spec);
        else if (a === "switch") {
          var o = otherOf(spec, CHARMAP[CUR]);
          if (o) setCur(o.id);
        }
        return;
      }
      var mn = ev.target.closest(".cst-min");
      if (mn) {
        el.classList.add("cst-fold");
        try { localStorage.setItem("yc.cast.fold." + hall, "1"); } catch (e) {}
        return;
      }
      if (ev.target.closest(".cst-mini")) {
        el.classList.remove("cst-fold");
        try { localStorage.setItem("yc.cast.fold." + hall, "0"); } catch (e) {}
        paint();
        sayNow(pickLine(CHARMAP[CUR], "idle", ctxOf(spec, CHARMAP[CUR])) || "我在。");
      }
    });

    paint();

    /* ---- 首访：先选边，再打招呼 ---- */
    var firstTime = !S.met[hall];
    if (firstTime) {
      S.met[hall] = Date.now(); write(S);
      spec.cast.forEach(function (c) { addBond(c.id, 5); });
      paint();
      /* 先让坞里有人说话，再弹选边 —— 关掉弹层之后不至于是一片空白 */
      setTimeout(function () {
        var ch = CHARMAP[CUR];
        sayNow(pickLine(ch, "greet", ctxOf(spec, ch)) ||
          "我是" + ch.name + "。这一馆由我盯着。");
      }, 600);
      if (!S.camp[hall] && spec.campQ && !isGamePage()) {
        setTimeout(function () { openCamp(hall); }, 1500);
      }
    } else {
      setTimeout(function () {
        var ch = CHARMAP[CUR];
        var line = pickLine(ch, S.camp[hall] === ch.id ? "greetMine" : "greet", ctxOf(spec, ch)) ||
          pickLine(ch, "greet", ctxOf(spec, ch));
        sayNow(line);
      }, 900);
    }

    /* ---- 跟着你走：换房间时他开口 ----
       五个馆的房名控件类名各不相同（.tab/.lay/.door/.zone/.ks），
       但都带 data-l —— 所以在 document 上代理一次，不去碰各馆代码。 */
    var lastZone = "", lastZoneAt = 0;
    function zoneLabel(el) {
      var c = el.querySelector(".tt") || el.querySelector("span") || el;
      var s = (c.textContent || "").replace(/[0-9０-９·]/g, " ").replace(/\s+/g, " ").trim();
      return s.length > 12 ? s.slice(0, 12) : s;
    }
    document.addEventListener("click", function (e) {
      var t = e.target.closest && e.target.closest("[data-l]");
      if (!t) return;
      var name = zoneLabel(t);
      if (!name || name === lastZone) return;
      if (Date.now() - lastZoneAt < 6000) return;
      lastZone = name; lastZoneAt = Date.now();
      setTimeout(function () { dispatch(hall, "zone", { name: name }); }, 340);
    }, true);

    /* ---- 闲置主动搭话 ---- */
    function resetIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(function () {
        if (document.hidden) return;
        var ch = CHARMAP[CUR];
        var t = pickLine(ch, "idle", ctxOf(spec, ch));
        if (t) { sayNow(t); toast(ch, t, 6000); }
        resetIdle();
      }, 44000);
    }
    ["pointerdown", "keydown", "wheel"].forEach(function (e) {
      window.addEventListener(e, resetIdle, { passive: true });
    });
    resetIdle();

    /* ---- 游戏页：盯盘 ---- */
    if (isGamePage() && typeof spec.probe === "function") {
      probeSnap = safeProbe(spec);
      probeTimer = setInterval(function () {
        var s = safeProbe(spec);
        if (!s || !probeSnap) { probeSnap = s; return; }
        react(hall, spec, probeSnap, s);
        probeSnap = s;
      }, 1500);
    }

    window.addEventListener("yc:deep", function (e) {
      var d = e.detail || {};
      if (d.hall !== hall) return;
      dispatch(hall, d.ev, d.data);
    });

    return el;
  }

  function safeProbe(spec) {
    try { return spec.probe ? spec.probe() : null; } catch (e) { return null; }
  }

  /* 盯盘：状态变了就说一句 */
  function react(hall, spec, a, b) {
    var ch = CHARMAP[CUR];
    if (!ch) return;
    if (Date.now() - lastSay < 5200) return;
    var ctx = ctxOf(spec, ch);
    if (a.done !== b.done && b.done) { if (SAYFN) SAYFN(pickLine(ch, "gameDone", ctx) || "走完了。回头看一遍你刚才的每一步。"); return; }
    if (b.left !== a.left && b.left < a.left) {
      var t = pickLine(ch, "gameSpend", ctx);
      if (t && SAYFN) SAYFN(t);
      return;
    }
    if (b.score !== a.score && b.score > a.score) {
      var t2 = pickLine(ch, "gameUp", ctx);
      if (t2 && SAYFN) SAYFN(t2);
      return;
    }
    if (b.warn && b.warn !== a.warn) {
      var t3 = pickLine(ch, "gameWarn", ctx);
      if (t3 && SAYFN) SAYFN(t3);
    }
  }

  /* ==========================================================
     7 · 求提示（只在玩法页）
     ----------------------------------------------------------
     这是本系统里唯一「有代价」的交互：一句真能用的提示，
     要拿信任度换，而且越要越贵。
     为什么这么做：如果提示免费，人就会一直问，人物就退化成
     说明书；如果提示太贵，人就不敢问，人物就退化成装饰。
     涨价的曲线是这条线的位置本身。
     ========================================================== */
  function hintCost(hall) {
    var n = num(S.flag["hint." + hall], 0);
    return 6 + n * 4;
  }

  function doHint(hall, spec) {
    var ch = CHARMAP[CUR];
    if (!ch || !spec.hint) return;
    var n = num(S.flag["hint." + hall], 0);
    var cost = hintCost(hall);
    var b = bondOf(ch.id);
    if (b < cost) {
      if (SAYFN) SAYFN("你还不够信我。信任度 " + b + "，这一句要 " + cost +
        "。先去把展品验几件，或者把这一关重走一遍——**信任是攒出来的，不是要出来的**。");
      return;
    }
    var snap = safeProbe(spec);
    var text = "";
    try { text = spec.hint(snap, n) || ""; } catch (e) { text = ""; }
    if (!text) { if (SAYFN) SAYFN("这一句我还没想好怎么跟你说。先自己试试。"); return; }
    addBond(ch.id, -cost, "hint");
    S.flag["hint." + hall] = n + 1;
    write(S);
    if (PAINTFN) PAINTFN();
    if (SAYFN) SAYFN(text);
    toast(ch, "这句花了你 " + cost + " 点信任。下一句要 " + hintCost(hall) + "。", 6000);
  }

  /* ==========================================================
     8 · 事件派发
     ========================================================== */
  function dispatch(hall, ev, data) {
    var spec = SPECS[hall];
    if (!spec || !DOCK) return;
    var ch = CHARMAP[CUR];
    if (!ch) return;
    var ctx = ctxOf(spec, ch);
    ctx.data = data || {};

    var DELTA = {
      pass: 4, fail: -1, seen: 2, streak: 3,
      elite: 15, visit: 6, enterDeep: 2, gameDone: 18, camp: 3
    };
    if (typeof DELTA[ev] === "number") addBond(ch.id, DELTA[ev], ev);

    var line = pickLine(ch, ev, ctx);
    if (!line) return;
    /* 情绪：成功上扬、失败下压 */
    MOOD = ev === "pass" || ev === "elite" || ev === "gameDone" ? "up"
      : (ev === "fail" || ev === "streak" || ev === "gameWarn" ? "down" : "calm");
    if (DOCK) {
      var f = DOCK.querySelectorAll(".cst-face");
      for (var i = 0; i < f.length; i++) {
        var id = f[i].getAttribute("data-ch");
        f[i].outerHTML = faceHTML(CHARMAP[id], id === CUR ? MOOD : "calm",
          id === CUR ? "on" : (S.camp[hall] && S.camp[hall] !== id ? "cold" : ""));
      }
    }
    if (SAYFN) SAYFN(line);
    if (ev === "pass" || ev === "elite" || ev === "gameDone" || ev === "streak") toast(ch, line, 7000);
  }

  /* 兼容：老代码可以直接调 */
  function say(hall, ev, data) { dispatch(hall, ev, data); }

  /* ==========================================================
     8 · 搭话面板
     ========================================================== */
  var PANEL = null;

  function ensurePanel() {
    if (PANEL) return PANEL;
    var p = document.createElement("div");
    p.className = "castpanel cst-root";
    p.innerHTML =
      '<div class="cstp-head">' +
        '<div class="cstp-top"><div class="cst-faces"></div>' +
          '<div class="cstp-id"></div>' +
          '<button class="cst-x" title="关闭">×</button>' +
        "</div>" +
        '<div class="cstp-meta"></div>' +
      "</div>" +
      '<div class="cstp-flow" id="cstFlow"></div>' +
      '<div class="cstp-topics" id="cstTopics"></div>';
    document.body.appendChild(p);
    PANEL = p;
    p.querySelector(".cst-x").addEventListener("click", function () { p.classList.remove("open"); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && p.classList.contains("open")) p.classList.remove("open");
    });
    return p;
  }

  function openPanel(hall, chId) {
    var spec = SPECS[hall];
    if (!spec) return;
    var ch = CHARMAP[chId || CUR];
    if (!ch) return;
    var p = ensurePanel();
    p.style.setProperty("--cst-ac", spec.accent);
    p.setAttribute("data-hall", hall);
    p.setAttribute("data-ch", ch.id);

    var faces = p.querySelector(".cstp-top .cst-faces");
    faces.innerHTML = spec.cast.map(function (c) {
      return faceHTML(c, "calm", c.id === ch.id ? "on" : "");
    }).join("");
    faces.onclick = function (ev) {
      var f = ev.target.closest(".cst-face");
      if (f) openPanel(hall, f.getAttribute("data-ch"));
    };

    var idBox = p.querySelector(".cstp-id");
    var t = tierOf(ch.id), b = bondOf(ch.id);
    var mine = S.camp[hall] === ch.id;
    idBox.innerHTML =
      '<div class="cst-nm">' + esc(ch.name) + "<small>" + esc(ch.role) + "</small></div>" +
      '<div class="cst-tag">' +
        '<span class="cst-camp' + (mine ? " mine" : "") + '">「' + esc(ch.camp) + "」</span>" +
        "<span>" + esc(t.cn) + "</span>" +
      "</div>";

    var meta = p.querySelector(".cstp-meta");
    var prog = ctxOf(spec, ch).progress;
    meta.innerHTML =
      "<span>信任 <b>" + b + "</b>/100</span>" +
      "<span>展品 <b>" + prog.passed + "</b>/" + prog.total + "</span>" +
      "<span>口述史 <b>" + unlockedOral(ch).length + "</b>/" + (ch.oral || []).length + "</span>" +
      (S.camp[hall] ? "<span>已选边 <b>" + esc((CHARMAP[S.camp[hall]] || {}).name || "—") + "</b></span>" : "<span>尚未选边</span>");

    /* 对话流：开场一句 */
    var flow = p.querySelector("#cstFlow");
    flow.innerHTML = "";
    var ctx = ctxOf(spec, ch);
    var opening = pickLine(ch, mine ? "panelMine" : "panel", ctx) ||
      pickLine(ch, "panel", ctx) || "问吧。我不一定全说。";
    pushMsg(flow, "them", opening);

    /* 话题 */
    paintTopics(p, hall, ch);
    p.classList.add("open");
  }

  function pushMsg(flow, who, text, lore) {
    var d = document.createElement("div");
    d.className = "cst-msg" + (who === "me" ? " me" : "");
    if (who === "sys") {
      d.className = "cst-msg sys";
      d.innerHTML = "<span>" + esc(text) + "</span>";
    } else {
      var html = rich(text);
      if (lore) html += '<span class="cst-lore">' + rich(lore) + "</span>";
      d.innerHTML = '<div class="cst-bub">' + html + "</div>";
    }
    flow.appendChild(d);
    flow.scrollTop = flow.scrollHeight;
    return d;
  }

  function paintTopics(p, hall, ch) {
    var spec = SPECS[hall];
    var box = p.querySelector("#cstTopics");
    var ctx = ctxOf(spec, ch);
    var asked = S.flag["asked." + ch.id] || {};
    var list = (ch.topics || []).filter(function (tp) {
      if (!tp.need) return true;
      if (tp.need.bond && bondOf(ch.id) < tp.need.bond) return false;
      if (tp.need.camp && !ctx.mine) return false;
      if (tp.need.elite && !ctx.elite) return false;
      return true;
    });

    var h = '<div class="cstp-th">可以问的</div>';
    if (!list.length) {
      h += '<div style="font-size:11.5px;color:var(--cst-ink3);line-height:1.7">他还没打算跟你聊这些。先去看看展品，或者把这一馆的挑战走一遍。</div>';
    }
    list.forEach(function (tp, i) {
      var isAsked = !!asked[tp.q];
      h += '<button class="cst-tp' + (isAsked ? " done" : "") + '" data-tp="' + i + '">' +
        esc(tp.q) +
        (tp.sub ? "<small>" + esc(tp.sub) + "</small>" : (isAsked ? "<small>已问过 · 可再问</small>" : "")) +
        "</button>";
    });
    /* 锁住的话题也显示，作为可见目标 */
    (ch.topics || []).forEach(function (tp) {
      if (!tp.need) return;
      if (list.indexOf(tp) >= 0) return;
      var why = tp.need.elite ? "需先完成本馆精英挑战" : (tp.need.camp ? "需先选边站队" : "需信任度 ≥ " + tp.need.bond);
      h += '<button class="cst-tp lock" disabled>' + esc(tp.q) + "<small>🔒 " + esc(why) + "</small></button>";
    });
    box.innerHTML = h;

    box.onclick = function (ev) {
      var b = ev.target.closest("[data-tp]");
      if (!b) return;
      var tp = list[+b.getAttribute("data-tp")];
      if (!tp) return;
      var flow = p.querySelector("#cstFlow");
      pushMsg(flow, "me", tp.q);
      var ctx2 = ctxOf(spec, ch);
      var ans = typeof tp.say === "function" ? tp.say(ctx2) : tp.say;
      var lore = null;
      if (tp.lore) lore = typeof tp.lore === "function" ? tp.lore(ctx2) : tp.lore;
      setTimeout(function () {
        pushMsg(flow, "them", ans, lore);
        S.flag["asked." + ch.id] = S.flag["asked." + ch.id] || {};
        S.flag["asked." + ch.id][tp.q] = 1;
        write(S);
        addBond(ch.id, 1);
        /* 追问 */
        if (tp.ask && tp.ask.length) {
          var fa = document.createElement("div");
          fa.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px";
          tp.ask.forEach(function (a, k) {
            var btn = document.createElement("button");
            btn.className = "cst-btn";
            btn.style.flex = "0 1 auto";
            btn.textContent = a.q;
            btn.onclick = function () {
              fa.remove();
              pushMsg(flow, "me", a.q);
              setTimeout(function () {
                pushMsg(flow, "them",
                  typeof a.say === "function" ? a.say(ctxOf(spec, ch)) : a.say,
                  a.lore ? (typeof a.lore === "function" ? a.lore(ctxOf(spec, ch)) : a.lore) : null);
                addBond(ch.id, 1);
              }, 380);
            };
            fa.appendChild(btn);
          });
          flow.appendChild(fa);
          flow.scrollTop = flow.scrollHeight;
        }
        /* 刷新头部数字与话题态 */
        var bb = bondOf(ch.id);
        var m = p.querySelector(".cstp-meta");
        if (m) m.children[0].innerHTML = "信任 <b>" + bb + "</b>/100";
        paintTopics(p, hall, ch);
      }, 420);
    };
  }

  /* ==========================================================
     9 · 人物档案
     ========================================================== */
  var CARD = null;

  function unlockedOral(ch) {
    var b = bondOf(ch.id);
    var elite = false;
    try { elite = !!(window.YCDeep && YCDeep.getCert(ch.hall, "elite")); } catch (e) {}
    var out = [];
    (ch.oral || []).forEach(function (o, i) {
      var ok = true;
      if (o.need) {
        if (o.need.bond && b < o.need.bond) ok = false;
        if (o.need.elite && !elite) ok = false;
      }
      if (ok) out.push(i);
    });
    return out;
  }

  function ensureCard() {
    if (CARD) return CARD;
    var c = document.createElement("div");
    c.className = "castcard cst-root";
    c.innerHTML = '<div class="cstc-box"><div class="cstc-head"></div>' +
      '<div class="cstc-wrap"><div class="cstc-body"></div></div></div>';
    document.body.appendChild(c);
    CARD = c;
    c.addEventListener("click", function (e) {
      if (e.target === c || e.target.closest(".cst-x")) c.classList.remove("open");
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && c.classList.contains("open")) c.classList.remove("open");
    });
    return c;
  }

  function openCard(hall, chId) {
    var spec = SPECS[hall];
    if (!spec) return;
    var ch = CHARMAP[chId || CUR];
    if (!ch) return;
    var c = ensureCard();
    c.style.setProperty("--cst-ac", ch.color || spec.accent);
    var head = c.querySelector(".cstc-head");
    var b = bondOf(ch.id), t = tierOf(ch.id);
    var mine = S.camp[hall] === ch.id;
    head.innerHTML =
      faceHTML(ch, "calm", "on") +
      '<div class="cstc-t"><h3>' + esc(ch.name) + " · " + esc(ch.role) + "</h3>" +
        "<p>" + esc(ch.camp) + "派 · " + esc(t.cn) + "（信任 " + b + "/100）" +
        (mine ? " · 你站他这边" : "") + "</p></div>" +
      '<button class="cst-x" title="关闭">×</button>';

    var o = otherOf(spec, ch);
    var ol = unlockedOral(ch);
    var body = c.querySelector(".cstc-body");
    /* 左栏大幅胸像：换人时要整块换掉，不能叠着留上一个人的脸 */
    var wrap = c.querySelector(".cstc-wrap");
    if (wrap) {
      var oldPor = wrap.querySelector(".cstc-por");
      if (oldPor) oldPor.parentNode.removeChild(oldPor);
      wrap.insertAdjacentHTML("afterbegin", bustHTML(ch, "calm"));
    }

    var kv = ch.kv || {};
    var kvHTML = Object.keys(kv).map(function (k) {
      return '<div class="cstc-kv"><div class="k">' + esc(k) + '</div><div class="v">' + esc(kv[k]) + "</div></div>";
    }).join("");

    body.innerHTML =
      '<div class="cstc-sec"><h4>他是谁</h4><p class="cstc-bio">' + rich(ch.bio || "") + "</p></div>" +
      (kvHTML ? '<div class="cstc-sec"><h4>档案</h4><div class="cstc-grid">' + kvHTML + "</div></div>" : "") +
      '<div class="cstc-sec"><h4>这一馆的分歧 <span>' + esc(spec.campQ || "") + "</span></h4>" +
        '<div class="cst-campline">' +
          '<div class="cst-campcard' + (mine ? " mine" : "") + '">' +
            '<div class="cn">' + esc(ch.name) + "「" + esc(ch.camp) + "」</div>" +
            '<div class="cq">' + esc(ch.stance || "") + "</div></div>" +
          '<div class="cst-vs">VS</div>' +
          (o ? '<div class="cst-campcard' + (S.camp[hall] === o.id ? " mine" : "") + '">' +
            '<div class="cn">' + esc(o.name) + "「" + esc(o.camp) + "」</div>" +
            '<div class="cq">' + esc(o.stance || "") + "</div></div>" : "<div></div>") +
        "</div>" +
        '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">' +
          (S.camp[hall] ? "" : '<button class="cst-btn pri" style="flex:0 0 auto;padding:7px 14px" data-act="camp">还没选边 · 现在选</button>') +
          (spec.clash ? '<button class="cst-btn" style="flex:0 0 auto;padding:7px 14px" data-act="clash">听他们吵一架 →</button>' : "") +
        "</div>" +
      "</div>" +
      '<div class="cstc-sec"><h4>口述史 <span>' + ol.length + " / " + (ch.oral || []).length + "</span></h4>" +
        (ch.oral || []).map(function (o2, i) {
          var open = ol.indexOf(i) >= 0;
          return '<div class="cst-loreitem' + (open ? "" : " lock") + '">' +
            '<div class="lt">' + esc(o2.t) + "<em>" + (open ? "已解锁" : lockHint(o2)) + "</em></div>" +
            '<div class="lx">' + rich(o2.x) + "</div></div>";
        }).join("") +
      "</div>";

    body.onclick = function (e) {
      if (e.target.closest('[data-act="camp"]')) { c.classList.remove("open"); openCamp(hall); }
      if (e.target.closest('[data-act="clash"]')) { c.classList.remove("open"); openClash(hall); }
    };
    c.classList.add("open");
  }
  function lockHint(o) {
    if (o.need && o.need.elite) return "需完成精英挑战";
    if (o.need && o.need.bond) return "信任度 ≥ " + o.need.bond;
    return "未解锁";
  }

  /* 玩法页不自动弹选边。
     选边是「进馆时的邀请」，不是「开局前的关卡」——
     在 h2-case / h3-maze 这类页面上，一个全屏弹层直接盖住棋盘，
     玩家的第一反应是「游戏坏了」。要看两人的立场，坞里那个「立场」按钮还在。 */
  function isGamePage() {
    return /-(case|maze|purge|forecast|tower)\.html$/.test(location.pathname);
  }

  /* ==========================================================
     10 · 选边
     ========================================================== */
  var CAMP = null;

  function ensureCamp() {
    if (CAMP) return CAMP;
    var c = document.createElement("div");
    c.className = "castcamp cst-root";
    c.innerHTML = '<div class="cstk-box" id="cstkBox"></div>';
    document.body.appendChild(c);
    CAMP = c;
    /* 必须能随手关掉：选边是邀请，不是关卡 */
    c.addEventListener("click", function (e) {
      if (e.target === c) c.classList.remove("open");
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && c.classList.contains("open")) c.classList.remove("open");
    });
    return c;
  }

  function openCamp(hall) {
    var spec = SPECS[hall];
    if (!spec || !spec.campQ) return;
    var c = ensureCamp();
    c.style.setProperty("--cst-ac", spec.accent);
    c.setAttribute("data-hall", hall);
    var box = c.querySelector("#cstkBox");
    box.innerHTML =
      '<div class="cstk-kick">' + esc(spec.hall) + " · " + esc(spec.roomName || spec.name) + " · 驻馆人立场</div>" +
      "<h2>" + esc(spec.campQ) + "</h2>" +
      '<p class="cstk-lead">' + rich(spec.campLead || "这一馆里两个人，对这个问题给出的答案不一样。他们都在这儿干了很久，都不打算改口。你站谁，之后听到的话就不一样——不是换个人说话，是换一套判断标准。") + "</p>" +
      '<div class="cstk-grid">' +
        spec.cast.map(function (ch) {
          /* 这里必须是 div 不能是 button：卡里要放头像按钮，
             button 套 button 会被解析器强制拆开，整张卡就散架了。 */
          return '<div class="cstk-pick" role="button" tabindex="0" data-pick="' + ch.id + '">' +
            '<div class="cst-faces">' + faceHTML(ch, "calm", "on") + "</div>" +
            '<div class="pn">' + esc(ch.name) + "</div>" +
            '<div class="pr">' + esc(ch.role) + " · 「" + esc(ch.camp) + "」派</div>" +
            '<div class="pq">' + esc(ch.stance || "") + "</div>" +
            '<div class="pc">我站他 →</div>' +
          "</div>";
        }).join("") +
      "</div>" +
      '<button class="cstk-skip">先不选，我再看看</button>';

    function pick(el) {
      var p = el.closest("[data-pick]");
      if (!p) return false;
      chooseCamp(hall, p.getAttribute("data-pick"));
      c.classList.remove("open");
      return true;
    }
    box.onclick = function (e) {
      if (pick(e.target)) return;
      if (e.target.closest(".cstk-skip")) c.classList.remove("open");
    };
    box.onkeydown = function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (pick(e.target)) e.preventDefault();
    };
    c.classList.add("open");
  }

  function chooseCamp(hall, id) {
    var spec = SPECS[hall];
    if (!spec || !CHARMAP[id]) return;
    S.camp[hall] = id; write(S);
    var ch = CHARMAP[id], o = otherOf(spec, ch);
    addBond(id, 8, "camp");
    if (o) addBond(o.id, -2, "campOther");
    if (DOCK) {
      CUR = id;
      try { localStorage.setItem("yc.cast.cur." + hall, id); } catch (e) {}
      mountRefresh(hall);
    }
    var line = pickLine(ch, "campWin", ctxOf(spec, ch)) ||
      "你站我这边。那我把话说透一点。";
    setTimeout(function () {
      if (SAYFN) SAYFN(line);
      toast(ch, line, 8000);
    }, 500);
    /* 让地图/首页知道状态变了 */
    try { window.dispatchEvent(new CustomEvent("yc:camp", { detail: { hall: hall, id: id } })); } catch (e) {}
  }

  function mountRefresh(hall) {
    /* 重挂一次，让头像的 cold/on 态、who 区全部重算 */
    var spec = SPECS[hall];
    if (!spec) return;
    var wasFold = DOCK && DOCK.classList.contains("cst-fold");
    unmount();
    var el = mount(hall);
    if (wasFold && el) el.classList.add("cst-fold");
    /* 注意：sayNow 是 mount 内的局部函数，这里只能用模块级的 SAYFN */
    if (el && SAYFN) SAYFN(pickLine(CHARMAP[CUR], "campWin", ctxOf(spec, CHARMAP[CUR])) || "行，我接着说。");
  }

  /* ==========================================================
     10 · 「听他们吵一架」
     ----------------------------------------------------------
     一个人对你说话，你是观众；两个人互相说话，你才是在场。
     台词不解释分歧，只把分歧演出来 —— 讲道理的部分留给玩家自己判断。
     ========================================================== */
  var CLASH = null, clashTimer = null, clashIdx = 0, clashHall = null;

  function ensureClash() {
    if (CLASH) return CLASH;
    var c = document.createElement("div");
    c.className = "castclash cst-root";
    c.innerHTML =
      '<div class="cstg-box">' +
        '<div class="cstg-head">' +
          '<div class="cstg-t"><h4>他们吵过一架</h4><p></p></div>' +
          '<button class="cst-x" title="关闭">×</button>' +
        "</div>" +
        '<div class="cstg-stage"></div>' +
        '<div class="cstg-foot">' +
          '<span class="cstg-hint">他们不会和解 —— 这是这一馆存在的原因。</span>' +
          '<button class="cst-btn" data-g="replay" style="flex:0 0 auto;padding:7px 12px">再说一遍</button>' +
          '<button class="cst-btn pri" data-g="skip" style="flex:0 0 auto;padding:7px 12px">全部展开</button>' +
        "</div>" +
      "</div>";
    document.body.appendChild(c);
    CLASH = c;
    c.addEventListener("click", function (e) {
      if (e.target === c || e.target.closest(".cst-x")) { stopClash(); return; }
      if (e.target.closest('[data-g="replay"]')) { openClash(clashHall); return; }
      if (e.target.closest('[data-g="skip"]')) { flushClash(); }
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && c.classList.contains("open")) stopClash();
    });
    return c;
  }

  function clashRow(spec, l) {
    var ch = spec.cast[l.w === "b" ? 1 : 0] || spec.cast[0];
    var row = document.createElement("div");
    row.className = "cstg-row" + (l.w === "b" ? " r" : "");
    row.innerHTML = faceHTML(ch, l.mood || "calm", "on") +
      '<div class="cstg-bub"><span class="cstg-n">' + esc(ch.name) + " · " + esc(ch.role) + "</span>" +
      rich(l.t) + "</div>";
    return row;
  }

  function stopClash() {
    clearTimeout(clashTimer); clashTimer = null;
    if (CLASH) CLASH.classList.remove("open");
  }

  function flushClash() {
    var spec = SPECS[clashHall];
    if (!spec || !spec.clash) return;
    clearTimeout(clashTimer); clashTimer = null;
    var stage = CLASH.querySelector(".cstg-stage");
    while (clashIdx < spec.clash.length) {
      stage.appendChild(clashRow(spec, spec.clash[clashIdx++]));
    }
    stage.scrollTop = stage.scrollHeight;
    CLASH.querySelector('[data-g="skip"]').style.display = "none";
  }

  function openClash(hall) {
    var spec = SPECS[hall];
    if (!spec || !spec.clash || !spec.clash.length) return;
    var c = ensureClash();
    c.style.setProperty("--cst-ac", spec.accent);
    c.querySelector("h4").textContent = spec.clashTitle || "他们吵过一架";
    c.querySelector(".cstg-head p").textContent =
      spec.hall + " · " + (spec.roomName || spec.name) + " · " + spec.campQ;
    c.querySelector(".cstg-stage").innerHTML = "";
    c.querySelector('[data-g="skip"]').style.display = "";
    clashHall = hall; clashIdx = 0;
    c.classList.add("open");
    playClash();
  }

  function playClash() {
    var spec = SPECS[clashHall];
    if (!spec || !spec.clash) return;
    var stage = CLASH.querySelector(".cstg-stage");
    if (clashIdx >= spec.clash.length) {
      CLASH.querySelector('[data-g="skip"]').style.display = "none";
      return;
    }
    stage.appendChild(clashRow(spec, spec.clash[clashIdx++]));
    stage.scrollTop = stage.scrollHeight;
    clearTimeout(clashTimer);
    clashTimer = setTimeout(playClash, 1750);
  }

  /* ==========================================================
     11 · 插话提示
     ========================================================== */
  var TOAST = null, toastTimer = null;
  function toast(ch, text, ms) {
    if (!TOAST) {
      TOAST = document.createElement("div");
      TOAST.className = "csttoast cst-root";
      document.body.appendChild(TOAST);
    }
    var spec = SPECS[ch.hall];
    TOAST.style.setProperty("--cst-ac", ch.color || (spec ? spec.accent : "#46d3e8"));
    TOAST.innerHTML =
      faceHTML(ch, "calm", "on") +
      '<div class="tx"><div class="nm">' + esc(ch.name) + " · " + esc(ch.role) + "</div>" +
      '<div class="sy">' + rich(text) + "</div></div>";
    TOAST.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { TOAST.classList.remove("on"); }, ms || 5200);
  }

  /* ==========================================================
     12 · 今日值守（城市页 / 地图页）
     ========================================================== */
  /* 轮值表：按北京时间分四班。名字与颜色在此登记，
     完整立绘仍由各馆文件提供——城市页只放小徽章，不加载五个馆的立绘。 */
  var MINI = {
    shen: { hall: "H2", nm: "沈砚", role: "首席证物官", color: "#a887ff", mono: "砚" },
    qi:   { hall: "H2", nm: "祁野", role: "现场探员",   color: "#a887ff", mono: "野" },
    bai:  { hall: "H3", nm: "白珩", role: "指标员",     color: "#f2a63c", mono: "珩" },
    tao:  { hall: "H3", nm: "陶叔", role: "老技师",     color: "#f2a63c", mono: "陶" },
    cen:  { hall: "H4", nm: "岑默", role: "净化工程师", color: "#35cfa8", mono: "岑" },
    luo:  { hall: "H4", nm: "罗姐", role: "产能主管",   color: "#35cfa8", mono: "罗" },
    wen:  { hall: "H5", nm: "温野", role: "育种师",     color: "#ef6a72", mono: "温" },
    sang: { hall: "H5", nm: "阿桑", role: "抢救组",     color: "#ef6a72", mono: "桑" },
    lu:   { hall: "H6", nm: "陆准", role: "配额官",     color: "#6d9bff", mono: "陆" },
    man:  { hall: "H6", nm: "小满", role: "攀爬者",     color: "#6d9bff", mono: "满" }
  };

  var SHIFTS = [
    { from: 6,  to: 12, name: "早班", ids: ["qi", "luo", "man"] },
    { from: 12, to: 18, name: "午班", ids: ["bai", "sang", "shen"] },
    { from: 18, to: 24, name: "夜班", ids: ["cen", "wen", "lu"] },
    { from: 0,  to: 6,  name: "守夜", ids: ["tao"] }
  ];

  function roster() {
    /* 城市页写的是「北京时间」，那就必须真的按东八区算，
       不能拿本机 local hour 糊过去 —— 用户在别的时区打开会错班。 */
    var now = new Date();
    var bj = new Date(now.getTime() + (now.getTimezoneOffset() + 480) * 60000);
    var h = bj.getHours(), mi = bj.getMinutes();
    var sh = SHIFTS[0];
    for (var i = 0; i < SHIFTS.length; i++) {
      if (h >= SHIFTS[i].from && h < SHIFTS[i].to) { sh = SHIFTS[i]; break; }
    }
    var leftMin = (sh.to - h) * 60 - mi;
    if (leftMin < 0) leftMin += 1440;
    return {
      hour: h, minute: mi, shift: sh.name,
      until: leftMin,
      clock: (h < 10 ? "0" : "") + h + ":" + (mi < 10 ? "0" : "") + mi,
      people: sh.ids.map(function (id) {
        var m = MINI[id] || {};
        return {
          id: id, hall: m.hall, name: m.nm, role: m.role,
          color: m.color, mono: m.mono,
          bond: bondOf(id), tier: tierOf(id).cn
        };
      })
    };
  }

  function miniBadge(p, size) {
    var s = size || 30;
    return '<span class="cst-mbadge" style="width:' + s + "px;height:" + s + "px;border-radius:" + Math.round(s / 3.6) +
      "px;background:linear-gradient(150deg," + p.color + "33," + p.color + "0d);border:1px solid " + p.color +
      '66;display:inline-grid;place-items:center;font-size:' + Math.round(s * .44) + "px;font-weight:800;color:" +
      p.color + ';flex:none;font-family:var(--mono,monospace)">' + esc(p.mono || "·") + "</span>";
  }

  /* ==========================================================
     13 · 导出
     ========================================================== */
  return {
    version: VERSION,
    register: register,
    specOf: specOf,
    svg: svg,
    state: function () { return S; },
    bondOf: bondOf,
    tierOf: function (id) { return tierOf(id).cn; },
    addBond: addBond,
    say: say,
    dispatch: dispatch,
    openPanel: openPanel,
    openCard: openCard,
    openCamp: openCamp,
    openClash: openClash,
    chooseCamp: chooseCamp,
    mount: mount,
    roster: roster,
    miniBadge: miniBadge,
    MINI: MINI,
    unlockedOral: unlockedOral,
    faceHTML: faceHTML,
    /* 让游戏内核自己报事件 */
    emit: function (hall, ev, data) { dispatch(hall, ev, data); }
  };
})();
</script>
<script>
/* 杨城 · 时间感知城市视图  yc-cityview.js
   程序化绘制的未来城市天际线。天空色、光照强度、窗户亮灯率、太阳位置
   全部由「北京时间」连续驱动 —— 不同时刻进来看到的是不同的杨城。

   构图（参照明亮的白昼未来城市）：
     天空 0 - 0.70 ｜ 城市三层纵深 0.19 - 0.70 ｜ 前景 0.70 - 1.0
     远景塔群（淡）→ 中景塔群 → 近景塔群（实），底部被前景绿植与高架遮挡

   性能结构：
     bgFar  离屏：天空 + 星 + 日轮 + 远山
     云     每帧：在天与城之间漂移
     bgNear 离屏：三层塔群 + 穹顶 + 绿植 + 河流 + 高架
     动态层 每帧：水面波光、飞行器、航标灯

   两个离屏层只在时间片推进（约 10 秒）或尺寸变化时重绘。 */

(function (global) {
  "use strict";

  var TAU = Math.PI * 2;

  /* ---------------- 北京时间 ---------------- */
  function beijingNow() {
    var n = new Date();
    return new Date(n.getTime() + n.getTimezoneOffset() * 60000 + 8 * 3600000);
  }

  /* ---------------- 一天的光线关键帧 ---------------- */
  var KEYS = [
    { h: 0.0,  name: "深夜", top: [222, 58, 9],  mid: [221, 50, 15], hor: [214, 40, 26], sun: [210, 66, 88], amb: 0.10, lamp: 1.00 },
    { h: 4.4,  name: "凌晨", top: [220, 56, 12], mid: [218, 46, 20], hor: [212, 38, 32], sun: [212, 58, 82], amb: 0.16, lamp: 0.94 },
    { h: 5.6,  name: "破晓", top: [228, 42, 26], mid: [272, 28, 42], hor: [332, 32, 56], sun: [22, 88, 74],  amb: 0.36, lamp: 0.76 },
    { h: 6.5,  name: "日出", top: [212, 44, 50], mid: [258, 28, 62], hor: [26, 76, 72],  sun: [40, 100, 88], amb: 0.60, lamp: 0.48 },
    { h: 7.8,  name: "清晨", top: [205, 58, 62], mid: [199, 50, 80], hor: [196, 46, 92], sun: [48, 100, 96], amb: 0.88, lamp: 0.18 },
    { h: 10.5, name: "上午", top: [203, 70, 54], mid: [197, 60, 80], hor: [194, 50, 94], sun: [50, 100, 98], amb: 0.99, lamp: 0.06 },
    { h: 13.0, name: "正午", top: [202, 74, 51], mid: [196, 62, 82], hor: [193, 48, 96], sun: [52, 100, 99], amb: 1.08, lamp: 0.02 },
    { h: 15.6, name: "午后", top: [204, 60, 58], mid: [198, 50, 82], hor: [197, 42, 94], sun: [46, 100, 97], amb: 0.95, lamp: 0.10 },
    { h: 17.6, name: "黄昏", top: [226, 42, 50], mid: [316, 24, 66], hor: [24, 80, 70],  sun: [34, 100, 84], amb: 0.66, lamp: 0.42 },
    { h: 18.9, name: "暮色", top: [230, 46, 28], mid: [270, 30, 42], hor: [332, 38, 54], sun: [16, 86, 72],  amb: 0.36, lamp: 0.78 },
    { h: 20.3, name: "入夜", top: [223, 56, 11], mid: [220, 46, 18], hor: [214, 40, 32], sun: [210, 64, 86], amb: 0.16, lamp: 0.95 },
    { h: 24.0, name: "深夜", top: [222, 58, 9],  mid: [221, 50, 15], hor: [214, 40, 26], sun: [210, 66, 88], amb: 0.10, lamp: 1.00 }
  ];

  function dayPhase(t) {
    t = ((t % 24) + 24) % 24;
    var i = 0;
    while (i < KEYS.length - 2 && KEYS[i + 1].h <= t) i++;
    var a = KEYS[i], b = KEYS[i + 1];
    var span = b.h - a.h || 1;
    var p = Math.max(0, Math.min(1, (t - a.h) / span));
    return {
      name: p < 0.5 ? a.name : b.name,
      top: mix3(a.top, b.top, p),
      mid: mix3(a.mid, b.mid, p),
      hor: mix3(a.hor, b.hor, p),
      sun: mix3(a.sun, b.sun, p),
      amb: a.amb + (b.amb - a.amb) * p,
      lamp: a.lamp + (b.lamp - a.lamp) * p,
      t: t
    };
  }

  function mix3(a, b, p) {
    return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p, a[2] + (b[2] - a[2]) * p];
  }
  function hsla(c, a) {
    return "hsla(" + (c[0] | 0) + "," + (c[1] | 0) + "%," + (c[2] | 0) + "%," + (a === undefined ? 1 : a) + ")";
  }
  function shift(c, dh, ds, dl) {
    return [c[0] + (dh || 0), Math.max(0, Math.min(100, c[1] + (ds || 0))), Math.max(0, Math.min(100, c[2] + (dl || 0)))];
  }

  /* ---------------- 太阳 / 月亮 ---------------- */
  function sunPos(t) {
    var rise = 6.0, set = 18.7;
    if (t >= rise && t <= set) {
      var p = (t - rise) / (set - rise);
      return { up: true, x: 0.05 + 0.90 * p, y: 0.665 - 0.585 * Math.sin(Math.PI * p), p: p };
    }
    var nt = t < rise ? t + 24 : t;
    var p2 = Math.max(0, Math.min(1, (nt - set) / (24 - set + rise)));
    return { up: false, x: 0.95 - 0.90 * p2, y: 0.64 - 0.46 * Math.sin(Math.PI * p2), p: p2 };
  }

  /* ---------------- 确定性随机 ---------------- */
  function seedRng(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* ---------------- 场景 ---------------- */
  var HOR = 0.685;
  var scene = null;

  function makeTower(rnd, x, w, h, baseY, layer) {
    var t = rnd();
    var top = t < 0.26 ? "spike" : t < 0.44 ? "dome" : t < 0.66 ? "slant" : "flat";
    return {
      x: x, w: w, h: h, baseY: baseY, layer: layer, top: top,
      hue: rnd() < 0.28 ? 205 + rnd() * 12 : 196 + rnd() * 18,
      sat: rnd() < 0.28 ? 6 + rnd() * 8 : 30 + rnd() * 22,
      rows: Math.max(8, Math.round(h * 150)),
      cols: Math.max(2, Math.round(w * 300)),
      seed: (rnd() * 1e6) | 0,
      mast: rnd() < 0.5
    };
  }

  function makeScene() {
    var rnd = seedRng(20261029);
    var s = { far: [], mid: [], near: [], domes: [], rails: [], trees: [], stars: [], clouds: [], river: null };

    for (var i = 0; i < 170; i++) {
      s.stars.push({ x: rnd(), y: rnd() * HOR * 0.86, r: 1.3 + rnd() * 2.0, ph: rnd() * TAU });
    }

    /* 远景：矮而密，低对比 */
    for (var f = 0; f < 118; f++) {
      var fx = -0.03 + rnd() * 1.06;
      var fw = 0.004 + rnd() * 0.010;
      var fh = 0.022 + rnd() * 0.135 * (0.55 + 0.45 * Math.cos((fx - 0.5) * 2.1));
      s.far.push(makeTower(rnd, fx, fw, fh, HOR - 0.008, 0));
    }

    /* 中景：主体密度 */
    for (var m = 0; m < 56; m++) {
      var mx = -0.02 + rnd() * 1.04;
      var mw = 0.009 + rnd() * 0.019;
      var mh = 0.075 + rnd() * 0.255 * (0.60 + 0.40 * Math.cos((mx - 0.5) * 1.7));
      s.mid.push(makeTower(rnd, mx, mw, mh, HOR + 0.034, 1));
    }

    /* 近景：少而高，细节最足，底部被前景遮挡 */
    var nearXs = [0.040, 0.092, 0.150, 0.222, 0.290, 0.348, 0.402, 0.452, 0.500,
                  0.552, 0.606, 0.668, 0.716, 0.778, 0.838, 0.898, 0.948, 0.988];
    nearXs.forEach(function (nx, k) {
      var nw = 0.026 + rnd() * 0.036;
      var nh = 0.21 + rnd() * 0.37;
      if (k === 8) nh = 0.60;       // 天际线主角
      if (k === 13) nh = 0.53;
      s.near.push(makeTower(rnd, nx, nw, nh, HOR + 0.112, 2));
    });
    s.near.sort(function (a, b) { return a.h - b.h; });

    /* 玻璃穹顶（前景） */
    [[0.030, 0.795, 0.135, 0.088], [0.168, 0.828, 0.092, 0.058],
     [0.885, 0.788, 0.118, 0.078], [0.795, 0.842, 0.070, 0.048]].forEach(function (d) {
      s.domes.push({ x: d[0], y: d[1], rx: d[2], ry: d[3] });
    });

    /* 高架轨道：三条不同高度 */
    s.rails = [
      { p: [[-0.08, 0.792], [0.20, 0.735], [0.52, 0.718], [0.84, 0.752], [1.08, 0.815]], w: 0.017, craft: 3 },
      { p: [[0.02, 0.960], [0.30, 0.862], [0.62, 0.808], [0.92, 0.762], [1.06, 0.744]], w: 0.013, craft: 2 },
      { p: [[0.52, 1.040], [0.70, 0.930], [0.86, 0.862], [1.06, 0.828]], w: 0.009, craft: 1 }
    ];

    /* 前景框架建筑：左右各一座半出画，撑出纵深 */
    s.front = [
      { x: -0.035, w: 0.105, h: 0.60, hue: 202, sat: 26 },
      { x: 0.955, w: 0.115, h: 0.55, hue: 198, sat: 22 }
    ];

    /* 河流：底部中央，近宽远窄 */
    s.river = { cx: 0.455, topW: 0.034, botW: 0.34, topY: 0.716, botY: 1.040 };

    /* 绿植：河岸两侧（前景的主要密度来源） */
    var zones = [
      { x0: 0.00, x1: 0.40, y0: 0.722, y1: 1.020, n: 74 },
      { x0: 0.53, x1: 1.00, y0: 0.722, y1: 1.020, n: 68 },
      { x0: 0.00, x1: 1.00, y0: 0.688, y1: 0.730, n: 30 }
    ];
    zones.forEach(function (z) {
      for (var k = 0; k < z.n; k++) {
        var tx = z.x0 + rnd() * (z.x1 - z.x0);
        var ty = z.y0 + rnd() * (z.y1 - z.y0);
        var rk = Math.max(0, Math.min(1, (ty - s.river.topY) / (s.river.botY - s.river.topY)));
        var half = s.river.topW + (s.river.botW - s.river.topW) * rk + 0.012;
        if (ty > s.river.topY - 0.02 && Math.abs(tx - s.river.cx) < half) continue;
        s.trees.push({ x: tx, y: ty, r: 0.010 + rnd() * 0.024, d: rnd(), g: 0.5 + rnd() * 0.5 });
      }
    });
    s.trees.sort(function (a, b) { return a.y - b.y; });

    for (var c2 = 0; c2 < 10; c2++) {
      s.clouds.push({
        x: rnd(), y: 0.02 + rnd() * 0.30,
        w: 0.11 + rnd() * 0.20, h: 0.030 + rnd() * 0.042,
        sp: 0.0014 + rnd() * 0.0036, a: 0.52 + rnd() * 0.38, layer: rnd()
      });
    }
    s.clouds.sort(function (a, b) { return a.layer - b.layer; });

    return s;
  }

  /* ---------------- 天空 ---------------- */
  function paintFar(g, W, H, p) {
    var horY = HOR * H;
    var sky = g.createLinearGradient(0, 0, 0, horY);
    sky.addColorStop(0, hsla(p.top));
    sky.addColorStop(0.55, hsla(p.mid));
    sky.addColorStop(1, hsla(p.hor));
    g.fillStyle = sky;
    g.fillRect(0, 0, W, horY + 2);

    // 地平线附近的暖光带（日出日落时明显）
    var glowA = Math.max(0, 1 - Math.abs(p.t - 6.4) / 1.6) + Math.max(0, 1 - Math.abs(p.t - 18.2) / 1.8);
    if (glowA > 0.02) {
      var hg = g.createLinearGradient(0, horY - H * 0.20, 0, horY);
      hg.addColorStop(0, hsla(p.sun, 0));
      hg.addColorStop(1, hsla(p.sun, Math.min(0.55, glowA * 0.5)));
      g.fillStyle = hg;
      g.fillRect(0, horY - H * 0.20, W, H * 0.20);
    }

    // 星
    var starA = Math.max(0, 1 - p.amb * 2.6);
    if (starA > 0.02) {
      for (var i = 0; i < scene.stars.length; i++) {
        var st = scene.stars[i];
        g.globalAlpha = starA * (0.5 + 0.5 * Math.sin(st.ph)) * 0.92;
        g.fillStyle = "#e8f2ff";
        g.beginPath();
        g.arc(st.x * W, st.y * H, st.r * (W / 1440), 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
    }

    // 日 / 月
    var sp = sunPos(p.t);
    var sx = sp.x * W, sy = sp.y * H;
    var rad = W * 0.026;
    var glow = g.createRadialGradient(sx, sy, 0, sx, sy, rad * 8);
    glow.addColorStop(0, hsla(p.sun, 0.60));
    glow.addColorStop(0.18, hsla(p.sun, 0.24));
    glow.addColorStop(1, hsla(p.sun, 0));
    g.fillStyle = glow;
    g.beginPath(); g.arc(sx, sy, rad * 8, 0, TAU); g.fill();
    g.fillStyle = hsla(p.sun, 0.97);
    g.beginPath(); g.arc(sx, sy, rad * (sp.up ? 1 : 0.70), 0, TAU); g.fill();

    // 远山
    function ridge(baseY, amp, seed, alpha, dl) {
      var r = seedRng(seed);
      g.beginPath();
      g.moveTo(-10, baseY + 60);
      var y = baseY;
      for (var x = -10; x <= W + 10; x += W / 30) {
        y = baseY - Math.sin(x / W * 6.5 + seed) * amp * (0.35 + r() * 0.65);
        g.lineTo(x, y);
      }
      g.lineTo(W + 10, baseY + 60);
      g.closePath();
      g.fillStyle = hsla(shift(p.hor, 8, -8, -4 + dl), alpha);
      g.fill();
    }
    ridge(horY - H * 0.010, H * 0.032, 7, 0.48, 8);
    ridge(horY - H * 0.002, H * 0.020, 19, 0.62, 3);
  }

  /* ---------------- 云 ---------------- */
  function drawClouds(g, W, H, p, ms) {
    var lit = shift(p.mid, 0, -8, 15 + p.amb * 13);
    var dark = shift(p.mid, 3, -5, -4 + p.amb * 3);
    for (var i = 0; i < scene.clouds.length; i++) {
      var c = scene.clouds[i];
      var x = ((c.x + ms * c.sp * 0.001) % 1.34) * W - W * 0.17;
      var y = c.y * H;
      var w = c.w * W, h = c.h * H;
      var a = c.a * (0.50 + p.amb * 0.70);
      if (a <= 0.015) continue;
      g.globalAlpha = a * 0.50;
      g.fillStyle = hsla(dark);
      blob(g, x, y + h * 0.22, w, h);
      g.globalAlpha = a;
      g.fillStyle = hsla(lit);
      blob(g, x, y - h * 0.10, w * 0.94, h * 0.80);
    }
    g.globalAlpha = 1;
  }
  function blob(g, cx, cy, w, h) {
    g.beginPath();
    g.ellipse(cx, cy, w * 0.50, h * 0.50, 0, 0, TAU);
    g.ellipse(cx - w * 0.26, cy + h * 0.16, w * 0.30, h * 0.42, 0, 0, TAU);
    g.ellipse(cx + w * 0.27, cy + h * 0.14, w * 0.32, h * 0.40, 0, 0, TAU);
    g.ellipse(cx + w * 0.01, cy - h * 0.20, w * 0.34, h * 0.44, 0, 0, TAU);
    g.fill();
  }

  /* ---------------- 城市 ---------------- */
  function paintNear(g, W, H, p) {
    var horY = HOR * H;
    var baseL = 13 + 33 * p.amb;

    /* 地面：地平线往下压暗 */
    var gl = 22 + 30 * p.amb;
    var grd = g.createLinearGradient(0, horY - H * 0.02, 0, H);
    grd.addColorStop(0, hsla([190, 14, gl + 12]));
    grd.addColorStop(0.20, hsla([178, 17, gl + 8]));
    grd.addColorStop(1, hsla([164, 20, gl - 8]));
    g.fillStyle = grd;
    g.fillRect(0, horY - H * 0.02, W, H - horY + H * 0.02);

    /* 远景 */
    var farCol = mix3(p.hor, [205, 20, 40], 0.62);
    for (var f = 0; f < scene.far.length; f++) {
      var b = scene.far[f];
      var bx = b.x * W, bw = Math.max(1.2, b.w * W), bh = b.h * H;
      var by = b.baseY * H;
      g.globalAlpha = 0.34 + (b.h / 0.16) * 0.26;
      g.fillStyle = hsla(shift(farCol, 0, 0, -6 - b.h * 40));
      g.fillRect(bx, by - bh, bw, bh + 2);
      if (b.top === "spike" && b.h > 0.09) {
        g.fillRect(bx + bw * 0.44, by - bh - H * 0.010, Math.max(1, bw * 0.14), H * 0.010);
      }
    }
    g.globalAlpha = 1;

    /* 中景 */
    for (var m = 0; m < scene.mid.length; m++) {
      drawTower(g, scene.mid[m], W, H, p, baseL, 1);
    }

    /* 地平线雾霭：把地面与天空的接缝化开 */
    var hz = g.createLinearGradient(0, horY - H * 0.055, 0, horY + H * 0.055);
    hz.addColorStop(0, hsla(p.hor, 0));
    hz.addColorStop(0.48, hsla(p.hor, 0.50));
    hz.addColorStop(1, hsla(p.hor, 0));
    g.fillStyle = hz;
    g.fillRect(0, horY - H * 0.055, W, H * 0.11);

    /* 近景 */
    for (var n = 0; n < scene.near.length; n++) {
      drawTower(g, scene.near[n], W, H, p, baseL, 2);
    }

    /* 穹顶 */
    for (var d = 0; d < scene.domes.length; d++) drawDome(g, scene.domes[d], W, H, p);

    /* 河流 */
    drawRiver(g, W, H, p);

    /* 绿植 */
    for (var t = 0; t < scene.trees.length; t++) {
      var tr = scene.trees[t];
      var depth = 0.55 + (tr.y - 0.70) * 1.7;
      var rr = tr.r * W * depth;
      g.globalAlpha = 0.74 + tr.g * 0.22;
      g.fillStyle = "hsl(" + (126 + tr.d * 30) + "," + (24 + p.amb * 30) + "%," + (11 + p.amb * 25 + tr.d * 7) + "%)";
      g.beginPath();
      g.arc(tr.x * W, tr.y * H, rr * 0.86, 0, TAU);
      g.arc(tr.x * W + rr * 0.80, tr.y * H + rr * 0.30, rr * 0.56, 0, TAU);
      g.arc(tr.x * W - rr * 0.74, tr.y * H + rr * 0.26, rr * 0.52, 0, TAU);
      g.arc(tr.x * W + rr * 0.28, tr.y * H - rr * 0.48, rr * 0.48, 0, TAU);
      g.arc(tr.x * W - rr * 0.34, tr.y * H - rr * 0.36, rr * 0.44, 0, TAU);
      g.fill();
      // 顶部受光
      g.globalAlpha = 0.20 + p.amb * 0.22;
      g.fillStyle = "hsl(" + (88 + tr.d * 20) + "," + (36 + p.amb * 20) + "%," + (34 + p.amb * 26) + "%)";
      g.beginPath();
      g.arc(tr.x * W - rr * 0.18, tr.y * H - rr * 0.30, rr * 0.52, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;

    /* 高架 */
    for (var r = 0; r < scene.rails.length; r++) drawRail(g, scene.rails[r], W, H, p);

    /* 前景框架建筑：最前层 */
    for (var fr = 0; fr < scene.front.length; fr++) drawFront(g, scene.front[fr], W, H, p, baseL);
  }

  function drawTower(g, tw, W, H, p, baseL, layer) {
    var by = tw.baseY * H;
    var x = tw.x * W, w = Math.max(layer === 0 ? 1.4 : 2.4, tw.w * W), h = tw.h * H;
    var top = by - h;
    var hue = tw.hue, sat = tw.sat;
    var L0 = baseL + (layer === 2 ? 11 : layer === 1 ? 2 : -7);

    // 裙楼：底部加宽的一层，让塔真正落在地面上
    if (layer === 2 && tw.h > 0.24) {
      var pw = w * 1.62, ph = h * 0.085;
      var pg = g.createLinearGradient(x - (pw - w) / 2, 0, x - (pw - w) / 2 + pw, 0);
      pg.addColorStop(0, hsla([hue - 2, sat + 6, L0 + 10]));
      pg.addColorStop(1, hsla([hue + 6, sat - 8, L0 - 16]));
      g.fillStyle = pg;
      g.fillRect(x - (pw - w) / 2, by - ph, pw, ph + 2);
      g.globalAlpha = 0.30;
      g.strokeStyle = p.amb > 0.45 ? "rgba(255,255,255,.75)" : "rgba(170,200,250,.45)";
      g.lineWidth = 1;
      for (var pc = 1; pc < 6; pc++) {
        var pcx = x - (pw - w) / 2 + pw * pc / 6;
