<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>净化车间 · 十二道工序 — 杨城 H4 数据污染博物馆</title>
<meta name="description" content="十二次工序额度，把一批脏题洗成一份站得住的审计报告。改写到最大也能让 κ̂ 归零——但那叫假净化。">
<link rel="stylesheet" href="shared/yc-core.css">
<link rel="stylesheet" href="shared/yc-deep.css">
<link rel="stylesheet" href="shared/yc-cast.css">
<style>
/* ==========================================================================
   H4 精英挑战 · 净化车间 · 十二道工序
   与 H2 案卷（浅色纸本四幕）、H3 指标塔（3D 迷宫）刻意错开：
   这里是**深色车间流水线** —— 左侧工序台 + 右侧读数仪表 + 底部账本。
   所有类名 pg- 前缀，避免撞共享样式。
   ========================================================================== */
:root{
  --pg-bg:#050d0b;
  --pg-bg2:#081613;
  --pg-panel:rgba(12,28,24,.9);
  --pg-line:rgba(112,190,164,.16);
  --pg-line2:rgba(112,190,164,.34);
  --pg-tx:#e4f1ea;
  --pg-tx2:#93b4a8;
  --pg-tx3:#5c7a70;
  --pg-ac:#35cfa8;
  --pg-brass:#c9a227;
  --pg-red:#ff6b6b;
  --pg-amber:#ffb03a;
  --pg-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --pg-serif:"Songti SC","STSong",SimSun,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 70% 46% at 16% -8%,rgba(53,207,168,.12),transparent 66%),
    radial-gradient(ellipse 52% 42% at 92% 106%,rgba(201,162,39,.08),transparent 70%),
    linear-gradient(180deg,#050d0b 0%,#081613 54%,#040b09 100%);
  color:var(--pg-tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,rgba(53,207,168,.028) 0 1px,transparent 1px 3px);
}

.pgwrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 20px 56px}

/* ---------------- 顶栏 ---------------- */
.pgbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:13px 0 12px;border-bottom:1px solid var(--pg-line2);
}
.pgbar .bk{
  color:var(--pg-ac);text-decoration:none;font-size:13px;
  border:1px solid var(--pg-line2);border-radius:7px;padding:6px 11px;
  transition:background .16s,border-color .16s;
}
.pgbar .bk:hover{background:rgba(53,207,168,.1);border-color:var(--pg-ac)}
.pgttl b{display:block;font-size:16px;letter-spacing:.5px}
.pgttl span{
  display:block;font-family:var(--pg-mono);font-size:10.5px;letter-spacing:2.4px;
  color:var(--pg-tx3);margin-top:3px;
}
.pgbar .sp{flex:1}
.pgbudget{display:flex;align-items:center;gap:10px}
.pgbudget .lb{font-size:11.5px;color:var(--pg-tx3);letter-spacing:1px}
.pgpips{display:flex;gap:3px}
.pgpips i{
  width:9px;height:18px;border-radius:2px;
  background:rgba(53,207,168,.14);border:1px solid rgba(53,207,168,.22);
  transition:background .2s,border-color .2s;
}
.pgpips i.on{background:var(--pg-ac);border-color:var(--pg-ac);box-shadow:0 0 8px rgba(53,207,168,.5)}
.pgpips i.spent{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.3)}
.pgbudget b{font-family:var(--pg-mono);font-size:17px;color:var(--pg-ac);min-width:2ch;text-align:right}

/* ---------------- 主栅格 ---------------- */
.pgmain{
  display:grid;grid-template-columns:352px minmax(0,1fr);gap:16px;
  margin-top:16px;align-items:start;
}

/* ---------------- 左：工序台 ---------------- */
.pgctl{display:flex;flex-direction:column;gap:11px}
.pgcard{
  background:var(--pg-panel);border:1px solid var(--pg-line);border-radius:11px;
  padding:13px 14px;
}
.pgcard>.hd{
  display:flex;align-items:baseline;gap:8px;margin-bottom:10px;
}
.pgcard>.hd h3{margin:0;font-size:13px;letter-spacing:.6px;font-weight:700}
.pgcard>.hd .k{
  margin-left:auto;font-family:var(--pg-mono);font-size:9.5px;
  letter-spacing:1.6px;color:var(--pg-tx3);
}

/* 档位条 */
.pgstep{display:flex;gap:5px;margin-bottom:9px}
.pgstep button{
  flex:1;padding:9px 2px;border-radius:7px;cursor:pointer;
  background:rgba(53,207,168,.05);border:1px solid rgba(53,207,168,.18);
  color:var(--pg-tx3);font-family:var(--pg-mono);font-size:11.5px;
  transition:all .16s;
}
.pgstep button:hover:not(:disabled){background:rgba(53,207,168,.13);color:var(--pg-tx)}
.pgstep button.on{
  background:rgba(53,207,168,.2);border-color:var(--pg-ac);color:var(--pg-ac);
  font-weight:700;box-shadow:0 0 0 1px rgba(53,207,168,.28) inset;
}
.pgstep button:disabled{opacity:.32;cursor:not-allowed}
.pghint{font-size:11.5px;line-height:1.75;color:var(--pg-tx3)}
.pghint b{color:var(--pg-tx2)}

/* 工序按钮 */
.pgops{display:flex;flex-direction:column;gap:7px}
.pgop{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;
  padding:11px 12px;border-radius:9px;text-align:left;
  background:rgba(53,207,168,.055);border:1px solid rgba(53,207,168,.2);
  color:var(--pg-tx);font-size:13px;transition:all .16s;
}
.pgop:hover:not(:disabled){background:rgba(53,207,168,.14);border-color:var(--pg-ac);transform:translateX(2px)}
.pgop:disabled{opacity:.3;cursor:not-allowed;transform:none}
.pgop .ic{font-size:15px;width:20px;text-align:center}
.pgop .tx{flex:1}
.pgop .tx small{display:block;font-size:10.5px;color:var(--pg-tx3);margin-top:2px}
.pgop .cost{
  font-family:var(--pg-mono);font-size:11px;color:var(--pg-brass);
  border:1px solid rgba(201,162,39,.32);border-radius:5px;padding:2px 6px;
}
.pgop.primary{background:rgba(53,207,168,.16);border-color:var(--pg-ac)}
.pgop.primary .cost{color:var(--pg-ac);border-color:rgba(53,207,168,.4)}

/* ---------------- 右：读数台 ---------------- */
.pgright{display:flex;flex-direction:column;gap:13px;min-width:0}

.pgread{
  background:linear-gradient(180deg,rgba(10,26,22,.95),rgba(6,17,14,.95));
  border:1px solid var(--pg-line2);border-radius:13px;padding:16px 18px;
  position:relative;overflow:hidden;
}
.pgread::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(53,207,168,.09),transparent 70%);
}
.pgrhd{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative}
.pgrhd .t{font-size:13.5px;font-weight:700;letter-spacing:.5px}
.pgrhd .st{
  font-family:var(--pg-mono);font-size:10px;letter-spacing:1.6px;
  padding:3px 8px;border-radius:5px;
  background:rgba(255,176,58,.12);border:1px solid rgba(255,176,58,.3);color:var(--pg-amber);
}
.pgrhd .st.ok{background:rgba(53,207,168,.14);border-color:rgba(53,207,168,.4);color:var(--pg-ac)}
.pgrhd .st.bad{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.4);color:var(--pg-red)}

.pgkv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.pgkv .cell{
  background:rgba(53,207,168,.045);border:1px solid var(--pg-line);
  border-radius:9px;padding:10px 11px;
}
.pgkv .cell .lb{font-size:10.5px;color:var(--pg-tx3);letter-spacing:.6px;margin-bottom:5px}
.pgkv .cell .vv{font-family:var(--pg-mono);font-size:19px;color:var(--pg-tx);line-height:1.1}
.pgkv .cell .nn{font-size:10px;color:var(--pg-tx3);margin-top:4px;font-family:var(--pg-mono)}
.pgkv .cell.hi .vv{color:var(--pg-ac)}
.pgkv .cell.warn .vv{color:var(--pg-amber)}

/* 守卫 */
.pgguard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:13px;position:relative}
.pgg{
  border-radius:8px;padding:9px 10px;border:1px solid;
  background:rgba(53,207,168,.05);border-color:rgba(53,207,168,.22);
  transition:all .18s;
}
.pgg.no{background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.4)}
.pgg .gn{font-size:11px;font-weight:600;display:flex;align-items:center;gap:5px}
.pgg .gn i{
  width:7px;height:7px;border-radius:50%;background:var(--pg-ac);flex:none;
  box-shadow:0 0 6px rgba(53,207,168,.7);
}
.pgg.no .gn i{background:var(--pg-red);box-shadow:0 0 6px rgba(255,107,107,.7)}
.pgg .gd{font-family:var(--pg-mono);font-size:10px;color:var(--pg-tx3);margin-top:5px;line-height:1.5}

.pgverdict{
  margin-top:13px;padding:12px 14px;border-radius:10px;position:relative;
  border:1px solid var(--pg-line2);background:rgba(53,207,168,.05);
}
.pgverdict .vt{font-size:14px;font-weight:700;letter-spacing:.4px;margin-bottom:6px}
.pgverdict .vw{font-size:12.5px;line-height:1.85;color:var(--pg-tx2)}
.pgverdict.undet{background:rgba(255,176,58,.07);border-color:rgba(255,176,58,.34)}
.pgverdict.undet .vt{color:var(--pg-amber)}
.pgverdict.conflict{background:rgba(255,107,107,.07);border-color:rgba(255,107,107,.32)}
.pgverdict.conflict .vt{color:var(--pg-red)}


/* κ̂ 标尺 */
.pgscale{margin-top:13px;position:relative}
.pgscale .track{
  position:relative;height:26px;border-radius:6px;overflow:hidden;
  background:linear-gradient(90deg,
    rgba(53,207,168,.30) 0%,rgba(53,207,168,.30) 25%,
    rgba(140,150,145,.18) 25%,rgba(140,150,145,.18) 60%,
    rgba(255,107,107,.26) 60%,rgba(255,107,107,.26) 100%);
  border:1px solid var(--pg-line2);
}
.pgscale .ci{
  position:absolute;top:0;bottom:0;
  background:rgba(228,241,234,.20);border-left:1px solid rgba(228,241,234,.5);
  border-right:1px solid rgba(228,241,234,.5);
}
.pgscale .pin{
  position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--pg-tx);
  box-shadow:0 0 10px rgba(228,241,234,.9);
}
.pgscale .pin::after{
  content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;
  border-radius:50%;background:var(--pg-tx);box-shadow:0 0 12px rgba(228,241,234,.8);
}
.pgscale .ticks{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--pg-mono);font-size:9.5px;color:var(--pg-tx3)}
.pgscale .ticks span.on{color:var(--pg-tx2)}
.pgscale .cap{font-size:11px;color:var(--pg-tx3);margin-top:5px;line-height:1.7}
.pgscale .cap b{color:var(--pg-tx2)}

/* 空态 */
.pgempty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:280px;color:var(--pg-tx3);font-size:13px;line-height:2;text-align:center;
}
.pgempty b{color:var(--pg-tx2)}

/* ---------------- 账本 ---------------- */
.pglog{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.pglrow{
  display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;
  padding:8px 10px;border-radius:7px;
  background:rgba(53,207,168,.035);border:1px solid var(--pg-line);
  font-size:11.5px;
}
.pglrow .n{font-family:var(--pg-mono);color:var(--pg-tx3);font-size:10.5px}
.pglrow .d{color:var(--pg-tx2)}
.pglrow .d b{color:var(--pg-tx);font-weight:600}
.pglrow .v{font-family:var(--pg-mono);font-size:10.5px;letter-spacing:.4px}
.pglrow .v.ok{color:var(--pg-ac)}
.pglrow .v.undet{color:var(--pg-amber)}
.pglrow .v.bad{color:var(--pg-red)}
.pglrow.final{background:rgba(201,162,39,.08);border-color:rgba(201,162,39,.32)}
.pglrow.final .v{color:var(--pg-brass)}
.pglog .none{font-size:12px;color:var(--pg-tx3);padding:14px 0;text-align:center}

/* ---------------- 诊断题弹层 ---------------- */
.pgmask{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(3,9,7,.82);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px;
}
.pgmask.on{display:flex}
.pgquiz{
  width:min(720px,100%);border-radius:14px;padding:22px 24px;
  background:linear-gradient(180deg,#0c1d19,#071310);
  border:1px solid var(--pg-line2);
  box-shadow:0 24px 70px rgba(0,0,0,.6);
  animation:pgpop .22s ease-out;
}
@keyframes pgpop{from{transform:translateY(12px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.pgquiz .qh{
  font-family:var(--pg-mono);font-size:10.5px;letter-spacing:2.4px;
  color:var(--pg-brass);margin-bottom:9px;
}
.pgquiz .qt{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:5px}
.pgquiz .qs{font-size:12.5px;color:var(--pg-tx2);line-height:1.8;margin-bottom:16px}
.pgquiz .qo{display:flex;flex-direction:column;gap:8px}
.pgquiz .qo button{
  text-align:left;padding:12px 14px;border-radius:9px;cursor:pointer;
  background:rgba(53,207,168,.05);border:1px solid rgba(53,207,168,.2);
  color:var(--pg-tx);font-size:13px;line-height:1.6;transition:all .15s;
}
.pgquiz .qo button:hover:not(:disabled){background:rgba(53,207,168,.13);border-color:var(--pg-ac)}
.pgquiz .qo button.ok{background:rgba(53,207,168,.2);border-color:var(--pg-ac);color:var(--pg-ac)}
.pgquiz .qo button.no{background:rgba(255,107,107,.13);border-color:rgba(255,107,107,.5);color:#ffb3b3}
.pgquiz .qr{margin-top:13px;font-size:12.5px;line-height:1.8;color:var(--pg-tx2);min-height:1px}
.pgquiz .qb{margin-top:14px;display:flex;justify-content:flex-end}
.pgquiz .qb button{
  padding:9px 20px;border-radius:8px;cursor:pointer;font-size:13px;
  background:var(--pg-ac);border:none;color:#04120e;font-weight:700;
}
.pgquiz .qb button:disabled{opacity:.35;cursor:not-allowed}

/* ---------------- 结算 ---------------- */
.pgend{
  border-radius:14px;padding:24px;margin-top:14px;
  background:linear-gradient(180deg,rgba(201,162,39,.09),rgba(6,17,14,.95));
  border:1px solid rgba(201,162,39,.34);
}
.pgend .eh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.pgend .eh h2{margin:0;font-size:22px;letter-spacing:.6px}
.pgend .eh .sc{font-family:var(--pg-mono);font-size:30px;color:var(--pg-brass);margin-left:auto}
.pgend .eh .sc small{font-size:13px;color:var(--pg-tx3)}
.pgend .es{font-size:13px;color:var(--pg-tx2);line-height:1.9;margin-bottom:16px}
.pgend .parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.pgend .parts .p{
  background:rgba(53,207,168,.045);border:1px solid var(--pg-line);
  border-radius:9px;padding:11px 12px;
}
.pgend .parts .p .pl{font-size:10.5px;color:var(--pg-tx3);margin-bottom:5px}
.pgend .parts .p .pv{font-family:var(--pg-mono);font-size:18px;color:var(--pg-tx)}
.pgend .parts .p .pn{font-size:10px;color:var(--pg-tx3);margin-top:4px}
.pgend .certbox{
  border-radius:11px;padding:16px;border:1px dashed rgba(201,162,39,.4);
  background:rgba(201,162,39,.05);
}
.pgend .certbox .ct{font-size:14px;font-weight:700;color:var(--pg-brass);margin-bottom:6px}
.pgend .certbox .cd{font-size:12.5px;color:var(--pg-tx2);line-height:1.8}
.pgend .certbox .cn{
  font-family:var(--pg-mono);font-size:12px;color:var(--pg-brass);
  margin-top:9px;letter-spacing:.5px;
}
.pgend .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.pgend .btnrow button{
  padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;
  background:var(--pg-brass);border:none;color:#1a1405;font-weight:700;
}
.pgend .btnrow button.ghost{background:transparent;border:1px solid var(--pg-line2);color:var(--pg-tx2);font-weight:500}

/* ---------------- 窄屏 ---------------- */
@media (max-width:1040px){
  .pgmain{grid-template-columns:1fr}
  .pgkv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgguard{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pgend .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .pgwrap{padding:0 12px 40px}
  .pgbar{gap:10px}
  .pgttl b{font-size:14px}
  .pgread{padding:13px}
  .pgkv{grid-template-columns:1fr 1fr;gap:7px}
  .pgguard{grid-template-columns:1fr}
  .pgend{padding:16px}
  .pgend .parts{grid-template-columns:1fr}
  .pgend .eh .sc{font-size:24px}
}
</style>
</head>
<div class="pgwrap">

  <header class="pgbar">
    <a class="bk" href="h4-contam.html">← 回污染馆</a>
    <div class="pgttl">
      <b>净化车间 · 十二道工序</b>
      <span>PURGE FLOOR · H4 ANNEX · 精英挑战</span>
    </div>
    <div class="sp"></div>
    <div class="pgbudget">
      <span class="lb">工序额度</span>
      <span class="pgpips" id="pips"></span>
      <b id="budN">12</b>
    </div>
  </header>

  <div class="pgmain">

    <!-- ==================== 左：工序台 ==================== -->
    <div class="pgctl">

      <div class="pgcard">
        <div class="hd"><h3>改写力度</h3><span class="k">REWRITE</span></div>
        <div class="pgstep" id="wSteps"></div>
        <div class="pghint" id="wHint">改得太轻，题目根本没变；改得太重，记忆认不出这道题。</div>
      </div>

      <div class="pgcard">
        <div class="hd"><h3>题组规模</h3><span class="k">SAMPLE</span></div>
        <div class="pgstep" id="nSteps"></div>
        <div class="pghint" id="nHint">题组太少，自助法区间压不下来，任何点估计都跨线。</div>
      </div>

      <div class="pgcard">
        <div class="hd"><h3>工序台</h3><span class="k">OPERATIONS</span></div>
        <div class="pgops">
          <button class="pgop" id="opLabel">
            <span class="ic">🏷</span>
            <span class="tx">标签复核<small>把泄漏答案里的错标清掉，噪声 × 0.4</small></span>
            <span class="cost">−2</span>
          </button>
          <button class="pgop primary" id="opRun">
            <span class="ic">▶</span>
            <span class="tx">开庭<small>跑一次审计，读五道守卫</small></span>
            <span class="cost">−1</span>
          </button>
          <button class="pgop" id="opRep">
            <span class="ic">⟳</span>
            <span class="tx">复核<small>换一个种子重跑，看判定会不会翻</small></span>
            <span class="cost">−2</span>
          </button>
          <button class="pgop" id="opSeal">
            <span class="ic">📄</span>
            <span class="tx">封卷出报告<small>交出结论，结算</small></span>
            <span class="cost">0</span>
          </button>
        </div>
      </div>

    </div>

    <!-- ==================== 右：读数台 ==================== -->
    <div class="pgright">

      <div class="pgread" id="readBox">
        <div class="pgrhd">
          <span class="t">读数台</span>
          <span class="st" id="rdSt">待开庭</span>
        </div>
        <div class="pgempty" id="rdEmpty">
          还没有读数。<br>
          <b>先调改写力度与题组规模，再按「开庭」。</b><br>
          车间里最贵的不是算力，是「你不知道这个 0 是什么意思」。
        </div>
        <div id="rdBody" style="display:none"></div>
      </div>

      <div class="pgcard">
        <div class="hd"><h3>工序账本</h3><span class="k">LEDGER</span></div>
        <div class="pglog" id="log"><div class="none">还没有工序记录。</div></div>
      </div>

    </div>
  </div>

<script>

     它在这道题上答对，是因为会做，还是因为见过，还是当前证据分不清？

   三个档：
     甲架 原题   训练语料里出现过的那道题（表面逐字相同）
     乙架 改数   同一道题，改掉一到两个数（答案随之改变）
     丙架 新题   同一技能族、从未出现过的题

   为什么不能只比准确率：
     乙架比丙架低，有两种完全不同的解释 ——
       (a) 它靠表面记忆，改了数就不认得了；
       (b) 你改的数让题变难了。
     只看准确率，这两件事长得一模一样。这是本馆全部设计要解决的那个混淆。

   两条独立通道：
     通道一 准确率分解  accA / accB / accC，配一个冷参照做难度认证。
                        它会被难度漂移污染，也会被天花板效应吃掉分辨力。

                        这是记忆的直接指纹：算错的答案不会系统性地等于旧答案。

     R  = P(答案 = 原题答案 | 改数题)         被测者在乙架上的回吐率
     R0 = 参照组在同一批改数题上的同一比例     偶然水平（实测，不是假设）

     κ̂ ≈ 0  说明它在这批改数题上确实在算；
     κ̂ ≈ 1  说明它几乎不算是，直接把旧答案搬过来。

   三条拒判线（仪器自己承认不行的时刻）：
     ① 变体根本没改变答案（R0 → 1，分母塌了，信息量为零）
     ② 变体与原题的表面匹配度低于记忆触发阈值（探针没接上，κ̂=0 不构成清白证明）
     ③ 题量不足 / 区间跨过判定边界

     参照组显示乙架明显更难 → 准确率通道失效，但 κ̂ 不受难度影响，仍然有效。

  }

  /* ---------------- 题库 ---------------- */

  /* 四数三步：技能族 = 加减链的形状，与具体数字无关 */
  var CHAINS = [
    ["+", "+", "-"],
    ["-", "+", "+"],
    ["+", "-", "-"],
    ["-", "-", "+"],
    ["+", "+", "+"],
    ["-", "+", "-"]
  ];
  var ENTS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
  var GOODS = [
    ["货箱", "箱"], ["零件", "件"], ["油桶", "桶"],
    ["包裹", "包"], ["托盘", "托"], ["原料", "袋"]
  ];

  function fold(chain, nums) {

    for (i = 0; i < 3; i++) {
      op = chain[i]; b = nums[i + 1];
      if (op === "+") {

      } else {
        if ((v % 10) < (b % 10)) carries++;

  }

  function digitsOf(nums) {

    for (i = 0; i < nums.length; i++) {
      var l = String(Math.abs(nums[i])).length;
      if (l > d) d = l;
    }

  }

  /* 生成一组数，保证中间值不为负、答案不为负 */
  function genNums(chain, r, digits) {

    var hi = digits >= 3 ? 962 : 96;
    for (var t = 0; t < 60; t++) {
      var n = [], i, ok = true;
      for (i = 0; i < 4; i++) n.push(lo + Math.floor(r() * (hi - lo)));
      var v = n[0];
      for (i = 0; i < 3; i++) {

      }
      if (ok && v >= 0) return n;

  /* 题面分段：数字单独成段，方便在界面上标出"改的是哪一个" */
  function segsOf(ent, goods, chain, nums, changed) {
    var out = [], i;

    out.push({ t: "t", v: " " + unit + "，" });

      out.push({ t: "t", v: (chain[i] === "+" ? "补进 " : "运走 ") });
      out.push({ t: "n", v: nums[i + 1], chg: changed.indexOf(i + 1) >= 0 });
      out.push({ t: "t", v: " " + unit + (i < 2 ? "，" : "，现存多少" + unit + "？") });

  function buildItem(entIdx, goodsIdx, chain, nums, changed, tag) {

    return {
      tag: tag,
      entIdx: entIdx, goodsIdx: goodsIdx,
      ent: ENTS[entIdx], noun: s.noun, unit: s.unit,
      chain: chain.slice(), nums: nums.slice(),
      ans: f.v, carries: f.carries, digits: digitsOf(nums),
      changed: (changed || []).slice(),
      segs: s.segs,
      text: s.segs.map(function (x) { return x.v; }).join("")

  }

  /* ---------------- 表面匹配 ---------------- */

  /* 槽位权重：仓名 0.10 + 物件 0.06 + 四个数各 0.21 = 1.00。
     权重直接决定"改几个数"与"记忆还能不能触发"的对应关系：
       换措辞不改数 → 0.84   改一个数 → 0.63   改两个数 → 0.42
     阈值 0.55 卡在 0.63 与"偶然撞车 0.52（同仓名＋两个数）"之间。
     这 0.03 的余量是必需的：新题档在 96×96 对里必然撞上几对，
     阈值压到 0.45 时丙档会有 4% 的题被误判成"记得"，κ̂ 因此系统性偏高。
     权重不是审美选择，它决定了这台仪器会不会骗自己。 */
  var W_ENT = 0.10, W_NOUN = 0.06, W_NUM = 0.21;

  function slotsOf(it) {
    return {
      ent: it.ent, noun: it.noun,
      n0: it.nums[0], n1: it.nums[1], n2: it.nums[2], n3: it.nums[3]
    };
  }

  function matchFrac(a, b) {
    var m = 0;
    if (a.ent === b.ent) m += W_ENT;
    if (a.noun === b.noun) m += W_NOUN;
    if (a.n0 === b.n0) m += W_NUM;
    if (a.n1 === b.n1) m += W_NUM;
    if (a.n2 === b.n2) m += W_NUM;
    if (a.n3 === b.n3) m += W_NUM;
    return m;
  }

  /* 记忆触发阈值：0.55 落在"改一个数（0.63）"与"改两个数（0.42）"之间，
     且高于"同仓名＋两个数"的偶然撞车（0.52）。见 sweep 的窗口扫描。 */

  /* 回吐压力：即使表面匹配上了，也不是每次都直接搬旧答案 */

      if (f > best.rho) { best.rho = f; best.rec = table[i]; }

  /* 一个题组 = 同源三件（甲/乙/丙）。重采样单位是题组，不是单题，

  function genTriple(fi, seed, w) {
    var r = rng(seed);

    var entA = Math.floor(r() * ENTS.length);
    var gA = Math.floor(r() * GOODS.length);
    var numsA = genNums(chain, r, 2);
    var A = buildItem(entA, gA, chain, numsA, [], "A");

    /* 乙：换仓名与物件（措辞变了），按改写力度改数 */

    var gB = (gA + 1 + Math.floor(r() * (GOODS.length - 1))) % GOODS.length;

    var bump = (w >= 0.62 && w < 0.82) ? 1 : 0;

    var boot = opt.boot == null ? 300 : Math.round(clamp(opt.boot, 60, 1200));

    var refSkill = opt.refSkill == null ? 0.80 : opt.refSkill;

      var accC = mean(list.map(function (x) { return x.C.ok ? 1 : 0; }));
      var refA = mean(list.map(function (x) { return x.rA.ok ? 1 : 0; }));
      var refB = mean(list.map(function (x) { return x.rB.ok ? 1 : 0; }));
      var refC = mean(list.map(function (x) { return x.rC.ok ? 1 : 0; }));
      var R = mean(list.map(function (x) { return x.B.stale ? 1 : 0; }));
      var R0 = mean(list.map(function (x) { return x.rB.stale ? 1 : 0; }));
      var rhoBar = mean(list.map(function (x) { return x.rhoDesign; }));
      var rhoHit = mean(list.map(function (x) { return x.B.rho; }));
      var eq = mean(list.map(function (x) { return x.aA === x.aB ? 1 : 0; }));
      var kappa = R0 >= 0.999 ? null : (R - R0) / (1 - R0);
      return {
        accA: accA, accB: accB, accC: accC,
        refA: refA, refB: refB, refC: refC,
        R: R, R0: R0, rhoBar: rhoBar, rhoHit: rhoHit, eqRate: eq, kappa: kappa,
        advAC: accA - accC, advBC: accB - accC

    var br = rng((seed ^ 0x165667b1) >>> 0);

    samples.sort(function (a, b2) { return a - b2; });

    var hi = samples.length ? samples[Math.floor(samples.length * 0.975)] : null;
    /* κ 的定义域是 [0,1]；区间按参数空间截断，点估计不截断 */
    var ci = samples.length ? [clamp(lo, 0, 1), clamp(hi, 0, 1)] : null;

    var guards = [];

    var eqGuard = e.eqRate <= 0.85;
    guards.push({
      id: "variant", ok: eqGuard,
      label: "变体改变了答案",
      detail: "甲与乙的正确答案相同的比例 " + (e.eqRate * 100).toFixed(0) + "%"
    });

    guards.push({
      id: "probe", ok: probeGuard,

    });

    );

    guards.push({
      id: "refcold", ok: refCold,
      label: "参照组是冷的",
      detail: "参照组 甲−丙 = " + ((e.refA - e.refC) * 100).toFixed(1) + "pp（噪声 " +
        (1.96 * seRefAC * 100).toFixed(1) + "pp）"
    });

    var seRefBC = Math.sqrt(
      Math.max(1e-9, e.refB * (1 - e.refB) / n + e.refC * (1 - e.refC) / n)
    );
    var diffOK = (e.refC - e.refB) < 1.96 * seRefBC;
    guards.push({
      id: "difficulty", ok: diffOK,
      label: "变体难度未漂移",
      detail: "参照组 丙−乙 = " + ((e.refC - e.refB) * 100).toFixed(1) + "pp（噪声 " +
        (1.96 * seRefBC * 100).toFixed(1) + "pp）"
    });

    /* ---- 判定 ---- */
    /* 通道状态：准确率通道可能被难度漂移或天花板吃掉，溯源通道只受"探针是否接通"影响 */
    var seAC = Math.sqrt(Math.max(1e-9, e.accA * (1 - e.accA) / n + e.accC * (1 - e.accC) / n));
    var advSig = (e.accA - e.accC) > 1.96 * seAC;
    var channels = {
      acc: diffOK ? (advSig ? "ok" : "blind") : "drift",
      trace: probeGuard ? "ok" : "off"
    };

    var verdict = "undetermined", subtype = "none", why = "";

    if (!eqGuard) {
      subtype = "vacuous";
      why = "乙架的正确答案与甲架相同的比例是 " + (e.eqRate * 100).toFixed(0) +
        "%，说明改数没有改变答案 —— 回吐率与准确率无法区分，这个设计提供不了任何信息。";
    } else if (!probeGuard) {
      subtype = "probe";
      why = "乙与甲的平均表面匹配只有 " + e.rhoBar.toFixed(2) + "，低于记忆触发阈值 " +
        THETA + "。记忆通道根本没被接上，所以 κ̂≈0 不是清白证明，只是探针没通电。";
    } else if (!nGuard) {
      subtype = "n";
      why = "只有 " + n + " 组题，区间宽度压不下来。这个效应量需要更多题组才能与噪声分开。";
    } else if (e.kappa == null) {
      subtype = "vacuous";
      why = "偶然率已达 1，分母塌陷，κ̂ 无定义。";
    } else if (ci && ((ci[0] <= 0.25 && ci[1] >= 0.25) || (ci[0] <= 0.60 && ci[1] >= 0.60))) {
      subtype = "straddle";
      why = "点估计 " + e.kappa.toFixed(2) + "，但区间 [" + ci[0].toFixed(2) + ", " +
        ci[1].toFixed(2) + "] 跨过了判定边界 —— 现在下结论等于拿噪声当效应。";
    } else if ((e.accC - e.accA) > 1.96 * seAC) {
      /* 记忆在扣分：唯一自洽的解释是泄漏数据里标错了。
         这一条不依赖 κ̂ —— κ̂ 只能看见"回吐了正确答案"的那部分记忆。 */
      verdict = "conflict"; subtype = "label";
      why = "甲架准确率（" + e.accA.toFixed(2) + "）显著低于丙架（" + e.accC.toFixed(2) +
        "，差 " + ((e.accC - e.accA) * 100).toFixed(1) + "pp），说明记忆在扣分；" +
        "而溯源通道测到的回吐只有 " + (e.kappa * 100).toFixed(0) +
        "%。两个通道只能同时成立于一种情形：泄漏的答案里有一部分本身是错的。" +
        "回吐错误答案与算错在行为上不可区分，所以 κ̂ 在这里是下界，不是估计。";
    } else if (e.kappa >= 0.60) {
      verdict = "supported"; subtype = "stale";
      why = "乙架上 " + (e.R * 100).toFixed(0) + "% 的答案就是原题答案，扣除偶然（" +
        (e.R0 * 100).toFixed(0) + "%）后仍有 " + (e.kappa * 100).toFixed(0) +
        "% 的题根本没算。这不是「记错了」，是没算。";
    } else if (!advSig) {
      verdict = "noeffect"; subtype = "noadv";
      why = "甲丙两档准确率差 " + ((e.accA - e.accC) * 100).toFixed(1) +
        "pp，与噪声（±" + (1.96 * seAC * 100).toFixed(1) +
        "pp）分不开 —— 见过这道题没有带来任何可测的优势，也就没有需要解释的东西。";
    } else if (e.kappa <= 0.25) {
      verdict = "refuted"; subtype = "compute";
      why = "乙架上的回吐率 " + (e.R * 100).toFixed(0) + "% 与参照组的偶然水平 " +
        (e.R0 * 100).toFixed(0) + "% 分不开 —— 在这么强的改写下，它在算。";
    } else {
      subtype = "mixed";
      why = "回吐压力 " + (e.kappa * 100).toFixed(0) +
        "%：一部分题在算，一部分题在搬旧答案。比例不足以判定主导。";
    }

    if (verdict === "supported" && channels.acc === "blind") {
      subtype = "ceiling";
      why += " 注意：甲丙准确率几乎相同，准确率通道被天花板吃掉了 —— 污染在分数上完全看不出来，只在行为上留下指纹。";
    }
    if (verdict === "supported" && channels.acc === "drift") {
      why += " 注意：参照组显示乙架更难，准确率通道因此失效；但 κ̂ 不依赖难度校准，结论仍然成立。";
    }

    return {
      ok: true,
      meta: {
        version: VERSION, protocol: PROTOCOL, seed: seed, n: n,
        rewrite: w, mem: mem, labelNoise: labelNoise, boot: boot,
        theta: THETA, subSkill: subSkill, refSkill: refSkill, refMem: refMem,
        retained: table.length
      },
      est: {
        accA: e.accA, accB: e.accB, accC: e.accC,
        refA: e.refA, refB: e.refB, refC: e.refC,

  /* ---------------- 自检：已知真值能不能收回来 ---------------- */

  function selfCheck(opt) {
    opt = opt || {};
    var levels = opt.levels || [0, 0.25, 0.5, 0.75, 1.0];
    var seeds = opt.seeds || [20261030, 771, 1931];
    var n = opt.n == null ? 96 : opt.n;
    var t0 = Date.now();
    var rows = [], errs = [], cov = 0;

    levels.forEach(function (mem) {
      seeds.forEach(function (sd) {
        var r = runAudit({
          seed: sd, mem: mem, rewrite: opt.rewrite == null ? 0.45 : opt.rewrite,
          labelNoise: 0, n: n, boot: 240

        var k = r.est.kappa;
        var e = k == null ? 1 : Math.abs(k - truth);
        errs.push(e);
        var hit = r.est.ci && r.est.ci[0] <= truth && truth <= r.est.ci[1];
        if (hit) cov++;
        rows.push({
          truth: +truth.toFixed(3), mem: mem, seed: sd,
          kappa: k == null ? null : +k.toFixed(3),
          ci: r.est.ci ? [+r.est.ci[0].toFixed(3), +r.est.ci[1].toFixed(3)] : null,
          err: +e.toFixed(3), hit: hit,

      rows: rows,
      mae: +mean(errs).toFixed(4),
      coverage: cov + "/" + rows.length,

  function negatives() {
    var base = { seed: 20261030, n: 96, boot: 200 };

      {
        id: "vacuous", name: "变体形同虚设",
        desc: "改写力度 0.10：只换了仓名与物件，数字一个没动。",
        expect: "变体未改变答案 → 拒判",
        opt: Object.assign({}, base, { rewrite: 0.10, mem: 0.85 })
      },
      {
        id: "probe", name: "探针没接通",
        desc: "改写力度 0.95：改了两个数，表面差异太大，记忆根本触发不了。",
        expect: "表面匹配低于阈值 → 拒判",
        opt: Object.assign({}, base, { rewrite: 0.95, mem: 0.85 })
      },
      {
        id: "label", name: "泄漏数据标错了",
        desc: "标签噪声 0.90：记忆里存的是错误答案，原题准确率被拉低。",
        expect: "准确率与溯源互相矛盾 → 结果冲突",
        opt: Object.assign({}, base, { rewrite: 0.45, mem: 0.90, labelNoise: 0.90 })
      },
      {
        id: "n", name: "题组太少",
        desc: "只有 30 组题，区间宽到盖住判定边界。",
        expect: "样本量不足 → 拒判",
        opt: Object.assign({}, base, { n: 30, rewrite: 0.45, mem: 0.55 })
      }
    ];
    return cases.map(function (c) {
      var r = runAudit(c.opt);
      return {
        id: c.id, name: c.name, desc: c.desc, expect: c.expect,
        verdict: r.verdict, subtype: r.subtype, why: r.why,
        kappa: r.est.kappa, ci: r.est.ci,
        passed: (c.id === "label" ? r.verdict === "conflict" : r.verdict === "undetermined")
      };
    });
  }

  /* ---------------- 窗口扫描：改写力度与可估性的关系 ---------------- */

  function sweep(opt) {
    opt = opt || {};
    var out = [];
    for (var w = 0.05; w <= 0.96; w += 0.1) {
      var r = runAudit({
        seed: opt.seed == null ? 20261030 : opt.seed,
        n: opt.n == null ? 96 : opt.n,
        mem: opt.mem == null ? 0.95 : opt.mem,
        rewrite: +w.toFixed(2), boot: 160
      });
      out.push({
        rewrite: +w.toFixed(2),
        kappa: r.est.kappa,
        ci: r.est.ci,
        rhoBar: +r.est.rhoBar.toFixed(3),
        eqRate: +r.est.eqRate.toFixed(3),
        accA: +r.est.accA.toFixed(3),
        accB: +r.est.accB.toFixed(3),
        accC: +r.est.accC.toFixed(3),
        refB: +r.est.refB.toFixed(3),
        refC: +r.est.refC.toFixed(3),
        verdict: r.verdict, subtype: r.subtype,
        usable: r.verdict !== "undetermined"
      });
    }
    return out;
  }

  /* ---------------- 参照体检：控制组自己是不是控制组 ---------------- */

  function refCheck(opt) {
    opt = opt || {};
    var cfgs = [
      { id: "cold", name: "冷参照", mem: 0, desc: "记忆通道完全关闭" },
      { id: "warm", name: "半冷参照", mem: 0.15, desc: "参照组自己也沾过一点语料" },
      { id: "hot", name: "不冷参照", mem: 0.55, desc: "参照组与原题同源，控制组失效" }
    ];
    return cfgs.map(function (c) {
      var r = runAudit({
        seed: opt.seed == null ? 20261030 : opt.seed,
        n: opt.n == null ? 96 : opt.n,
        rewrite: 0.45, mem: 0.85, refMem: c.mem, boot: 160
      });
      var g = r.guards.filter(function (x) { return x.id === "refcold"; })[0];
      return {
        id: c.id, name: c.name, desc: c.desc,
        refA: +r.est.refA.toFixed(3), refC: +r.est.refC.toFixed(3),
        gap: +((r.est.refA - r.est.refC) * 100).toFixed(1),
        certified: g.ok,
        detail: g.detail,
        kappa: r.est.kappa, verdict: r.verdict
      };
    });
  }

  return {
    VERSION: VERSION, PROTOCOL: PROTOCOL, THETA: THETA, KAPPA_RECALL: KAPPA_RECALL,
    runAudit: runAudit, selfCheck: selfCheck, negatives: negatives,
    sweep: sweep, refCheck: refCheck,
    _internals: {
      genTriple: genTriple, slotsOf: slotsOf, matchFrac: matchFrac,
      skillOf: skillOf, fold: fold, CHAINS: CHAINS
    }
  };
});

      (elite ? '已完成本馆的精英挑战「' + esc(cert.play || "未命名") + '」，' : '已逐件看完本馆八件展品并答对全部现场问题，') + '</text>' +
      '<text x="110" y="378" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.72">' +
      (elite ? '并能说明每一步判断所依据的判据。' : '能说出每件展品失效的机制与判据。') + '</text>' +
      rows +
      seal +
      '<text x="110" y="556" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">编号 ' + esc(cert.no) + '</text>' +
      '<text x="' + (W - 110) + '" y="556" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">' + esc(cert.date) + ' · 校验 ' + esc(cert.checksum) + '</text>' +
      (cert.score != null ? '<text x="110" y="' + (430 + detail.length * 30 + 6) + '" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="' + accent + '">得分 ' + cert.score + '</text>' : "") +
      '</svg>';

  function download(cert, opt) {
    if (typeof document === "undefined") return null;
    var svg = certSVG(cert, opt);

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = cert.no + ".svg";

  /* ---------------- 展品长廊（DOM） ---------------- */
  /* 结构：8 张卡，点开变详情；每张卡带一道现场题，答对才算「看过」 */
  function mountGallery(box, hall, opt) {
    if (!box) return null;
    opt = opt || {};
    var items = itemsOf(hall);
    var cur = -1;
    var accent = opt.accent || "#8fb7ff";

    function paint() {
      /* 每次重绘都重新读一遍存储。挂载时缓存的 s 是快照，
         答完题不会回写到它 —— 那样卡片永远停在「待识破」。 */
      var s = st(hall);
      var p = progress(hall);
      var H = [];
      H.push('<div class="dpg-head">' +
        '<div class="dpg-t">展品长廊 <em>' + p.passed + ' / ' + p.total + ' 已答对</em></div>' +
        '<div class="dpg-bar"><i style="width:' + p.pct + '%;background:' + accent + '"></i></div>' +
        '<div class="dpg-note">' + (p.visitorReady ? '八件全通 · 可领参观证书' : '逐件点开，答对现场题才算看过') + '</div>' +
        '</div>');

      H.push('<div class="dpg-grid">');
      items.forEach(function (it, i) {
        var done = !!s.quiz[it.id];
        H.push('<button class="dpg-c' + (done ? " done" : "") + (cur === i ? " on" : "") + '" data-i="' + i + '"' +
          ' style="--ac:' + accent + '">' +
          '<span class="dpg-no">' + it.no + '</span>' +
          '<span class="dpg-ic">' + (it.icon || "◆") + '</span>' +
          '<span class="dpg-nm">' + esc(it.name) + '</span>' +
          '<span class="dpg-sy">' + esc(it.symptom) + '</span>' +
          '<span class="dpg-st">' + (done ? "✓ 已识破" : "待识破") + '</span>' +
          '</button>');
      });
      H.push('</div>');

      H.push('<div class="dpg-detail" id="dpgDetail">');
      if (cur < 0) {
        H.push('<div class="dpg-empty">选一件展品。<b>八件展品对应本馆的八个失效侧面</b>——它们不是八个知识点，' +
          '是同一台仪器能做出的八种不同诊断。答对现场题，进度才往前走。</div>');
      } else {
        var it = items[cur];
        var q = it.quiz;
        var answered = !!s.quiz[it.id];
        H.push('<div class="dpg-dh"><span class="dpg-dno">' + it.no + '</span>' +
          '<span class="dpg-dnm">' + esc(it.name) + '</span>' +
          '<span class="dpg-dsy">' + esc(it.symptom) + '</span></div>');
        H.push('<div class="dpg-cols">');
        H.push('<div class="dpg-col"><h4>机制</h4><p>' + it.mech + '</p></div>');
        H.push('<div class="dpg-col"><h4>判据</h4><p>' + it.judge + '</p></div>');
        H.push('<div class="dpg-col"><h4>真实案例</h4><p>' + it.real + '</p></div>');
        H.push('</div>');
        if (it.verify) {
          H.push('<div class="dpg-verify"><button class="dpg-vb" data-v="' + cur + '">▶ 现场验证这件展品</button>' +
            '<span class="dpg-vr" id="dpgVr">点一下，用本馆内核当场跑一次对照。</span></div>');
        }
        if (q) {
          H.push('<div class="dpg-quiz"><div class="dpg-qt">现场题 · ' + esc(q.q) + '</div>');
          H.push('<div class="dpg-opts">');
          q.opts.forEach(function (o, k) {
            H.push('<button class="dpg-opt' + (answered && k === q.a ? " ok" : "") + '" data-o="' + k + '">' +
              String.fromCharCode(65 + k) + '　' + esc(o) + '</button>');
          });
          H.push('</div>');
          H.push('<div class="dpg-qr" id="dpgQr">' + (answered ? "✓ 已答对。这一件算识破。" : "") + '</div>');

    box.addEventListener("click", function (e) {
      var c = e.target.closest(".dpg-c");

            esc(out.value) + '</span>' + (out.note ? '　<span class="dpg-vn">' + esc(out.note) + '</span>' : "");
        }

      }
      var o = e.target.closest(".dpg-opt");
      if (o) {
        var it2 = items[cur], k = +o.dataset.o, ok = (k === it2.quiz.a);
        var qr = box.querySelector("#dpgQr");

        o.classList.add(ok ? "ok" : "no");

          if (qr) qr.innerHTML = "✓ 正确。" + (it2.quiz.why ? " " + esc(it2.quiz.why) : "");
          var nm = box.querySelector('.dpg-c[data-i="' + cur + '"]');

          var p = progress(hall);
          var t = box.querySelector(".dpg-t em");

          var bar = box.querySelector(".dpg-bar i");

          if (note) note.textContent = p.visitorReady ? "八件全通 · 可领参观证书" : "逐件点开，答对现场题才算看过";

      }

    paint();

  }

  function esc(s) {

      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];

  }

      var H = [];
      H.push('<div class="dpc-wrap">');

      H.push('<div class="dpc-card' + (v ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">一级</span><span class="dpc-n">参观证书</span></div>' +
        '<div class="dpc-d">看完八件展品并答对全部现场题即可领取。' +
        (v ? '' : '当前进度 ' + p.passed + ' / ' + p.total + '。') + '</div>' +
        '<div class="dpc-act">' +
        (v ? '<span class="dpc-no">' + esc(v.no) + '</span><button class="dpc-b" data-dl="visitor">下载</button>'
          : (p.visitorReady
            ? '<button class="dpc-b" data-get="visitor">领取参观证书</button>'
            : '<button class="dpc-b" data-get="visitor" disabled>还差 ' + (p.total - p.passed) + ' 件</button>')) +
        '</div></div>');

      H.push('<div class="dpc-card elite' + (e2 ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">二级</span><span class="dpc-n">精英证书</span></div>' +
        '<div class="dpc-d">' + esc((opt.game && opt.game.brief) || "完成本馆的精英挑战。") + '</div>' +
        '<div class="dpc-act">' +
        (e2 ? '<span class="dpc-no">' + esc(e2.no) + '</span><button class="dpc-b" data-dl="elite">下载</button>'
          : '<button class="dpc-b" data-go="1">进入挑战 →</button>') +
        '</div></div>');

      H.push('</div>');
      box.innerHTML = H.join("");
    }

    box.addEventListener("click", function (e) {
      var g = e.target.closest("[data-get]");
      if (g && !g.disabled) {
        var c = issueCert(hall, g.dataset.get, { holder: opt.holder || "参观者" });
        paint();
        if (opt.onIssue) opt.onIssue(c);
        return;
      }
      var d = e.target.closest("[data-dl]");
      if (d) { var cert = getCert(hall, d.dataset.dl); if (cert) download(cert, { accent: accent, paper: paper, ink: ink }); return; }
      var go = e.target.closest("[data-go]");
      if (go && opt.gameHref) location.href = opt.gameHref;
    });

    paint();
    return { repaint: paint };
  }

  return {
    VERSION: VERSION,
    HALLS: HALLS,
    TIER: TIER,
    register: register,
    specOf: specOf,
    itemsOf: itemsOf,
    progress: progress,
    markSeen: markSeen,
    markQuiz: markQuiz,
    issueCert: issueCert,
    getCert: getCert,
    allCerts: allCerts,
    eliteCount: eliteCount,
    certSVG: certSVG,
    download: download,
    mountGallery: mountGallery,
    mountCerts: mountCerts,
    checksum: fnv
  };
});
</script>
<script>
/* ============================================================
   shared/yc-port.js — 驻馆人立绘引擎 · Portrait 2.0
   ------------------------------------------------------------
   为什么推翻重写
   ------------------------------------------------------------
   1.0 的画法是「一根根线」：五官全是半透明 stroke，没有面。
   放大看是线框图，缩到 52px 就糊成一团灰。十个人只能靠
   「圆脸 / 方脸」两个变量区分，谁都不像谁，也确实不好看。

   2.0 换成赛璐璐上色（cel-shading），五件事：

     一、统一光源。左上 45°，高光永远在左上，暗部永远在右下。
         一旦每个人的光向不一样，十张脸放在一起就会「贴纸感」。
     二、以色块为主、线为辅。色块缩小仍然可读，线缩小就消失。
     三、五官分层。眼睛七层、头发四层、皮肤三层，不是一笔画完。
     四、唯一 id 前缀。SVG 的渐变 / 滤镜 id 是全局的，十个立绘
         同页时必须隔离，否则所有人都会用第一个人的渐变 ——
         这是这类系统最容易踩、也最难查的坑。
     五、成人骨相。脸宽 96 / 脸长 152（1 : 1.58），眼距 = 一个眼宽，
         鼻底到嘴 20、嘴到下巴 26。娃娃脸是脸宽 ≈ 脸长、眼睛占半张脸，
         一眼就像玩具。这一版所有比例按成人头骨重算。

   坐标系 200×240（胸像）
   ------------------------------------------------------------
     发顶 16 / 发际 76 / 眉 96 / 眼 110 / 鼻尖 136
     嘴 156 / 下巴 182 / 颈 176-206 / 肩 206-240

   两种输出
   ------------------------------------------------------------
     bust   —— 完整胸像，全部图层，用在档案卡左栏（约 220×264）
     avatar —— 只取头部，跳过柔光滤镜与发丝高光，用在 26—84px 的小头像

         真眼睛的虹膜上缘被上睑压住、下缘贴着下睑，几乎不留白。 */
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) + '" fill="' + (o.irisFill || ("url(#" + u + "ir)")) + '"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) +
        '" fill="none" stroke="' + ir.deep + '" stroke-width="1.1" stroke-opacity=".75"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.29) + '" fill="#100906"/>' +
      '<circle cx="' + n(cx - w * 0.22) + '" cy="' + n(cy - h * 0.42) + '" r="' + n(w * 0.17) + '" fill="#fff" opacity=".95"/>' +
      '<circle cx="' + n(cx + w * 0.28) + '" cy="' + n(cy + h * 0.42) + '" r="' + n(w * 0.08) + '" fill="#fff" opacity=".5"/>' +
      /* 上睑投影：虹膜顶部压一层暗，眼睛才有厚度 */

    /* 上睑线：整张脸最重的一笔。它比任何细节都更决定「有没有神」 */
    var lidY = cy - h * 1.0 + (m === "down" ? h * 0.2 : 0) - (m === "up" ? h * 0.06 : 0);
    s += '<path d="M' + n(cx + out * w * 0.98) + " " + n(cy - h * 0.26) +
      "C" + n(cx + out * w * 0.7) + " " + n(lidY - h * 0.12) + " " +
            n(cx + out * w * 0.24) + " " + n(lidY - h * 0.26) + " " +
            n(cx) + " " + n(lidY - h * 0.08) +
      "C" + n(cx - out * w * 0.24) + " " + n(lidY - h * 0.26) + " " +
            n(cx - out * w * 0.68) + " " + n(cy - h * 0.8) + " " +
            n(cx - out * w) + " " + n(cy + h * 0.32) +
      '" fill="none" stroke="#241409" stroke-width="' + (o.lash === false ? 2 : 3.1) +
      '" stroke-linecap="round" stroke-opacity=".9"/>';

    if (o.lash !== false) {

        "L" + n(cx + out * w * 1.22) + " " + n(cy - h * 0.92) +
        '" stroke="#241409" stroke-width="2" stroke-linecap="round" opacity=".78"/>';
      s += '<path d="M' + n(cx + out * w * 0.68) + " " + n(cy - h * 0.98) +
        "L" + n(cx + out * w * 0.9) + " " + n(cy - h * 1.46) +
        '" stroke="#241409" stroke-width="1.6" stroke-linecap="round" opacity=".58"/>';

    s += '<path d="M' + n(cx + out * w * 0.88) + " " + n(cy + h * 0.68) +
      "C" + n(cx + out * w * 0.38) + " " + n(cy + h * 1.2) + " " +
            n(cx - out * w * 0.3) + " " + n(cy + h * 1.18) + " " +
            n(cx - out * w * 0.84) + " " + n(cy + h * 0.6) +

      s += '<path d="M' + n(cx + out * w * 0.76) + " " + n(cy - h * 1.92) +
        "C" + n(cx + out * w * 0.28) + " " + n(cy - h * 2.5) + " " +

  }

  /* --- 鼻 ---
     不画轮廓线。鼻子靠四块明暗立起来：
     鼻梁高光（左）、鼻侧暗面（右）、鼻头高光、鼻底投影。
     少了鼻头那一点高光，鼻子就会「塌」进脸里。 */
  function nose(u, k, cx, cy, detail) {
    var s = "";
    if (detail >= 2) {
      /* 鼻梁高光要压到「看得见但说不出」的程度。画成一条白线就假了 */
      s += '<path d="M' + n(cx - 3) + " " + n(cy - 22) + "L" + n(cx - 4.6) + " " + n(cy - 8) +
        '" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".14"/>';
      s += '<ellipse cx="' + n(cx + 7) + '" cy="' + n(cy - 13) + '" rx="5.6" ry="13" fill="' +
        k.deep + '" opacity=".22" filter="url(#' + u + 'sf2)"/>';
      /* 鼻头高光：一小团，位置比鼻梁高光略低略右 */
      s += '<ellipse cx="' + n(cx - 1.4) + '" cy="' + n(cy - 1.6) + '" rx="3.4" ry="2.6" fill="#fff" opacity=".2" filter="url(#' + u + 'sf2)"/>';
      /* 鼻底投影：鼻子「浮起来」靠这一道 */
      s += '<ellipse cx="' + n(cx) + '" cy="' + n(cy + 3.6) + '" rx="9.6" ry="3.6" fill="' +
        k.deep + '" opacity=".3" filter="url(#' + u + 'sf2)"/>';
    }
    /* 鼻翼：两个小小的暗点，不是两道弧。
       画成弧线会变成两撇「八字胡」，这是最容易翻车的一笔。 */
    s += '<ellipse cx="' + n(cx - 7.4) + '" cy="' + n(cy + 1.4) + '" rx="2.6" ry="1.7" fill="' +
      k.deep + '" opacity=".3"/>';
    s += '<ellipse cx="' + n(cx + 7.4) + '" cy="' + n(cy + 1.4) + '" rx="2.6" ry="1.7" fill="' +
      k.deep + '" opacity=".3"/>';
    return s;
  }

  /* --- 嘴 ---
     上唇暗、下唇亮、中间一条缝。笑是「嘴角抬、缝中段下沉」，
     不是把整条线弯成上拱 —— 上拱是「猫嘴」，不是人笑。 */
  function mouth(u, m, k, cx, cy, w, detail, style) {
    var hw = w / 2;
    var cdy = m === "up" ? -2.8 : (m === "down" ? 2.4 : 0);
    var mdy = m === "up" ? 1.8 : (m === "down" ? -1.4 : 0.9);
    var soft = style === "soft";          /* 男性：唇薄、颜色低 */
    var th = soft ? 0.82 : 1;
    var L = n(cx - hw), R = n(cx + hw);
    var y0 = n(cy + cdy), y1 = n(cy + mdy);

    var upper = "M" + L + " " + y0 +
      "C" + n(cx - hw * 0.62) + " " + n(cy + cdy - 4.2 * th) + " " +
            n(cx - hw * 0.3) + " " + n(cy + cdy - 4.6 * th) + " " +
            n(cx - hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +
      "C" + n(cx - hw * 0.05) + " " + n(cy + cdy - 1.4) + " " +
            n(cx + hw * 0.05) + " " + n(cy + cdy - 1.4) + " " +
            n(cx + hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +
      "C" + n(cx + hw * 0.3) + " " + n(cy + cdy - 4.6 * th) + " " +
            n(cx + hw * 0.62) + " " + n(cy + cdy - 4.2 * th) + " " +
            R + " " + y0 +
      "Q" + n(cx) + " " + y1 + " " + L + " " + y0 + "Z";

    var lower = "M" + L + " " + y0 +
      "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +
      "C" + n(cx + hw * 0.64) + " " + n(cy + cdy + 5.2 * th) + " " +
            n(cx + hw * 0.3) + " " + n(cy + cdy + 6.8 * th) + " " +
            n(cx) + " " + n(cy + cdy + 6.6 * th) +
      "C" + n(cx - hw * 0.3) + " " + n(cy + cdy + 6.8 * th) + " " +
            n(cx - hw * 0.64) + " " + n(cy + cdy + 5.2 * th) + " " +
            L + " " + y0 + "Z";

    var s = '<path d="' + upper + '" fill="' + k.lipd + '" opacity="' + (soft ? ".62" : ".88") + '"/>';

    if (detail >= 2) {
      s += '<ellipse cx="' + n(cx - hw * 0.18) + '" cy="' + n(cy + cdy + 3.4 * th) + '" rx="' + n(hw * 0.32) +

    }
    s += '<path d="M' + L + " " + y0 + "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +
      '" fill="none" stroke="' + k.lipd + '" stroke-width="1.5" stroke-linecap="round" stroke-opacity=".85"/>';
    if (m === "up") {
      s += '<path d="M' + L + " " + y0 + "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +
        "Q" + n(cx) + " " + n(cy + cdy + 2.4) + " " + L + " " + y0 +
        '" fill="#3d1c17" opacity=".5"/>';
    }
    return s;
  }

  /* --- 颈 ---
     下巴 182、肩 206，颈长 24。颈太短会「头直接架在肩上」，
     太宽会跟下颌连成一块，看不出下巴在哪。宽 26 是上限。 */
  function neck(u, k, detail, F) {
    var s = '<path d="M87 166H113V210C113 215 107 218 100 218C93 218 87 215 87 210Z" fill="' + F + '"/>';
    if (detail >= 2) {
      s += '<ellipse cx="100" cy="184" rx="26" ry="15" fill="' + k.deep + '" opacity=".4" filter="url(#' + u + 'sf)"/>';
      s += '<path d="M88 198C90 205 93 210 95 214" stroke="' + k.deep + '" stroke-width="2" fill="none" opacity=".13"/>';
      s += '<path d="M112 198C110 205 107 210 105 214" stroke="' + k.deep + '" stroke-width="2" fill="none" opacity=".13"/>';
    }
    return s;
  }

  /* --- 衣 ---
     三种领型，够撑起十个人的身份差：
       shirt 衬衫 + 领带（证物官、指标员）
       coat  大衣翻领（探员、守藤人）
       stand 立领工装 + 拉链（净化、育种、配额） */
  function body(u, cfg, k, detail, F) {
    var c = cfg.cloth || {};
    var hi = c.hi || "#2b3849", dp = c.deep || "#101724";
    var ac = c.accent || cfg.accent || "#46d3e8";
    var type = c.type || "shirt";
    var s = "";

    /* 衣身：肩宽 200，是头宽的 2 倍。窄了就像小孩穿大人衣服 */
    s += '<path d="M100 196C74 196 44 204 22 217C11 224 5 232 2 240H198C195 232 189 224 178 217C156 204 126 196 100 196Z" fill="' + F + '"/>';

    if (type === "shirt") {
      /* 衬衫：V 领 + 两片翻领 + 领带。
         领子不能用纯白 —— 纯白在深色背景上会变成一块抢戏的亮斑，
         人物反而看不见了。压到 #d9d3c9、九成不透明就够。 */
      s += '<path d="M87 194L100 222L113 194L128 201L100 240H72L72 201Z" fill="#d9d3c9" opacity=".9"/>';
      s += '<path d="M87 194L100 222L113 194L104 191L100 197L96 191Z" fill="' + k.deep + '" opacity=".34"/>';
      s += '<path d="M100 198L93.5 207L100 213.5L106.5 207Z" fill="' + ac + '" opacity=".95"/>';
      s += '<path d="M100 213.5L94 231L100 240L106 231Z" fill="' + ac + '" opacity=".78"/>';
      if (detail >= 2) {
        s += '<path d="M87 194L76 207L73 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".55"/>';
        s += '<path d="M113 194L124 207L127 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".55"/>';
        s += '<path d="M100 222V240" stroke="' + k.deep + '" stroke-width="1.2" opacity=".18"/>';
      }
    } else if (type === "coat") {
      /* 大衣：大翻领，左右各一片，压出厚度 */
      s += '<path d="M100 196L72 189L48 215L76 240H100Z" fill="' + hi + '"/>';
      s += '<path d="M100 196L128 189L152 215L124 240H100Z" fill="' + hi + '"/>';
      s += '<path d="M100 196L72 189L56 216L100 240Z" fill="' + dp + '" opacity=".5"/>';
      s += '<path d="M100 196L128 189L144 216L100 240Z" fill="' + dp + '" opacity=".36"/>';
      if (detail >= 2) {
        s += '<path d="M72 189L76 240" stroke="' + dp + '" stroke-width="1.7" opacity=".6"/>';
        s += '<path d="M128 189L124 240" stroke="' + dp + '" stroke-width="1.7" opacity=".6"/>';
        s += '<circle cx="100" cy="228" r="2.4" fill="' + ac + '" opacity=".7"/>';

      s += '<path d="M100 185V240" stroke="' + dp + '" stroke-width="2" opacity=".72"/>';
      if (detail >= 2) {
        s += '<path d="M96.4 185V240" stroke="' + ac + '" stroke-width="1" opacity=".5"/>';
        s += '<circle cx="100" cy="214" r="2.2" fill="' + ac + '" opacity=".55"/>';
        s += '<path d="M79 207C74 219 71 231 70 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".42"/>';
        s += '<path d="M121 207C126 219 129 231 130 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".42"/>';

  /* --- 发 ---
     四层：后发（衬在脸后）、鬓角（盖住耳前）、主发块、发丝高光。
     「头盔感」来自发际线是一条光滑圆弧 —— 真实发际线有鬓角、
     有 M 形后退、有碎发。所以这里把头发拆成可以各自给形的三层。 */
  function hairShape(u, d, hd, detail, noStroke, F) {
    if (!d) return "";

    if (!noStroke) s += '<path d="' + d + '" fill="none" stroke="' + hd + '" stroke-width="1.4" stroke-opacity=".5" stroke-linejoin="round"/>';
    return s;
  }
  function hairHi(paths, hl, detail) {
    if (detail < 2 || !paths || !paths.length) return "";
    return '<g>' + paths.map(function (d) {
      return '<path d="' + d + '" fill="none" stroke="' + hl + '" stroke-width="2.6" stroke-linecap="round" stroke-opacity=".5"/>';
    }).join("") + "</g>";

  /* --- 发缕 ---
     头发之所以「像头发」，靠的是发梢长短不一。
     但发缕如果从发块外缘起笔，就会变成贴在额头上的黑色贴片 ——
     所以起笔点必须落在发块内部（被发块盖住），只有收尖的末梢露出来。
     这样叠出来的发际线才是「发梢」，不是「锯齿」。 */
  function lock(x0, y0, x1, y1, w) {
    var dy = y1 - y0;
    return "M" + n(x0) + " " + n(y0) +
      "C" + n(x0 + (x1 - x0) * 0.1) + " " + n(y0 + dy * 0.56) + " " +
            n(x1 - w * 0.16) + " " + n(y1 - dy * 0.14) + " " + n(x1) + " " + n(y1) +
      "C" + n(x1 + w * 0.34) + " " + n(y1 - dy * 0.26) + " " +
            n(x0 + w + (x1 - x0) * 0.1) + " " + n(y0 + dy * 0.56) + " " +
            n(x0 + w) + " " + n(y0) + "Z";
  }

  /* ============================================================
     总装
     ============================================================ */
  function figure(cfg, mood, detail) {
    detail = detail || 2;
    mood = mood || "calm";
    var u = uid();
    var k = SKIN[cfg.skin || "a"];
    var ir = cfg.iris || { lit: "#8a6038", base: "#5a3a24", deep: "#2a1a10" };
    var h = cfg.hair || {};
    var hc = h.color || "#241b14", hd = h.deep || "#0d0906", hl = h.light || "#4c3826";
    var ac = cfg.accent || "#46d3e8";
    var f = FACES[cfg.face] || cfg.face || FACES.oval;
    var ey = (cfg.eye && cfg.eye.cy) || 110;
    var ex = (cfg.eye && cfg.eye.gap) || 26;
    var erx = (cfg.eye && cfg.eye.rx) || 13;
    var ery = (cfg.eye && cfg.eye.ry) || 5.8;
    var my = (cfg.mouth && cfg.mouth.y) || 156;
    var mw = (cfg.mouth && cfg.mouth.w) || 30;
    var by = (cfg.brow && cfg.brow.y) || 96;
    var bw = (cfg.brow && cfg.brow.w) || 36;
    var bt = (cfg.brow && cfg.brow.thick) || 5;
    var barch = (cfg.brow && cfg.brow.arch != null) ? cfg.brow.arch : 4.2;
    var cl = cfg.cloth || {};
    var clhi = cl.hi || "#2b3849", cldp = cl.deep || "#101724";

    /* 小头像一律用纯色，不引渐变。
       两个原因：一是 52px 下渐变根本看不出来；
       二是头像常常处在带 filter / transform 的合成层里，
       那层里渐变填充会整块丢，脸直接变成一团黑。
       大图才需要渐变 —— 那里才有足够的像素去表现过渡。 */
    var solid = detail < 2;
    var F_SK = solid ? k.base : "url(#" + u + "sk)";
    var F_HK = solid ? hc : "url(#" + u + "hk)";
    var F_CL = solid ? clhi : "url(#" + u + "cl)";
    var F_IR = solid ? ir.base : "url(#" + u + "ir)";

    /* 渐变一律用 userSpaceOnUse。
       默认的 objectBoundingBox 会让每个元素各算一套渐变 ——
       十几缕头发就变成十几个各自反光的小贴纸，永远合不成一坨头发。
       坐标写死在同一套用户空间里，叠在一起才像同一个光源照的。 */
    var defs = "";
    defs += '<linearGradient id="' + u + 'sk" gradientUnits="userSpaceOnUse" x1="52" y1="34" x2="156" y2="188">' +
      '<stop offset="0" stop-color="' + k.lit + '"/><stop offset=".44" stop-color="' + k.base + '"/>' +
      '<stop offset="1" stop-color="' + k.sh + '"/></linearGradient>';
    defs += '<linearGradient id="' + u + 'hk" gradientUnits="userSpaceOnUse" x1="44" y1="14" x2="150" y2="170">' +
      '<stop offset="0" stop-color="' + mix(hl, hc, 0.5) + '"/><stop offset=".34" stop-color="' + hc + '"/>' +
      '<stop offset="1" stop-color="' + hd + '"/></linearGradient>';
    defs += '<linearGradient id="' + u + 'cl" gradientUnits="userSpaceOnUse" x1="30" y1="192" x2="180" y2="240">' +
      '<stop offset="0" stop-color="' + clhi + '"/><stop offset="1" stop-color="' + cldp + '"/></linearGradient>';
    defs += '<radialGradient id="' + u + 'ir" cx=".4" cy=".34" r=".66">' +
      '<stop offset="0" stop-color="' + ir.lit + '"/><stop offset=".5" stop-color="' + ir.base + '"/>' +
      '<stop offset="1" stop-color="' + ir.deep + '"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bl" cx=".5" cy=".5" r=".5">' +
      '<stop offset="0" stop-color="' + k.blush + '" stop-opacity=".34"/>' +
      '<stop offset="1" stop-color="' + k.blush + '" stop-opacity="0"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bg" cx=".5" cy=".36" r=".72">' +
      '<stop offset="0" stop-color="' + ac + '" stop-opacity=".2"/>' +
      '<stop offset=".6" stop-color="' + ac + '" stop-opacity=".05"/>' +
      '<stop offset="1" stop-color="' + ac + '" stop-opacity="0"/></radialGradient>';
    if (detail >= 2) {
      defs += '<filter id="' + u + 'sf" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="4"/></filter>';
      defs += '<filter id="' + u + 'sf2" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="2.2"/></filter>';
    }
    defs += '<clipPath id="' + u + 'fc"><path d="' + f + '"/></clipPath>';
    defs += '<clipPath id="' + u + 'el"><path d="' + eyePath(100 - ex, -1, erx, ey, ery) + '"/></clipPath>';
    defs += '<clipPath id="' + u + 'er"><path d="' + eyePath(100 + ex, 1, erx, ey, ery) + '"/></clipPath>';

    var s = "";

    /* 背景辉光交给 CSS 的 .cstc-por::before 做。
       画在 SVG 里的话，SVG 一被缩放就会出现一个可见的矩形边界。 */

    /* 后发：先于脸，形成「头发包住头」的外轮廓 */
    s += hairShape(u, h.back, hd, detail, false, F_HK);

    s += neck(u, k, detail, F_SK);
    /* 衣身整体下移 12：下巴在 182，肩线原来在 196，只剩 14px 脖子 ——
       头看着像直接搁在肩上。挪到 208 之后露出 26px，
       这是「有脖子的人」和「贴纸人」的分界。 */
    s += '<g transform="translate(0,12)">' + body(u, cfg, k, detail, F_CL) + "</g>";

    /* 耳：先于脸画，脸盖住内侧一半，剩下的正好是耳廓。
       位置必须跟着脸型走 —— 瘦削脸的边缘在 60，耳朵还钉在 50 的话
       会挂到脸外面去，看起来像精灵耳。 */
    var EARX = { oval: 52, square: 50, long: 55, round: 48, sharp: 59 };
    var exr = EARX[cfg.face] || 50;
    s += '<ellipse cx="' + exr + '" cy="108" rx="6.6" ry="11.4" fill="' + k.base + '" opacity=".95"/>';
