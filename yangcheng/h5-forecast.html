<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坍塌预报台 · 三个温室 — 杨城 H5 递归坍塌博物馆</title>
<meta name="description" content="看半程藤蔓，为八个质量层各插一面旗：活着、会枯死、还是根本看不见。三轮预报，插错一层就少一分。">
<link rel="stylesheet" href="shared/yc-core.css">
<link rel="stylesheet" href="shared/yc-deep.css">
<link rel="stylesheet" href="shared/yc-cast.css">
<style>
/* ==========================================================================
   H5 精英挑战 · 坍塌预报台 · 三个温室
   与 H2 案卷（浅色纸本）、H3 指标塔（3D 迷宫）、H4 净化车间（调度台）
   刻意错开：这里是**预报台** —— 一张只画到一半的藤蔓图，玩家为每层插旗。
   所有类名 fc- 前缀。
   ========================================================================== */
:root{
  --fc-bg:#0a0507;
  --fc-bg2:#140a0d;
  --fc-panel:rgba(26,12,16,.9);
  --fc-line:rgba(239,106,114,.16);
  --fc-line2:rgba(239,106,114,.34);
  --fc-tx:#f6e6e8;
  --fc-tx2:#c9a3a8;
  --fc-tx3:#8a6a70;
  --fc-ac:#ef6a72;
  --fc-gold:#c9a227;
  --fc-green:#6fbf73;
  --fc-mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 66% 44% at 18% -8%,rgba(239,106,114,.13),transparent 66%),
    radial-gradient(ellipse 50% 40% at 90% 104%,rgba(111,191,115,.08),transparent 70%),
    linear-gradient(180deg,#0a0507 0%,#140a0d 56%,#070405 100%);
  color:var(--fc-tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:repeating-linear-gradient(0deg,rgba(239,106,114,.024) 0 1px,transparent 1px 3px);
}
.fcwrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px 56px}

/* ---------------- 顶栏 ---------------- */
.fcbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:13px 0 12px;border-bottom:1px solid var(--fc-line2);
}
.fcbar .bk{
  color:var(--fc-ac);text-decoration:none;font-size:13px;
  border:1px solid var(--fc-line2);border-radius:7px;padding:6px 11px;
  transition:background .16s;
}
.fcbar .bk:hover{background:rgba(239,106,114,.1)}
.fcttl b{display:block;font-size:16px;letter-spacing:.5px}
.fcttl span{
  display:block;font-family:var(--fc-mono);font-size:10.5px;letter-spacing:2.4px;
  color:var(--fc-tx3);margin-top:3px;
}
.fcbar .sp{flex:1}
.fcrounds{display:flex;gap:6px;align-items:center}
.fcrounds .rd{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--fc-mono);font-size:11px;color:var(--fc-tx3);
  border:1px solid var(--fc-line);background:rgba(239,106,114,.05);
  transition:all .2s;
}
.fcrounds .rd.on{border-color:var(--fc-ac);color:var(--fc-ac);box-shadow:0 0 0 3px rgba(239,106,114,.14)}
.fcrounds .rd.done{background:rgba(111,191,115,.16);border-color:rgba(111,191,115,.5);color:var(--fc-green)}
.fcscore{font-family:var(--fc-mono);font-size:12px;color:var(--fc-tx3)}
.fcscore b{color:var(--fc-gold);font-size:16px}

/* ---------------- 轮次说明 ---------------- */
.fchead{
  margin-top:16px;padding:15px 17px;border-radius:12px;
  background:var(--fc-panel);border:1px solid var(--fc-line);
}
.fchead .k{
  font-family:var(--fc-mono);font-size:10px;letter-spacing:2.2px;
  color:var(--fc-ac);margin-bottom:7px;
}
.fchead h2{margin:0 0 8px;font-size:19px;letter-spacing:.5px}
.fchead p{margin:0;font-size:12.5px;line-height:1.85;color:var(--fc-tx2)}
.fchead p b{color:var(--fc-tx)}
.fcparams{
  display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;
}
.fcparams .pp{
  font-family:var(--fc-mono);font-size:11px;padding:4px 9px;border-radius:6px;
  background:rgba(239,106,114,.07);border:1px solid var(--fc-line);color:var(--fc-tx2);
}
.fcparams .pp b{color:var(--fc-ac)}

/* ---------------- 藤蔓图 ---------------- */
.fcchart{
  margin-top:13px;padding:14px 16px 16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(26,12,16,.95),rgba(12,6,8,.95));
  border:1px solid var(--fc-line2);
}
.fcaxis{
  display:grid;grid-template-columns:118px minmax(0,1fr) 152px;gap:10px;
  align-items:center;margin-bottom:7px;
}
.fcaxis .al{font-family:var(--fc-mono);font-size:9.5px;letter-spacing:1.4px;color:var(--fc-tx3)}
.fcaxis .gens{display:flex;gap:2px}
.fcaxis .gens i{
  flex:1;text-align:center;font-family:var(--fc-mono);font-size:9px;
  color:var(--fc-tx3);font-style:normal;
}
.fcaxis .gens i:first-child{color:var(--fc-ac)}
.fcaxis .fg{font-family:var(--fc-mono);font-size:9.5px;letter-spacing:1.4px;color:var(--fc-tx3);text-align:center}

.fcrow{
  display:grid;grid-template-columns:118px minmax(0,1fr) 152px;gap:10px;
  align-items:center;padding:5px 0;border-radius:7px;
  transition:background .16s;
}
.fcrow:hover{background:rgba(239,106,114,.035)}
.fcln{display:flex;align-items:baseline;gap:7px;min-width:0}
.fcln b{
  font-family:var(--fc-mono);font-size:10px;color:var(--fc-tx3);flex:none;
}
.fcln span{
  font-size:11.5px;color:var(--fc-tx2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;
}
.fccells{display:flex;gap:2px;height:22px}
.fccells i{
  flex:1;border-radius:2px;display:block;
  transition:background .3s,transform .3s;
}
.fccells i.first{
  outline:1px solid rgba(246,230,232,.32);outline-offset:0;
}
.fcflag{display:flex;gap:4px;justify-content:flex-end}
.fcflag button{
  padding:5px 0;width:46px;border-radius:6px;cursor:pointer;
  font-size:11.5px;letter-spacing:.5px;
  background:rgba(239,106,114,.05);border:1px solid rgba(239,106,114,.18);
  color:var(--fc-tx3);transition:all .15s;
}
.fcflag button:hover:not(:disabled){background:rgba(239,106,114,.14);color:var(--fc-tx)}
.fcflag button.on[data-f="alive"]{background:rgba(111,191,115,.2);border-color:var(--fc-green);color:var(--fc-green);font-weight:700}
.fcflag button.on[data-f="wilted"]{background:rgba(201,120,60,.2);border-color:#c9783c;color:#e2a06a;font-weight:700}
.fcflag button.on[data-f="blind"]{background:rgba(150,150,160,.18);border-color:#8b8b96;color:#b9b9c4;font-weight:700}
.fcflag button:disabled{cursor:default;opacity:.55}
.fcflag .mark{
  width:20px;display:grid;place-items:center;font-size:13px;font-family:var(--fc-mono);
}
.fcflag .mark.ok{color:var(--fc-green)}
.fcflag .mark.no{color:#ff7d7d}

/* 揭示行 */
.fcrow.rev .fcln span{color:var(--fc-tx)}
.fcrow.rev.wrong{background:rgba(255,90,90,.055)}

/* 图例 */
.fclegend{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;
  border-top:1px dashed var(--fc-line);font-size:10.5px;color:var(--fc-tx3);
}
.fclegend span{display:flex;align-items:center;gap:5px}
.fclegend i{width:12px;height:9px;border-radius:2px;display:block}

/* ---------------- 底部：诊断 + 提交 ---------------- */
.fcfoot{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:13px;margin-top:13px}
.fcdiag{
  padding:14px 16px;border-radius:12px;
  background:var(--fc-panel);border:1px solid var(--fc-line);
}
.fcdiag .dh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.fcdiag .dh h3{margin:0;font-size:13px;letter-spacing:.6px}
.fcdiag .dh .left{
  margin-left:auto;font-family:var(--fc-mono);font-size:11px;color:var(--fc-gold);
}
.fcdiag .dbtn{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:10px 12px;border-radius:8px;margin-bottom:7px;
  background:rgba(239,106,114,.05);border:1px solid rgba(239,106,114,.2);
  color:var(--fc-tx);font-size:12.5px;transition:all .15s;
}
.fcdiag .dbtn:hover:not(:disabled){background:rgba(239,106,114,.13);border-color:var(--fc-ac)}
.fcdiag .dbtn:disabled{opacity:.32;cursor:not-allowed}
.fcdiag .dbtn .ic{font-size:14px}
.fcdiag .dbtn .tx small{display:block;font-size:10.5px;color:var(--fc-tx3);margin-top:2px}
.fcdiag .dres{
  margin-top:4px;font-size:11.5px;line-height:1.8;color:var(--fc-tx2);
  padding:9px 11px;border-radius:7px;background:rgba(239,106,114,.05);
  border-left:2px solid var(--fc-ac);
}
.fcdiag .dres:empty{display:none}
.fcdiag .dres b{color:var(--fc-ac)}

.fcsubmit{
  padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;
  background:var(--fc-panel);border:1px solid var(--fc-line);
}
.fcsubmit .sn{font-size:12.5px;color:var(--fc-tx2);line-height:1.8;margin-bottom:10px}
.fcsubmit .sn b{color:var(--fc-tx)}
.fcsubmit .cnt{font-family:var(--fc-mono);font-size:22px;color:var(--fc-ac);margin-bottom:10px}
.fcsubmit .cnt small{font-size:12px;color:var(--fc-tx3)}
.fcsubmit button{
  margin-top:auto;padding:12px;border-radius:9px;cursor:pointer;
  background:var(--fc-ac);border:none;color:#1a0507;font-weight:700;font-size:13.5px;
  transition:filter .15s;
}
.fcsubmit button:hover:not(:disabled){filter:brightness(1.1)}
.fcsubmit button:disabled{opacity:.32;cursor:not-allowed}
.fcsubmit button.ghost{background:transparent;border:1px solid var(--fc-line2);color:var(--fc-tx2);font-weight:500;margin-top:8px}

/* ---------------- 结算 ---------------- */
.fcend{
  margin-top:14px;padding:24px;border-radius:14px;
  background:linear-gradient(180deg,rgba(201,162,39,.09),rgba(12,6,8,.95));
  border:1px solid rgba(201,162,39,.34);
}
.fcend .eh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.fcend .eh h2{margin:0;font-size:22px;letter-spacing:.6px}
.fcend .eh .sc{font-family:var(--fc-mono);font-size:30px;color:var(--fc-gold);margin-left:auto}
.fcend .eh .sc small{font-size:13px;color:var(--fc-tx3)}
.fcend .es{font-size:13px;color:var(--fc-tx2);line-height:1.9;margin-bottom:16px}
.fcend .parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fcend .parts .p{
  background:rgba(239,106,114,.05);border:1px solid var(--fc-line);
  border-radius:9px;padding:11px 12px;
}
.fcend .parts .p .pl{font-size:10.5px;color:var(--fc-tx3);margin-bottom:5px}
.fcend .parts .p .pv{font-family:var(--fc-mono);font-size:18px;color:var(--fc-tx)}
.fcend .parts .p .pn{font-size:10px;color:var(--fc-tx3);margin-top:4px}
.fcend .certbox{
  border-radius:11px;padding:16px;border:1px dashed rgba(201,162,39,.4);
  background:rgba(201,162,39,.05);
}
.fcend .certbox .ct{font-size:14px;font-weight:700;color:var(--fc-gold);margin-bottom:6px}
.fcend .certbox .cd{font-size:12.5px;color:var(--fc-tx2);line-height:1.8}
.fcend .certbox .cn{
  font-family:var(--fc-mono);font-size:12px;color:var(--fc-gold);
  margin-top:9px;letter-spacing:.5px;
}
.fcend .btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.fcend .btnrow button{
  padding:10px 18px;border-radius:8px;cursor:pointer;font-size:13px;
  background:var(--fc-gold);border:none;color:#1a1405;font-weight:700;
}
.fcend .btnrow button.ghost{background:transparent;border:1px solid var(--fc-line2);color:var(--fc-tx2);font-weight:500}

/* ---------------- 窄屏 ---------------- */
@media (max-width:960px){
  .fcfoot{grid-template-columns:1fr}
  .fcend .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .fcwrap{padding:0 12px 40px}
  .fcaxis,.fcrow{grid-template-columns:78px minmax(0,1fr) 128px;gap:6px}
  .fcln span{font-size:10px}
  .fccells{height:18px}
  .fcflag button{width:38px;font-size:10.5px;padding:4px 0}
  .fcaxis .gens i{font-size:7.5px}
  .fcend{padding:16px}
  .fcend .parts{grid-template-columns:1fr}
  .fcend .eh .sc{font-size:24px}
}
</style>

<script>
/* ============================================================
   yc-greenhouse.js — H5 递归坍塌博物馆 · 谱系温室引擎  v0.2.0
   ------------------------------------------------------------
   问题：数据反复来自模型自身时，哪些信息会消失？

   这一版不画「一条模糊曲线」。它做四件老馆没做的事：

   ① 给每一层信息单独定死因
      把 p₀ 按密度排名切成 8 个质量层，每层每代算保留率，
      然后分三类：
        blind   分辨率外 —— N 太小，这层从来没被采到过
        wilted  递归枯萎 —— 看见了，然后在反复重采样里没了
        alive   幸存
      「尾部先死」这句话因此被拆成两种完全不同的病，
      而不是含糊地算成一个总体距离。

   ② 不用总体距离判坍塌
      TV 距离被主体质量主导。N=2000 时尾巴全死光，TV 只掉 0.08。
      用 TV 看坍塌会看到「什么都没发生」—— 这本身是展品。
      这里改用「分位层存活数」，按层等权，不按质量加权。

   ③ 把「一次实验」变成「一群谱系」
      单条谱系的枯萎世代是随机变量。只跑一条就宣布「第 X 代坍塌」，
      等于把一次抽样当成一个定律。默认播种 16 条平行谱系。

   ④ 给出可被自己证伪的归因
      N 只改变速度（ρ=0 时无移民，迟早全枯）；
      ρ 改变归宿（ρ>0 才有非退化稳态）。
      把观测窗拉长三倍，ρ=0 应全枯、ρ=0.3 应保持 —— 这一条能被推翻。

   模型本体（不是装饰）：
     世界 = [0,1] 上 96 个仓的离散分布 p₀（三峰 + 宽尾 + 十个极稀卫星仓）
     模型 = 同网格上的计数向量（最简非参数生成模型：直方图）
     每代：从模型抽 N(1-ρ) 件 + 从真分布抽 Nρ 件 → 重拟合
     这就是 Wright–Fisher 漂变 + 移民的离散版本，参数含义明确。

   为什么 α 平滑必须是 0：
     v0.1 用 α=0.5，结果层 8 的保留率跑到 2900%。因为加性平滑给每个
     空仓都塞了 α 的质量，96 个仓 × α/(N+96α) 在稀薄层里远大于真实
     概率 —— 平滑凭空造出了尾巴，把「尾巴死了」显示成「尾巴涨了」。
     这不是调参问题，是这类测量必须避开的系统性伪造。
     现在 α 默认 0，并留作自检项：把 α 调到 0.5，看它怎么骗人。

   随机数用 mulberry32。H4 的教训：xorshift32 前一两百个输出对 32 位
   种子低位有偏，会把抽样率变成结论里的偏差。这里同样不许用。
   ============================================================ */
(function (root) {
  "use strict";

  var VERSION = "0.2.0";

  /* ---------------- 世界 ---------------- */
  var K = 96;                 /* 仓数：分辨率的下限由它决定 */
  var NL = 8;                 /* 质量层数 */
  var EDGES = [0.5, 0.75, 0.90, 0.97, 0.99, 0.997, 0.999, 1.0];
  var LAYER_NAME = [
    "最密 50%", "50—75%", "75—90%", "90—97%",
    "97—99%", "99—99.7%", "99.7—99.9%", "99.9—100%"
  ];
  var UNI_FROM = 79;                 /* x ≥ 0.82 的起始仓（79.5/96 = 0.828） */
  var SAT_FROM = 84, SAT_TO = 94;    /* 十个极稀卫星仓：x 0.880—0.984 */

  function mulberry32(a) {
    a = (a >>> 0) || 0x9e3779b9;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function gaussPdf(x, mu, sd) {
    var z = (x - mu) / sd;
    return Math.exp(-0.5 * z * z) / (sd * 2.5066282746);
  }

  /* p₀：三个不同宽度的峰 + 一段宽尾 + 十个极稀卫星仓。
     卫星仓是故意的：它们是「尾部先死」这句话唯一能被证伪的地方 ——
     如果连它们都活着，那就不该说尾巴先死。 */
  function buildWorld() {
    var p = new Array(K), i, x, v, sum = 0;
    for (i = 0; i < K; i++) {
      x = (i + 0.5) / K;
      v = (0.32 * gaussPdf(x, 0.20, 0.050)
         + 0.26 * gaussPdf(x, 0.46, 0.022)
         + 0.24 * gaussPdf(x, 0.68, 0.090)) / K;
      if (i >= UNI_FROM) v += 0.16 / (K - UNI_FROM);                    /* 宽尾 17 仓 */
      if (i >= SAT_FROM && i < SAT_TO) v += 0.03 / (SAT_TO - SAT_FROM); /* 卫星 10 仓 */
      p[i] = v; sum += v;
    }
    for (i = 0; i < K; i++) p[i] /= sum;
    return p;
  }

  /* 质量层：按 p₀ 密度从高到低累计，切在累计质量的 50/75/90/97/99/99.7/99.9%。
     分层依据是「密度排名」而不是「x 位置」—— 同一层里可以是好几个分散的仓，
     这正是要的：层 8 装的是「最稀的那 0.1% 质量」，它散落在哪里不重要。 */
  function layerMap(p) {
    var idx = [], i, b;
    for (i = 0; i < K; i++) idx.push(i);
    idx.sort(function (a, c) { return p[c] - p[a]; });
    var L = new Array(K), cum = 0;
    for (i = 0; i < K; i++) {
      b = idx[i];
      var mid = cum + p[b] / 2, li = 0;
      while (li < NL - 1 && mid >= EDGES[li]) li++;
      L[b] = li;
      cum += p[b];
    }
    return L;
  }

  function layerMass(p, L) {
    var m = new Array(NL), l;
    for (l = 0; l < NL; l++) m[l] = 0;
    for (var i = 0; i < K; i++) m[L[i]] += p[i];
    return m;
  }

  function layerBins(L) {
    var c = new Array(NL), l;
    for (l = 0; l < NL; l++) c[l] = 0;
    for (var i = 0; i < K; i++) c[L[i]]++;
    return c;
  }

  /* ---------------- 抽样 ---------------- */
  function cumOf(q) {
    var c = new Float64Array(K), s = 0, i;
    for (i = 0; i < K; i++) { s += q[i]; c[i] = s; }
    return c;
  }

  function sampleInto(counts, cum, n, rnd) {
    var total = cum[K - 1];
    for (var t = 0; t < n; t++) {
      var u = rnd() * total, lo = 0, hi = K - 1;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (cum[mid] < u) lo = mid + 1; else hi = mid;
      }
      counts[lo]++;
    }
  }

  /* ---------------- 逐代测量 ---------------- */
  /* 两个指标，分工明确：
       ret  质量比 = 该层在模型里的质量 / 在真分布里的质量。
            稀薄层一旦落进一两个计数就会爆到 5×、20×，读起来像「变多了」。
            它只适合看主体层，不适合判死活。
       cov  支撑覆盖率 = 该层的仓还有几成在模型里有非零质量。
            这是判死活的量：它不随质量膨胀，单调、可解释
            （「这层还剩几成仓」），而且 α=0 时一旦归零就是吸收态。
     判死活用 cov，看形变用 ret。混用会把「一个计数撞上了」说成「这层还活着」。 */
  function measure(q, p0, L, LM, binCount) {
    var i, l, tv = 0, H = 0;
    for (i = 0; i < K; i++) {
      tv += Math.abs(q[i] - p0[i]);
      if (q[i] > 1e-12) H -= q[i] * Math.log(q[i]);
    }
    var lm = new Array(NL), ret = new Array(NL), cov = new Array(NL);
    for (l = 0; l < NL; l++) { lm[l] = 0; cov[l] = 0; }
    for (i = 0; i < K; i++) {
      lm[L[i]] += q[i];
      if (q[i] > 1e-12) cov[L[i]]++;
    }
    for (l = 0; l < NL; l++) {
      ret[l] = LM[l] > 0 ? lm[l] / LM[l] : 0;
      cov[l] = binCount[l] > 0 ? cov[l] / binCount[l] : 0;
    }
    return { tv: tv / 2, fid: 1 - tv / 2, H: Math.exp(H), ret: ret, cov: cov, lm: lm };
  }

  /* ---------------- 单条谱系 ---------------- */
  /* 第 0 代 = 用无限真数据训练出来的模型（就是 p₀ 本身）。
     这样「第 1 代掉多少」就只反映采样分辨率，不含初始拟合误差。 */
  function runLine(seed, o, L, p0, LM, BC) {
    var rnd = mulberry32(seed);
    var q = p0.slice();
    var gens = [], g, i;
    var nReal = Math.round(o.N * o.rho);
    var nSyn = o.N - nReal;
    var cum0 = nReal > 0 ? cumOf(p0) : null;
    for (g = 1; g <= o.G; g++) {
      var counts = new Float64Array(K);
      if (nSyn > 0) sampleInto(counts, cumOf(q), nSyn, rnd);
      if (nReal > 0) sampleInto(counts, cum0, nReal, rnd);
      var nq = new Array(K), s = 0;
      for (i = 0; i < K; i++) { nq[i] = counts[i] + o.alpha; s += nq[i]; }
      for (i = 0; i < K; i++) nq[i] /= s;
      q = nq;
      var m = measure(q, p0, L, LM, BC);
      m.g = g;
      m.q = q;            /* 保留该代分布，供镜面显示平均形变 */
      gens.push(m);
    }
    return { seed: seed, gens: gens };
  }

  function median(a) {
    var b = a.slice().sort(function (x, y) { return x - y; });
    if (!b.length) return NaN;
    var n = b.length;
    return n % 2 ? b[(n - 1) >> 1] : (b[n / 2 - 1] + b[n / 2]) / 2;
  }

  function mean(a) {
    if (!a.length) return NaN;
    var s = 0;
    for (var i = 0; i < a.length; i++) s += a[i];
    return s / a.length;
  }

  /* 可见门槛：一个层在第 1 代的支撑覆盖率要达到一半，才算「被看见」。
     低于一半不是坍塌，是没采到 —— 两者必须分开报，否则会把
     「根本没看见」说成「看见了然后没了」。 */
  var VIS_MIN = 0.5;

  var DEF = {
    seed: 20311030,
    rho: 0.05,
    N: 400,
    G: 24,
    lines: 16,
    alpha: 0
  };

  /* 由第 1 代的支撑覆盖率决定「哪些层被看见了」。
     注意这是设计属性（N 与世界决定），不是某条谱系的运气：
     取的是跨谱系中位数，所以对单条谱系的随机性免疫。 */
  function visibleOf(cov1) {
    var j = [], b = [], l;
    for (l = 0; l < NL; l++) {
      if (cov1[l] >= VIS_MIN) j.push(l); else b.push(l);
    }
    return { judgeable: j, blind: b };
  }

  function run(opt) {
    var o = {}, k;
    for (k in DEF) if (DEF.hasOwnProperty(k)) o[k] = DEF[k];
    if (opt) for (k in opt) if (opt.hasOwnProperty(k) && opt[k] !== undefined) o[k] = opt[k];

    var t0 = (typeof performance !== "undefined" && performance.now)
      ? performance.now() : Date.now();

    var p0 = buildWorld();
    var L = layerMap(p0);
    var LM = layerMass(p0, L);
    var BC = layerBins(L);

    var lines = [], li, g, l;

    /* 第一步：只跑，不做判定。判定范围要先从第 1 代算出来，
       不能在跑之前用「期望计数」猜 —— 那会把「撞上一个计数」的层
       误判成可见、把真正可见的层误判成不可见。 */
    for (li = 0; li < o.lines; li++) {
      lines.push(runLine((o.seed + li * 7919) >>> 0, o, L, p0, LM, BC));
    }

    /* 第二步：聚合逐代跨谱系中位数 */
    var byGen = [];
    for (g = 0; g < o.G; g++) {
      var fid = [], H = [], rl = [], cl = [];
      for (l = 0; l < NL; l++) { rl.push([]); cl.push([]); }
      for (li = 0; li < lines.length; li++) {
        var gx = lines[li].gens[g];
        fid.push(gx.fid); H.push(gx.H);
        for (l = 0; l < NL; l++) { rl[l].push(gx.ret[l]); cl[l].push(gx.cov[l]); }
      }
      var ret = [], cov = [];
      for (l = 0; l < NL; l++) { ret.push(median(rl[l])); cov.push(median(cl[l])); }
      /* 平均分布：镜面显示用。中位数对分布没有定义，所以用跨谱系平均，
         并在界面上写明「16 条谱系的平均形变」，不假装这是某一条。 */
      var meanQ = new Array(K), i2;
      for (i2 = 0; i2 < K; i2++) meanQ[i2] = 0;
      for (li = 0; li < lines.length; li++) {
        var qq = lines[li].gens[g].q;
        for (i2 = 0; i2 < K; i2++) meanQ[i2] += qq[i2] / lines.length;
      }
      byGen.push({ g: g + 1, fid: median(fid), H: median(H), ret: ret, cov: cov, meanQ: meanQ });
    }

    /* 第三步：判定范围 = 第 1 代支撑覆盖率 ≥ 一半的层 */
    var vis = visibleOf(byGen[0].cov);
    var judgeable = vis.judgeable, blind = vis.blind;

    /* 第四步：逐条谱系判枯萎（只看被看见的层）
       判据是「相对支撑保留」而不是绝对值：
         keep = 末代覆盖率 / 第 1 代覆盖率，keep < 0.5 才算枯。
       用绝对值会冤枉本来就起步低的层 —— 一个第 1 代只有 0.55 覆盖的层，
       掉到 0.45 只是正常抖动，不是坍塌。 */
    for (li = 0; li < lines.length; li++) {
      var ln = lines[li], lost = [], keepEnd = [];
      var first = ln.gens[0], fin = ln.gens[ln.gens.length - 1];
      for (var jj = 0; jj < judgeable.length; jj++) {
        var lx = judgeable[jj];
        var k = first.cov[lx] > 1e-9 ? fin.cov[lx] / first.cov[lx] : 0;
        keepEnd.push(k);
        if (k < VIS_MIN) lost.push(lx);
      }
      ln.keep = keepEnd;
      ln.lost = lost;
      /* 枯萎世代取「持续枯萎」的起点：最后一次还在阈值以上的下一代。
         单代抖动不算枯萎 —— 有移民时层会回光返照，取首次跌破会把它误判成早死。 */
      ln.deathGen = null;
      for (jj = 0; jj < judgeable.length; jj++) {
        var l2 = judgeable[jj], lastOk = 0;
        for (g = 0; g < ln.gens.length; g++) {
          var kk = first.cov[l2] > 1e-9 ? ln.gens[g].cov[l2] / first.cov[l2] : 0;
          if (kk >= VIS_MIN) lastOk = g + 1;
        }
        if (lastOk < ln.gens.length) {
          var d = lastOk + 1;
          if (ln.deathGen === null || d < ln.deathGen) ln.deathGen = d;
        }
      }
      ln.final = fin;
    }

    /* 逐代存活率（现在能算了） */
    for (g = 0; g < o.G; g++) {
      var surv = 0, clean = 0;
      for (li = 0; li < lines.length; li++) {
        if (lines[li].deathGen === null || lines[li].deathGen > g + 1) surv++;
        if (lines[li].lost.length === 0) clean++;
      }
      byGen[g].surv = surv / lines.length;
      byGen[g].clean = clean / lines.length;
    }

    /* 每层的归宿（用跨谱系中位覆盖率算相对保留） */
    var last = byGen[byGen.length - 1], firstG = byGen[0];
    var fate = [], keepG = [], wiltedLayers = [], blindLayers = blind.slice(), aliveLayers = [];
    for (l = 0; l < NL; l++) {
      var kp = firstG.cov[l] > 1e-9 ? last.cov[l] / firstG.cov[l] : 0;
      keepG.push(kp);
      if (blind.indexOf(l) >= 0) fate.push("blind");
      else if (kp < VIS_MIN) { fate.push("wilted"); wiltedLayers.push(l); }
      else { fate.push("alive"); aliveLayers.push(l); }
    }

    /* 主结论挂在「跨谱系中位枯萎层数」上，而不是「任一层枯」。
       后者太松：ρ=0.5 时最稀的可见层也会偶尔掉一半，于是永远报不出「稳定」。 */
    var lostCounts = lines.map(function (x) { return x.lost.length; });
    var medLost = median(lostCounts);
    var wiltFrac = mean(lostCounts.map(function (n) { return n > 0 ? 1 : 0; }));
    var deaths = lines.filter(function (x) { return x.deathGen !== null; })
                      .map(function (x) { return x.deathGen; });

    /* 枯萎的层全在稀薄半边？那叫「按分位坍塌」；主体也枯了叫「全面坍塌」 */
    var mid = Math.floor(judgeable.length / 2);
    var denseJudge = judgeable.slice(0, mid);
    var denseWilted = wiltedLayers.filter(function (x) { return denseJudge.indexOf(x) >= 0; });

    var verdict, subtype, why;

    if (o.lines < 8) {
      verdict = "undetermined"; subtype = "few";
      why = "只播了 " + o.lines + " 条谱系。单条谱系的枯萎世代是随机变量，" +
            "一条线不构成一个定律 —— 至少 8 条才能把「必然」和「这次刚好」分开。";
    } else if (o.G < 5) {
      verdict = "undetermined"; subtype = "short";
      why = "观测窗只有 " + o.G + " 代。没枯萎可能只是还没到，" +
            "枯萎了也可能只是刚起步 —— 这个长度不足以谈「归宿」。";
    } else if (o.rho >= 1) {
      verdict = "undetermined"; subtype = "nonrecursive";
      why = "ρ = 1 意味着每一代都用纯新鲜真数据，模型输出一件都没进训练集。" +
            "这不是递归条件，测出来的只是「有限样本拟合误差」。";
    } else if (judgeable.length < 2) {
      verdict = "undetermined"; subtype = "resolution";
      why = "N = " + o.N + " 时，8 个质量层里只有 " + judgeable.length +
            " 层的期望计数够得上「被看见」。这不是坍塌，是分辨率不够 —— " +
            "加大采样量再来问。";
    } else if (medLost === 0 && wiltFrac <= 0.20) {
      verdict = "refuted"; subtype = "stable";
      why = "在 ρ = " + o.rho + "、N = " + o.N + "、G = " + o.G + " 下，过半谱系一层都没枯，" +
            "枯萎的谱系占 " + (wiltFrac * 100).toFixed(0) + "%。" +
            "至少在这个观测窗内，没测到成规模的不可逆信息损失。";
    } else if (medLost === 0) {
      verdict = "conflict"; subtype = "spread";
      why = "多数谱系一层都没枯（中位枯萎层数 0），但有 " + (wiltFrac * 100).toFixed(0) +
            "% 的谱系枯了至少一层。这说明参数正好压在临界线上 —— " +
            "任何人只跑一次，得到的结论都取决于运气。";
    } else if (wiltFrac >= 0.80) {
      if (denseWilted.length > 0) {
        verdict = "supported"; subtype = "body";
        why = "连主体质量层也枯了（第 " + denseWilted.map(function (x) { return x + 1; }).join("、") +
              " 层只剩不到一半的仓）。" + (wiltFrac * 100).toFixed(0) + "% 的谱系在 " + o.G +
              " 代内中位丢了 " + medLost + " 层 —— 这是全面坍塌，不只是尾巴。";
      } else {
        verdict = "supported"; subtype = "tail";
        why = "主体层全在，枯的是第 " +
              wiltedLayers.map(function (x) { return x + 1; }).join("、") + " 层。" +
              (wiltFrac * 100).toFixed(0) + "% 的谱系在 " + o.G +
              " 代内中位丢了 " + medLost + " 层 —— 坍塌按分位发生：越稀的先死，而且是不可逆的。";
      }
    } else {
      verdict = "conflict"; subtype = "spread";
      why = "中位枯萎层数 " + medLost + "，但只有 " + (wiltFrac * 100).toFixed(0) +
            "% 的谱系枯了 —— 同一组参数下谱系之间分歧很大。" +
            "这个混合比正好在临界附近，任何单次实验的结论都会是运气。";
    }

    /* 附注：ρ = 0 时没有移民，观测窗只是「还没死完」 */
    var note = null;
    if (o.rho === 0 && medLost === 0 && judgeable.length >= 2) {
      note = "ρ = 0 时没有任何新信息输入，枯萎是吸收态：一旦某层的仓全归零就再也回不来。" +
             "现在还有 " + ((1 - wiltFrac) * 100).toFixed(0) + "% 的谱系一层都没枯，" +
             "只说明 " + o.G + " 代还不够长，不代表它们能一直活下去 —— 去「归因」里把窗口拉长三倍看看。";
    }

    var guards = [
      { key: "rec", label: "递归守卫", ok: o.rho < 1,
        detail: "ρ = " + o.rho + "，每代 " + Math.round(o.N * (1 - o.rho)) + " 件来自模型自身" },
      { key: "lines", label: "谱系守卫", ok: o.lines >= 8,
        detail: o.lines + " 条平行谱系（≥8 才分得开随机与必然）" },
      { key: "len", label: "长度守卫", ok: o.G >= 5,
        detail: "观测窗 " + o.G + " 代" },
      { key: "res", label: "分辨率守卫", ok: judgeable.length >= 4,
        detail: "可见 " + judgeable.length + "/8 层" +
                (blind.length ? "，看不见第 " + blind.map(function (x) { return x + 1; }).join("、") + " 层" : "") }
    ];

    var ms = ((typeof performance !== "undefined" && performance.now)
      ? performance.now() : Date.now()) - t0;

    return {
      meta: {
        version: VERSION, seed: o.seed, rho: o.rho, N: o.N, G: o.G,
        lines: o.lines, alpha: o.alpha,
        K: K, NL: NL, edges: EDGES, layerName: LAYER_NAME,
        visMin: VIS_MIN, uniFrom: UNI_FROM, satFrom: SAT_FROM, satTo: SAT_TO
      },
      p0: p0, L: L, LM: LM,
      lines: lines, byGen: byGen,
      judgeable: judgeable, blind: blind,
      fate: fate, wiltedLayers: wiltedLayers, blindLayers: blindLayers, aliveLayers: aliveLayers,
      est: {
        wiltFrac: wiltFrac, surviveFrac: 1 - wiltFrac, medLost: medLost, keepG: keepG,
        wilted: wiltedLayers.length, blind: blind.length, alive: aliveLayers.length,
        fid0: byGen[0].fid, fidG: last.fid, H0: byGen[0].H, HG: last.H,
        medDeath: deaths.length ? median(deaths) : null,
        deathMin: deaths.length ? Math.min.apply(null, deaths) : null,
        deathMax: deaths.length ? Math.max.apply(null, deaths) : null,
        deaths: deaths,
        layerRetG: last.ret, layerRet1: byGen[0].ret,
        layerCovG: last.cov, layerCov1: byGen[0].cov
      },
      verdict: verdict, subtype: subtype, why: why, note: note,
      guards: guards, ms: ms
    };
  }

  /* ---------------- 归因：N 改速度，ρ 改归宿 ---------------- */
  /* 四个对照，同一世界、同一 seed：
       A  ρ=0     N      G     基准
       B  ρ=0     8N     G     只加预算，窗口不变
       C  ρ=0     8N     3G    加预算 + 拉长窗口，仍无移民
       D  ρ=0.30  N      3G    拉长窗口 + 有移民
     三条预测：
       ① B 的存活率不低于 A —— 预算变多，同窗口内枯萎更少（速度效应）
       ② C 的存活率仍接近 0 —— 八倍预算也救不回无移民的归宿
       ③ D 的存活率显著高于 C —— 同窗口下，移民才是改变结局的东西
     若 ②③ 同时成立，「N 小所以尾部死了」就只解释了「早死」，解释不了「必死」。
     这一条能被推翻：如果 C 保持住了，或者 D 没比 C 好，归因就不成立。 */
  function decompose(opt) {
    var o = {}, k;
    for (k in DEF) if (DEF.hasOwnProperty(k)) o[k] = DEF[k];
    if (opt) for (k in opt) if (opt.hasOwnProperty(k) && opt[k] !== undefined) o[k] = opt[k];

    var L8 = Math.min(o.lines, 8);
    var A = run({ seed: o.seed, rho: 0, N: o.N, G: o.G, lines: L8, alpha: o.alpha });
    var B = run({ seed: o.seed, rho: 0, N: o.N * 8, G: o.G, lines: L8, alpha: o.alpha });
    var C = run({ seed: o.seed, rho: 0, N: o.N * 8, G: o.G * 3, lines: L8, alpha: o.alpha });
    var D = run({ seed: o.seed, rho: 0.30, N: o.N, G: o.G * 3, lines: L8, alpha: o.alpha });

    var sv = function (r) { return r.est.surviveFrac; };

    var md = function (r) { return r.est.medDeath === null ? o.G + 1 : r.est.medDeath; };
    var preds = [
      { key: "speed", text: "预算 ×8、窗口不变：中位枯萎世代应明显推迟",
        ok: md(B) >= md(A) + 3,
        got: "第 " + md(A) + " 代 → 第 " + md(B) + " 代" },
      { key: "fate", text: "预算 ×8、窗口 ×3、仍无移民：存活率应仍接近 0",
        ok: sv(C) <= 0.15,
        got: (sv(B) * 100).toFixed(0) + "% → " + (sv(C) * 100).toFixed(0) + "%" },
      { key: "mix", text: "同窗口下加 30% 移民：存活率应显著高于无移民",
        ok: sv(D) >= sv(C) + 0.40,
        got: (sv(C) * 100).toFixed(0) + "% → " + (sv(D) * 100).toFixed(0) + "%" }
    ];
    var hit = preds.filter(function (p) { return p.ok; }).length;

    var v, txt;
    if (hit === 3) {
      v = "confirmed";
      txt = "三条预测全部成立。八倍预算把中位枯萎世代从第 " + md(A) + " 代推迟到第 " + md(B) +
            " 代（速度变慢了），但窗口拉长三倍后存活率仍然归零到 " + (sv(C) * 100).toFixed(0) +
            "%（归宿没变）；同样长度的窗口里加 30% 移民，存活率是 " + (sv(D) * 100).toFixed(0) +
            "%。所以「N 小所以尾部死了」只解释了「早死」，解释不了「必死」—— " +

      '<text x="' + (W / 2) + '" y="212" text-anchor="middle" font-family="Songti SC,SimSun,serif" font-size="17" fill="' + ink + '" opacity="0.66">' + esc(cert.hallName) + ' · 杨城</text>' +
      '<line x1="150" y1="244" x2="' + (W - 150) + '" y2="244" stroke="' + accent + '" stroke-width="1" opacity="0.4"/>' +
      '<text x="110" y="300" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.55">兹证明</text>' +
      '<text x="180" y="304" font-family="Songti SC,SimSun,serif" font-size="26" font-weight="600" fill="' + ink + '">' + esc(cert.holder) + '</text>' +
      '<text x="110" y="348" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.72">' +
      (elite ? '已完成本馆的精英挑战「' + esc(cert.play || "未命名") + '」，' : '已逐件看完本馆八件展品并答对全部现场问题，') + '</text>' +
      '<text x="110" y="378" font-family="Songti SC,SimSun,serif" font-size="15" fill="' + ink + '" opacity="0.72">' +
      (elite ? '并能说明每一步判断所依据的判据。' : '能说出每件展品失效的机制与判据。') + '</text>' +
      rows +
      seal +
      '<text x="110" y="556" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">编号 ' + esc(cert.no) + '</text>' +
      '<text x="' + (W - 110) + '" y="556" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="12" fill="' + ink + '" opacity="0.5">' + esc(cert.date) + ' · 校验 ' + esc(cert.checksum) + '</text>' +
      (cert.score != null ? '<text x="110" y="' + (430 + detail.length * 30 + 6) + '" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="' + accent + '">得分 ' + cert.score + '</text>' : "") +
      '</svg>';
  }

  function download(cert, opt) {
    if (typeof document === "undefined") return null;
    var svg = certSVG(cert, opt);
    var blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = cert.no + ".svg";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
    return a.download;
  }

  /* ---------------- 展品长廊（DOM） ---------------- */
  /* 结构：8 张卡，点开变详情；每张卡带一道现场题，答对才算「看过」 */
  function mountGallery(box, hall, opt) {
    if (!box) return null;
    opt = opt || {};
    var items = itemsOf(hall);
    var cur = -1;
    var accent = opt.accent || "#8fb7ff";

    function paint() {
      /* 每次重绘都重新读一遍存储。挂载时缓存的 s 是快照，
         答完题不会回写到它 —— 那样卡片永远停在「待识破」。 */
      var s = st(hall);
      var p = progress(hall);
      var H = [];
      H.push('<div class="dpg-head">' +
        '<div class="dpg-t">展品长廊 <em>' + p.passed + ' / ' + p.total + ' 已答对</em></div>' +
        '<div class="dpg-bar"><i style="width:' + p.pct + '%;background:' + accent + '"></i></div>' +
        '<div class="dpg-note">' + (p.visitorReady ? '八件全通 · 可领参观证书' : '逐件点开，答对现场题才算看过') + '</div>' +
        '</div>');

      H.push('<div class="dpg-grid">');
      items.forEach(function (it, i) {
        var done = !!s.quiz[it.id];
        H.push('<button class="dpg-c' + (done ? " done" : "") + (cur === i ? " on" : "") + '" data-i="' + i + '"' +
          ' style="--ac:' + accent + '">' +
          '<span class="dpg-no">' + it.no + '</span>' +
          '<span class="dpg-ic">' + (it.icon || "◆") + '</span>' +
          '<span class="dpg-nm">' + esc(it.name) + '</span>' +
          '<span class="dpg-sy">' + esc(it.symptom) + '</span>' +
          '<span class="dpg-st">' + (done ? "✓ 已识破" : "待识破") + '</span>' +
          '</button>');
      });
      H.push('</div>');

      H.push('<div class="dpg-detail" id="dpgDetail">');
      if (cur < 0) {
        H.push('<div class="dpg-empty">选一件展品。<b>八件展品对应本馆的八个失效侧面</b>——它们不是八个知识点，' +
          '是同一台仪器能做出的八种不同诊断。答对现场题，进度才往前走。</div>');
      } else {
        var it = items[cur];
        var q = it.quiz;
        var answered = !!s.quiz[it.id];
        H.push('<div class="dpg-dh"><span class="dpg-dno">' + it.no + '</span>' +
          '<span class="dpg-dnm">' + esc(it.name) + '</span>' +
          '<span class="dpg-dsy">' + esc(it.symptom) + '</span></div>');
        H.push('<div class="dpg-cols">');
        H.push('<div class="dpg-col"><h4>机制</h4><p>' + it.mech + '</p></div>');
        H.push('<div class="dpg-col"><h4>判据</h4><p>' + it.judge + '</p></div>');
        H.push('<div class="dpg-col"><h4>真实案例</h4><p>' + it.real + '</p></div>');
        H.push('</div>');
        if (it.verify) {
          H.push('<div class="dpg-verify"><button class="dpg-vb" data-v="' + cur + '">▶ 现场验证这件展品</button>' +
            '<span class="dpg-vr" id="dpgVr">点一下，用本馆内核当场跑一次对照。</span></div>');
        }
        if (q) {
          H.push('<div class="dpg-quiz"><div class="dpg-qt">现场题 · ' + esc(q.q) + '</div>');
          H.push('<div class="dpg-opts">');
          q.opts.forEach(function (o, k) {
            H.push('<button class="dpg-opt' + (answered && k === q.a ? " ok" : "") + '" data-o="' + k + '">' +
              String.fromCharCode(65 + k) + '　' + esc(o) + '</button>');
          });
          H.push('</div>');
          H.push('<div class="dpg-qr" id="dpgQr">' + (answered ? "✓ 已答对。这一件算识破。" : "") + '</div>');
          H.push('</div>');
        }
        H.push('</div>');
      }
      box.innerHTML = H.join("");
    }

    box.addEventListener("click", function (e) {
      var c = e.target.closest(".dpg-c");
      if (c) { cur = +c.dataset.i; markSeen(hall, items[cur].id); paint(); return; }
      var vb = e.target.closest(".dpg-vb");
      if (vb) {
        var it = items[+vb.dataset.v];
        var out = null;
        try { out = it.verify ? it.verify() : null; } catch (err) { out = { label: "验证失败", value: "—", note: String(err && err.message || err) }; }
        var vr = box.querySelector("#dpgVr");
        if (vr && out) {
          vr.innerHTML = '<b style="color:' + accent + '">' + esc(out.label) + '</b>　<span class="dpg-vv">' +
            esc(out.value) + '</span>' + (out.note ? '　<span class="dpg-vn">' + esc(out.note) + '</span>' : "");
        }
        return;
      }
      var o = e.target.closest(".dpg-opt");
      if (o) {
        var it2 = items[cur], k = +o.dataset.o, ok = (k === it2.quiz.a);
        var qr = box.querySelector("#dpgQr");
        var all = box.querySelectorAll(".dpg-opt");
        for (var i = 0; i < all.length; i++) all[i].classList.remove("ok", "no");
        o.classList.add(ok ? "ok" : "no");
        if (ok) {
          markQuiz(hall, it2.id, true);
          if (qr) qr.innerHTML = "✓ 正确。" + (it2.quiz.why ? " " + esc(it2.quiz.why) : "");
          var nm = box.querySelector('.dpg-c[data-i="' + cur + '"]');
          if (nm) { nm.classList.add("done"); nm.querySelector(".dpg-st").textContent = "✓ 已识破"; }
          var p = progress(hall);
          var t = box.querySelector(".dpg-t em");
          if (t) t.textContent = p.passed + " / " + p.total + " 已答对";
          var bar = box.querySelector(".dpg-bar i");
          if (bar) bar.style.width = p.pct + "%";
          var note = box.querySelector(".dpg-note");
          if (note) note.textContent = p.visitorReady ? "八件全通 · 可领参观证书" : "逐件点开，答对现场题才算看过";
          if (opt.onProgress) { try { opt.onProgress(p); } catch (e2) {} }
        } else {
          if (qr) qr.innerHTML = '<span style="color:#ff8f8f">再想想。' +
            (it2.quiz.hint ? " 提示：" + esc(it2.quiz.hint) : "") + '</span>';
        }
        return;
      }
    });

    paint();
    return { repaint: paint, progress: function () { return progress(hall); } };
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  /* ---------------- 证书面板（DOM） ---------------- */
  function mountCerts(box, hall, opt) {
    if (!box) return null;
    opt = opt || {};
    var accent = opt.accent || "#c9a227";
    var paper = opt.paper || "#0e1218";
    var ink = opt.ink || "#f2ece0";

    function paint() {
      var p = progress(hall);
      var v = getCert(hall, "visitor"), e2 = getCert(hall, "elite");
      var H = [];
      H.push('<div class="dpc-wrap">');

      H.push('<div class="dpc-card' + (v ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">一级</span><span class="dpc-n">参观证书</span></div>' +
        '<div class="dpc-d">看完八件展品并答对全部现场题即可领取。' +
        (v ? '' : '当前进度 ' + p.passed + ' / ' + p.total + '。') + '</div>' +
        '<div class="dpc-act">' +
        (v ? '<span class="dpc-no">' + esc(v.no) + '</span><button class="dpc-b" data-dl="visitor">下载</button>'
          : (p.visitorReady
            ? '<button class="dpc-b" data-get="visitor">领取参观证书</button>'
            : '<button class="dpc-b" data-get="visitor" disabled>还差 ' + (p.total - p.passed) + ' 件</button>')) +
        '</div></div>');

      H.push('<div class="dpc-card elite' + (e2 ? " has" : "") + '">' +
        '<div class="dpc-h"><span class="dpc-k">二级</span><span class="dpc-n">精英证书</span></div>' +
        '<div class="dpc-d">' + esc((opt.game && opt.game.brief) || "完成本馆的精英挑战。") + '</div>' +
        '<div class="dpc-act">' +
        (e2 ? '<span class="dpc-no">' + esc(e2.no) + '</span><button class="dpc-b" data-dl="elite">下载</button>'
          : '<button class="dpc-b" data-go="1">进入挑战 →</button>') +
        '</div></div>');

      H.push('</div>');
      box.innerHTML = H.join("");
    }

    box.addEventListener("click", function (e) {
      var g = e.target.closest("[data-get]");
      if (g && !g.disabled) {
        var c = issueCert(hall, g.dataset.get, { holder: opt.holder || "参观者" });
        paint();
        if (opt.onIssue) opt.onIssue(c);
        return;
      }
      var d = e.target.closest("[data-dl]");
      if (d) { var cert = getCert(hall, d.dataset.dl); if (cert) download(cert, { accent: accent, paper: paper, ink: ink }); return; }
      var go = e.target.closest("[data-go]");
      if (go && opt.gameHref) location.href = opt.gameHref;
    });

    paint();
    return { repaint: paint };
  }

  return {
    VERSION: VERSION,
    HALLS: HALLS,
    TIER: TIER,
    register: register,
    specOf: specOf,
    itemsOf: itemsOf,
    progress: progress,
    markSeen: markSeen,
    markQuiz: markQuiz,
    issueCert: issueCert,
    getCert: getCert,
    allCerts: allCerts,
    eliteCount: eliteCount,
    certSVG: certSVG,
    download: download,
    mountGallery: mountGallery,
    mountCerts: mountCerts,
    checksum: fnv
  };
});
</script>
<script>
/* ============================================================
   shared/yc-port.js — 驻馆人立绘引擎 · Portrait 2.0
   ------------------------------------------------------------
   为什么推翻重写
   ------------------------------------------------------------
   1.0 的画法是「一根根线」：五官全是半透明 stroke，没有面。
   放大看是线框图，缩到 52px 就糊成一团灰。十个人只能靠
   「圆脸 / 方脸」两个变量区分，谁都不像谁，也确实不好看。

   2.0 换成赛璐璐上色（cel-shading），五件事：

     一、统一光源。左上 45°，高光永远在左上，暗部永远在右下。
         一旦每个人的光向不一样，十张脸放在一起就会「贴纸感」。
     二、以色块为主、线为辅。色块缩小仍然可读，线缩小就消失。
     三、五官分层。眼睛七层、头发四层、皮肤三层，不是一笔画完。
     四、唯一 id 前缀。SVG 的渐变 / 滤镜 id 是全局的，十个立绘
         同页时必须隔离，否则所有人都会用第一个人的渐变 ——
         这是这类系统最容易踩、也最难查的坑。
     五、成人骨相。脸宽 96 / 脸长 152（1 : 1.58），眼距 = 一个眼宽，
         鼻底到嘴 20、嘴到下巴 26。娃娃脸是脸宽 ≈ 脸长、眼睛占半张脸，
         一眼就像玩具。这一版所有比例按成人头骨重算。

   坐标系 200×240（胸像）
   ------------------------------------------------------------
     发顶 16 / 发际 76 / 眉 96 / 眼 110 / 鼻尖 136
     嘴 156 / 下巴 182 / 颈 176-206 / 肩 206-240

   两种输出
   ------------------------------------------------------------
     bust   —— 完整胸像，全部图层，用在档案卡左栏（约 220×264）
     avatar —— 只取头部，跳过柔光滤镜与发丝高光，用在 26—84px 的小头像

   ============================================================ */
(function () {
  "use strict";

  var N = 0;
  function uid() { return "yp" + (++N).toString(36); }
  function n(v) { return Math.round(v * 100) / 100; }

  /* 两个十六进制色按比例混。用来把配置里给的「发丝高光色」
     往发色里压回去一点 —— 原样拿去铺渐变的亮端，
     在 300px 的胸像上会横出一道浅色斜带，看着像秃了一块。 */

    function p(h) { h = h.replace("#", ""); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }

    a: { base: "#e3a97f", lit: "#fbd4b2", sh: "#b87a5a", deep: "#8a4c36", line: "#63352a", blush: "#cd6652", lip: "#b25c49", lipd: "#873d30" },
    b: { base: "#d69a72", lit: "#f0c49c", sh: "#ac7049", deep: "#81472f", line: "#5a3226", blush: "#bd5c49", lip: "#a85544", lipd: "#7c382b" },
    c: { base: "#ecc09a", lit: "#ffdfc4", sh: "#c58f6a", deep: "#975c42", line: "#6d3f2e", blush: "#d47b61", lip: "#bd6750", lipd: "#904638" },
    d: { base: "#ca9470", lit: "#ecc09d", sh: "#a16b48", deep: "#77432d", line: "#532d21", blush: "#b9604d", lip: "#a3523e", lipd: "#763627" },
    e: { base: "#dfa57c", lit: "#f6ceaa", sh: "#b57756", deep: "#874a34", line: "#613426", blush: "#c96450", lip: "#af5945", lipd: "#833b2d" }

    /* 鹅蛋：颧骨最宽，下颌收得干净 */
    oval:   "M100 30C124 30 148 52 148 88C148 108 146 128 141 146C135 166 120 182 100 182C80 182 65 166 59 146C54 128 52 108 52 88C52 52 76 30 100 30Z",
    /* 方脸：下颌角外扩，下巴平 */
    square: "M100 30C126 30 150 52 150 88C150 110 149 132 146 150C142 170 124 182 100 182C76 182 58 170 54 150C51 132 50 110 50 88C50 52 74 30 100 30Z",
    /* 长脸：整体上移下延，中庭长 */
    long:   "M100 24C122 24 144 48 144 86C144 112 141 138 135 158C129 180 116 194 100 194C84 194 71 180 65 158C59 138 56 112 56 86C56 48 78 24 100 24Z",
    /* 圆脸：颊部外扩，下巴圆 */
    round:  "M100 32C130 32 152 58 152 94C152 118 145 140 132 158C121 174 111 182 100 182C89 182 79 174 68 158C55 140 48 118 48 94C48 58 70 32 100 32Z",
    /* 瘦削：颧骨突出，颊部内收，下巴尖 */
    sharp:  "M100 28C120 28 140 52 140 88C140 112 136 136 129 156C122 176 112 188 100 188C88 188 78 176 71 156C64 136 60 112 60 88C60 52 80 28 100 28Z"
  };

  /* ---------------- 眼型轮廓 ----------------
     外眼角比内眼角高 —— 这是「眼睛有神」的唯一来源。
     两点等高就变成死鱼眼。 */
  function eyePath(cx, out, w, cy, h) {
    function p(sx, sy) { return n(cx + out * w * sx) + " " + n(cy + h * sy); }
    return "M" + p(1, -0.28) +
      "C" + p(0.72, -1.14) + " " + p(0.26, -1.3) + " " + p(0, -1.14) +
      "C" + p(-0.26, -1.3) + " " + p(-0.74, -0.92) + " " + p(-1, 0.3) +
      "C" + p(-0.74, 1.0) + " " + p(-0.26, 1.22) + " " + p(0, 1.16) +
      "C" + p(0.26, 1.22) + " " + p(0.74, 0.9) + " " + p(1, -0.28) + "Z";
  }

  /* ============================================================
     单个部件
     ============================================================ */

  /* --- 眉 ---
     不画成等宽的黑条。真眉毛是「外端细、内端粗、上缘拱、下缘平」的
     一块面。用 stroke 画永远是马克笔，用填充面才像眉毛。
     mood 改三件事：整体抬降、内端升降、眉峰高低。
     down 时内端往下压才叫「皱眉」；只把整条眉往下挪是「失望」。 */
  function brow(m, k, hc, cx, cy, w, thick, o) {
    o = o || {};
    var out = o.out, arch = o.arch == null ? 4.2 : o.arch;
    var lift = m === "up" ? -2.2 : (m === "down" ? 1.0 : 0);
    var innerDy = m === "down" ? 4.0 : (m === "up" ? -1.2 : 0);
    var outerDy = m === "up" ? -2.4 : (m === "down" ? -0.4 : 0);
    var W = w / 2;
    var x0 = cx + out * W;            /* 外端：细 */
    var x1 = cx - out * W;            /* 内端：粗 */
    var y0 = cy + outerDy + lift;
    var y1 = cy + innerDy + lift;
    var t0 = thick * 0.4, t1 = thick;
    var mx = (x0 + x1) / 2, my = cy - arch + lift;

    var d = "M" + n(x0) + " " + n(y0 - t0) +

      "L" + n(x1) + " " + n(y1 + t1 * 0.5) +
      "Q" + n(mx) + " " + n(my + t1 * 0.56) + " " + n(x0) + " " + n(y0 + t0) + "Z";

  function eye(u, m, k, ir, cx, cy, w, h, o) {
    o = o || {};
    var out = o.out, detail = o.detail || 2;
    var p = eyePath(cx, out, w, cy, h);
    var s = "";

    if (detail >= 2) {
      s += '<ellipse cx="' + n(cx) + '" cy="' + n(cy - h * 0.6) + '" rx="' + n(w * 1.16) +
        '" ry="' + n(h * 1.2) + '" fill="' + k.deep + '" opacity=".14" filter="url(#' + u + 'sf2)"/>';

      /* 虹膜半径要够大。偏小的时候上下都留一圈白，

      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) + '" fill="' + (o.irisFill || ("url(#" + u + "ir)")) + '"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.64) +
        '" fill="none" stroke="' + ir.deep + '" stroke-width="1.1" stroke-opacity=".75"/>' +
      '<circle cx="' + n(cx) + '" cy="' + n(cy + h * 0.04) + '" r="' + n(w * 0.29) + '" fill="#100906"/>' +
      '<circle cx="' + n(cx - w * 0.22) + '" cy="' + n(cy - h * 0.42) + '" r="' + n(w * 0.17) + '" fill="#fff" opacity=".95"/>' +

            n(cx) + " " + n(lidY - h * 0.08) +
      "C" + n(cx - out * w * 0.24) + " " + n(lidY - h * 0.26) + " " +
            n(cx - out * w * 0.68) + " " + n(cy - h * 0.8) + " " +
            n(cx - out * w) + " " + n(cy + h * 0.32) +

  /* --- 鼻 ---
     不画轮廓线。鼻子靠四块明暗立起来：
     鼻梁高光（左）、鼻侧暗面（右）、鼻头高光、鼻底投影。

    s += '<ellipse cx="' + n(cx - 7.4) + '" cy="' + n(cy + 1.4) + '" rx="2.6" ry="1.7" fill="' +

  /* --- 嘴 ---
     上唇暗、下唇亮、中间一条缝。笑是「嘴角抬、缝中段下沉」，

            n(cx - hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +
      "C" + n(cx - hw * 0.05) + " " + n(cy + cdy - 1.4) + " " +
            n(cx + hw * 0.05) + " " + n(cy + cdy - 1.4) + " " +
            n(cx + hw * 0.12) + " " + n(cy + cdy - 2.4 * th) +
      "C" + n(cx + hw * 0.3) + " " + n(cy + cdy - 4.6 * th) + " " +

            R + " " + y0 +

      "Q" + n(cx) + " " + y1 + " " + R + " " + y0 +

            n(cx) + " " + n(cy + cdy + 6.6 * th) +

    if (m === "up") {

        "Q" + n(cx) + " " + n(cy + cdy + 2.4) + " " + L + " " + y0 +

  /* --- 颈 ---
     下巴 182、肩 206，颈长 24。颈太短会「头直接架在肩上」，

      s += '<path d="M88 198C90 205 93 210 95 214" stroke="' + k.deep + '" stroke-width="2" fill="none" opacity=".13"/>';
      s += '<path d="M112 198C110 205 107 210 105 214" stroke="' + k.deep + '" stroke-width="2" fill="none" opacity=".13"/>';

  /* --- 衣 ---
     三种领型，够撑起十个人的身份差：
       shirt 衬衫 + 领带（证物官、指标员）

    var ac = c.accent || cfg.accent || "#46d3e8";
    var type = c.type || "shirt";
    var s = "";

    /* 衣身：肩宽 200，是头宽的 2 倍。窄了就像小孩穿大人衣服 */

      /* 衬衫：V 领 + 两片翻领 + 领带。

         人物反而看不见了。压到 #d9d3c9、九成不透明就够。 */
      s += '<path d="M87 194L100 222L113 194L128 201L100 240H72L72 201Z" fill="#d9d3c9" opacity=".9"/>';
      s += '<path d="M87 194L100 222L113 194L104 191L100 197L96 191Z" fill="' + k.deep + '" opacity=".34"/>';
      s += '<path d="M100 198L93.5 207L100 213.5L106.5 207Z" fill="' + ac + '" opacity=".95"/>';
      s += '<path d="M100 213.5L94 231L100 240L106 231Z" fill="' + ac + '" opacity=".78"/>';
      if (detail >= 2) {

        s += '<path d="M113 194L124 207L127 240" stroke="' + dp + '" stroke-width="1.5" fill="none" opacity=".55"/>';
        s += '<path d="M100 222V240" stroke="' + k.deep + '" stroke-width="1.2" opacity=".18"/>';

      s += '<path d="M100 196L128 189L152 215L124 240H100Z" fill="' + hi + '"/>';
      s += '<path d="M100 196L72 189L56 216L100 240Z" fill="' + dp + '" opacity=".5"/>';

  /* --- 发 ---

  /* --- 发缕 ---

     所以起笔点必须落在发块内部（被发块盖住），只有收尖的末梢露出来。

            n(x1 - w * 0.16) + " " + n(y1 - dy * 0.14) + " " + n(x1) + " " + n(y1) +
      "C" + n(x1 + w * 0.34) + " " + n(y1 - dy * 0.26) + " " +
            n(x0 + w + (x1 - x0) * 0.1) + " " + n(y0 + dy * 0.56) + " " +
            n(x0 + w) + " " + n(y0) + "Z";

  /* ============================================================
     总装
     ============================================================ */
  function figure(cfg, mood, detail) {
    detail = detail || 2;
    mood = mood || "calm";
    var u = uid();
    var k = SKIN[cfg.skin || "a"];
    var ir = cfg.iris || { lit: "#8a6038", base: "#5a3a24", deep: "#2a1a10" };
    var h = cfg.hair || {};
    var hc = h.color || "#241b14", hd = h.deep || "#0d0906", hl = h.light || "#4c3826";
    var ac = cfg.accent || "#46d3e8";

    var ey = (cfg.eye && cfg.eye.cy) || 110;
    var ex = (cfg.eye && cfg.eye.gap) || 26;
    var erx = (cfg.eye && cfg.eye.rx) || 13;
    var ery = (cfg.eye && cfg.eye.ry) || 5.8;

       那层里渐变填充会整块丢，脸直接变成一团黑。

    var solid = detail < 2;

    var defs = "";
    defs += '<linearGradient id="' + u + 'sk" gradientUnits="userSpaceOnUse" x1="52" y1="34" x2="156" y2="188">' +
      '<stop offset="0" stop-color="' + k.lit + '"/><stop offset=".44" stop-color="' + k.base + '"/>' +
      '<stop offset="1" stop-color="' + k.sh + '"/></linearGradient>';
    defs += '<linearGradient id="' + u + 'hk" gradientUnits="userSpaceOnUse" x1="44" y1="14" x2="150" y2="170">' +

    defs += '<linearGradient id="' + u + 'cl" gradientUnits="userSpaceOnUse" x1="30" y1="192" x2="180" y2="240">' +
      '<stop offset="0" stop-color="' + clhi + '"/><stop offset="1" stop-color="' + cldp + '"/></linearGradient>';
    defs += '<radialGradient id="' + u + 'ir" cx=".4" cy=".34" r=".66">' +
      '<stop offset="0" stop-color="' + ir.lit + '"/><stop offset=".5" stop-color="' + ir.base + '"/>' +
      '<stop offset="1" stop-color="' + ir.deep + '"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bl" cx=".5" cy=".5" r=".5">' +
      '<stop offset="0" stop-color="' + k.blush + '" stop-opacity=".34"/>' +
      '<stop offset="1" stop-color="' + k.blush + '" stop-opacity="0"/></radialGradient>';
    defs += '<radialGradient id="' + u + 'bg" cx=".5" cy=".36" r=".72">' +
      '<stop offset="0" stop-color="' + ac + '" stop-opacity=".2"/>' +
      '<stop offset=".6" stop-color="' + ac + '" stop-opacity=".05"/>' +
      '<stop offset="1" stop-color="' + ac + '" stop-opacity="0"/></radialGradient>';
    if (detail >= 2) {
      defs += '<filter id="' + u + 'sf" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="4"/></filter>';
      defs += '<filter id="' + u + 'sf2" x="-45%" y="-45%" width="190%" height="190%">' +
        '<feGaussianBlur stdDeviation="2.2"/></filter>';

    defs += '<clipPath id="' + u + 'fc"><path d="' + f + '"/></clipPath>';
    defs += '<clipPath id="' + u + 'el"><path d="' + eyePath(100 - ex, -1, erx, ey, ery) + '"/></clipPath>';
    defs += '<clipPath id="' + u + 'er"><path d="' + eyePath(100 + ex, 1, erx, ey, ery) + '"/></clipPath>';

    var s = "";

    /* 背景辉光交给 CSS 的 .cstc-por::before 做。

    /* 后发：先于脸，形成「头发包住头」的外轮廓 */
    s += hairShape(u, h.back, hd, detail, false, F_HK);

    s += neck(u, k, detail, F_SK);
    /* 衣身整体下移 12：下巴在 182，肩线原来在 196，只剩 14px 脖子 ——
       头看着像直接搁在肩上。挪到 208 之后露出 26px，
       这是「有脖子的人」和「贴纸人」的分界。 */
