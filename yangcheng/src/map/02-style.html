<style>
/* ===== 杨城地图：俯瞰城市 ===== */
html,body{height:100%;overflow:hidden}
body{
  background:#e8efe2;color:#16324a;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.mapshell{
  position:fixed;inset:0;display:grid;
  grid-template-rows:58px 1fr;
  grid-template-columns:266px 1fr;
  grid-template-areas:"top top" "side main";
}

/* ---------- 顶栏 ---------- */
.maptop{
  grid-area:top;display:flex;align-items:center;gap:20px;padding:0 20px;
  background:rgba(255,255,255,.90);
  border-bottom:1px solid rgba(22,50,74,.10);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:30;
}
.mt-brand{display:flex;align-items:baseline;gap:9px}
.mt-brand b{font-size:17px;font-weight:800;letter-spacing:4px;color:#0f2a40}
.mt-brand i{
  font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(22,50,74,.48);
}
.mt-sep{width:1px;height:22px;background:rgba(22,50,74,.14)}
.mt-title{font-size:11.5px;letter-spacing:1.4px;color:rgba(22,50,74,.66);font-weight:600}
.mt-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.mt-right a,.mt-right button{
  font-family:inherit;font-size:11.5px;letter-spacing:.6px;cursor:pointer;
  padding:7px 13px;border-radius:8px;text-decoration:none;
  color:#1b3f5c;border:1px solid rgba(22,50,74,.16);
  background:rgba(255,255,255,.6);transition:.2s;
}
.mt-right a:hover,.mt-right button:hover{
  background:#16324a;color:#fff;border-color:#16324a;
}
#mapClock{
  font-family:var(--mono);font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;color:#1b3f5c;
  padding:5px 10px;border-radius:7px;background:rgba(22,50,74,.06);
}

/* ---------- 左栏 ---------- */
.mapside{
  grid-area:side;overflow-y:auto;padding:14px 13px 20px;
  background:rgba(255,255,255,.80);
  border-right:1px solid rgba(22,50,74,.09);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  z-index:20;
}
.ms-h{
  font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(22,50,74,.42);margin:4px 0 9px 2px;
}
.ms-h:not(:first-child){margin-top:18px}

/* 今日值守（侧栏） */
.duty-s{
  display:flex;align-items:center;gap:7px;padding:5px 2px;border-radius:7px;
  text-decoration:none;color:inherit;transition:.16s;
}
.duty-s:hover{background:rgba(22,50,74,.05)}
.duty-s .dn{min-width:0;flex:1}
.duty-s .dn b{display:block;font-size:11px;font-weight:700;color:rgba(16,38,58,.92);letter-spacing:.2px}
.duty-s .dn i{
  display:block;font-style:normal;font-size:8px;font-family:var(--mono);
  color:rgba(22,50,74,.48);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.duty-s .db{flex:none;font-family:var(--mono);font-size:8px;color:rgba(22,50,74,.42)}
.duty-s .db.hot{color:#a8761c;font-weight:700}
.duty-n{
  font-size:8.5px;font-family:var(--mono);color:rgba(22,50,74,.45);
  line-height:1.7;margin-top:6px;
}
.duty-n b{color:rgba(16,38,58,.85)}

.hitem{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  padding:9px 10px;margin-bottom:6px;border-radius:9px;
  border:1px solid rgba(22,50,74,.10);background:rgba(255,255,255,.7);
  transition:.2s;position:relative;overflow:hidden;
}
.hitem::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac);
}
.hitem:hover{border-color:var(--ac);background:#fff;transform:translateX(2px)}
.hitem .hi-no{
  font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ac);
  letter-spacing:1px;
}
.hitem .hi-nm{font-size:13.5px;font-weight:700;color:#12293c;margin:2px 0 3px;letter-spacing:.5px}
.hitem .hi-q{font-size:10.5px;line-height:1.5;color:rgba(22,50,74,.56)}
.hitem .hi-st{
  display:inline-block;margin-top:5px;font-family:var(--mono);
  font-size:8px;letter-spacing:.8px;padding:1.5px 6px;border-radius:4px;
}
.hitem.ready .hi-st{background:rgba(20,150,110,.13);color:#0f7d5c}
.hitem.build .hi-st{background:rgba(22,50,74,.08);color:rgba(22,50,74,.5)}

/* 精英挑战：馆内的二级入口，必须一眼能看出「还有第二层」 */
.hitem .hi-annex{
  display:block;margin-top:6px;padding:4px 7px;border-radius:5px;
  font-size:9.5px;line-height:1.45;text-decoration:none;
  color:#8a5a12;background:rgba(201,162,39,.13);
  border:1px dashed rgba(201,162,39,.42);
  transition:background .16s,border-color .16s,color .16s;
}
.hitem .hi-annex:hover{background:rgba(201,162,39,.24);border-color:#c9a227;color:#6d4609}
.tipcard .tc-annex{
  margin-top:7px;padding-top:6px;border-top:1px dashed rgba(201,162,39,.34);
  font-size:10px;line-height:1.5;color:#e8c86a;
}
.hitem.build{opacity:.86}
.hitem.build::before{opacity:.42}

.sideNote{
  font-size:10px;line-height:1.8;color:rgba(22,50,74,.52);
  padding:9px 10px;border-radius:8px;background:rgba(22,50,74,.045);
  margin-top:6px;
}
.sideNote b{color:#12293c}

/* 行程表：图上距离换算成真实路程 */
#routeLegs{margin-top:7px;display:flex;flex-direction:column;gap:1px}
.legrow{
  display:grid;grid-template-columns:7px 40px 1fr auto;align-items:center;gap:6px;
  font-size:10px;padding:4px 6px;border-radius:6px;color:rgba(22,50,74,.62);
}
.legrow:nth-child(odd){background:rgba(22,50,74,.035)}
.legrow.ride{background:rgba(184,144,78,.13);color:#7c5c22}
.lg-dot{width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.lg-nm{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.4px;color:rgba(22,50,74,.8)}
.legrow.ride .lg-nm{color:#7c5c22}
.lg-km{font-family:ui-monospace,monospace;color:rgba(22,50,74,.42);font-size:9.5px}
.lg-tm{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 地图区 ---------- */
.mapmain{grid-area:main;position:relative;overflow:hidden;background:#dbe8cf}
#mapSvg{width:100%;height:100%;display:block;touch-action:none}
#mapSvg.grabbing{cursor:grabbing}
.mapmain{cursor:grab}

/* 缩放控件 */
.zoomctl{
  position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:1px;
  border-radius:9px;overflow:hidden;box-shadow:0 8px 22px -8px rgba(15,42,64,.4);
  z-index:12;
}
.zoomctl button{
  width:34px;height:32px;border:0;cursor:pointer;font-size:15px;font-weight:700;
  background:rgba(255,255,255,.94);color:#1b3f5c;font-family:var(--mono);
  transition:.16s;
}
.zoomctl button:hover{background:#16324a;color:#fff}

/* 图例 */
.legend2{
  position:absolute;left:16px;bottom:16px;z-index:12;
  padding:10px 12px;border-radius:10px;
  background:rgba(255,255,255,.93);
  box-shadow:0 10px 26px -10px rgba(15,42,64,.4);
  font-size:10px;line-height:1.9;color:#1b3f5c;
}
.legend2 .lg-t{
  font-family:var(--mono);font-size:8px;letter-spacing:1.6px;
  color:rgba(22,50,74,.45);margin-bottom:5px;
}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.legend2 i.dash{background:none;border:1.5px dashed #7b93a5}
.legend2 i.solid{background:#1a9fc0}

/* 指北针 */
.compass2{
  position:absolute;right:18px;bottom:18px;z-index:12;
  width:52px;height:52px;opacity:.55;
}

/* ---------- 悬浮信息卡 ---------- */
.tipcard{
  position:fixed;z-index:60;pointer-events:none;
  min-width:186px;max-width:250px;padding:11px 13px;border-radius:10px;
  background:rgba(11,28,44,.96);color:#eaf4ff;
  box-shadow:0 18px 44px -14px rgba(0,10,20,.7);
  opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;
  border:1px solid rgba(140,200,255,.24);
}
.tipcard.on{opacity:1;transform:translateY(0)}
.tipcard .tc-no{
  font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;
  color:rgba(150,210,255,.8);
}
.tipcard .tc-nm{font-size:13.5px;font-weight:800;letter-spacing:1px;margin:3px 0 5px}
.tipcard .tc-q{font-size:10.5px;line-height:1.6;color:rgba(200,224,246,.82)}
.tipcard .tc-st{
  margin-top:7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;
  padding:2px 7px;border-radius:4px;display:inline-block;
}
.tipcard.ready .tc-st{background:rgba(70,211,232,.18);color:#8fe9ff}
.tipcard.build .tc-st{background:rgba(255,255,255,.10);color:rgba(220,236,250,.66)}

/* ---------- 筹建说明弹层 ---------- */
.bmodal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(8,20,32,.5);backdrop-filter:blur(4px);
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.bm-card{
  width:min(480px,90vw);padding:24px 26px;border-radius:16px;
  background:#fff;box-shadow:0 40px 90px -30px rgba(10,30,50,.6);
  animation:popIn .26s cubic-bezier(.3,1.4,.5,1);
}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.bm-card h3{font-size:18px;font-weight:800;letter-spacing:1.5px;margin-bottom:4px;color:#0f2a40}
.bm-card .bm-q{font-size:12px;color:rgba(22,50,74,.6);margin-bottom:16px}
.bm-card .bm-row{
  display:grid;grid-template-columns:58px 1fr;gap:8px 12px;
  font-size:11.5px;line-height:1.75;margin-bottom:14px;
}
.bm-card .bm-row dt{
  font-family:var(--mono);font-size:9px;letter-spacing:1px;
  color:rgba(22,50,74,.42);padding-top:3px;
}
.bm-card .bm-row dd{color:#1b3f5c}
.bm-card .bm-cannot{
  font-size:10.5px;line-height:1.75;color:#8a4a2a;
  padding:9px 11px;border-radius:8px;background:rgba(200,120,40,.09);
  border-left:2px solid rgba(200,120,40,.5);margin-bottom:16px;
}
.bm-card .bm-close{
  width:100%;padding:10px;border-radius:9px;border:0;cursor:pointer;
  background:#16324a;color:#fff;font-family:inherit;font-size:12.5px;
  letter-spacing:2px;font-weight:600;transition:.2s;
}
.bm-card .bm-close:hover{background:#1f4a6b}

/* ---------- 窄屏 ---------- */
@media (max-width:860px){
  .mapshell{grid-template-columns:1fr;grid-template-areas:"top" "main"}
  .mapside{display:none}
  .maptop{gap:10px;padding:0 12px}
  .mt-brand b{font-size:15px;letter-spacing:2px}
  .mt-brand i,.mt-sep,.mt-title{display:none}
  .mt-right a{padding:6px 10px;font-size:10.5px}
  #mapClock{font-size:11px;padding:4px 7px}
  .legend2{font-size:9px;padding:8px 10px}
  .legend2 .lg-t{display:none}
}
</style>
