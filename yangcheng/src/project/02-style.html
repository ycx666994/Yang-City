<style>
/* ============================================================
   城市公告 · 项目详情页
   ------------------------------------------------------------
   底色沿用二维总图的米纸（--cm-paper 同族），但这里是「档案」
   而不是「地图」：纸更白一格，字更黑一格，靠细线和留白分层，
   不用投影和大圆角。项目名走宋体——公告是一份要归档的东西。
   ============================================================ */
:root{
  --pj-paper:#eff1e7; --pj-card:#fdfdf8; --pj-slab:#e6e9dd;
  --pj-ink:#232c27; --pj-ink2:#4a554d; --pj-muted:#6d7a70; --pj-faint:#8d998f;
  --pj-line:#d2d8c9; --pj-line2:#e0e4d7;
  --pj-ac:#3f5f4a; --pj-tone:#5b8ea8; --pj-warm:#b0813f;
  --pj-serif:"Songti SC","SimSun","Noto Serif SC",Georgia,serif;
  --pj-sans:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  --pj-mono:"Cascadia Code","Consolas","SF Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pj-paper);color:var(--pj-ink);font-family:var(--pj-sans);
  -webkit-font-smoothing:antialiased}

/* 极淡的经纬网格：只做质感，不抢内容 */
.pj-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--pj-line2) 1px,transparent 1px),
    linear-gradient(90deg,var(--pj-line2) 1px,transparent 1px);
  background-size:88px 88px;opacity:.42;
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 72%);
          mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 72%)}

/* ---------- 顶栏 ---------- */
.pj-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:22px;
  padding:0 32px;height:56px;background:rgba(239,241,231,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--pj-line)}
.pj-brand{display:flex;align-items:baseline;gap:9px;text-decoration:none;color:var(--pj-ink)}
.pj-brand b{font-family:var(--pj-serif);font-size:19px;font-weight:500;letter-spacing:.1em}
.pj-brand i{font-style:normal;font-family:var(--pj-mono);font-size:10.5px;
  letter-spacing:.18em;color:var(--pj-faint)}
.pj-nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.pj-nav a{position:relative;padding:7px 13px;font-size:13px;color:var(--pj-ink2);
  text-decoration:none;border-radius:4px;transition:background .18s,color .18s}
.pj-nav a:hover{background:var(--pj-slab);color:var(--pj-ink)}
.pj-nav a[aria-current="page"]{color:var(--pj-ac);font-weight:500}
.pj-nav a[aria-current="page"]::after{content:"";position:absolute;left:13px;right:13px;
  bottom:1px;height:1.5px;background:var(--pj-ac)}

/* ---------- 版面 ---------- */
.pj-wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 32px 90px}

.pj-crumb{display:flex;align-items:center;gap:10px;padding:26px 0 0;
  font-family:var(--pj-mono);font-size:11.5px;color:var(--pj-faint);letter-spacing:.04em}
.pj-crumb a{color:var(--pj-muted);text-decoration:none;border-bottom:1px solid transparent;
  padding-bottom:1px}
.pj-crumb a:hover{color:var(--pj-ac);border-bottom-color:var(--pj-ac)}
.pj-crumb span{color:#c2c8b9}
.pj-crumb em{font-style:normal;color:var(--pj-tone);font-weight:500}

/* ---------- 主视觉 ---------- */
.pj-hero{display:grid;grid-template-columns:minmax(0,1fr) 254px;gap:56px;
  padding:34px 0 44px;border-bottom:1px solid var(--pj-line)}
.pj-kind{display:flex;align-items:center;gap:9px;font-family:var(--pj-mono);
  font-size:11px;letter-spacing:.13em;color:var(--pj-faint);text-transform:uppercase}
.pj-kind b{color:var(--pj-tone);font-weight:500}
.pj-kind i{width:16px;height:1px;background:currentColor;opacity:.5}
.pj-hero h1{font-family:var(--pj-serif);font-size:52px;line-height:1.12;font-weight:500;
  letter-spacing:.03em;margin:16px 0 6px}
.pj-sub{font-family:var(--pj-mono);font-size:12px;letter-spacing:.22em;
  color:var(--pj-faint);margin-bottom:22px}
.pj-lead{font-size:16.5px;line-height:1.85;color:var(--pj-ink2);margin:0;max-width:38em;
  text-wrap:pretty}
.pj-lead b{font-weight:500;color:var(--pj-ink);
  background:linear-gradient(transparent 62%,rgba(176,129,63,.26) 62%)}

.pj-act{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.pj-btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 24px;
  font-size:14px;font-weight:500;letter-spacing:.02em;text-decoration:none;border-radius:5px;
  border:1px solid transparent;transition:transform .16s,background .18s,border-color .18s,color .18s}
.pj-btn:active{transform:translateY(1px)}
.pj-btn.primary{background:var(--pj-ink);color:#f6f7f0}
.pj-btn.primary:hover{background:#101713}
.pj-btn.primary svg{transition:transform .18s}
.pj-btn.primary:hover svg{transform:translateX(3px)}
.pj-btn.ghost{background:transparent;color:var(--pj-ink);border-color:#c3cabc}
.pj-btn.ghost:hover{background:var(--pj-card);border-color:var(--pj-ink2)}
.pj-btn[aria-disabled="true"]{background:var(--pj-slab);color:var(--pj-faint);
  cursor:not-allowed;pointer-events:none;border-color:var(--pj-line)}
.pj-act-note{flex-basis:100%;font-size:12px;color:var(--pj-faint);margin-top:2px;
  display:flex;align-items:center;gap:7px}
.pj-dot{width:6px;height:6px;border-radius:50%;background:#4f8f5e;flex:none}
.pj-dot.off{background:#b0803f}

/* 右栏：档案栏 */
.pj-side{border-left:1px solid var(--pj-line);padding-left:26px}
.pj-side h2{font-family:var(--pj-mono);font-size:10.5px;font-weight:400;letter-spacing:.16em;
  color:var(--pj-faint);margin:0 0 14px;text-transform:uppercase}
.pj-dl{margin:0}
.pj-dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px dotted #d8ddcf}
.pj-dl>div:last-child{border-bottom:0}
.pj-dl dt{font-size:12px;color:var(--pj-muted);flex:none}
.pj-dl dd{margin:0;font-size:12.5px;color:var(--pj-ink);text-align:right;font-weight:500}
.pj-dl dd a{color:var(--pj-tone);text-decoration:none;border-bottom:1px solid rgba(91,142,168,.4)}
.pj-dl dd a:hover{border-bottom-color:var(--pj-tone)}
.pj-st{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.pj-st.live{color:#3d7d4f}
.pj-st.arch{color:#96702f}

/* ---------- 指标条 ---------- */
.pj-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin:0 0 54px;
  background:var(--pj-line);border:1px solid var(--pj-line)}
.pj-metrics div{background:var(--pj-card);padding:18px 16px}
.pj-metrics b{display:block;font-family:var(--pj-serif);font-size:24px;font-weight:500;
  line-height:1.1;margin-bottom:5px;letter-spacing:.02em}
.pj-metrics span{font-size:11.5px;color:var(--pj-muted);letter-spacing:.03em}

/* ---------- 正文 ---------- */
.pj-body{max-width:706px}
.pj-sec{position:relative;padding:0 0 42px 58px}
.pj-sec::before{content:attr(data-n);position:absolute;left:0;top:3px;
  font-family:var(--pj-mono);font-size:12px;color:var(--pj-faint);letter-spacing:.06em}
.pj-sec::after{content:"";position:absolute;left:14px;top:22px;bottom:8px;width:1px;
  background:linear-gradient(var(--pj-line),transparent)}
.pj-sec:last-child::after{display:none}
.pj-sec h3{font-family:var(--pj-serif);font-size:21px;font-weight:500;letter-spacing:.02em;
  margin:0 0 14px}
.pj-sec p{margin:0 0 14px;font-size:14.5px;line-height:2.02;color:#3d4741;text-wrap:pretty}
.pj-sec p:last-child{margin-bottom:0}

.pj-tags{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0}
.pj-tags span{font-family:var(--pj-mono);font-size:11px;letter-spacing:.06em;
  color:var(--pj-muted);border:1px solid var(--pj-line);background:var(--pj-card);
  padding:4px 10px;border-radius:3px}

/* ---------- 上下条 ---------- */
.pj-more{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:24px;
  border-top:1px solid var(--pj-line);background:var(--pj-line)}
.pj-more a{background:var(--pj-card);padding:22px 24px;text-decoration:none;color:inherit;
  transition:background .18s}
.pj-more a:hover{background:#f6f7ee}
.pj-more .k{font-family:var(--pj-mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--pj-faint);display:block;margin-bottom:7px}
.pj-more b{font-size:14px;font-weight:500}
.pj-more small{display:block;font-size:11.5px;color:var(--pj-muted);margin-top:5px}
.pj-more .nx{text-align:right}

/* ---------- 页脚 ---------- */
.pj-foot{border-top:1px solid var(--pj-line);padding:26px 32px;display:flex;
  justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:11.5px;
  color:var(--pj-faint);font-family:var(--pj-mono);letter-spacing:.04em}

/* 未找到 */
.pj-none{max-width:560px;margin:120px auto;text-align:center}
.pj-none h1{font-family:var(--pj-serif);font-size:30px;font-weight:500;margin:0 0 14px}
.pj-none p{color:var(--pj-muted);font-size:14px;line-height:1.9}

@media (max-width:860px){
  .pj-wrap{padding:0 20px 64px}
  .pj-top{padding:0 18px;gap:10px;height:auto;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
  .pj-nav{margin-left:0;width:100%;overflow-x:auto}
  .pj-nav a{padding:6px 10px;white-space:nowrap}
  .pj-hero{grid-template-columns:1fr;gap:32px;padding:26px 0 34px}
  .pj-hero h1{font-size:38px}
  .pj-side{border-left:0;border-top:1px solid var(--pj-line);padding-left:0;padding-top:20px}
  .pj-sec{padding-left:40px}
  .pj-sec::after{left:9px}
  .pj-more{grid-template-columns:1fr}
  .pj-more .nx{text-align:left}
  .pj-foot{padding:22px 20px}
}
@media (max-width:520px){
  .pj-metrics{grid-template-columns:1fr}
  .pj-btn{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
