<style>
/* ==========================================================================
   H3 指标塔 · 3D 迷宫
   深色仪表盘皮，与 H3 同源（--h3 电蓝）。类名统一 mz- 前缀。
   ========================================================================== */
:root{
  --mz-bg:#070b14;
  --mz-panel:#0c1220;
  --mz-line:#1b2740;
  --mz-line2:#24344f;
  --mz-tx:#dce8fb;
  --mz-tx2:#93a7c4;
  --mz-tx3:#64748b;
  --mz-ac:#4ea3ff;
  --mz-ac2:#7cc4ff;
  --mz-warn:#ffb03a;
  --mz-bad:#ff5e6c;
  --mz-good:#3ecf8e;
  --mz-mono:ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
/* 覆盖 yc-core.css 的固定视口（body{overflow:hidden} 会传播到视口，滚轮全废）。
   本页内容 931px > 视口 900px，底部「回馆」一行会被切掉且够不着。
   改完在 1440×900 下不出现滚动条（871 < 900），视口更矮时才靠滚动兜底。
   判据同 h2-case：必须用真实 mouseWheel 事件验证，scrollTo 测不出这个 bug。 */
html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{
  height:auto;
  min-height:100vh;
  overflow:visible;
  background:radial-gradient(900px 500px at 50% -10%,#0e1930,transparent 65%),var(--mz-bg);
  color:var(--mz-tx);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}

.mzwrap{max-width:1180px;margin:0 auto;padding:0 16px 8px;position:relative;z-index:1}

/* ---------------- 顶栏 ---------------- */
.mzbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 11px;
  border-bottom:1px solid var(--mz-line)}
.mzbar .bk{text-decoration:none;color:var(--mz-tx2);font-size:11.5px;
  border:1px solid var(--mz-line2);border-radius:5px;padding:5px 10px;transition:.15s}
.mzbar .bk:hover{color:var(--mz-ac);border-color:var(--mz-ac);background:rgba(78,163,255,.08)}
.mzttl b{font-size:17px;letter-spacing:.6px;display:block;line-height:1.2}
.mzttl span{font-family:var(--mz-mono);font-size:9px;letter-spacing:1.8px;color:var(--mz-tx3)}
.mzbar .sp{flex:1}

/* 全屏按钮：跟 .bk 同一套视觉，但它是按钮不是链接 */
.mzfs{font-family:var(--mz-mono);font-size:10.5px;letter-spacing:.8px;cursor:pointer;
  color:var(--mz-tx2);background:transparent;border:1px solid var(--mz-line2);
  border-radius:5px;padding:5px 10px;transition:.15s}
.mzfs:hover{color:var(--mz-ac);border-color:var(--mz-ac);background:rgba(78,163,255,.08)}
.mzfs:focus-visible{outline:1px solid var(--mz-ac);outline-offset:2px}

.mzhud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mz-mono);font-size:10px}
.mzhud .h{display:flex;align-items:center;gap:5px;color:var(--mz-tx3);letter-spacing:.6px}
.mzhud .h b{color:var(--mz-tx);font-size:13px;letter-spacing:0}
.mzhud .h .u{font-size:8.5px;color:var(--mz-tx3)}
.mzlife{display:flex;gap:3px}
.mzlife i{width:12px;height:12px;border-radius:2px;background:rgba(78,163,255,.22);
  border:1px solid rgba(78,163,255,.4);transition:.2s}
.mzlife i.on{background:var(--mz-ac);box-shadow:0 0 8px rgba(78,163,255,.6)}
.mzlife i.gone{background:rgba(255,94,108,.18);border-color:rgba(255,94,108,.5)}

/* ---------------- 视口 ---------------- */
/* 这一页是一台仪器，不是长文档：一屏装得下就别让人滚。
   做法是给舞台一个「跟着视口高度走」的宽度上限（画布 960:520 ≈ 1.846），
   宽度仍然 100%，所以等比缩放、不会把 3D 画面拉变形。
   1440×900 实测整页正好一屏（898 / 900），矮屏自动缩，高屏最多 1148。 */
.mzstage{position:relative;margin:14px auto 0;width:100%;
  max-width:min(100%, calc((100vh - 302px) * 1.846));
  border:1px solid var(--mz-line2);border-radius:10px;
  overflow:hidden;background:#04070d;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 22px 60px -30px rgba(78,163,255,.35)}
#mzcv{display:block;width:100%;height:auto;image-rendering:pixelated}

.mzoverlay{position:absolute;inset:0;pointer-events:none}
.mzcross{position:absolute;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);
  opacity:.55}
.mzcross::before,.mzcross::after{content:"";position:absolute;background:var(--mz-ac2)}
.mzcross::before{left:6px;top:0;width:2px;height:14px}
.mzcross::after{left:0;top:6px;width:14px;height:2px}

/* ---------------- 小地图：只追踪，不画地形 ----------------
   这里是设计上的关键取舍：一旦把墙、门画上去，迷宫就不再是迷宫 ——
   玩家会盯着缩略图找路，3D 画面退化成装饰。
   所以这一块只画「你和追捕者的位置 + 走过的轨迹」，地形完全不透露。
   底纹给一层极淡的坐标网格，只用来读「走了多远、朝哪个方向」。 */
.mzmap{position:absolute;right:10px;top:10px;border:1px solid var(--mz-line2);border-radius:6px;
  background:rgba(4,7,13,.88);backdrop-filter:blur(4px);padding:4px 4px 3px}
.mzmaplb{display:flex;align-items:baseline;gap:5px;padding:1px 2px 4px;
  font-family:var(--mz-mono);font-size:8px;letter-spacing:1.2px;color:var(--mz-tx3)}
.mzmaplb b{color:var(--mz-ac2);font-weight:400;letter-spacing:1.6px}
.mzmaplb span{opacity:.6}
#mzmini{display:block;border-radius:3px}

.mzprompt{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  background:rgba(10,16,28,.92);border:1px solid var(--mz-ac);border-radius:7px;
  padding:7px 15px;font-size:12px;color:var(--mz-ac2);letter-spacing:.4px;
  opacity:0;transition:.2s;white-space:nowrap}
.mzprompt.on{opacity:1}

.mzmsg{position:absolute;left:50%;top:18px;transform:translateX(-50%);
  background:rgba(10,16,28,.94);border-left:3px solid var(--mz-ac);border-radius:0 7px 7px 0;
  padding:9px 15px;font-size:12px;line-height:1.7;color:var(--mz-tx);max-width:min(560px,86%);
  opacity:0;transition:.25s;pointer-events:none}
.mzmsg.on{opacity:1}
.mzmsg.bad{border-left-color:var(--mz-bad)}
.mzmsg.good{border-left-color:var(--mz-good)}
.mzmsg.warn{border-left-color:var(--mz-warn)}

/* ---------------- 鼠标锁定提示 ----------------
   进入视口先看到它。pointer-events:none —— 点击必须穿过去打到 canvas，
   否则第一下点击会被这层吃掉，锁不上鼠标。 */
.mzlock{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;opacity:0;transition:.3s;
  background:rgba(6,10,18,.78);border:1px solid var(--mz-line2);border-radius:10px;
  padding:16px 22px;backdrop-filter:blur(3px);max-width:88%;
}
.mzlock.on{opacity:1}
.mzlock b{display:block;font-size:14px;letter-spacing:.5px;color:var(--mz-ac2);margin-bottom:7px}
.mzlock span{font-size:11px;color:var(--mz-tx3);line-height:1.9}
.mzlock kbd{font-family:var(--mz-mono);font-size:10px;border:1px solid var(--mz-line2);
  border-radius:4px;padding:1px 5px;color:var(--mz-tx2);background:rgba(255,255,255,.04)}

/* ---------------- 危险红晕 ----------------
   逮捕者越近越亮。用 mix-blend-mode:screen 叠在画面上，
   不遮挡视线，只在边缘压一层血色。 */
.mzvig{
  position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at 50% 50%,transparent 42%,rgba(190,22,38,.55) 100%);
  mix-blend-mode:screen;
}
.mzvig.on{opacity:1}
.mzvig.beat{animation:mzBeat 1s ease-in-out infinite}
@keyframes mzBeat{0%,100%{opacity:.55}50%{opacity:1}}

.mzhud .hunt{color:var(--mz-tx3)}
.mzhud .hunt b{color:var(--mz-tx3)}
.mzhud .hunt.live b{color:var(--mz-bad);animation:mzPulse 1.1s ease-in-out infinite}
.mzhud .hunt.near b{color:#ff2f42}
@keyframes mzPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------------- 控制 ---------------- */
.mzctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mzpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,40px);gap:5px}
.mzpad button{border:1px solid var(--mz-line2);background:rgba(78,163,255,.07);color:var(--mz-tx2);
  border-radius:7px;font:inherit;font-size:15px;cursor:pointer;transition:.12s;user-select:none;
  display:flex;align-items:center;justify-content:center}
.mzpad button:active{background:rgba(78,163,255,.28);color:#fff}
.mzpad .up{grid-column:2;grid-row:1}
.mzpad .lf{grid-column:1;grid-row:2}
.mzpad .dn{grid-column:2;grid-row:2}
.mzpad .rt{grid-column:3;grid-row:2}

.mztips{font-size:11px;line-height:1.9;color:var(--mz-tx3);flex:1;min-width:200px}
.mztips kbd{font-family:var(--mz-mono);font-size:10px;border:1px solid var(--mz-line2);
  border-radius:4px;padding:1px 5px;color:var(--mz-tx2);background:rgba(255,255,255,.04)}
.mzbtn{cursor:pointer;border:1px solid var(--mz-ac);background:rgba(78,163,255,.12);color:var(--mz-ac2);
  border-radius:7px;padding:8px 16px;font:inherit;font-size:12px;font-weight:700;transition:.15s}
.mzbtn:hover{background:rgba(78,163,255,.24)}
.mzbtn.ghost{border-color:var(--mz-line2);background:transparent;color:var(--mz-tx2);font-weight:600}
.mzbtn.ghost:hover{border-color:var(--mz-tx2);background:rgba(255,255,255,.05)}

/* ---------------- 碎片条 ---------------- */
.mzfrag{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap}
.mzfrag .lb{font-family:var(--mz-mono);font-size:9px;letter-spacing:1.4px;color:var(--mz-tx3)}
.mzf{width:26px;height:26px;border-radius:5px;border:1px dashed var(--mz-line2);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mz-tx3);
  font-family:var(--mz-mono);transition:.25s}
.mzf.got{border-style:solid;border-color:var(--mz-ac);background:rgba(78,163,255,.16);color:var(--mz-ac2);
  box-shadow:0 0 10px rgba(78,163,255,.3)}
.mzf.miss{border-color:rgba(255,94,108,.5);color:rgba(255,94,108,.7)}

/* ---------------- 题目弹层 ---------------- */
.mzmodal{position:fixed;inset:0;z-index:90;background:rgba(4,7,13,.86);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:20px}
.mzmodal.on{display:flex}
.mzq{width:min(620px,100%);background:var(--mz-panel);border:1px solid var(--mz-line2);
  border-radius:12px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
.mzqh{padding:13px 18px;border-bottom:1px solid var(--mz-line);display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(78,163,255,.1),transparent)}
.mzqh .n{font-family:var(--mz-mono);font-size:9px;letter-spacing:1.6px;color:var(--mz-ac);}
.mzqh .t{font-size:14.5px;font-weight:700;letter-spacing:.3px}
.mzqh .sp{flex:1}
.mzqh .tag{font-family:var(--mz-mono);font-size:8.5px;letter-spacing:1.2px;color:var(--mz-tx3);
  border:1px solid var(--mz-line2);border-radius:4px;padding:2px 6px}
.mzqb{padding:16px 18px}
.mzqb .q{font-size:13px;line-height:1.9;color:var(--mz-tx);margin-bottom:13px}
.mzopts{display:flex;flex-direction:column;gap:8px}
.mzo{cursor:pointer;text-align:left;border:1px solid var(--mz-line2);border-radius:7px;
  background:rgba(255,255,255,.025);color:var(--mz-tx2);font:inherit;font-size:12px;
  padding:10px 13px;transition:.14s;line-height:1.65;display:flex;gap:9px}
.mzo .k{font-family:var(--mz-mono);font-size:10px;color:var(--mz-tx3);flex:0 0 auto}
.mzo:hover:not(:disabled){border-color:var(--mz-ac);background:rgba(78,163,255,.09);color:var(--mz-tx)}
.mzo.ok{border-color:var(--mz-good);background:rgba(62,207,142,.14);color:#9bf0c9}
.mzo.no{border-color:var(--mz-bad);background:rgba(255,94,108,.12);color:#ffa8b0}
.mzo:disabled{cursor:default}
.mzwhy{margin-top:12px;font-size:11.5px;line-height:1.85;color:var(--mz-tx2);
  border-left:2px solid var(--mz-ac);padding-left:11px;display:none}
.mzwhy.on{display:block}
.mzqf{padding:12px 18px;border-top:1px solid var(--mz-line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mzqf .hint{font-size:10.5px;color:var(--mz-tx3)}

/* ---------------- 结算 ---------------- */
.mzend{margin-top:14px}
.mzend .box{border:1px solid var(--mz-line2);border-radius:10px;padding:18px 20px;background:var(--mz-panel)}
.mzend .box.win{border-color:rgba(201,162,39,.55);box-shadow:inset 0 0 60px -30px rgba(201,162,39,.8)}
.mzend .box.caught{border-color:rgba(255,47,66,.55);
  background:linear-gradient(180deg,rgba(255,47,66,.08),var(--mz-panel) 60%);
  box-shadow:inset 0 0 80px -40px rgba(255,47,66,.9)}
.mzend .box.caught h3{color:#ff8b96}
.mzend h3{margin:0 0 8px;font-size:17px;letter-spacing:.5px}
.mzend p{margin:0 0 9px;font-size:12px;line-height:1.9;color:var(--mz-tx2)}
.mzend .sc{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;font-family:var(--mz-mono);font-size:10px;color:var(--mz-tx3)}
.mzend .sc b{display:block;font-size:20px;color:var(--mz-tx);margin-top:2px;letter-spacing:-.5px}
.mzend .certbox{margin-top:14px;overflow:auto;border:1px solid var(--mz-line2);border-radius:8px}

.mztoast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);z-index:95;
  background:#0e1726;border:1px solid var(--mz-line2);color:var(--mz-tx);padding:9px 17px;
  border-radius:7px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.mztoast.on{opacity:1;transform:translate(-50%,0)}

/* ---------------- 视角设置面板 ----------------
   手感是个人化的：同一个灵敏度，高 DPI 鼠标和笔记本触控板差三倍。
   所以它必须是可调的，而不是由作者替所有人定死一个数。 */
.mzaim{position:fixed;right:18px;bottom:18px;z-index:96;width:314px;max-width:calc(100vw - 24px);
  background:#0b1220;border:1px solid var(--mz-line2);border-radius:10px;
  box-shadow:0 18px 48px rgba(0,0,0,.6);padding:0 0 12px;
  opacity:0;transform:translateY(14px) scale(.98);pointer-events:none;transition:.2s}
.mzaim.on{opacity:1;transform:none;pointer-events:auto}
.mzaim .ah{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--mz-line)}
.mzaim .ah b{font-size:12.5px;letter-spacing:.4px}
.mzaim .ah span{font-family:var(--mz-mono);font-size:8.5px;letter-spacing:1.5px;color:var(--mz-tx3)}
.mzaim .ah button{margin-left:auto;background:none;border:none;color:var(--mz-tx3);
  font-size:17px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:4px;transition:.15s}
.mzaim .ah button:hover{color:var(--mz-bad);background:rgba(255,94,108,.1)}
.mzaim .ar{display:grid;grid-template-columns:56px 1fr 52px;align-items:center;gap:9px;
  padding:9px 13px 0;font-size:11px;color:var(--mz-tx2)}
.mzaim .ar b{font-family:var(--mz-mono);font-size:10.5px;color:var(--mz-ac2);text-align:right}
.mzaim .ar.chk{grid-template-columns:1fr auto;padding-top:11px}
.mzaim input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
  background:var(--mz-line2);outline:none;cursor:pointer}
.mzaim input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--mz-ac);border:2px solid #0b1220;
  box-shadow:0 0 0 1px var(--mz-ac);cursor:grab}
.mzaim input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
  background:var(--mz-ac);border:2px solid #0b1220;cursor:grab}
.mzaim input[type=checkbox]{appearance:none;-webkit-appearance:none;width:34px;height:18px;
  border-radius:9px;background:var(--mz-line2);position:relative;cursor:pointer;transition:.18s;margin:0}
.mzaim input[type=checkbox]::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;
  border-radius:50%;background:#7d8ea8;transition:.18s}
.mzaim input[type=checkbox]:checked{background:rgba(78,163,255,.35)}
.mzaim input[type=checkbox]:checked::after{left:18px;background:var(--mz-ac)}
.mzaim .af{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  margin:13px 13px 0;padding-top:11px;border-top:1px solid var(--mz-line);
  font-size:10px;color:var(--mz-tx3)}
.mzaim .af b{color:var(--mz-ac2);font-family:var(--mz-mono);font-size:11px}
.mzaim .af i{font-style:normal;opacity:.72}
.mzaim .af .mzbtn{margin-left:auto;font-size:10px;padding:4px 9px}
.mzaim .an{margin:9px 13px 0;font-size:10px;line-height:1.75;color:var(--mz-tx3)}

@media(max-width:760px){
  .mzwrap{padding:0 10px 34px}
  .mzttl b{font-size:15px}
  .mzpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px)}
  .mzmap{right:6px;top:6px;transform:scale(.62);transform-origin:top right}
  .mzmodal{padding:10px}
  .mzqb{padding:13px 14px}
  .mzaim{left:10px;right:10px;bottom:10px;width:auto}
}

/* ---------------- 全屏 ----------------
   全屏的对象是整个 .mzwrap，不是画布 —— 顶栏那四个读数（可信度 / 答对 /
   用时 / 追捕距离）在迷宫里是必须一直看得见的，切到全屏反而把它们藏起来
   等于把仪表拆了。
   画布尺寸由 stage 宽度决定：stage 取「视口宽」与「按可用高度反推的宽」
   里较小的那个，画布 width:100% 跟着它走，高度按 960:520 自动算。
   反过来（给画布 max-height 让浏览器自己缩）不行 —— 替换元素在
   width:auto 时用的是固有宽度 960，全屏反而比非全屏更小。

   `.mzfsim` 是同一套规则的「演练开关」：无头浏览器里 Fullscreen API
   不一定真的生效，体检就没法验布局。加这个类等于把页面按全屏排版一遍，
   但不动真正的全屏状态 —— 布局这件事因此可以被真测，而不是靠肉眼。 */
:is(.mzwrap:fullscreen, .mzwrap.mzfsim){
  display:flex;flex-direction:column;
  width:100vw;height:100vh;height:100dvh;
  max-width:none;margin:0;padding:0;
  overflow:hidden;background:#02040a;
}
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzbar{flex:0 0 auto;padding:8px 16px 7px}
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzbar .bk,
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzttl span,
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzfrag,
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzctl,
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzfoot,
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzaim{display:none}
:is(.mzwrap:fullscreen, .mzwrap.mzfsim) .mzstage{
  flex:0 1 auto;
  width:min(100vw, calc((100vh - 70px) * 1.846));
  width:min(100vw, calc((100dvh - 70px) * 1.846));
  max-width:none;margin:auto;   /* 上下黑边均分，画面垂直居中 */
