<style>
.ev{position:relative;z-index:10;height:100dvh;display:flex;flex-direction:column}
.evbody{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr}

/* ---- 左：档案索引 ---- */
.evlist{
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  background:linear-gradient(180deg,rgba(8,12,18,.62),rgba(8,12,18,.26));
}
.evlist .lh{padding:14px 15px 10px;border-bottom:1px solid var(--line)}
.evlist .lh .lt{font-size:13px;font-weight:700;letter-spacing:1.2px}
.evlist .lh .ls{font-family:var(--mono);font-size:9px;color:var(--tx4);margin-top:3px}
.filters{display:flex;gap:4px;flex-wrap:wrap;padding:10px 15px;border-bottom:1px solid var(--line)}
.fb{
  cursor:pointer;font-family:inherit;font-size:10px;padding:4px 9px;border-radius:6px;
  border:1px solid var(--line);background:transparent;color:var(--tx3);transition:.15s;
}
.fb:hover{color:var(--tx);border-color:var(--line2)}
.fb.on{color:#f2dcae;border-color:rgba(217,179,100,.45);background:rgba(217,179,100,.12)}
.evitems{flex:1;overflow-y:auto;padding:8px 10px 20px}
.evitems::-webkit-scrollbar{width:7px}
.evitems::-webkit-scrollbar-thumb{background:rgba(120,152,186,.2);border-radius:4px}
.evi{
  padding:9px 11px;border-radius:9px;border:1px solid transparent;cursor:pointer;
  border-left:2px solid var(--line2);margin-bottom:4px;transition:.14s;
}
.evi:hover{background:rgba(120,152,186,.07)}
.evi.on{background:rgba(217,179,100,.09);border-color:rgba(217,179,100,.3)}
.evi .et{font-size:11.5px;color:var(--tx);line-height:1.5}
.evi .em{font-family:var(--mono);font-size:8.5px;color:var(--tx4);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.evi .em .v.ok{color:var(--ok)}
.evi .em .v.bad{color:var(--bad)}
.evi .em .v.warn{color:var(--warn)}
.evi .em .v.idle{color:var(--tx3)}

/* ---- 右：详情 ---- */
.evmain{min-height:0;overflow-y:auto;padding:20px 24px 40px}
.evmain::-webkit-scrollbar{width:9px}
.evmain::-webkit-scrollbar-thumb{background:rgba(120,152,186,.22);border-radius:5px}

.evhead{margin-bottom:16px}
.evhead .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--gold)}
.evhead h1{font-size:21px;font-weight:800;line-height:1.35;margin-top:5px}
.evhead .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-family:var(--mono);font-size:9.5px;color:var(--tx4)}
.evhead .meta b{color:var(--tx2);font-weight:400}

.sec{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:12px;background:rgba(15,21,31,.55)}
.sec>.st{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--tx4);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec>.st .spacer{flex:1}
.sec p{font-size:12px;line-height:1.85;color:var(--tx2)}
.sec p+p{margin-top:7px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:11.5px}
.kv dt{color:var(--tx4);font-family:var(--mono);font-size:10px;padding-top:1px}
.kv dd{color:var(--tx2);line-height:1.65;word-break:break-word}
ul.dd{padding-left:16px;font-size:11.5px;line-height:1.85;color:var(--tx2)}
ul.dd li{margin-bottom:3px}
ul.dd li::marker{color:var(--tx4)}

.blank{
  border:1px dashed var(--line2);border-radius:12px;padding:34px 22px;text-align:center;
  color:var(--tx4);font-size:12px;line-height:1.9;
}
.blank b{color:var(--tx2);display:block;font-size:14px;margin-bottom:6px}

/* 案件 */
.casecard{border:1px solid rgba(217,179,100,.26);border-radius:11px;padding:13px 15px;margin-bottom:10px;
  background:linear-gradient(150deg,rgba(217,179,100,.07),transparent)}
.casecard .ct{font-size:12.5px;font-weight:700}
.casecard .cs{font-family:var(--mono);font-size:9px;color:var(--tx4);margin-top:4px}
.casecard .crows{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.casecard .cr{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--tx3)}
.casecard .cr i{width:6px;height:6px;border-radius:50%;flex:none}
.casecard .cr b{color:var(--tx2);font-weight:600;min-width:88px}

.warnbox{border:1px solid rgba(240,85,77,.34);border-radius:10px;padding:11px 13px;
  background:rgba(240,85,77,.05);font-size:11.5px;line-height:1.8;color:var(--tx2)}
.warnbox b{color:#ef8a90}

/* ============================================================
   全城联合复核台（YC-Audit）
   ============================================================ */
.audit{
  border:1px solid rgba(217,179,100,.28);border-radius:12px;margin-bottom:12px;
  background:linear-gradient(165deg,rgba(217,179,100,.055),rgba(15,21,31,.6) 42%);
  overflow:hidden;
}
.audit .ah{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;border-bottom:1px solid rgba(217,179,100,.16);
}
.audit .at{font-size:13.5px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.audit .abadge{
  font-family:var(--mono);font-size:8px;letter-spacing:1.3px;color:var(--gold);
  border:1px solid rgba(217,179,100,.35);border-radius:4px;padding:1px 5px;font-weight:400;
}
.audit .as{font-family:var(--mono);font-size:9.5px;color:var(--tx4);letter-spacing:.6px}
.audit .ah .spacer{flex:1}
.audit .ah .btn{font-size:11px;padding:6px 12px}
.aempty{padding:18px 16px 20px;font-size:11.5px;line-height:1.9;color:var(--tx4)}

#auditBody{padding:14px 16px 16px}

/* 判定条 */
.averd{
  display:flex;align-items:flex-start;gap:14px;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(8,12,18,.5);margin-bottom:12px;
}
.averd.ok{border-color:rgba(63,208,138,.34);background:rgba(63,208,138,.055)}
.averd.warn{border-color:rgba(217,179,100,.36);background:rgba(217,179,100,.055)}
.averd.bad{border-color:rgba(240,85,77,.36);background:rgba(240,85,77,.055)}
.averd .av{
  font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:1px;flex:none;
  padding-top:1px;
}
.averd.ok .av{color:var(--ok)}
.averd.warn .av{color:var(--gold)}
.averd.bad .av{color:#ef8a90}
.averd .aw{font-size:11.5px;line-height:1.85;color:var(--tx2)}
.averd .aw b{color:var(--tx)}

/* 四个数字 */
.astats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:13px}
.astat{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:rgba(8,12,18,.45)}
.astat .k{font-family:var(--mono);font-size:8px;letter-spacing:1.2px;color:var(--tx4);text-transform:uppercase}
.astat .n{font-family:var(--mono);font-size:20px;line-height:1.15;margin-top:3px;color:var(--tx)}
.astat .n small{font-size:10px;color:var(--tx4);font-weight:400}
.astat.bad .n{color:#ef8a90}
.astat.warn .n{color:var(--gold)}
.astat.ok .n{color:var(--ok)}

/* 可比性矩阵 */
.amwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;margin-bottom:13px}
.ambox{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:rgba(8,12,18,.4);overflow-x:auto;align-self:start}
.ambox .mt{
  font-family:var(--mono);font-size:8.5px;letter-spacing:1.4px;color:var(--tx4);
  margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.ambox .mt .spacer{flex:1}
.mleg{display:flex;gap:10px;flex-wrap:wrap;font-size:8.5px;font-family:var(--mono);letter-spacing:.4px}
.mleg span{display:flex;align-items:center;gap:4px;color:var(--tx4)}
.mleg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.mleg i.c{background:rgba(63,208,138,.85)}
.mleg i.a{background:rgba(217,179,100,.85)}
.mleg i.x{background:rgba(240,85,77,.85)}
.mleg i.s{background:rgba(120,152,186,.22)}

.amgrid{display:grid;gap:4px;justify-content:center}
.amgrid .rh{
  font-family:var(--mono);font-size:9px;color:var(--tx3);display:flex;align-items:center;
  justify-content:flex-end;padding-right:6px;letter-spacing:.5px;height:44px;
}
.amgrid .ch{
  font-family:var(--mono);font-size:9px;color:var(--tx3);text-align:center;
  padding-bottom:4px;letter-spacing:.5px;
}
.amc{
  width:44px;height:44px;border-radius:6px;cursor:pointer;transition:.13s;position:relative;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;letter-spacing:.4px;color:rgba(0,0,0,.45);
  border:1px solid transparent;
}
.amc:hover{transform:scale(1.08);border-color:rgba(255,255,255,.55);z-index:2}
.amc.c{background:rgba(63,208,138,.72)}
.amc.a{background:rgba(217,179,100,.72)}
.amc.x{background:rgba(240,85,77,.72)}
.amc.s{background:rgba(120,152,186,.12);cursor:default;color:var(--tx4);font-size:10px}
.amc.s:hover{transform:none;border-color:transparent}
.amc.on{outline:2px solid #fff;outline-offset:1px;z-index:3}

/* 配对详情 */
.apair{
  border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  background:rgba(8,12,18,.4);font-size:11px;line-height:1.8;color:var(--tx2);min-height:96px;
}
.apair .ph{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--gold);margin-bottom:7px}
.apair .pv{font-weight:700;color:var(--tx)}
.apair .pd{color:var(--tx3);margin-top:5px}
.apair .pl{font-family:var(--mono);font-size:8.5px;color:var(--tx4);margin-top:8px;letter-spacing:.5px}

/* 命题表 */
.aclaim{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.aclaim .ct{
  display:grid;grid-template-columns:52px 1fr 96px 104px;gap:8px;padding:8px 12px;
  font-family:var(--mono);font-size:8px;letter-spacing:1.2px;color:var(--tx4);
  background:rgba(120,152,186,.06);border-bottom:1px solid var(--line);
}
.aclaim .cr{
  display:grid;grid-template-columns:52px 1fr 96px 104px;gap:8px;padding:8px 12px;
  font-size:11px;color:var(--tx2);border-bottom:1px solid rgba(120,152,186,.07);align-items:center;
}
.aclaim .cr:last-child{border-bottom:none}
.aclaim .cr .hh{font-family:var(--mono);font-size:9px;letter-spacing:.8px}
.aclaim .cr .dd{font-family:var(--mono);font-size:9px;letter-spacing:.5px}
.aclaim .cr .dd.on{color:var(--ok)}
.aclaim .cr .dd.off{color:var(--tx4)}
.aclaim .cr .vv{font-family:var(--mono);font-size:8.5px;text-align:right}
.aclaim .cr .vv.ok{color:var(--ok)}
.aclaim .cr .vv.bad{color:#ef8a90}
.aclaim .cr .vv.warn{color:var(--gold)}
.aclaim .cr .vv.idle{color:var(--tx4)}

/* 标记 */
.aflags{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.aflag{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:rgba(8,12,18,.4);font-size:11px;line-height:1.8;
}
.aflag .fk{
  font-family:var(--mono);font-size:8px;letter-spacing:1px;padding:1px 6px;border-radius:3px;
  flex:none;margin-top:2px;
}
.aflag.orphan{border-color:rgba(217,179,100,.3)}
.aflag.orphan .fk{color:var(--gold);border:1px solid rgba(217,179,100,.4)}
.aflag.gap{border-color:rgba(240,85,77,.28)}
.aflag.gap .fk{color:#ef8a90;border:1px solid rgba(240,85,77,.4)}
.aflag.incomparable{border-color:rgba(240,85,77,.28)}
.aflag.incomparable .fk{color:#ef8a90;border:1px solid rgba(240,85,77,.4)}
.aflag.sharedimpl .fk,.aflag.sameorigin .fk{color:var(--tx3);border:1px solid var(--line2)}
.aflag .ft{color:var(--tx);font-weight:600;flex:none}
.aflag .fd{color:var(--tx3)}

/* 自检 */
.acheck{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ackbox{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:rgba(8,12,18,.4)}
.ackbox .kh{
  font-family:var(--mono);font-size:8.5px;letter-spacing:1.3px;color:var(--tx4);
  margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.ackbox .kh .spacer{flex:1}
.ackrow{display:flex;gap:7px;font-size:10.5px;line-height:1.7;padding:3px 0;color:var(--tx3)}
.ackrow .st{font-family:var(--mono);font-size:8px;flex:none;padding-top:2px;letter-spacing:.6px}
.ackrow .st.ok{color:var(--ok)}
.ackrow .st.no{color:#ef8a90}
.ackrow b{color:var(--tx2);font-weight:600}

@media (max-width:980px){
  .amwrap{grid-template-columns:1fr}
  .astats{grid-template-columns:1fr 1fr}
  .acheck{grid-template-columns:1fr}
  .aclaim .ct,.aclaim .cr{grid-template-columns:44px 1fr 70px}
  .aclaim .ct span:nth-child(4),.aclaim .cr .vv{display:none}
  .amc{height:26px}
}

@media (max-width:980px){
  .ev{height:auto;min-height:100dvh}
  .evbody{grid-template-columns:1fr}
  .evlist{border-right:none;border-bottom:1px solid var(--line);max-height:300px}
  .evmain{padding:14px 13px 30px;overflow:visible}
  .kv{grid-template-columns:1fr}
  .kv dt{padding-top:6px}
}
</style>
