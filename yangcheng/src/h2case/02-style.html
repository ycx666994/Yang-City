<style>
/* ==========================================================================
   案卷 0117 · 十一日 —— 剧本杀
   深墨 + 纸黄的档案室。和 H2 主厅的浅色案卷纸刻意分开：
   那一个是白天读卷宗，这一个是在没有窗的会议室里坐到半夜。
   类名统一 c3- 前缀（避开 shared/yc-*.css 里的 .vd/.rail/.knob 这类泛名）。
   ========================================================================== */
:root{
  --c3-bg:#0b0a08;
  --c3-panel:#15120e;
  --c3-panel2:#1c1813;
  --c3-line:#2e2720;
  --c3-line2:#40372c;
  --c3-paper:#e9dfc9;
  --c3-paper2:#d6c8ac;
  --c3-tx:#ddcfb6;
  --c3-tx2:#a8997f;
  --c3-tx3:#7a6d58;
  --c3-gold:#c9a227;
  --c3-gold2:#e8c65a;
  --c3-red:#c0503a;
  --c3-blue:#5b8fb8;
  --c3-green:#6fa36a;
  --c3-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --c3-serif:"Songti SC","Noto Serif SC",Georgia,serif;
}
*{box-sizing:border-box}
/* 覆盖 yc-core.css 的固定视口（body{overflow:hidden} 会传播到视口，滚轮全废） */
html{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{
  height:auto;min-height:100vh;overflow:visible;
  background:
    radial-gradient(1100px 600px at 50% -20%, #1a1510 0%, transparent 60%),
    radial-gradient(700px 400px at 100% 100%, #17120c 0%, transparent 55%),
    var(--c3-bg);
  color:var(--c3-tx);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 纸纹：极淡的斜线，只为了让大面积深色不显得像纯色块 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:repeating-linear-gradient(135deg,rgba(201,162,39,.014) 0 1px,transparent 1px 5px)}

.c3wrap{
  position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:0 18px 46px;
  display:grid;grid-template-columns:minmax(0,1fr) 302px;
  grid-template-areas:"bar bar" "acts acts" "main wall" "note note";
  gap:0 20px;align-items:start;
}

/* ---------------- 顶栏 ---------------- */
.c3bar{grid-area:bar;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 0 13px;border-bottom:1px solid var(--c3-line)}
.c3bar .bk{text-decoration:none;color:var(--c3-tx2);font-size:11.5px;
  border:1px solid var(--c3-line2);border-radius:5px;padding:5px 10px;transition:.15s;white-space:nowrap}
.c3bar .bk:hover{color:var(--c3-gold);border-color:var(--c3-gold);background:rgba(201,162,39,.08)}
.c3ttl{display:flex;flex-direction:column;gap:2px;min-width:0}
.c3ttl b{font-size:16px;letter-spacing:.6px;font-family:var(--c3-serif)}
.c3ttl span{font-family:var(--c3-mono);font-size:8.5px;letter-spacing:1.8px;color:var(--c3-tx3)}
.c3id{margin-left:auto;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
  border-left:1px solid var(--c3-line);padding-left:14px}
.c3id .lb{font-size:9.5px;color:var(--c3-tx3);letter-spacing:1px}
.c3id b{font-size:13px;color:var(--c3-gold2);font-family:var(--c3-serif);letter-spacing:1px}
.c3id .sub{font-size:9.5px;color:var(--c3-tx3)}
.c3res{display:flex;gap:12px;border-left:1px solid var(--c3-line);padding-left:14px}
.c3res .r{display:flex;flex-direction:column;align-items:center;gap:1px}
.c3res .r i{font-style:normal;font-size:8.5px;color:var(--c3-tx3);letter-spacing:1px}
.c3res .r b{font-family:var(--c3-mono);font-size:17px;color:var(--c3-gold2);line-height:1}
.c3res .r.low b{color:var(--c3-red)}

/* ---------------- 幕导航 ---------------- */
.c3acts{grid-area:acts;display:flex;gap:0;margin:0 0 18px;border-bottom:1px solid var(--c3-line);
  overflow-x:auto;scrollbar-width:none}
.c3acts::-webkit-scrollbar{display:none}
.c3acts button{
  appearance:none;background:none;border:none;cursor:pointer;flex:0 0 auto;
  padding:12px 20px 11px;display:flex;align-items:baseline;gap:7px;
  color:var(--c3-tx3);border-bottom:2px solid transparent;transition:.18s;
  font-family:inherit;font-size:12.5px;position:relative}
.c3acts button b{font-family:var(--c3-mono);font-size:10px;opacity:.7}
.c3acts button span{letter-spacing:1px}
.c3acts button:hover:not(:disabled){color:var(--c3-tx);background:rgba(201,162,39,.05)}
.c3acts button.on{color:var(--c3-gold2);border-bottom-color:var(--c3-gold)}
.c3acts button.on b{opacity:1}
.c3acts button:disabled{opacity:.3;cursor:not-allowed}
.c3acts button.done::after{content:"·";position:absolute;right:8px;top:9px;color:var(--c3-green);font-size:15px}

/* ---------------- 主区 ---------------- */
.c3main{grid-area:main;min-width:0}
.c3lay{display:none;animation:c3in .3s ease}
.c3lay.on{display:block}
@keyframes c3in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.c3card{background:var(--c3-panel);border:1px solid var(--c3-line);border-radius:9px;
  padding:17px 19px 16px;margin-bottom:14px}
.c3h{display:flex;align-items:center;gap:10px;margin:0 0 13px;
  padding-bottom:10px;border-bottom:1px solid var(--c3-line)}
.c3h h3{margin:0;font-size:14px;letter-spacing:.8px;font-family:var(--c3-serif);color:var(--c3-paper)}
.c3h .k{margin-left:auto;font-family:var(--c3-mono);font-size:8.5px;letter-spacing:1.5px;color:var(--c3-tx3)}

.c3lede{margin:0 0 14px;font-size:12.5px;line-height:1.95;color:var(--c3-tx2)}
.c3lede b{color:var(--c3-paper);font-weight:600}
.c3foot{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:15px;
  padding-top:13px;border-top:1px solid var(--c3-line)}
.c3foot .hint{font-size:10.5px;color:var(--c3-tx3);line-height:1.6}

.c3btn{
  appearance:none;cursor:pointer;font-family:inherit;font-size:12px;
  padding:8px 17px;border-radius:6px;border:1px solid var(--c3-gold);
  background:rgba(201,162,39,.14);color:var(--c3-gold2);
  transition:.16s;letter-spacing:.4px;white-space:nowrap}
.c3btn:hover:not(:disabled){background:var(--c3-gold);color:#1a1408;border-color:var(--c3-gold)}
.c3btn:disabled{opacity:.35;cursor:not-allowed}
.c3btn.red{border-color:var(--c3-red);background:rgba(192,80,58,.16);color:#e08a76}
.c3btn.red:hover:not(:disabled){background:var(--c3-red);color:#fff}
.c3btn.ghost{border-color:var(--c3-line2);background:none;color:var(--c3-tx2)}
.c3btn.ghost:hover:not(:disabled){border-color:var(--c3-tx2);color:var(--c3-paper);background:rgba(255,255,255,.03)}

/* ---------------- 幕一 · 剧本 ---------------- */
.c3script{font-family:var(--c3-serif);font-size:14px;line-height:2.15;color:var(--c3-tx)}
.c3script p{margin:0 0 15px;opacity:0;transform:translateY(8px);
  animation:c3para .55s cubic-bezier(.22,.8,.3,1) forwards}
@keyframes c3para{to{opacity:1;transform:none}}
.c3script p:last-child{margin-bottom:0}
.c3script p b{color:var(--c3-gold2);font-weight:600}

.c3secret{border-color:rgba(201,162,39,.32);background:
  linear-gradient(180deg,rgba(201,162,39,.055),transparent 70%),var(--c3-panel)}
.c3sec{margin:0 0 11px;font-family:var(--c3-serif);font-size:13px;line-height:2;color:var(--c3-paper2)}
.c3stake{margin:0;font-size:11.5px;line-height:1.95;color:var(--c3-tx2);
  padding-left:11px;border-left:2px solid var(--c3-red)}

/* ---------------- 幕二 · 搜证 ---------------- */
.c3grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.c3pl{
  position:relative;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--c3-panel2);border:1px solid var(--c3-line);border-radius:7px;
  padding:11px 12px 10px;transition:.16s;color:var(--c3-tx2);overflow:hidden}
.c3pl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--c3-line2);transition:.16s}
.c3pl:hover:not(:disabled){border-color:var(--c3-line2);background:#221d16;transform:translateY(-1px)}
.c3pl:hover:not(:disabled)::before{background:var(--c3-gold)}
.c3pl b{display:block;font-size:12px;color:var(--c3-paper);font-weight:600;margin-bottom:4px;
  line-height:1.5;padding-right:14px}
.c3pl span{display:block;font-size:10px;color:var(--c3-tx3);line-height:1.55}
.c3pl .n{position:absolute;right:9px;top:9px;font-family:var(--c3-mono);
  font-size:9px;color:var(--c3-tx3)}
.c3pl:disabled{cursor:default}
.c3pl.taken{border-color:rgba(111,163,106,.34);background:rgba(111,163,106,.07)}
.c3pl.taken::before{background:var(--c3-green)}
.c3pl.taken b{color:var(--c3-paper)}
.c3pl.taken .n{color:var(--c3-green)}
.c3pl.miss{border-color:var(--c3-line);opacity:.42}
.c3pl.miss::before{background:transparent}

/* ---------------- 幕三 · 质询 ---------------- */
.c3cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.c3ca{
  position:relative;cursor:pointer;font-family:inherit;text-align:left;
  background:var(--c3-panel2);border:1px solid var(--c3-line);border-radius:7px;
  padding:10px 11px;transition:.16s;color:var(--c3-tx2)}
.c3ca:hover:not(:disabled){border-color:var(--c3-line2);background:#221d16}
.c3ca b{display:block;font-size:12.5px;color:var(--c3-paper);margin-bottom:3px}
.c3ca span{display:block;font-size:9.5px;color:var(--c3-tx3);line-height:1.5}
.c3ca .st{position:absolute;right:9px;top:9px;width:6px;height:6px;border-radius:50%;
  background:var(--c3-line2)}
.c3ca.used{border-color:rgba(201,162,39,.34)}
.c3ca.used .st{background:var(--c3-gold)}
.c3ca.used.done .st{background:var(--c3-green)}
.c3ca:disabled{opacity:.42;cursor:not-allowed}
.c3ca.on{border-color:var(--c3-gold);background:rgba(201,162,39,.1)}

.c3room{margin-top:14px}
.c3empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:44px 20px;border:1px dashed var(--c3-line2);border-radius:9px;
  background:rgba(255,255,255,.012);text-align:center}
.c3empty b{font-size:12.5px;color:var(--c3-tx3);font-weight:600}
.c3empty span{font-size:10.5px;color:var(--c3-tx3);opacity:.8;line-height:1.7}

.c3who{display:flex;gap:13px;align-items:flex-start;margin-bottom:13px;
  padding-bottom:13px;border-bottom:1px solid var(--c3-line)}
.c3who .av{width:54px;height:54px;flex:none;border-radius:7px;overflow:hidden;
  border:1px solid var(--c3-line2);background:#0e0b08}
.c3who .info{min-width:0;flex:1}
.c3who .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.c3who .nm b{font-size:14px;color:var(--c3-paper);font-family:var(--c3-serif);letter-spacing:.6px}
.c3who .nm i{font-style:normal;font-size:9.5px;color:var(--c3-tx3);
  border:1px solid var(--c3-line2);border-radius:3px;padding:1px 6px}
.c3who .jb{font-size:10.5px;color:var(--c3-tx3);margin-bottom:5px}
.c3who .lk{font-size:11px;color:var(--c3-tx2);line-height:1.75;font-style:italic}

.c3dlg{display:flex;flex-direction:column;gap:11px;margin-bottom:13px}
.c3qa{border-left:2px solid var(--c3-line2);padding:0 0 0 12px}
.c3qa .q{font-size:11.5px;color:var(--c3-gold2);margin-bottom:5px;line-height:1.7}
.c3qa .q::before{content:"你问　";color:var(--c3-tx3);font-size:10px;letter-spacing:1px}
.c3qa .a{font-family:var(--c3-serif);font-size:12.5px;line-height:1.95;color:var(--c3-paper2)}
.c3qa .a::before{content:"「";color:var(--c3-tx3)}
.c3qa .a::after{content:"」";color:var(--c3-tx3)}
.c3qa.broke{border-left-color:var(--c3-green)}
.c3qa.broke .a{color:#cfe0c9}
.c3qa .brk{margin-top:8px;font-size:10.5px;color:var(--c3-green);line-height:1.8;
  padding:7px 10px;background:rgba(111,163,106,.07);border-radius:5px;
  border:1px solid rgba(111,163,106,.22)}
.c3qa .brk::before{content:"证据对上　";font-family:var(--c3-mono);font-size:9px;letter-spacing:1px;opacity:.8}

.c3qs{display:flex;flex-direction:column;gap:7px}
.c3q{appearance:none;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--c3-panel2);border:1px solid var(--c3-line);border-radius:6px;
  padding:9px 12px;font-size:11.5px;color:var(--c3-tx2);transition:.15s;line-height:1.6}
.c3q:hover:not(:disabled){border-color:var(--c3-gold);color:var(--c3-paper);background:rgba(201,162,39,.07)}
.c3q:disabled{opacity:.4;cursor:default}
.c3q .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--c3-line2);margin-right:8px;vertical-align:middle}
.c3q.asked .dot{background:var(--c3-tx3)}
.c3q.lied .dot{background:var(--c3-red)}

.c3evbtn{appearance:none;cursor:pointer;font-family:inherit;font-size:10.5px;
  margin-top:8px;padding:5px 12px;border-radius:5px;
  border:1px dashed rgba(192,80,58,.5);background:rgba(192,80,58,.1);color:#e08a76;transition:.15s}
.c3evbtn:hover{background:rgba(192,80,58,.22);border-style:solid}

/* ---------------- 幕四 · 时间线 ---------------- */
.c3tl{display:flex;flex-direction:column;gap:6px}
.c3tc{
  display:flex;align-items:center;gap:10px;
  background:var(--c3-panel2);border:1px solid var(--c3-line);border-radius:6px;
  padding:9px 11px;cursor:grab;transition:.15s;position:relative}
.c3tc:active{cursor:grabbing}
.c3tc.drag{opacity:.35;border-style:dashed}
.c3tc.over{border-color:var(--c3-gold);background:rgba(201,162,39,.08)}
.c3tc .no{flex:none;width:22px;height:22px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(201,162,39,.14);color:var(--c3-gold2);
  font-family:var(--c3-mono);font-size:10.5px}
.c3tc .tx{flex:1;min-width:0}
.c3tc .tx b{display:block;font-size:11.5px;color:var(--c3-paper2);line-height:1.6;font-weight:500}
.c3tc .tx span{display:block;font-size:9.5px;color:var(--c3-tx3);margin-top:2px}
.c3tc .mv{display:flex;gap:3px;flex:none}
.c3tc .mv button{appearance:none;cursor:pointer;width:22px;height:22px;
  background:none;border:1px solid var(--c3-line2);border-radius:4px;
  color:var(--c3-tx3);font-size:10px;line-height:1;transition:.14s;font-family:inherit}
.c3tc .mv button:hover{color:var(--c3-gold);border-color:var(--c3-gold)}
.c3tc.ok{border-color:rgba(111,163,106,.42);background:rgba(111,163,106,.06)}
.c3tc.ok .no{background:rgba(111,163,106,.18);color:#9dc497}
.c3tc.bad{border-color:rgba(192,80,58,.45);background:rgba(192,80,58,.06)}
.c3tc.bad .no{background:rgba(192,80,58,.2);color:#e08a76}

/* ---------------- 幕五 · 指认 ---------------- */
.c3form{display:flex;flex-direction:column;gap:19px}
.c3fld .qq{font-size:12.5px;color:var(--c3-paper);margin-bottom:3px;line-height:1.7}
.c3fld .qq em{font-style:normal;font-family:var(--c3-mono);font-size:8.5px;
  color:var(--c3-tx3);letter-spacing:1.4px;margin-left:8px}
.c3opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:7px;margin-top:9px}
.c3opt{appearance:none;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--c3-panel2);border:1px solid var(--c3-line);border-radius:6px;
  padding:10px 12px;font-size:11.5px;color:var(--c3-tx2);transition:.15s;line-height:1.65}
.c3opt:hover{border-color:var(--c3-line2);background:#221d16;color:var(--c3-paper)}
.c3opt.on{border-color:var(--c3-gold);background:rgba(201,162,39,.1);color:var(--c3-gold2)}
.c3opt.on::before{content:"◆ ";font-size:9px}

/* ---------------- 线索墙 ---------------- */
.c3wall{grid-area:wall;position:sticky;top:12px;
  background:var(--c3-panel);border:1px solid var(--c3-line);border-radius:9px;
  overflow:hidden;max-height:calc(100vh - 30px);display:flex;flex-direction:column}
.c3wall .wh{display:flex;align-items:center;gap:9px;padding:11px 13px;
  border-bottom:1px solid var(--c3-line);flex:none}
.c3wall .wh b{font-size:12px;font-family:var(--c3-serif);letter-spacing:1px;color:var(--c3-paper)}
.c3wall .wh span{font-family:var(--c3-mono);font-size:9.5px;color:var(--c3-tx3)}
.c3wall .wh button{margin-left:auto;appearance:none;cursor:pointer;
  background:none;border:1px solid var(--c3-line2);border-radius:4px;
  color:var(--c3-tx3);width:20px;height:20px;line-height:1;font-size:12px;transition:.15s}
.c3wall .wh button:hover{color:var(--c3-gold);border-color:var(--c3-gold)}
.c3wall .wb{padding:10px;overflow-y:auto;flex:1;min-height:0;
  display:flex;flex-direction:column;gap:7px}
.c3wall.fold .wb{display:none}
.c3wnone{font-size:10.5px;color:var(--c3-tx3);line-height:1.9;text-align:center;padding:20px 8px}

.c3cl{
  background:linear-gradient(180deg,#efe6d2,#e3d7bd);
  border-radius:5px;padding:9px 10px 8px;cursor:pointer;transition:.15s;
  border:1px solid #cdbfa2;position:relative;overflow:hidden}
.c3cl::after{content:"";position:absolute;right:-9px;top:-9px;width:20px;height:20px;
  background:rgba(0,0,0,.06);transform:rotate(45deg)}
.c3cl:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.c3cl .tg{display:inline-block;font-family:var(--c3-mono);font-size:8px;
  letter-spacing:1px;padding:1px 5px;border-radius:2px;margin-bottom:5px;
  background:rgba(0,0,0,.09);color:#5b4a2e}
.c3cl .tg.core{background:rgba(192,80,58,.2);color:#8c3320}
.c3cl .tg.root{background:rgba(111,163,106,.24);color:#3c6b38}
.c3cl b{display:block;font-size:10.5px;color:#2a2317;line-height:1.55;
  font-family:var(--c3-serif);font-weight:600}
.c3cl .src{display:block;font-size:8.5px;color:#7a6a4e;margin-top:4px}

/* ---------------- 模态 ---------------- */
.c3modal{position:fixed;inset:0;z-index:120;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(5,4,3,.82);backdrop-filter:blur(3px)}
.c3modal.on{display:flex}
.c3m{width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:#0f0c09;border:1px solid var(--c3-line2);border-radius:10px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);animation:c3pop .24s ease}
@keyframes c3pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.c3mh{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--c3-line);flex:none}
.c3mh .tag{font-family:var(--c3-mono);font-size:8.5px;letter-spacing:1.4px;
  color:#1a1408;background:var(--c3-gold);padding:2px 7px;border-radius:3px}
.c3mh b{font-size:13px;color:var(--c3-paper);font-family:var(--c3-serif);letter-spacing:.6px}
.c3mh button{margin-left:auto;appearance:none;cursor:pointer;background:none;
  border:none;color:var(--c3-tx3);font-size:20px;line-height:1;padding:2px 6px;border-radius:4px;transition:.15s}
.c3mh button:hover{color:var(--c3-red);background:rgba(192,80,58,.12)}
.c3mb{margin:0;padding:16px;overflow-y:auto;flex:1;min-height:0;
  font-family:var(--c3-mono);font-size:11.5px;line-height:1.95;
  color:var(--c3-paper2);white-space:pre-wrap;word-break:break-word;
  background:
    repeating-linear-gradient(0deg,transparent 0 27px,rgba(201,162,39,.045) 27px 28px);
}
