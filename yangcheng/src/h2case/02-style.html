<style>
/* ==========================================================================
   H2 破案游戏 · 案卷 0117「十一日」
   浅色案卷纸皮，与 H2 主馆同源；所有类名 c2- 前缀，避免撞共享样式。
   ========================================================================== */
:root{
  --c2-paper:#f4efe3;
  --c2-paper2:#efe8d8;
  --c2-ink:#2b2822;
  --c2-ink2:#4a453b;
  --c2-ink3:#7a7364;
  --c2-line:#d6cbb4;
  --c2-line2:#c2b498;
  --c2-ac:#6b4ea8;
  --c2-ac2:#a887ff;
  --c2-red:#a8322a;
  --c2-gold:#a8842f;
  --c2-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --c2-serif:"Songti SC",SimSun,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 20% -10%,rgba(255,255,255,.7),transparent 60%),
    radial-gradient(900px 500px at 90% 110%,rgba(200,180,140,.28),transparent 60%),
    var(--c2-paper);
  color:var(--c2-ink);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    repeating-linear-gradient(0deg,rgba(120,100,60,.045) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(120,100,60,.035) 0 1px,transparent 1px 4px);
}

.c2wrap{position:relative;z-index:1;max-width:1420px;margin:0 auto;padding:0 20px 60px}

/* ---------------- 顶栏 ---------------- */
.c2bar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:13px 0 12px;border-bottom:2px solid var(--c2-ink);
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,var(--c2-paper) 76%,rgba(244,239,227,.86));
  backdrop-filter:blur(6px);
}
.c2bar .bk{
  text-decoration:none;color:var(--c2-ink2);font-size:11.5px;letter-spacing:.4px;
  border:1px solid var(--c2-line2);border-radius:5px;padding:5px 10px;transition:.15s;
}
.c2bar .bk:hover{border-color:var(--c2-ink);color:var(--c2-ink);background:#fff}
.c2ttl{display:flex;flex-direction:column;gap:1px;min-width:0}
.c2ttl b{font-family:var(--c2-serif);font-size:19px;letter-spacing:1px;line-height:1.2}
.c2ttl span{font-family:var(--c2-mono);font-size:9.5px;letter-spacing:1.6px;color:var(--c2-ink3)}
.c2bar .sp{flex:1}
.c2meter{display:flex;align-items:center;gap:7px;font-family:var(--c2-mono);font-size:10px;color:var(--c2-ink3)}
.c2pips{display:flex;gap:3px}
.c2pips i{width:9px;height:9px;border-radius:2px;background:var(--c2-line);display:block;transition:.2s}
.c2pips i.on{background:var(--c2-ac)}
.c2pips i.spent{background:var(--c2-red);opacity:.55}

/* ---------------- 幕导航 ---------------- */
.c2acts{display:flex;gap:0;margin:14px 0 0;border:1px solid var(--c2-line2);border-radius:8px;overflow:hidden;background:#fff}
.c2act{
  flex:1;border:0;border-right:1px solid var(--c2-line);background:transparent;cursor:pointer;
  padding:9px 10px;text-align:left;font:inherit;color:var(--c2-ink3);transition:.16s;position:relative;
}
.c2act:last-child{border-right:0}
.c2act b{display:block;font-size:12px;color:var(--c2-ink2);letter-spacing:.3px}
.c2act span{display:block;font-family:var(--c2-mono);font-size:8.5px;letter-spacing:1.2px;margin-top:1px}
.c2act:hover{background:rgba(107,78,168,.05)}
.c2act.on{background:rgba(107,78,168,.10);box-shadow:inset 0 -2px 0 var(--c2-ac)}
.c2act.on b{color:var(--c2-ac);font-weight:700}
.c2act.done b::after{content:" ✓";color:#3f8f5f}
.c2act:disabled{opacity:.42;cursor:not-allowed}

/* ---------------- 通用卡片 ---------------- */
.c2lay{display:none;padding-top:18px}
.c2lay.on{display:block;animation:c2in .28s ease}
@keyframes c2in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.c2card{
  background:#fff;border:1px solid var(--c2-line2);border-radius:9px;padding:16px 18px;
  box-shadow:0 1px 0 rgba(120,100,60,.10),0 10px 26px -22px rgba(60,45,20,.6);
}
.c2card + .c2card{margin-top:13px}
.c2h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.c2h h3{margin:0;font-family:var(--c2-serif);font-size:16.5px;letter-spacing:.4px}
.c2h .k{font-family:var(--c2-mono);font-size:8.5px;letter-spacing:1.6px;color:var(--c2-ink3);
  border:1px solid var(--c2-line2);border-radius:4px;padding:1px 5px}
.c2card p{margin:0 0 9px;font-size:12.5px;line-height:1.95;color:var(--c2-ink2)}
.c2card p:last-child{margin-bottom:0}
.c2card b{color:var(--c2-ink)}
.c2card b.hl{background:linear-gradient(transparent 62%,rgba(168,135,255,.42) 62%);padding:0 1px}

/* ---------------- 卷宗（幕一） ---------------- */
.c2doc{
  background:linear-gradient(180deg,#fffdf7,#fbf6e9);
  border:1px solid var(--c2-line2);border-left:4px solid var(--c2-red);
  border-radius:6px;padding:16px 18px;font-family:var(--c2-serif);
  font-size:13.5px;line-height:2.05;color:var(--c2-ink);position:relative;
}
.c2doc .stamp{
  position:absolute;right:16px;top:12px;transform:rotate(-8deg);
  border:2.5px solid rgba(168,50,42,.6);color:rgba(168,50,42,.72);
  font-family:var(--c2-mono);font-size:10px;letter-spacing:2px;
  padding:4px 9px;border-radius:4px;
}
.c2doc .lg{
  display:block;margin:9px 0;padding:9px 12px;border-left:2px solid var(--c2-line2);
  background:rgba(107,78,168,.055);font-family:var(--c2-mono);font-size:11.5px;
  line-height:1.95;color:var(--c2-ink2);letter-spacing:.2px;
}
.c2doc .lg em{color:var(--c2-red);font-style:normal;font-weight:700}

.c2pick{display:grid;gap:8px;margin-top:13px}
.c2p{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--c2-line);
  background:#fff;border-radius:7px;padding:10px 12px;cursor:pointer;transition:.14s;text-align:left;font:inherit;color:inherit}
.c2p:hover{border-color:var(--c2-ac2);background:rgba(168,135,255,.06)}
.c2p .bx{flex:0 0 15px;height:15px;border:1.5px solid var(--c2-line2);border-radius:3px;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:.14s}
.c2p.on{border-color:var(--c2-ac);background:rgba(107,78,168,.07)}
.c2p.on .bx{background:var(--c2-ac);border-color:var(--c2-ac)}
.c2p.ok{border-color:#3f8f5f;background:rgba(63,143,95,.08)}
.c2p.ok .bx{background:#3f8f5f;border-color:#3f8f5f}
.c2p.no{border-color:var(--c2-red);background:rgba(168,50,42,.06)}
.c2p.no .bx{background:var(--c2-red);border-color:var(--c2-red)}
.c2p .tx{font-size:12px;line-height:1.8;color:var(--c2-ink2)}
.c2p .tx b{color:var(--c2-ink)}

/* ---------------- 审讯室（幕二） ---------------- */
.c2room{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:13px;align-items:start}
@media(max-width:1180px){.c2room{grid-template-columns:220px minmax(0,1fr)}.c2wall{display:none}}

.c2list{border:1px solid var(--c2-line2);border-radius:9px;background:#fff;overflow:hidden}
.c2list .lt{padding:9px 12px;border-bottom:1px solid var(--c2-line);
  font-family:var(--c2-mono);font-size:9px;letter-spacing:1.5px;color:var(--c2-ink3);
  display:flex;justify-content:space-between;align-items:center}
.c2w{
  display:flex;gap:9px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--c2-line);
  background:transparent;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.13s;
}
.c2w:last-child{border-bottom:0}
.c2w:hover{background:rgba(107,78,168,.055)}
.c2w.on{background:rgba(107,78,168,.10);box-shadow:inset 3px 0 0 var(--c2-ac)}
.c2w .av{flex:0 0 30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:var(--c2-paper2);border:1px solid var(--c2-line2)}
.c2w .nm{flex:1;min-width:0}
.c2w .nm b{display:block;font-size:12px;color:var(--c2-ink);letter-spacing:.2px}
.c2w .nm span{display:block;font-size:9.5px;color:var(--c2-ink3);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2w .mk{font-family:var(--c2-mono);font-size:9px;color:var(--c2-ink3);flex:0 0 auto}
.c2w.tested .mk{color:var(--c2-ac);font-weight:700}

.c2dossier{border:1px solid var(--c2-line2);border-radius:9px;background:#fff;padding:0;overflow:hidden}
.c2dh{padding:12px 15px;border-bottom:1px solid var(--c2-line);display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(107,78,168,.05),transparent)}
.c2dh .av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:var(--c2-paper2);border:1px solid var(--c2-line2)}
.c2dh .nm b{display:block;font-family:var(--c2-serif);font-size:15.5px;letter-spacing:.5px}
.c2dh .nm span{display:block;font-family:var(--c2-mono);font-size:9px;letter-spacing:1.2px;color:var(--c2-ink3);margin-top:1px}
.c2dh .fg{margin-left:auto;font-family:var(--c2-mono);font-size:8.5px;letter-spacing:1.4px;
  border:1px solid var(--c2-line2);border-radius:4px;padding:2px 6px;color:var(--c2-ink3)}

.c2quote{padding:13px 15px;font-family:var(--c2-serif);font-size:13px;line-height:2;color:var(--c2-ink);
  border-bottom:1px dashed var(--c2-line);position:relative}
.c2quote::before{content:"「";position:absolute;left:5px;top:6px;font-size:22px;color:var(--c2-line2)}
.c2quote{padding-left:26px}
.c2quote::after{content:"」";color:var(--c2-line2)}
.c2meta{padding:9px 15px;border-bottom:1px solid var(--c2-line);
  display:flex;gap:14px;flex-wrap:wrap;font-family:var(--c2-mono);font-size:9.5px;color:var(--c2-ink3)}
.c2meta b{color:var(--c2-ink2);font-weight:600}

/* 追问 */
.c2more{padding:0 15px}
.c2more:empty{display:none}
.c2more .c2btn{font-size:11px;padding:5px 11px}
.c2more-line{
  border-left:2px solid var(--c2-ac);padding:9px 12px;margin:2px 0 11px;
  background:rgba(107,78,168,.05);border-radius:0 6px 6px 0;
  font-family:var(--c2-serif);font-size:12.5px;line-height:1.95;color:var(--c2-ink2);
  animation:c2in .3s ease;
}
.c2quote.typing::after{content:"▌";animation:c2Caret .6s steps(2) infinite;color:var(--c2-ac)}
@keyframes c2Caret{0%,49%{opacity:1}50%,100%{opacity:0}}

.c2test{padding:13px 15px}
.c2btn{
  cursor:pointer;border:1px solid var(--c2-ac);background:rgba(107,78,168,.10);color:var(--c2-ac);
  border-radius:6px;padding:8px 15px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.3px;transition:.15s;
}
.c2btn:hover:not(:disabled){background:rgba(107,78,168,.2)}
.c2btn:disabled{opacity:.4;cursor:not-allowed}
.c2btn.ghost{background:transparent;border-color:var(--c2-line2);color:var(--c2-ink2);font-weight:600}
.c2btn.ghost:hover:not(:disabled){border-color:var(--c2-ink2);background:rgba(120,100,60,.06)}
.c2btn.red{border-color:var(--c2-red);color:var(--c2-red);background:rgba(168,50,42,.08)}
.c2btn.red:hover:not(:disabled){background:rgba(168,50,42,.16)}
.c2btn.go{border-color:#3f8f5f;color:#2f7248;background:rgba(63,143,95,.1)}
.c2btn.go:hover:not(:disabled){background:rgba(63,143,95,.2)}

.c2res{margin-top:11px;border:1px solid var(--c2-line);border-radius:7px;padding:11px 13px;background:var(--c2-paper2);display:none}
.c2res.on{display:block;animation:c2in .3s ease}
.c2res .rl{font-family:var(--c2-mono);font-size:9px;letter-spacing:1.5px;color:var(--c2-ink3);margin-bottom:6px}
.c2res .rv{font-family:var(--c2-mono);font-size:27px;font-weight:700;letter-spacing:-.5px;line-height:1}
.c2res .rv.hi{color:var(--c2-red)}
.c2res .rv.mid{color:var(--c2-gold)}
.c2res .rv.lo{color:var(--c2-ink3)}
.c2res .rw{margin-top:7px;font-size:11.5px;line-height:1.8;color:var(--c2-ink2)}
.c2res .bar{height:5px;border-radius:3px;background:rgba(120,100,60,.16);overflow:hidden;margin-top:8px}
.c2res .bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* 线索墙 */
.c2wall{border:1px solid var(--c2-line2);border-radius:9px;background:#fff;overflow:hidden}
.c2wall .wt{padding:9px 12px;border-bottom:1px solid var(--c2-line);
  font-family:var(--c2-mono);font-size:9px;letter-spacing:1.5px;color:var(--c2-ink3)}
.c2wall .wb{padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:120px}
.c2row{display:flex;align-items:center;gap:7px;font-family:var(--c2-mono);font-size:9.5px;color:var(--c2-ink3)}
.c2row .lb{flex:0 0 46px;text-align:right;color:var(--c2-ink2);font-size:9px}
.c2row .tr{flex:1;height:8px;border-radius:2px;background:rgba(120,100,60,.13);overflow:hidden;position:relative}
.c2row .tr i{display:block;height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.c2row .vl{flex:0 0 32px;text-align:right;font-weight:700;color:var(--c2-ink2)}
.c2wall .wempty{font-size:11px;line-height:1.8;color:var(--c2-ink3)}
.c2base{margin:0 12px 12px;padding:8px 10px;border-radius:6px;background:rgba(107,78,168,.07);
  border:1px dashed rgba(107,78,168,.3);font-size:10.5px;line-height:1.75;color:var(--c2-ink2)}

/* ---------------- 对撞（幕三） ---------------- */
.c2pair{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}
.c2pc{border:1px solid var(--c2-line2);border-radius:8px;padding:11px 13px;background:var(--c2-paper2)}
.c2pc .t{font-family:var(--c2-mono);font-size:9px;letter-spacing:1.4px;color:var(--c2-ink3);margin-bottom:5px}
.c2pc .n{font-size:12.5px;font-weight:700;margin-bottom:5px}
.c2pc .v{font-family:var(--c2-mono);font-size:22px;font-weight:700;color:var(--c2-ac)}
.c2pc .d{font-size:10.5px;color:var(--c2-ink3);margin-top:4px;line-height:1.7}

/* ---------------- 指认（幕四） ---------------- */
.c2form{display:grid;gap:14px}
.c2fld{border:1px solid var(--c2-line);border-radius:8px;padding:12px 14px;background:#fff}
.c2fld .q{font-size:12.5px;font-weight:700;margin-bottom:9px;color:var(--c2-ink)}
.c2fld .q em{font-style:normal;font-family:var(--c2-mono);font-size:9px;letter-spacing:1.3px;color:var(--c2-ink3);margin-left:7px}
.c2opts{display:grid;gap:7px}
.c2o{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--c2-line);border-radius:6px;
  padding:8px 11px;cursor:pointer;font:inherit;color:inherit;background:transparent;text-align:left;transition:.13s}
.c2o:hover{border-color:var(--c2-ac2);background:rgba(168,135,255,.06)}
.c2o .rad{flex:0 0 13px;height:13px;border-radius:50%;border:1.5px solid var(--c2-line2);margin-top:2px}
.c2o.on{border-color:var(--c2-ac);background:rgba(107,78,168,.08)}
.c2o.on .rad{border-color:var(--c2-ac);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 8px var(--c2-ac)}
.c2o.ok{border-color:#3f8f5f;background:rgba(63,143,95,.09)}
.c2o.ok .rad{border-color:#3f8f5f;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 8px #3f8f5f}
.c2o.no{border-color:var(--c2-red);background:rgba(168,50,42,.06)}
.c2o .tx{font-size:11.5px;line-height:1.75;color:var(--c2-ink2)}

/* ---------------- 结算 ---------------- */
.c2score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:13px 0}
.c2sc{border:1px solid var(--c2-line2);border-radius:8px;padding:11px 12px;background:#fff}
.c2sc .l{font-family:var(--c2-mono);font-size:8.5px;letter-spacing:1.4px;color:var(--c2-ink3)}
.c2sc .v{font-family:var(--c2-mono);font-size:23px;font-weight:700;margin-top:3px;color:var(--c2-ink)}
.c2sc .d{font-size:10px;color:var(--c2-ink3);margin-top:2px}
.c2total{border:2px solid var(--c2-ink);border-radius:9px;padding:14px 16px;background:#fff;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.c2total .tv{font-family:var(--c2-mono);font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.c2total .tl{font-family:var(--c2-serif);font-size:15px;letter-spacing:.5px}
.c2total .td{font-size:11px;color:var(--c2-ink3);line-height:1.7;flex:1;min-width:180px}

.c2note{margin-top:12px;border-left:3px solid var(--c2-gold);padding:9px 13px;background:rgba(168,132,47,.07);
  font-size:11.5px;line-height:1.85;color:var(--c2-ink2);border-radius:0 6px 6px 0}
.c2note b{color:var(--c2-gold)}

.c2toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;
  background:var(--c2-ink);color:#f7f2e4;padding:10px 18px;border-radius:7px;
  font-size:12px;letter-spacing:.3px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.c2toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------------- 气氛层 ----------------
   这一层不改内容，只改「你现在在哪」的感觉：
   颗粒、暗角、随压力加深的四周、以及一条只在演出时出现的扫描线。
   全部 pointer-events:none，绝不挡任何一次点击。 */
.c2grain{
  position:fixed;inset:0;z-index:60;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.28'/></svg>");
  animation:c2Grain 1.1s steps(3) infinite;
}
@keyframes c2Grain{0%{transform:translate(0,0)}33%{transform:translate(-2%,1%)}66%{transform:translate(1%,-2%)}100%{transform:translate(0,0)}}
.c2vig{
  position:fixed;inset:0;z-index:59;pointer-events:none;transition:opacity .8s;
  background:radial-gradient(ellipse at 50% 45%,transparent 46%,rgba(28,16,10,.42) 100%);
  opacity:.35;
}
.c2vig.deep{opacity:.8}
.c2vig.beat{animation:c2VigBeat 2.6s ease-in-out infinite}
@keyframes c2VigBeat{0%,100%{opacity:.42}50%{opacity:.78}}

/* 声音开关 */
.c2snd{
  cursor:pointer;border:1px solid var(--c2-line2);background:#fff;color:var(--c2-ink2);
  border-radius:5px;padding:5px 10px;font:inherit;font-size:10.5px;letter-spacing:.3px;
  display:flex;align-items:center;gap:6px;transition:.15s;
}
.c2snd:hover{border-color:var(--c2-ink);color:var(--c2-ink)}
.c2snd .dot{width:6px;height:6px;border-radius:50%;background:var(--c2-line2);transition:.2s}
.c2snd.on{border-color:var(--c2-ac);color:var(--c2-ac);background:rgba(107,78,168,.07)}
.c2snd.on .dot{background:var(--c2-ac);box-shadow:0 0 0 3px rgba(107,78,168,.18);animation:c2Pulse 1.6s ease-in-out infinite}
@keyframes c2Pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* 案件压力条 */
.c2press{
  display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 11px;
  border:1px dashed var(--c2-line2);border-radius:7px;background:rgba(255,255,255,.6);
  font-family:var(--c2-mono);font-size:9px;letter-spacing:1.2px;color:var(--c2-ink3);
}
.c2press .bar{flex:1;height:5px;border-radius:3px;background:rgba(120,100,60,.15);overflow:hidden}
.c2press .bar i{display:block;height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,#c9a227,#a8322a);transition:width .9s cubic-bezier(.4,0,.2,1)}
.c2press b{font-size:10px;color:var(--c2-ink2);letter-spacing:0}

/* 卷宗逐行显现 */
.c2doc.reveal{animation:c2Reveal 1.5s steps(26) both}
@keyframes c2Reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.c2doc .scan{
  position:absolute;left:0;right:0;height:2px;top:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(168,50,42,.75),transparent);
  box-shadow:0 0 12px rgba(168,50,42,.6);animation:c2Scan 1.5s ease-out forwards;
}
@keyframes c2Scan{from{top:0;opacity:1}to{top:100%;opacity:0}}

/* 疑点卡入场 */
.c2pick .c2p{animation:c2Item .34s both}
.c2pick .c2p:nth-child(1){animation-delay:.04s}
.c2pick .c2p:nth-child(2){animation-delay:.09s}
.c2pick .c2p:nth-child(3){animation-delay:.14s}
.c2pick .c2p:nth-child(4){animation-delay:.19s}
.c2pick .c2p:nth-child(5){animation-delay:.24s}
.c2pick .c2p:nth-child(6){animation-delay:.29s}
@keyframes c2Item{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.c2p.on{animation:c2Tick .28s cubic-bezier(.3,1.6,.5,1)}
@keyframes c2Tick{0%{transform:scale(1)}45%{transform:scale(1.014)}100%{transform:scale(1)}}

/* 证人列表入场 */
.c2w{animation:c2Item .3s both}
.c2w:nth-child(1){animation-delay:.02s}
.c2w:nth-child(2){animation-delay:.06s}
.c2w:nth-child(3){animation-delay:.10s}
.c2w:nth-child(4){animation-delay:.14s}
.c2w:nth-child(5){animation-delay:.18s}
.c2w:nth-child(6){animation-delay:.22s}

/* 干预演算：90 道工单逐条翻过去 */
.c2comp{
  margin-top:11px;border:1px solid var(--c2-line2);border-radius:7px;padding:11px 13px;
  background:linear-gradient(180deg,#fffdf7,#faf4e6);font-family:var(--c2-mono);font-size:10px;
  color:var(--c2-ink2);animation:c2in .2s ease;
}
.c2comp .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;
  font-size:9px;letter-spacing:1.4px;color:var(--c2-ink3)}
.c2comp .hd b{color:var(--c2-red);font-size:11px;letter-spacing:0}
.c2comp .grid{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-bottom:8px}
.c2comp .grid i{height:9px;border-radius:1.5px;background:rgba(120,100,60,.14);transition:.1s}
.c2comp .grid i.f{background:var(--c2-red)}
.c2comp .grid i.s{background:rgba(120,100,60,.28)}
.c2comp .ft{font-size:9.5px;color:var(--c2-ink3);letter-spacing:.4px}

/* 结论印章 */
.c2stamp{
  position:absolute;right:26px;top:50%;transform:translateY(-50%) rotate(-14deg) scale(2.6);
  border:4px double rgba(168,50,42,.85);color:rgba(168,50,42,.9);
  font-family:var(--c2-serif);font-size:22px;font-weight:800;letter-spacing:5px;
  padding:9px 16px;border-radius:5px;opacity:0;pointer-events:none;
  text-shadow:0 0 1px rgba(168,50,42,.5);
}
.c2stamp.hit{animation:c2Stamp .62s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes c2Stamp{
  0%{opacity:0;transform:translateY(-50%) rotate(-14deg) scale(2.6)}
  55%{opacity:1;transform:translateY(-50%) rotate(-14deg) scale(.94)}
  70%{transform:translateY(-50%) rotate(-14deg) scale(1.04)}
  100%{opacity:1;transform:translateY(-50%) rotate(-14deg) scale(1)}
}
.c2total{position:relative;overflow:hidden}

/* 幕切换：标题闪一下 */
.c2flash{
  position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:70;pointer-events:none;
  font-family:var(--c2-serif);font-size:clamp(30px,6vw,64px);letter-spacing:14px;
  color:rgba(43,40,34,.10);white-space:nowrap;opacity:0;
}
.c2flash.on{animation:c2Flash .95s ease-out forwards}
@keyframes c2Flash{
  0%{opacity:0;transform:translate(-50%,-50%) scale(1.16)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.98)}
}

/* 结算数字滚动 */
.c2sc .v.count{color:var(--c2-ac)}

/* ---------------- 窄屏 ---------------- */
@media(max-width:820px){
  .c2wrap{padding:0 12px 50px}
  .c2bar{gap:8px;padding:10px 0}
  .c2ttl b{font-size:16px}
  .c2acts{flex-wrap:wrap}
  .c2act{flex:1 1 50%;border-bottom:1px solid var(--c2-line)}
  .c2act:nth-child(2n){border-right:0}
  .c2room{grid-template-columns:1fr}
  .c2list{max-height:none}
  .c2pair{grid-template-columns:1fr}
  .c2score{grid-template-columns:1fr 1fr}
  .c2doc{font-size:12.5px;padding:13px 14px}
  .c2doc .stamp{position:static;display:inline-block;transform:none;margin-bottom:8px}
  .c2total .tv{font-size:32px}
}
</style>
