<div class="cm-bg" aria-hidden="true"></div>
<header class="cm-top">
  <div class="cm-brand"><b>杨城</b><em>YANG CITY · 17 区总图</em></div>
  <div class="cm-spacer"></div>
  <span class="cm-clock" id="cmClock" datetime="">--:--</span>
  <div class="cm-time">
    <label for="cmHour">时间<output id="cmHourOut">--:--</output></label>
    <input id="cmHour" type="range" min="0" max="23.75" step="0.25" aria-label="演练小时，UTC+8">
    <button type="button" class="cm-btn on" id="cmReset" title="回到跟随北京时间的实时状态">北京时间</button>
  </div>
  <a class="cm-btn" href="evidence.html" title="跨馆证据比对与联合复核">公共证据厅</a>
  <button class="cm-btn" id="cmRandom" type="button" title="随机高亮一个区域（快捷键 R）">随机漫游</button>
  <a class="cm-btn" href="map.html" title="三维全城，可进到每一区的街区近景">杨城 3D</a>
</header>
<main class="cm-main">
  <svg id="cmMap" viewBox="0 0 1600 1400" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="杨城 17 区平面总图：按地块真实轮廓、街网与建筑平面绘制，点击区域进入三维街区，点击馆标直接参观"></svg>
</main>
<aside class="cm-panel" id="cmPanel" aria-live="polite">
  <div class="cm-panel-head">
    <span class="cm-panel-kicker" id="cmKick">区域</span>
    <button id="cmClose" type="button" aria-label="收起面板">×</button>
  </div>
  <h2 id="cmName">—</h2>
  <p class="cm-en" id="cmEn"></p>
  <p class="cm-desc" id="cmDesc"></p>
  <div class="cm-tags" id="cmTags"></div>
  <div class="cm-museums" id="cmMuseums"></div>
  <a class="cm-enter" id="cmEnter" href="district.html">进入三维街区 →</a>
</aside>
<div class="cm-legend" aria-hidden="true">
  <span><i style="background:#ffffff;border:1px solid #c9cfc2"></i>街道 / 街区</span>
  <span><i style="background:linear-gradient(90deg,#b3baa8,#5a6455)"></i>建筑（越深越高）</span>
  <span><i style="background:#a9cfe2"></i>澄川河与湖</span>
  <span><i style="background:repeating-linear-gradient(90deg,#c6a267 0 4px,transparent 4px 7px)"></i>城际高架</span>
  <span><i style="background:#d63d7e;border-radius:50%;width:9px;height:9px"></i>博物馆（可直达）</span>
</div>
<p class="cm-foot" id="cmHint"><b>点击任意区域</b>进三维街区 · 点<b>馆标</b>直接参观 · 拨时间看白天与夜间</p>
