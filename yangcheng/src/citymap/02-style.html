<style>
/* 杨城平面总图：深色全息 AI 城市风格，零依赖、可双击打开。 */
:root{
  --cm-bg:#070c16; --cm-bg2:#0b1322; --cm-ink:#e8f4ff; --cm-muted:#8fa8c0;
  --cm-cyan:#35d6e8; --cm-magenta:#ff4fa3; --cm-line:rgba(120,190,230,.14);
  --cm-panel:rgba(10,20,36,.88); --cm-border:rgba(120,200,240,.28);
  --sans:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  --mono:"Cascadia Code","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--sans);color:var(--cm-ink);background:
  radial-gradient(1200px 700px at 70% -10%, rgba(53,214,232,.10), transparent 60%),
  radial-gradient(900px 600px at 10% 110%, rgba(255,79,163,.08), transparent 60%),
  linear-gradient(180deg,var(--cm-bg),var(--cm-bg2));}
[hidden]{display:none!important}
button,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{text-decoration:none}
:focus-visible{outline:2px solid var(--cm-cyan);outline-offset:2px}

/* 背景网格与扫描线 */
.cm-bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg, var(--cm-line) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(90deg, var(--cm-line) 0 1px, transparent 1px 72px);
  mask-image:radial-gradient(75% 75% at 50% 45%, #000 30%, transparent 100%);}
.cm-bg::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(140,220,255,.028) 0 2px, transparent 2px 5px);}

/* 顶栏 */
.cm-top{position:fixed;z-index:30;left:0;right:0;top:0;height:58px;display:flex;align-items:center;
  gap:16px;padding:0 20px;background:linear-gradient(180deg,rgba(7,12,22,.92),rgba(7,12,22,.55) 80%,transparent);
  border-bottom:1px solid rgba(120,200,240,.16)}
.cm-brand{display:flex;align-items:baseline;gap:12px}
.cm-brand b{font-size:22px;letter-spacing:6px;
  background:linear-gradient(92deg,#bff3ff,#35d6e8 45%,#8f9dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cm-brand em{font-style:normal;font-size:11px;letter-spacing:3px;color:var(--cm-muted)}
.cm-top .cm-spacer{flex:1}
.cm-clock{font-family:var(--mono);font-size:13px;color:#9fd8e8;letter-spacing:1px;
  border:1px solid rgba(120,200,240,.25);padding:5px 10px;border-radius:3px;background:rgba(12,26,44,.6)}
.cm-btn{border:1px solid var(--cm-border);background:rgba(14,30,52,.75);padding:8px 14px;font-size:13px;
  border-radius:3px;letter-spacing:1px;transition:.18s;color:var(--cm-ink)}
.cm-btn:hover{border-color:var(--cm-cyan);color:#dff8ff;box-shadow:0 0 14px rgba(53,214,232,.35)}
.cm-btn.hot{border-color:var(--cm-cyan);color:#0a1420;background:linear-gradient(92deg,#59e6f5,#2fc4dd)}

/* 主区 */
.cm-main{position:absolute;inset:58px 0 0 0;z-index:1}
#cmMap{width:100%;height:100%;display:block}

/* SVG 元素 */
.d-blob{cursor:pointer;transition:filter .2s, opacity .3s;opacity:0;animation:bin .7s ease forwards;animation-delay:calc(var(--i)*55ms)}
@keyframes bin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.d-blob .fill{transition:fill-opacity .25s}
.d-blob .edge{transition:stroke-width .2s, filter .2s}
.d-blob:hover .fill{fill-opacity:.5}
.d-blob:hover .edge{stroke-width:2.4;filter:drop-shadow(0 0 7px currentColor)}
.d-blob.sel .fill{fill-opacity:.56}
.d-blob.sel .edge{stroke-width:3;filter:drop-shadow(0 0 11px currentColor)}
.d-name{pointer-events:none;font-size:15px;font-weight:700;fill:#eef8ff;text-anchor:middle;
  paint-order:stroke;stroke:rgba(5,10,18,.85);stroke-width:3px;letter-spacing:1px}
.d-en{pointer-events:none;font-size:8.5px;letter-spacing:2.5px;text-anchor:middle;fill-opacity:.9}
.d-road{stroke:rgba(150,205,240,.10);stroke-width:1;fill:none}
.d-road.major{stroke:rgba(170,215,245,.20);stroke-width:2}
.d-river{fill:none;stroke-linecap:round;stroke-linejoin:round}
.d-rail{fill:none;stroke:#ffd88f;stroke-width:2.6;stroke-dasharray:10 7;opacity:.75;stroke-linejoin:round;
  filter:drop-shadow(0 0 4px rgba(255,200,120,.6));animation:railflow 2.6s linear infinite}
@keyframes railflow{to{stroke-dashoffset:-34}}
.d-mark{fill:#bfe9ff;opacity:.85}
.d-museum{cursor:pointer}
.d-museum .halo{animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{r:5;opacity:.9}70%{r:15;opacity:0}100%{r:15;opacity:0}}
.d-museum text{font-size:10.5px;fill:#fff;paint-order:stroke;stroke:rgba(5,10,18,.9);stroke-width:2.5px;font-weight:650}
.d-museum:hover .core{filter:drop-shadow(0 0 9px currentColor)}
.cm-ring{fill:none;stroke-width:2;stroke-dasharray:14 9;opacity:.9;animation:ringspin 14s linear infinite}
@keyframes ringspin{to{transform:rotate(360deg)}}
.cm-ring2{fill:none;stroke-width:1;stroke-dasharray:3 6;opacity:.55;animation:ringspin 22s linear infinite reverse}
.d-badge{pointer-events:none}
.d-badge rect{fill:rgba(9,20,34,.85);stroke:#ffd45e;stroke-width:1.2}
.d-badge text{fill:#ffe6a8;font-size:11px;letter-spacing:3px;text-anchor:middle;font-weight:700}
.cm-grid-label{fill:rgba(140,190,220,.35);font-size:9px;letter-spacing:2px}

/* 信息面板 */
.cm-panel{position:fixed;z-index:25;left:20px;top:78px;width:318px;padding:16px 18px 18px;
  background:var(--cm-panel);border:1px solid var(--cm-border);border-top:3px solid var(--cm-cyan);
  box-shadow:0 18px 48px rgba(0,0,0,.5), inset 0 0 40px rgba(53,214,232,.05);backdrop-filter:blur(6px);
  transition:border-color .25s}
.cm-panel-head{display:flex;align-items:center;gap:8px}
.cm-panel-kicker{font-size:10px;letter-spacing:3px;color:#0a1626;background:linear-gradient(92deg,#6ee9f7,#39c9e2);
  padding:3px 9px;border-radius:2px;font-weight:700}
.cm-panel-kicker.rec{background:linear-gradient(92deg,#ffd45e,#ffb347);color:#231603}
#cmClose{margin-left:auto;color:var(--cm-muted);font-size:20px;line-height:1;padding:2px 6px}
#cmClose:hover{color:#fff}
.cm-panel h2{margin:12px 0 2px;font-size:24px;letter-spacing:2px}
.cm-en{margin:0 0 10px;font-size:10px;letter-spacing:3.5px;color:var(--cm-muted)}
.cm-desc{margin:0 0 12px;font-size:12.5px;line-height:1.9;color:#c6dcee}
.cm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cm-tags i{font-style:normal;font-size:10.5px;letter-spacing:1px;padding:4px 9px;border:1px solid var(--cm-border);
  border-radius:2px;color:#bfe4f5;background:rgba(20,42,66,.5)}
.cm-tags i b{color:#fff;font-weight:650}
.cm-museums{display:grid;gap:7px;margin-bottom:14px}
.cm-museums a{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--cm-border);
  background:rgba(16,34,56,.65);font-size:12.5px;transition:.18s}
.cm-museums a:hover{border-color:currentColor;box-shadow:0 0 12px -2px currentColor;transform:translateX(2px)}
.cm-museums .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.cm-museums .go{margin-left:auto;font-size:11px;color:var(--cm-muted)}
.cm-enter{display:block;text-align:center;padding:11px;font-size:14px;letter-spacing:2px;font-weight:700;
  color:#04121c;background:linear-gradient(92deg,#59e6f5,#2fa8e0);border-radius:2px;transition:.2s}
.cm-enter:hover{box-shadow:0 0 20px rgba(53,214,232,.55);filter:brightness(1.08)}

/* 图例与底栏 */
.cm-legend{position:fixed;z-index:24;right:20px;bottom:20px;display:grid;gap:5px;padding:10px 13px;
  background:rgba(9,18,32,.8);border:1px solid rgba(120,200,240,.18);font-size:10.5px;color:var(--cm-muted)}
.cm-legend span{display:flex;align-items:center;gap:8px}
.cm-legend i{width:16px;height:8px;border-radius:2px;flex:none}
.cm-foot{position:fixed;z-index:24;left:50%;transform:translateX(-50%);bottom:16px;padding:7px 18px;
  font-size:11.5px;letter-spacing:1px;color:#9fc4da;background:rgba(9,18,32,.72);
  border:1px solid rgba(120,200,240,.16);border-radius:20px}
.cm-foot b{color:#dff5ff}

@media (max-width:860px){
  .cm-panel{left:10px;right:10px;top:auto;bottom:12px;width:auto;max-height:44vh;overflow:auto;padding:12px 14px}
  .cm-panel h2{font-size:19px;margin-top:8px}
  .cm-legend{display:none}
  .cm-brand em{display:none}
  .cm-clock{display:none}
  .cm-top{gap:8px;padding:0 12px}
  .cm-btn{padding:7px 10px;font-size:12px}
}
@media (max-width:560px){
  /* 四项入口在窄屏挤不下：只留证据厅，旧馆与鸟瞰收进副行以外的最小字号 */
  .cm-top{gap:5px;padding:0 9px}
  .cm-btn{padding:6px 7px;font-size:11px;letter-spacing:0}
  .cm-brand b{font-size:19px;letter-spacing:3px}
  .cm-opt{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
