<style>
/* ===== 杨城首页：时间感知城市 ===== */
html,body{height:100%;overflow:hidden}
body{
  background:#0a1524;color:#eaf4ff;
  font-family:var(--sans);
}
#cityCv{
  position:fixed;inset:0;width:100%;height:100%;display:block;
  z-index:0;
}
/* 上下压暗，保证浮层文字可读 */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(4,12,24,.62) 0%,rgba(4,12,24,.18) 16%,transparent 34%,transparent 62%,rgba(4,10,20,.42) 86%,rgba(3,8,16,.72) 100%);
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:70px;z-index:20;
  display:flex;align-items:center;gap:26px;padding:0 26px;
}
.brand{
  display:flex;align-items:baseline;gap:10px;
  font-size:22px;font-weight:800;letter-spacing:5px;
  text-shadow:0 2px 18px rgba(0,0,0,.75);
}
.brand em{
  font-family:var(--mono);font-style:normal;font-size:9px;font-weight:600;
  letter-spacing:2.4px;color:rgba(200,232,255,.62);
}
.brand::after{
  content:"";width:1px;height:26px;margin-left:4px;
  background:linear-gradient(180deg,transparent,rgba(160,215,255,.5),transparent);
}

.clock{display:flex;align-items:baseline;gap:12px}
#clkTime{
  font-family:var(--mono);font-size:clamp(22px,2.6vw,32px);font-weight:600;
  letter-spacing:1.5px;line-height:1;
  font-variant-numeric:tabular-nums;
  color:#f2fbff;text-shadow:0 0 26px rgba(90,200,255,.55),0 2px 12px rgba(0,0,0,.8);
}
#clkPhase{
  font-size:11px;letter-spacing:1.6px;color:rgba(196,226,255,.78);
  padding:3px 9px;border-radius:99px;
  border:1px solid rgba(140,200,255,.26);
  background:rgba(10,26,44,.5);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
}

.topnav{margin-left:auto;display:flex;gap:8px}
.topnav a{
  font-size:11.5px;letter-spacing:.8px;color:rgba(214,236,255,.86);
  padding:7px 13px;border-radius:8px;text-decoration:none;
  border:1px solid rgba(150,205,255,.20);
  background:rgba(8,20,36,.46);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:.22s;
}
.topnav a:hover{border-color:rgba(120,225,255,.62);background:rgba(14,40,64,.7);color:#fff}

/* ---------- 左栏读数 ---------- */
.hudleft{
  position:fixed;left:26px;top:96px;z-index:15;
  width:172px;padding:13px 14px;border-radius:12px;
  border:1px solid rgba(150,205,255,.16);
  background:rgba(6,16,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(13px);
  box-shadow:0 18px 44px -22px rgba(0,0,0,.85);
}
.hudleft .ht{
  font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(160,196,226,.6);margin-bottom:9px;
}
.hudrow{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.hudrow span{font-size:10.5px;color:rgba(196,220,244,.8)}
.hudrow b{
  font-family:var(--mono);font-size:14px;font-weight:600;color:#eaf6ff;
  font-variant-numeric:tabular-nums;
}
.hudrow b small{font-size:9px;color:rgba(170,200,226,.62);font-weight:400}

/* ---------- 中央 CTA ---------- */
.cta{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  z-index:22;display:flex;flex-direction:column;align-items:center;gap:11px;
}
.maphint{
  position:relative;
  font-size:12px;letter-spacing:.5px;color:#0a1a2c;
  padding:7px 15px;border-radius:99px;
  background:linear-gradient(180deg,#eaf8ff,#c9e9ff);
  box-shadow:0 10px 30px -10px rgba(0,20,40,.7);
  white-space:nowrap;
  animation:hintFloat 3.2s ease-in-out infinite;
  transition:opacity .45s,transform .45s;
}
.maphint::after{
  content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
  width:10px;height:10px;background:#c9e9ff;border-radius:2px;
}
.maphint.gone{opacity:0;transform:translateY(6px);pointer-events:none}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.mapbtn{
  position:relative;display:flex;align-items:center;gap:13px;
  padding:14px 30px 14px 24px;border-radius:14px;text-decoration:none;
  color:#04141f;
  background:linear-gradient(135deg,#8fe9ff 0%,#4fc8f0 42%,#d9b364 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.42) inset,
    0 18px 42px -14px rgba(40,160,220,.85),
    0 0 58px -12px rgba(120,225,255,.55);
  transition:transform .26s cubic-bezier(.3,1.4,.5,1),box-shadow .26s;
  overflow:hidden;
}
.mapbtn::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 48%,transparent 66%);
  transform:translateX(-120%);
  animation:sheen 4.6s ease-in-out infinite;
}
@keyframes sheen{0%,62%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}
.mapbtn:hover{
  transform:translateY(-3px) scale(1.024);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.6) inset,
    0 24px 54px -14px rgba(40,160,220,.95),
    0 0 82px -8px rgba(120,225,255,.7);
}
.mapbtn svg{width:26px;height:26px;flex:none;position:relative;z-index:1}
.mapbtn .mbt{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1;text-align:left}
.mapbtn .mbt b{font-size:15.5px;font-weight:800;letter-spacing:2px;line-height:1.15}
.mapbtn .mbt i{
  font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:1.5px;
  color:rgba(4,20,31,.62);font-weight:600;
}

/* ---------- 底栏 ---------- */
.botbar{
  position:fixed;left:0;right:0;bottom:0;height:52px;z-index:20;
  display:flex;align-items:center;gap:16px;padding:0 26px;
  font-family:var(--mono);font-size:9px;letter-spacing:1.2px;
  color:rgba(178,206,232,.66);
  border-top:1px solid rgba(140,196,240,.14);
  background:linear-gradient(180deg,transparent,rgba(3,10,20,.62));
}
.botbar .sep{color:rgba(140,180,214,.34)}
.botbar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.botbar kbd{
  font-family:var(--mono);font-size:8.5px;padding:1.5px 5px;border-radius:4px;
  border:1px solid rgba(150,200,240,.28);color:rgba(206,230,250,.86);
}

/* ---------- 时段说明（右下） ---------- */
.phaseNote{
  position:fixed;right:26px;bottom:74px;z-index:15;
  max-width:236px;text-align:right;
  font-size:10.5px;line-height:1.75;color:rgba(200,224,246,.72);
  text-shadow:0 1px 10px rgba(0,0,0,.9);
  transition:opacity .5s;
}
.phaseNote b{color:#dff1ff;font-weight:600}

/* ---------- 今日值守（驻馆人轮值） ---------- */
.duty{
  position:fixed;right:26px;top:96px;z-index:15;width:238px;
  padding:13px 14px 11px;border-radius:12px;
  border:1px solid rgba(150,205,255,.16);
  background:rgba(6,16,30,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(13px);
  box-shadow:0 18px 44px -22px rgba(0,0,0,.85);
}
.duty-h{
  font-family:var(--mono);font-size:8.5px;letter-spacing:2px;
  color:rgba(160,196,226,.6);margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.duty-h::after{content:"";flex:1;height:1px;background:rgba(150,205,255,.14)}
.duty-p{
  display:flex;align-items:center;gap:8px;padding:5px 0;
  text-decoration:none;color:inherit;border-radius:8px;
  transition:.18s;
}
.duty-p:hover{background:rgba(150,205,255,.06)}
.duty-p .dn{min-width:0;flex:1}
.duty-p .dn b{display:block;font-size:12.5px;color:rgba(226,240,255,.95);font-weight:700;letter-spacing:.3px}
.duty-p .dn i{
  display:block;font-style:normal;font-size:9.5px;font-family:var(--mono);
  color:rgba(160,196,226,.68);letter-spacing:.5px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.duty-p .db{
  flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.4px;
  color:rgba(150,186,218,.5);
}
.duty-p .db.hot{color:#d9b364}
.duty-f{
  margin-top:9px;padding-top:8px;border-top:1px solid rgba(150,205,255,.12);
  font-size:9.5px;font-family:var(--mono);letter-spacing:.5px;
  color:rgba(150,186,218,.55);line-height:1.7;
}
.duty-f b{color:rgba(226,240,255,.9);font-weight:700}
.duty-f .mine{color:#d9b364}

/* ---------- 窄屏 ---------- */
@media (max-width:900px){
  .topbar{height:58px;padding:0 16px;gap:14px}
  .brand{font-size:17px;letter-spacing:3px}
  .brand em{display:none}
  #clkTime{font-size:20px}
  .hudleft{display:none}
  .duty{display:none}
  .phaseNote{display:none}
  .cta{bottom:72px}
  .mapbtn{padding:12px 22px 12px 18px}
  .mapbtn .mbt b{font-size:13.5px;letter-spacing:1px}
  .topnav a{padding:6px 10px;font-size:10.5px}
  .botbar{padding:0 14px;font-size:8px;gap:9px}
  .botbar .hide-sm{display:none}
}
@media (max-width:520px){
  .topnav a:first-child{display:none}
  .maphint{font-size:11px;padding:6px 12px}
}
</style>
