<style>
/* 首页把空间留给城市，地图才展开分类。白天是浅色玻璃，夜晚沿用同一布局。 */
:root{--yc-ink:#163346;--yc-muted:#42647a;--yc-panel:rgba(244,250,253,.9);--yc-sub:rgba(23,104,135,.07);--yc-line:rgba(35,87,115,.23);--yc-accent:#176887;--yc-shadow:0 12px 32px rgba(29,62,80,.13);--yc-bg:#b8dcef}
:root[data-city-theme="night"]{--yc-ink:#e8f5ff;--yc-muted:#afcbdc;--yc-panel:rgba(13,28,47,.9);--yc-sub:rgba(20,42,66,.55);--yc-line:rgba(145,206,234,.28);--yc-accent:#8be8ff;--yc-shadow:0 12px 32px rgba(0,0,0,.26);--yc-bg:#071320}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--yc-bg);color:var(--yc-ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,a{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--yc-accent);text-decoration:none}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--yc-accent);outline-offset:4px}
[hidden]{display:none!important}
#cityCv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:grab;touch-action:none}
#cityCv.dragging{cursor:grabbing}#cityCv.hot{cursor:pointer}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(225,242,250,.22),transparent 15%,transparent 85%,rgba(225,242,250,.17))}
:root[data-city-theme="night"] .vignette{background:linear-gradient(180deg,rgba(3,9,18,.25),transparent 20%,transparent 83%,rgba(3,9,18,.25))}
.boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:var(--yc-bg);transition:opacity .45s,visibility .45s}
.boot.done{opacity:0;visibility:hidden}.boot-in{text-align:center;width:min(320px,74vw)}
.boot-mark{font-size:44px;font-weight:750;letter-spacing:12px;text-indent:12px}.boot-sub{margin-top:12px;font-size:12px;color:var(--yc-muted)}
.boot-bar{margin:28px auto 0;height:3px;background:var(--yc-line);overflow:hidden}.boot-bar i{display:block;height:100%;width:0;background:var(--yc-accent);transition:width .2s}
.boot-log{margin-top:14px;font-size:12px;color:var(--yc-muted)}
.topbar{position:fixed;top:16px;left:24px;right:24px;z-index:20;display:flex;align-items:center;gap:24px;min-height:48px}
.brand{display:flex;align-items:baseline;gap:10px;font-size:25px;font-weight:750;letter-spacing:3px;color:var(--yc-ink)}
.brand em{font-size:10px;font-style:normal;font-weight:500;letter-spacing:0;color:var(--yc-muted)}
.clock{padding:8px 13px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--yc-panel);border:1px solid var(--yc-line);border-radius:8px;backdrop-filter:blur(12px)}
.clock-source{font-size:10px;font-weight:650;color:var(--yc-accent);padding:3px 5px;border:1px solid var(--yc-line);border-radius:3px}.clock[data-mode="rehearsal"]{border-color:var(--yc-accent)}.clock[data-mode="rehearsal"] .clock-source{background:var(--yc-accent);color:var(--yc-bg)}.real-clock{font-size:10px;color:var(--yc-muted);flex-basis:100%;line-height:1.4}
#clkTime{font-family:Consolas,"Microsoft YaHei",monospace;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1}
#clkPhase{font-size:10px;white-space:nowrap;color:var(--yc-muted)}
.topnav{margin-left:auto;display:flex;gap:6px}.topnav a{padding:9px 12px;font-size:12px;white-space:nowrap;border:1px solid var(--yc-line);background:var(--yc-panel);border-radius:6px;backdrop-filter:blur(12px);color:var(--yc-ink)}
.topnav a:hover{border-color:var(--yc-accent)}
.hudleft,.time-control{position:fixed;z-index:15;border:1px solid var(--yc-line);border-radius:9px;background:var(--yc-panel);backdrop-filter:blur(16px);box-shadow:var(--yc-shadow)}
summary{cursor:pointer;font-size:12px;padding:12px 14px;font-weight:600;user-select:none}
.hudleft{left:24px;top:83px;width:178px}.hudleft summary span{float:right;font-variant-numeric:tabular-nums;font-weight:500}
.hudrow{display:flex;align-items:baseline;justify-content:space-between;margin:0 14px;padding:5px 0;font-size:11px}.hudrow b{font-size:16px;font-variant-numeric:tabular-nums}.hudrow small{font-size:10px;font-weight:400;color:var(--yc-muted)}
.hudmini{padding:12px 14px;font-size:10px;line-height:1.7;color:var(--yc-muted)}
/* 分类定位：顶栏里的第五个入口。收起时就是一个普通按钮，
   展开时列表从按钮左下方浮出，不再占据地图右上角。 */
.nodes{position:relative;width:auto;flex:none}
.nodes > summary{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;
  font-size:12px;font-weight:500;white-space:nowrap;list-style:none;
  border:1px solid var(--yc-line);background:var(--yc-panel);border-radius:6px;
  backdrop-filter:blur(12px);color:var(--yc-ink);
  transition:border-color .16s,background .16s,color .16s}
.nodes > summary::-webkit-details-marker{display:none}
.nodes > summary::after{content:"▾";font-size:8px;line-height:1;opacity:.55}
.nodes > summary:hover{border-color:var(--yc-accent)}
.nodes[open] > summary{background:var(--yc-accent);color:var(--yc-bg);border-color:var(--yc-accent)}
.nodes-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:16;width:266px;
  max-height:min(58vh,440px);overflow:auto;overscroll-behavior:contain;
  border:1px solid var(--yc-line);border-radius:9px;background:var(--yc-panel);
  backdrop-filter:blur(16px);box-shadow:var(--yc-shadow);padding-top:10px}
#nodeList{padding:0 10px;max-height:none;overflow:visible}
.node-filters{display:flex;gap:4px;padding:0 10px 10px}.node-filters button{flex:1;padding:6px 3px;font-size:11px;border:1px solid var(--yc-line);background:transparent;border-radius:5px}.node-filters button[aria-pressed="true"]{background:var(--yc-accent);color:var(--yc-bg);border-color:var(--yc-accent)}
.node{display:flex;width:100%;align-items:center;gap:8px;text-align:left;padding:9px 5px;border:0;border-top:1px solid var(--yc-line);border-radius:0;background:transparent;color:var(--yc-ink)}
.node:hover,.node.selected{background:rgba(79,153,186,.13)}.node .dot{width:6px;height:20px;border-radius:2px;background:var(--c);flex:none}.node .nm{flex:1;min-width:0}.node .nm b{display:block;font-size:12px;font-weight:600}.node .nm i{display:block;font-size:10px;font-style:normal;color:var(--yc-muted);margin-top:3px;line-height:1.5}.node .st{font-size:9px;white-space:nowrap;color:var(--yc-muted)}
.nodes-f{margin:0;padding:10px 14px;font-size:10px;line-height:1.6;color:var(--yc-muted)}
.phaseNote{position:fixed;left:24px;bottom:198px;z-index:14;max-width:270px;font-size:11px;line-height:1.7;background:var(--yc-panel);padding:8px 12px;border-left:2px solid var(--yc-accent);border-radius:0 5px 5px 0;color:var(--yc-muted)}.phaseNote b{color:var(--yc-ink)}
.time-control{left:24px;bottom:60px;width:220px}.time-control label{display:flex;justify-content:space-between;gap:8px;margin:0 12px;font-size:11px}.time-control output{font-variant-numeric:tabular-nums}.time-control input[type="range"]{width:calc(100% - 24px);margin:10px 12px;accent-color:var(--yc-accent)}.time-actions{display:flex;gap:8px;align-items:center;padding:0 12px}.time-actions button{font-size:10px;padding:5px 6px;background:transparent;border:1px solid var(--yc-line);border-radius:4px}.time-actions label{margin:0;align-items:center;font-size:10px;white-space:nowrap}.time-actions input{accent-color:var(--yc-accent)}.time-control p{font-size:10px;color:var(--yc-muted);line-height:1.6;margin:10px 12px}
.cta{position:fixed;right:24px;bottom:70px;z-index:16;display:flex;flex-direction:column;align-items:flex-end;gap:12px}.maphint{padding:7px 12px;font-size:11px;background:var(--yc-panel);border:1px solid var(--yc-line);border-radius:5px}.maphint.gone{display:none}
.mapbtn{padding:13px 22px;border:1px solid var(--yc-line);border-radius:8px;color:var(--yc-ink);background:var(--yc-panel);box-shadow:var(--yc-shadow);backdrop-filter:blur(12px)}.mapbtn:hover{border-color:var(--yc-accent)}.mbt{display:flex;flex-direction:column;gap:4px}.mbt b{font-size:15px;font-weight:700}.mbt i{font-size:10px;font-style:normal;color:var(--yc-muted)}.new-hall{font-size:11px;padding:5px 8px;background:var(--yc-panel);border-radius:4px}
.hall-shortcuts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.map-tools{position:fixed;right:24px;bottom:70px;z-index:16;display:flex;align-items:center;gap:12px;background:var(--yc-panel);padding:8px 12px;border:1px solid var(--yc-line);border-radius:6px}.map-tools button,.card-locate{background:transparent;border:1px solid var(--yc-line);border-radius:5px;padding:7px 10px;font-size:11px}.map-tools span{font-size:10px;color:var(--yc-muted)}
/* 缩放控件：把「全城 / 城区 / 街区 / 建筑」四档写出来，人才知道自己推到了哪一层 */
.zoomctl{display:flex;align-items:center;border:1px solid var(--yc-line);border-radius:5px;overflow:hidden;background:var(--yc-sub)}
.zoomctl button{border:0;border-radius:0;background:transparent;padding:5px 9px;font-size:15px;line-height:1;color:var(--yc-ink)}
.zoomctl button:hover{background:var(--yc-line)}
.zoomctl output{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:62px;padding:1px 4px;font-variant-numeric:tabular-nums;border-left:1px solid var(--yc-line);border-right:1px solid var(--yc-line)}
.zoomctl output i{font-style:normal;font-size:8px;letter-spacing:.12em;color:var(--yc-muted)}
.zoomctl output b{font-size:11px;font-weight:600;color:var(--yc-ink)}
.zoomctl output[data-zone="建筑"] b{color:#b8791b}
:root[data-city-theme="night"] .zoomctl output[data-zone="建筑"] b{color:#ffcf72}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:20;min-height:36px;padding:9px 24px;display:flex;align-items:center;gap:16px;border-top:1px solid var(--yc-line);background:var(--yc-panel);color:var(--yc-muted);font-size:10px}.botbar .right{margin-left:auto;display:flex;gap:16px;align-items:center}.botbar kbd{font:inherit;color:var(--yc-ink)}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--yc-panel);border:1px solid var(--yc-line);color:var(--yc-ink);padding:7px 10px;border-radius:5px;font-size:11px;white-space:nowrap;opacity:0;transform:translate(-50%,-150%)}.tip.on{opacity:1}.tip i{font-size:9px;font-style:normal;color:var(--yc-muted);margin-left:7px}
.card{position:fixed;z-index:40;left:24px;bottom:110px;width:304px;max-height:calc(100vh - 200px);overflow:auto;padding:20px;background:var(--yc-panel);backdrop-filter:blur(18px);border:1px solid var(--yc-line);border-radius:10px;box-shadow:var(--yc-shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);transition:opacity .18s,transform .18s,visibility .18s}.card.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.card-x{position:absolute;right:10px;top:8px;border:0;background:transparent;padding:2px 6px;font-size:22px}.card-k{font-size:10px;color:var(--yc-muted);margin-bottom:10px}.card-n{font-size:21px;line-height:1.3;font-weight:700;margin:0 24px 0 0}.card-e{font-size:10px;color:var(--yc-muted);margin-top:6px}.card-l{font-size:12px;line-height:1.8;margin:14px 0 10px}.card-m{white-space:pre-line;font-size:10px;line-height:1.8;color:var(--yc-muted)}.card-locate{margin-top:12px}.card-go{display:block;text-align:center;margin-top:10px;padding:10px;color:var(--yc-bg);background:var(--yc-accent);border-radius:5px;font-size:12px;font-weight:600}.card-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px}.card-links a{padding:4px 0;text-decoration:underline;text-underline-offset:3px}
body.map-mode .cta{display:none}body.map-mode .phaseNote{display:none}body.card-open .phaseNote{display:none}
@media(max-width:1100px){.real-clock{display:none}.clock{max-width:420px}}
@media(max-width:1050px){.brand em{display:none}.topbar{gap:16px}#clkPhase{font-size:9px}.topnav a{padding:8px;font-size:11px}.botbar .hide-sm{display:none}#footPhase{display:none}}
@media(max-width:760px){.topbar{top:10px;left:12px;right:12px;gap:10px;flex-wrap:wrap}.brand{font-size:21px}.clock{padding:7px 9px;gap:6px}#clkTime{font-size:18px}#clkPhase{font-size:9px}.topnav{gap:4px}.topnav a{padding:7px 8px;font-size:10px}.topnav>a:last-of-type{display:none}.hudleft,.phaseNote{display:none}.nodes-pop{width:min(266px,calc(100vw - 24px));max-height:52vh}.nodes>summary{padding:8px;font-size:10.5px}.time-control{left:12px;bottom:55px;width:208px}body.bul-open .time-control{display:none}.cta{right:12px;bottom:62px}.maphint{display:none}.mapbtn{padding:10px 12px}.mbt b{font-size:12px}.mbt i{display:none}.new-hall{font-size:10px}.botbar{padding:7px 12px;gap:7px;font-size:9px}.botbar .right{max-width:46%;text-align:right}.map-tools{right:12px;bottom:57px}.map-tools span{display:none}.card{left:12px;bottom:102px;width:min(304px,calc(100vw - 24px));max-height:calc(100vh - 186px)}}
@media(max-width:480px){.topnav{margin-left:0;flex:1;justify-content:flex-end}.topnav a{font-size:9px;padding:7px 6px}.brand{font-size:19px}.clock{gap:5px}#clkPhase{max-width:86px;white-space:normal;font-size:8px}.topbar{gap:7px}.time-control{width:178px;bottom:118px}.time-actions{flex-wrap:wrap}.time-control summary{font-size:11px}.nodes>summary{font-size:9.5px;padding:7px 6px}}
/* 手机上公告栏是铺满宽度的底部抽屉，不用给谁让位 */
@media(max-width:760px){body.bul-open .cta,body.bul-open .map-tools{right:12px}}
/* 区域视角 HUD（district.html?zone=） */
.district-hud{position:fixed;z-index:22;left:18px;top:96px;width:316px;padding:15px 17px 16px;background:var(--yc-panel);border:1px solid var(--yc-line);border-top:3px solid var(--yc-accent,#8be8ff);box-shadow:var(--yc-shadow);backdrop-filter:blur(5px)}
.district-hud h2{margin:0 0 2px;font-size:22px;letter-spacing:2px}
.dh-en{font-size:10px;letter-spacing:3px;color:var(--yc-muted);margin-bottom:6px}
.dh-hint{margin:0 0 10px;padding:7px 9px;font-size:10.5px;line-height:1.7;color:var(--yc-muted);border-left:2px solid var(--yc-accent);background:var(--yc-sub)}
.dh-desc{margin:0 0 11px;font-size:12px;line-height:1.85;color:var(--yc-muted)}
.dh-museums{display:grid;gap:7px;margin-bottom:12px}
.dh-museums a{display:block;padding:9px 11px;border:1px solid var(--yc-line);background:var(--yc-sub);font-size:12.5px;color:var(--yc-ink);transition:.18s}
.dh-museums a:hover{border-color:var(--yc-accent);box-shadow:0 0 12px -2px var(--yc-accent)}
.dh-nav{display:flex;gap:8px}
.dh-nav a,.dh-nav button{flex:1;text-align:center;padding:8px 6px;border:1px solid var(--yc-line);background:transparent;font-size:11.5px;color:var(--yc-muted)}
.dh-nav a:hover,.dh-nav button:hover{color:var(--yc-ink);border-color:var(--yc-accent)}
@media(max-width:760px){.district-hud{left:10px;right:10px;top:auto;bottom:96px;width:auto;padding:11px 13px}.district-hud h2{font-size:18px}}
/* ============================================================
   城市公告栏 + 二维图层（本轮新增）
   ------------------------------------------------------------
   公告栏是右侧抽屉：收起时完全在画面外，不占场景；展开时压住
   六馆列表那一列（那一列本来也要收起）。抽屉不上遮罩——看公告
   的时候城还在转，这符合「城市里的一块告示板」而不是弹窗。
   ============================================================ */
.topnav button{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;font-size:12px;
  white-space:nowrap;border:1px solid var(--yc-line);background:var(--yc-panel);border-radius:6px;
  backdrop-filter:blur(12px);color:var(--yc-ink);cursor:pointer;transition:border-color .16s,background .16s}
.topnav button:hover{border-color:var(--yc-accent)}
.topnav button[aria-expanded="true"]{background:var(--yc-accent);color:var(--yc-bg);border-color:var(--yc-accent)}
.tn-count{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--yc-accent);color:var(--yc-bg);font-size:9.5px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}
.topnav button[aria-expanded="true"] .tn-count{background:var(--yc-bg);color:var(--yc-accent)}

/* ---------- 公告抽屉 ---------- */
.bul{position:fixed;right:0;top:72px;bottom:0;z-index:55;width:min(376px,100vw);
  display:flex;flex-direction:column;padding:20px 0 0;
  background:var(--yc-panel);backdrop-filter:blur(20px);
  border-left:1px solid var(--yc-line);border-top:1px solid var(--yc-line);
  border-radius:10px 0 0 0;box-shadow:-18px 0 46px rgba(20,44,60,.14);
  transform:translateX(calc(100% + 20px));visibility:hidden;
  transition:transform .32s cubic-bezier(.22,.7,.3,1),visibility .32s}
.bul.on{transform:none;visibility:visible}
.bul-h{display:flex;align-items:flex-start;gap:12px;padding:0 22px 12px}
.bul-ht{flex:1;min-width:0}
.bul-ht b{display:block;font-size:17px;font-weight:700;letter-spacing:.06em;color:var(--yc-ink)}
.bul-ht i{display:block;margin-top:4px;font-style:normal;font-size:9.5px;letter-spacing:.2em;
  color:var(--yc-muted)}
.bul-x{border:1px solid var(--yc-line);background:transparent;border-radius:5px;
  width:28px;height:28px;font-size:18px;line-height:1;color:var(--yc-muted);flex:none}
.bul-x:hover{color:var(--yc-ink);border-color:var(--yc-accent)}
.bul-sub{margin:0 22px 14px;padding-bottom:14px;border-bottom:1px solid var(--yc-line);
  font-size:11px;line-height:1.75;color:var(--yc-muted)}
.bul-list{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 8px}

.bul-item{display:block;position:relative;padding:13px 12px 13px 16px;border-radius:7px;
  text-decoration:none;color:var(--yc-ink);transition:background .16s}
.bul-item::before{content:"";position:absolute;left:5px;top:14px;bottom:14px;width:2.5px;
  border-radius:2px;background:var(--tone,#5b8ea8);opacity:.75;transition:opacity .16s}
.bul-item:hover{background:rgba(79,153,186,.1)}
.bul-item:hover::before{opacity:1}
.bi-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bi-date{font-family:Consolas,"Microsoft YaHei",monospace;font-size:10.5px;
  color:var(--yc-muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.bi-vendor{font-size:10.5px;font-weight:700;color:var(--tone,#5b8ea8)}
.bi-joint{font-size:9.5px;color:var(--yc-muted)}
.bi-st{margin-left:auto;font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:3px;
  border:1px solid var(--yc-line);color:var(--yc-muted);white-space:nowrap}
.bi-st.live{color:#2f7a4a;border-color:rgba(47,122,74,.5);background:rgba(47,122,74,.09)}
:root[data-city-theme="night"] .bi-st.live{color:#7fd6a0;border-color:rgba(127,214,160,.45);
  background:rgba(127,214,160,.1)}
.bi-title{font-size:14px;font-weight:700;line-height:1.45;letter-spacing:.02em}
.bi-title em{font-style:normal;font-size:10px;font-weight:400;letter-spacing:.12em;
  color:var(--yc-muted);margin-left:7px}
.bi-lead{margin:6px 0 0;font-size:11.5px;line-height:1.72;color:var(--yc-muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bul-f{display:flex;align-items:center;gap:12px;padding:12px 22px 14px;
  border-top:1px solid var(--yc-line);font-size:10px;color:var(--yc-muted)}
.bul-f a{margin-left:auto;color:var(--yc-accent);font-size:10.5px}

/* ---------- 二维图层 ---------- */
.lyr2d{position:fixed;inset:0;z-index:60;background:#dfe5d6;
  animation:l2in .28s ease both}
@keyframes l2in{from{opacity:0}to{opacity:1}}
.lyr2d iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#eef0e6}
.l2b{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2;
  display:flex;align-items:center;gap:14px;padding:8px 10px 8px 8px;
  background:rgba(247,249,241,.95);backdrop-filter:blur(14px);
