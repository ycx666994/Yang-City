<meta name="description" content="虚构未来 AI 城市杨城的平面区域总图：17 个风格街区，点击进入三维街区，点击馆标直接参观。">
<style>
/* 杨城平面总图 · 纸质制图风（day）/ 夜间灯图（night）
   上一版是深色全息：整页 #070c16，地块是发光圆斑。
   用户的原话是「黑漆漆的，太丑了，也体现不出杨城的容貌」。
   这一版按总图来配色：浅米纸、白街、灰楼、深蓝江；
   晚上 19:30 之后自动翻成夜图，楼里点灯。 */
:root{
  --cm-paper:#eef0e6; --cm-country:#d6dfc6; --cm-land:#e0e7d2;
  --cm-plate:#f1f1e8; --cm-plate-edge:#c2c8b7;
  --cm-block:#d9ddca; --cm-block2:#d0d5c0;
  --cm-b0:#c4cab6; --cm-b1:#b4bba4; --cm-b2:#a2aa91;
  --cm-b4:#8e9780; --cm-b5:#77826a; --cm-b6:#5b6751;
  --cm-ave:#ffffff; --cm-ave-edge:#dfe2d7;
  --cm-river:#a9cfe2; --cm-river-bank:#8cbdd6; --cm-water-2:#b6d8e6;
  --cm-rail:#c6a267; --cm-rail-casing:#efe7d4;
  --cm-bridge:#f7f6ef; --cm-bridge-in:#ffffff;
  --cm-plaza:#f4f2e5; --cm-sea:#b3d4e2;
  --cm-ink:#26302b; --cm-muted:#6f7d74; --cm-line:#d3d8cb;
  --cm-panel:#ffffff; --cm-panel-2:#f6f7f1; --cm-hair:#e2e6da;
  --cm-lit:#ffd88a; --cm-lit-op:0;
  --sans:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  --mono:"Cascadia Code","Consolas",monospace;
}
body[data-phase="dawn"]{ --cm-paper:#eee7dc; --cm-country:#e4e2cf; --cm-land:#ebe5d8;
  --cm-ave:#fffaf0; --cm-river:#a8c4d6; --cm-river-bank:#8fb0c6; }
body[data-phase="dusk"]{ --cm-paper:#e6ddd6; --cm-country:#dcd6c6; --cm-land:#e4ddd2;
  --cm-ave:#fff4e6; --cm-river:#8fa8c0; --cm-river-bank:#7793ad; --cm-block:#cdc7bd;
  --cm-b0:#c2bcb2; --cm-b1:#b6b0a5; --cm-b2:#a6a094; --cm-b3:#948e82; --cm-b4:#7e786e; }
body[data-phase="night"]{
  /* 夜图不是把白图整体压暗：夜里的主调是「街亮、楼暗」。
     街道被路灯照出来，所以 --cm-ave 要比街区亮一档；
     楼只剩轮廓，靠窗户的暖光点出来。压反了整张图就是一片黑。 */
  --cm-paper:#0a1119; --cm-country:#0e161f; --cm-land:#101a24;
  --cm-plate:#2a3947; --cm-plate-edge:#40566b;
  --cm-block:#18232e; --cm-block2:#1b2733;
  --cm-b0:#26323f; --cm-b1:#2d3b49; --cm-b2:#354555; --cm-b3:#3f5162;
  --cm-b4:#4a5e71; --cm-b5:#576d82; --cm-b6:#6b8399;
  --cm-ave:#4a6076; --cm-ave-edge:#22303e;
  --cm-river:#122f42; --cm-river-bank:#0e2534; --cm-water-2:#16384c;
  --cm-rail:#8a7448; --cm-rail-casing:#1d2a36;
  --cm-bridge:#32465a; --cm-bridge-in:#3c5468;
  --cm-plaza:#1d2a36; --cm-sea:#0f2b3c;
  --cm-ink:#e2ecf3; --cm-muted:#8ea3b3; --cm-line:#26343f;
  --cm-panel:#16202b; --cm-panel-2:#1b2733; --cm-hair:#26343f;
  --cm-lit:#ffd07a; --cm-lit-op:.92;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--sans);color:var(--cm-ink);background:var(--cm-paper);
  transition:background .5s ease,color .5s ease}
[hidden]{display:none!important}
button,a{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{text-decoration:none}
:focus-visible{outline:2px solid #2b7fa8;outline-offset:2px}

/* 纸纹：极淡的一层斜线，别抢图 */
.cm-bg{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:repeating-linear-gradient(45deg,rgba(120,132,110,.035) 0 1px,transparent 1px 6px)}
body[data-phase="night"] .cm-bg{opacity:.35;
  background:repeating-linear-gradient(45deg,rgba(120,180,220,.05) 0 1px,transparent 1px 6px)}

/* 顶栏 */
.cm-top{position:fixed;z-index:30;left:0;right:0;top:0;height:56px;display:flex;align-items:center;
  gap:14px;padding:0 18px;background:linear-gradient(180deg,var(--cm-panel) 72%,rgba(255,255,255,0));
  border-bottom:1px solid var(--cm-hair)}
body[data-phase="night"] .cm-top{background:linear-gradient(180deg,var(--cm-panel) 72%,rgba(13,21,32,0))}
.cm-brand{display:flex;align-items:baseline;gap:10px}
.cm-brand b{font-size:21px;letter-spacing:5px;color:var(--cm-ink)}
.cm-brand em{font-style:normal;font-size:10.5px;letter-spacing:2.5px;color:var(--cm-muted)}
.cm-top .cm-spacer{flex:1}
.cm-clock{font-family:var(--mono);font-size:12.5px;color:var(--cm-ink);letter-spacing:.5px;
  border:1px solid var(--cm-line);padding:5px 10px;border-radius:3px;background:var(--cm-panel-2)}
.cm-btn{border:1px solid var(--cm-line);background:var(--cm-panel-2);padding:7px 13px;font-size:12.5px;
  border-radius:3px;letter-spacing:.5px;transition:.16s;color:var(--cm-ink);white-space:nowrap}
.cm-btn:hover{border-color:#3f8fb5;color:#1d6b8c;background:#fff}
body[data-phase="night"] .cm-btn:hover{color:#bfe6f6;border-color:#3f8fb5;background:#1e2b38}

/* 时间条 */
.cm-time{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 12px;border:1px solid var(--cm-line);
  border-radius:3px;background:var(--cm-panel-2)}
.cm-time label{font-size:11.5px;color:var(--cm-muted);letter-spacing:.5px}
.cm-time output{font-family:var(--mono);color:var(--cm-ink);font-size:12px;margin-left:5px}
.cm-time input[type=range]{width:104px;accent-color:#3f8fb5}
.cm-time .cm-btn{padding:4px 9px;font-size:11.5px;border-radius:2px}
.cm-time .cm-btn.on{border-color:#3f8fb5;color:#1d6b8c;background:#eaf4f8}
body[data-phase="night"] .cm-time .cm-btn.on{color:#bfe6f6;background:#1d3242}

/* 主区 */
.cm-main{position:absolute;inset:56px 0 0 0;z-index:1}
@media(min-width:900px){.cm-main{left:348px}}
#cmMap{width:100%;height:100%;display:block}

/* ---------- 图纸 ---------- */
.cm-paper{fill:var(--cm-paper)}
.cm-country{fill:var(--cm-country)}
.cm-land{fill:var(--cm-land)}
.cm-ave{stroke:var(--cm-ave);stroke-linecap:round;opacity:.95}
.cm-ave.spine{stroke:var(--cm-ave);opacity:1}
.cm-river-bank{fill:var(--cm-river-bank);opacity:.55}
.cm-river{fill:var(--cm-river)}
.cm-rail-casing{fill:none;stroke:var(--cm-rail-casing);stroke-width:4.4;stroke-linejoin:round;stroke-linecap:round}
.cm-rail{fill:none;stroke:var(--cm-rail);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round;
  animation:railflow 3.4s linear infinite}
@keyframes railflow{to{stroke-dashoffset:-18}}
.cm-station{fill:var(--cm-paper);stroke:var(--cm-rail);stroke-width:2}
.cm-bridge{fill:var(--cm-bridge);stroke:var(--cm-river-bank);stroke-width:.8}
.cm-bridge-in{fill:var(--cm-bridge-in);opacity:.85}

/* 地块 */
.cm-g-district .cm-plate{fill:var(--cm-plate)}
.cm-g-district .cm-plate-edge{fill:none;stroke:var(--cm-plate-edge);stroke-width:1}
.cm-block{fill:var(--cm-block)}
.cm-dist-ave{stroke:var(--cm-ave);stroke-linecap:round;opacity:.96}
.cm-ring-road{stroke:var(--cm-ave);opacity:.96}
.cm-plaza{fill:var(--cm-plaza);stroke:var(--cm-plate-edge);stroke-width:.5}
.cm-inner-water{fill:var(--cm-water-2)}
.cm-lake{fill:var(--cm-river);stroke:var(--cm-river-bank);stroke-width:.8}
.cm-sea{fill:var(--cm-sea)}
.cm-shore{stroke:var(--cm-river-bank);stroke-width:1.1;stroke-dasharray:6 3}
.cm-bldg{stroke:rgba(60,70,58,.28);stroke-width:.35}
.cm-bldg.h0{fill:var(--cm-b0)} .cm-bldg.h1{fill:var(--cm-b1)} .cm-bldg.h2{fill:var(--cm-b2)}
.cm-bldg.h3{fill:var(--cm-b3)} .cm-bldg.h4{fill:var(--cm-b4)} .cm-bldg.h5{fill:var(--cm-b5)}
.cm-bldg.h6{fill:var(--cm-b6)}
body[data-phase="night"] .cm-bldg{stroke:rgba(10,18,26,.6)}
.cm-bldg-sh{fill:#5d6656;opacity:.14}
body[data-phase="night"] .cm-bldg-sh{fill:#000;opacity:.34}
.cm-lit{fill:var(--cm-lit);opacity:var(--cm-lit-op);transition:opacity .5s}
.cm-bldg-g{pointer-events:none}

/* 交互 */
.cm-hit{fill:transparent;cursor:pointer;transition:fill .18s}
.cm-hit:hover{fill:rgba(58,140,180,.09)}
body[data-phase="night"] .cm-hit:hover{fill:rgba(120,200,240,.10)}
.cm-hit.sel{fill:rgba(58,140,180,.13);stroke:#2f88ad;stroke-width:1.6;stroke-dasharray:5 4;
  animation:march 12s linear infinite}
body[data-phase="night"] .cm-hit.sel{fill:rgba(120,200,240,.12);stroke:#63c6e6}
@keyframes march{to{stroke-dashoffset:-72}}

/* 标签 */
.cm-lab{pointer-events:auto;cursor:pointer;transition:opacity .25s;opacity:.9}
.cm-lab:hover{opacity:1}
.cm-lab.on{opacity:1}
.cm-lab.on .cm-lab-bg{stroke:#2f88ad}
.cm-lab.on .cm-lab-name{fill:#1d6b8c}
.cm-lab-bg{fill:var(--cm-panel);opacity:.82;stroke:var(--cm-hair);stroke-width:.6}
.cm-lab-id{font-family:var(--mono);font-size:8.5px;fill:var(--cm-muted);letter-spacing:.5px}
.cm-lab-name{font-size:11px;font-weight:700;fill:var(--cm-ink);letter-spacing:.6px}
.cm-lab.featured .cm-lab-name{fill:#b8641c}
body[data-phase="night"] .cm-lab.featured .cm-lab-name{fill:#ffc06a}

/* 馆标 */
.cm-hall{cursor:pointer}
.cm-hall-dot{fill:currentColor;stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
body[data-phase="night"] .cm-hall-dot{stroke:#0d1520}
.cm-hall-halo{fill:currentColor;opacity:.18;animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{r:6;opacity:.34}70%{r:15;opacity:0}100%{r:15;opacity:0}}
.cm-hall-core{fill:#fff;opacity:.9}
.cm-hall-t{font-family:var(--mono);font-size:9px;font-weight:700;fill:var(--cm-ink);
  paint-order:stroke;stroke:var(--cm-paper);stroke-width:2.4px}
.cm-hall:hover .cm-hall-dot{filter:drop-shadow(0 0 7px currentColor)}
.cm-badge rect{fill:var(--cm-panel);stroke:#c9a24a;stroke-width:1}
.cm-badge text{fill:#a8761c;font-size:9px;letter-spacing:1px;text-anchor:middle;font-weight:700}
body[data-phase="night"] .cm-badge text{fill:#ffcf7d}

/* 信息面板 */
.cm-panel{position:fixed;z-index:25;left:18px;top:72px;width:314px;padding:15px 17px 17px;
  background:var(--cm-panel);border:1px solid var(--cm-hair);border-top:3px solid var(--c,#3f8fb5);
  box-shadow:0 14px 38px rgba(40,55,45,.16);border-radius:2px}
body[data-phase="night"] .cm-panel{box-shadow:0 14px 38px rgba(0,0,0,.55)}
.cm-panel-head{display:flex;align-items:center;gap:8px}
.cm-panel-kicker{font-size:10px;letter-spacing:2.5px;color:#fff;background:#3f8fb5;
  padding:3px 8px;border-radius:2px;font-weight:700}
.cm-panel-kicker.rec{background:#c9861c;color:#fff}
#cmClose{margin-left:auto;color:var(--cm-muted);font-size:19px;line-height:1;padding:2px 6px}
#cmClose:hover{color:var(--cm-ink)}
.cm-panel h2{margin:10px 0 1px;font-size:22px;letter-spacing:1.5px;color:var(--cm-ink)}
.cm-en{margin:0 0 9px;font-size:9.5px;letter-spacing:3px;color:var(--cm-muted);text-transform:uppercase}
.cm-desc{margin:0 0 11px;font-size:12.5px;line-height:1.85;color:var(--cm-ink);opacity:.86}
.cm-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px}
.cm-tags i{font-style:normal;font-size:10.5px;letter-spacing:.5px;padding:3px 8px;border:1px solid var(--cm-hair);
  border-radius:2px;color:var(--cm-muted);background:var(--cm-panel-2)}
.cm-tags i b{color:var(--cm-ink);font-weight:650}
.cm-museums{display:grid;gap:6px;margin-bottom:13px}
.cm-museums a{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--cm-hair);
  background:var(--cm-panel-2);font-size:12px;transition:.16s;color:var(--cm-ink);border-radius:2px}
.cm-museums a:hover{background:var(--cm-panel);border-color:currentColor}
.cm-museums .dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.cm-museums .go{margin-left:auto;font-size:10.5px;color:var(--cm-muted)}
.cm-enter{display:block;text-align:center;padding:10px;font-size:13.5px;letter-spacing:1.5px;font-weight:700;
  color:#fff;background:#2f7fa3;border-radius:2px;transition:.18s}
.cm-enter:hover{background:#256b8c}

/* 图例与底栏 */
.cm-legend{position:fixed;z-index:24;right:16px;bottom:16px;display:grid;gap:4px;padding:9px 12px;
  background:var(--cm-panel);border:1px solid var(--cm-hair);font-size:10.5px;color:var(--cm-muted);
  border-radius:2px}
.cm-legend span{display:flex;align-items:center;gap:7px}
.cm-legend i{width:14px;height:7px;border-radius:1px;flex:none}
.cm-foot{position:fixed;z-index:24;left:50%;transform:translateX(-50%);bottom:12px;padding:6px 16px;
  font-size:11.5px;letter-spacing:.5px;color:var(--cm-muted);background:var(--cm-panel);
  border:1px solid var(--cm-hair);border-radius:16px}
.cm-foot b{color:var(--cm-ink)}

@media (max-width:1080px){ .cm-time input[type=range]{width:76px} .cm-brand em{display:none} }
@media (max-width:860px){
  .cm-panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:44vh;overflow:auto;padding:12px 14px}
  .cm-panel h2{font-size:18px;margin-top:7px}
  .cm-legend{display:none}
  .cm-clock{display:none}
  .cm-top{gap:8px;padding:0 10px;height:52px}
  .cm-main{inset:52px 0 0 0}
  .cm-btn{padding:6px 9px;font-size:11.5px}
  .cm-time{padding:3px 8px}
}
@media (max-width:620px){
  .cm-time label{display:none}
  .cm-time input[type=range]{width:62px}
  .cm-brand b{font-size:18px;letter-spacing:3px}
  .cm-foot{display:none}
}
/* 嵌进三维页当图层时：本页顶栏让位给父页，图往上顶一段，
   给父页那条「← 返回三维」的工具条腾出位置。 */
body.in-frame .cm-top{display:none}
body.in-frame .cm-main{inset:76px 0 0 0}
body.in-frame .cm-panel{top:92px}
@media (min-width:900px){body.in-frame .cm-main{left:348px}}
@media (max-width:880px){
  body.in-frame .cm-main{inset:64px 0 0 0}
  body.in-frame .cm-panel{top:auto;bottom:12px;left:10px;right:10px;width:auto}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<div class="cm-bg" aria-hidden="true"></div>
<header class="cm-top">
  <div class="cm-brand"><b>杨城</b><em>YANG CITY · 17 区总图</em></div>
  <div class="cm-spacer"></div>
  <span class="cm-clock" id="cmClock" datetime="">--:--</span>
  <div class="cm-time">
    <label for="cmHour">时间<output id="cmHourOut">--:--</output></label>
    <input id="cmHour" type="range" min="0" max="23.75" step="0.25" aria-label="演练小时，UTC+8">
    <button type="button" class="cm-btn on" id="cmReset" title="回到跟随北京时间的实时状态">北京时间</button>
  </div>
  <a class="cm-btn" href="evidence.html" title="跨馆证据比对与联合复核">公共证据厅</a>
  <button class="cm-btn" id="cmRandom" type="button" title="随机高亮一个区域（快捷键 R）">随机漫游</button>
  <a class="cm-btn" href="map.html" title="三维全城，可进到每一区的街区近景">杨城 3D</a>
</header>
<main class="cm-main">
  <svg id="cmMap" viewBox="0 0 1600 1400" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="杨城 17 区平面总图：按地块真实轮廓、街网与建筑平面绘制，点击区域进入三维街区，点击馆标直接参观"></svg>
</main>
<aside class="cm-panel" id="cmPanel" aria-live="polite">
  <div class="cm-panel-head">
    <span class="cm-panel-kicker" id="cmKick">区域</span>
    <button id="cmClose" type="button" aria-label="收起面板">×</button>
  </div>
  <h2 id="cmName">—</h2>
  <p class="cm-en" id="cmEn"></p>
  <p class="cm-desc" id="cmDesc"></p>
  <div class="cm-tags" id="cmTags"></div>
  <div class="cm-museums" id="cmMuseums"></div>
  <a class="cm-enter" id="cmEnter" href="district.html">进入三维街区 →</a>
</aside>
<div class="cm-legend" aria-hidden="true">
  <span><i style="background:#ffffff;border:1px solid #c9cfc2"></i>街道 / 街区</span>
  <span><i style="background:linear-gradient(90deg,#b3baa8,#5a6455)"></i>建筑（越深越高）</span>
  <span><i style="background:#a9cfe2"></i>澄川河与湖</span>
  <span><i style="background:repeating-linear-gradient(90deg,#c6a267 0 4px,transparent 4px 7px)"></i>城际高架</span>
  <span><i style="background:#d63d7e;border-radius:50%;width:9px;height:9px"></i>博物馆（可直达）</span>
</div>
<p class="cm-foot" id="cmHint"><b>点击任意区域</b>进三维街区 · 点<b>馆标</b>直接参观 · 拨时间看白天与夜间</p>
<script>
/* 杨城 17 区划数据 · 3D 城市与平面总图共用。
   坐标是虚构局部场景单位（x: -3120..3260, z: -2700..2830），无地理底图。
   cx/cz/r 是片区在杨城总图上的位置与半径；三维城市按这张表把 17 个
   独立设计的街区拼成一座城，平面总图也按这张表绘制。
   vibe 决定该区 3D 街区的高度区间、立面色板与屋顶倾向；
   color/accent 是平面总图与 HUD 的主题色；marks 只是展示用归属清单。 */
(function (global) {
  "use strict";
  var DISTRICTS = [
    /* ---------------- 北岸 · 北排（工业与门户） ---------------- */

<script>

  ];
  function hClass(h) {
    for (var i = 0; i < HEIGHT_STEPS.length; i++) if (h <= HEIGHT_STEPS[i][0]) return "h" + HEIGHT_STEPS[i][1];
    return "h6";
  }

  var zones = {}, hallPos = {};

  DISTRICTS.forEach(function (d, di) {
    var plan = PLAN ? PLAN(d) : null;
    var hx = d.hx || d.r, hz = d.hz || d.r;
    var g = el("g", { transform: "translate(" + PX(d.cx) + "," + PY(d.cz) + ") scale(" + S + ")" }, gDistrict);
    g.style.setProperty("--i", di);
    var cid = "cmclip-" + d.id;
    var cp = el("clipPath", { id: cid }, el("defs", {}, map));
    el("rect", { x: -hx, y: -hz, width: hx * 2, height: hz * 2 }, cp);

    var body = el("g", { "clip-path": "url(#" + cid + ")" }, g);

    /* 地块底板 */
    el("rect", { x: -hx, y: -hz, width: hx * 2, height: hz * 2, class: "cm-plate" }, body);
    /* 地块轮廓：这一圈是二维图上唯一「硬」的边界，读图靠它分块 */
    el("rect", { x: -hx, y: -hz, width: hx * 2, height: hz * 2, class: "cm-plate-edge",
      "vector-effect": "non-scaling-stroke" }, body);

    if (plan) {
      /* --- 5a. 水系：海 / 湖 / 河 --- */
      if (plan.basin) {
        var bx = plan.basin.x0;
        el("rect", { x: bx, y: -hz, width: hx - bx, height: hz * 2, class: "cm-sea" }, body);
        el("line", { x1: bx, y1: -hz, x2: bx, y2: hz, class: "cm-shore",
          "vector-effect": "non-scaling-stroke" }, body);
      }
      if (plan.lake) {
        var lk = plan.lake;
        el("ellipse", { cx: lk.x, cy: lk.z, rx: lk.rx, ry: lk.rz, class: "cm-lake",
          transform: "rotate(" + ((lk.rot || 0) * 180 / Math.PI).toFixed(1) + "," + lk.x + "," + lk.z + ")" }, body);
      }
      if (plan.water && plan.water.pts) {
        var wp = plan.water.pts, hw = (plan.water.w || 60) / 2, A = [], Bk = [];
        for (var wi = 0; wi < wp.length; wi++) {
          var a2 = wp[Math.max(0, wi - 1)], b2 = wp[Math.min(wp.length - 1, wi + 1)];
          var dx2 = b2[0] - a2[0], dz2 = b2[1] - a2[1], l2 = Math.sqrt(dx2 * dx2 + dz2 * dz2) || 1;
          var nx2 = -dz2 / l2, nz2 = dx2 / l2;
          A.push([wp[wi][0] + nx2 * hw, wp[wi][1] + nz2 * hw]);
          Bk.push([wp[wi][0] - nx2 * hw, wp[wi][1] - nz2 * hw]);
        }
        var wd = "M" + A.map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join("L")
          + "L" + Bk.reverse().map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join("L") + "Z";
        el("path", { d: wd, class: "cm-inner-water" }, body);
      }

      /* --- 5b. 街网：街区是一块块浅灰，街是它们之间露出来的底板 --- */
      var gd = plan.grid;
      var R = plan.R || 470;
      if (gd && gd.type === "grid") {
        var ang = (gd.angle || 0) * 180 / Math.PI;
        var gg = el("g", { transform: "rotate(" + ang.toFixed(2) + ")" }, body);
        var sx = gd.spacingX || 96, sz = gd.spacingZ || 96;
        var major = gd.majorEvery || 3;
        var limX = hx * 1.45, limZ = hz * 1.45;
        var ix = 0;
        for (var cx0 = -limX; cx0 < limX; cx0 += sx, ix++) {
          var iz = 0;
          for (var cz0 = -limZ; cz0 < limZ; cz0 += sz, iz++) {
            /* 交叉口留得更宽 */
            var padX = (ix % major === 0) ? 13 : 8, padZ = (iz % major === 0) ? 13 : 8;
            el("rect", { x: +(cx0 + padX).toFixed(1), y: +(cz0 + padZ).toFixed(1),
              width: Math.max(2, sx - padX * 2), height: Math.max(2, sz - padZ * 2), class: "cm-block" }, gg);
          }
        }
      }

      /* --- 5c. 环路与林荫道 --- */
      (plan.rings || []).forEach(function (r) {
        el("circle", { cx: r.cx || 0, cy: r.cz || 0, r: r.r, fill: "none",
          class: "cm-ring-road", "stroke-width": Math.max(1.6, L(r.w || 26) * 1.4),
          "vector-effect": "non-scaling-stroke" }, body);
      });
      (plan.avenues || []).forEach(function (av) {
        el("line", { x1: av.from[0], y1: av.from[1], x2: av.to[0], y2: av.to[1],
          class: "cm-dist-ave", "stroke-width": Math.max(1.5, L(av.w || 30) * 1.4),
          "vector-effect": "non-scaling-stroke" }, body);
      });
      /* --- 5d. 广场 --- */
      (plan.plazas || []).forEach(function (pz) {
        el("rect", { x: pz.x - pz.w / 2, y: pz.z - pz.d / 2, width: pz.w, height: pz.d,
          rx: 3, class: "cm-plaza" }, body);
      });
      /* --- 5e. 真建筑 --- */
      var gh = el("g", { class: "cm-bldg-g" }, body);
      (plan.hero || []).forEach(function (h) {
        if (!h.w || !h.d) return;
        var rot = h.rot ? (h.rot * 180 / Math.PI) : 0;
        var tr = "rotate(" + rot.toFixed(1) + "," + h.x + "," + h.z + ")";
        if ((h.h || 0) >= 110) {
          /* 只有高个子才投影子：低层楼也投，图会糊成一片灰。 */
          el("rect", { x: +(h.x - h.w / 2 + 7).toFixed(1), y: +(h.z - h.d / 2 + 7).toFixed(1),
            width: h.w, height: h.d, transform: tr, class: "cm-bldg-sh" }, gh);
        }
        el("rect", { x: +(h.x - h.w / 2).toFixed(1), y: +(h.z - h.d / 2).toFixed(1),
          width: h.w, height: h.d, transform: tr, class: "cm-bldg " + hClass(h.h || 20) }, gh);
        /* 灯：夜里高楼上的一层亮窗 */
        if ((h.h || 0) >= 55) {
          el("rect", { x: +(h.x - h.w * 0.22).toFixed(1), y: +(h.z - h.d * 0.22).toFixed(1),
            width: +(h.w * 0.44).toFixed(1), height: +(h.d * 0.44).toFixed(1), transform: tr,
            class: "cm-lit" }, gh);
        }
        /* 记下每座馆在本区里的位置 */
        for (var hid in HALL_TYPE) {
          if (HALL_TYPE[hid] === h.type && (d.museums || []).indexOf(hid) >= 0 && !hallPos[hid]) {
            hallPos[hid] = { x: d.cx + h.x, z: d.cz + h.z };
          }
        }
      });
    }

    /* 交互层：透明矩形盖住整块地 */
    var hit = el("rect", { x: -hx, y: -hz, width: hx * 2, height: hz * 2, class: "cm-hit" }, body);
    zones[d.id] = { g: g, hit: hit, d: d, hx: hx, hz: hz, plan: plan };
    hit.addEventListener("mouseenter", function () { show(d); });
    hit.addEventListener("click", function () { go("district.html?zone=" + d.id); });

    /* --- 5f. 标签：挂在每块地头上那条缝里，不压街区 --- */
    var lx = PX(d.cx - hx) + 2, ly = PY(d.cz - hz) - 6;
    var nmW = d.name.length * 11.4 + 30;
    var gl = el("g", { class: "cm-lab" + (d.featured ? " featured" : "") }, gLabel);
    gl.dataset.id = d.id;
    el("rect", { x: lx - 3.5, y: ly - 10.5, width: nmW, height: 15, rx: 2, class: "cm-lab-bg" }, gl);
    el("text", { x: lx, y: ly, class: "cm-lab-id" }, gl).textContent = d.id;
    el("text", { x: lx + 22, y: ly, class: "cm-lab-name" }, gl).textContent = d.name;
    gl.addEventListener("mouseenter", function () { show(d); });
    zones[d.id].lab = gl;
  });

  /* ---------------- 6. 六馆 ---------------- */
  for (var hid in HALLS) {
    var p = hallPos[hid];
    if (!p) continue;
    var mu = HALLS[hid];
    var a = el("a", { class: "cm-hall", href: mu.href, "aria-label": "参观" + mu.name }, gPin);
    a.style.color = mu.color;
    var mx = PX(p.x), my = PY(p.z);
    el("circle", { cx: mx, cy: my, r: 7.5, class: "cm-hall-halo" }, a);
    el("circle", { cx: mx, cy: my, r: 4.6, class: "cm-hall-dot" }, a);
    el("circle", { cx: mx, cy: my, r: 1.8, class: "cm-hall-core" }, a);
    var t = el("text", { x: mx + 8, y: my + 3.4, class: "cm-hall-t" }, a);
    t.textContent = hid;
    var tt = document.createElementNS(SVG, "title"); tt.textContent = mu.name; a.appendChild(tt);
  }
  /* 中央广场与主塔 */
  var d01 = DISTRICTS.filter(function (x) { return x.id === "D01"; })[0];
  if (d01) {
    var tx = PX(d01.cx), ty = PY(d01.cz - 60);
    var bg = el("g", { class: "cm-badge" }, gPin);
    el("rect", { x: tx - 40, y: ty - 34, width: 80, height: 17, rx: 2 }, bg);
    el("text", { x: tx, y: ty - 22 }, bg).textContent = "中央广场 · 主塔";
  }

  /* ---------------- 7. 面板与选中 ---------------- */
  var selected = null;
  function show(d) {
    selected = d;
    for (var id in zones) {
      var z = zones[id];
      z.hit.classList.toggle("sel", id === d.id);
      z.lab.classList.toggle("on", id === d.id);
    }
    $("cmPanel").style.setProperty("--c", d.color || "#4a7f9c");
    $("cmKick").textContent = d.featured ? "推荐参观" : (VIBE_LABEL[d.vibe] || d.vibe);
    $("cmKick").className = "cm-panel-kicker" + (d.featured ? " rec" : "");
    $("cmName").textContent = d.name;
    $("cmEn").textContent = d.id + " · " + d.en;
    $("cmDesc").textContent = d.desc;
    var tags = $("cmTags"); tags.replaceChildren();
    [[VIBE_LABEL[d.vibe] || d.vibe], ["天际线 " + d.minH + "–" + d.maxH + " m"],
      [d.museums.length ? d.museums.length + " 座博物馆" : "无常设馆"]].forEach(function (pair) {
      var tag = document.createElement("i");
      var b = document.createElement("b"); b.textContent = pair[0];
      tag.appendChild(b); tags.appendChild(tag);
    });
    var box = $("cmMuseums"); box.replaceChildren();
    d.museums.forEach(function (hid) {
      var mu = HALLS[hid]; if (!mu) return;
      var a = document.createElement("a"); a.href = mu.href; a.style.color = mu.color;
      var dot = document.createElement("span"); dot.className = "dot"; a.appendChild(dot);
      var nm = document.createElement("span"); nm.textContent = hid + " · " + mu.name; a.appendChild(nm);
      var go = document.createElement("span"); go.className = "go"; go.textContent = "直接参观 →"; a.appendChild(go);
      box.appendChild(a);
    });
    $("cmEnter").href = "district.html?zone=" + d.id + "&" + phaseQuery();
    $("cmEnter").textContent = "进入" + d.name + " →";
    $("cmPanel").hidden = false;
  }
  $("cmClose").addEventListener("click", function () { $("cmPanel").hidden = true; });
  $("cmRandom").addEventListener("click", roll);
  function roll() {
    show(DISTRICTS[Math.floor(Math.random() * DISTRICTS.length)]);
  }
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "r" || e.key === "R") roll();
  });

  /* ---------------- 8. 时间 ---------------- */
  /* 和 3D 同一套口径：默认跟随北京时间，滑杆只冻结「演练时钟」。
     二维图上时间不是装饰——它决定这张图是白天总图还是夜间灯图。 */
  var autoTime = true, simHour = null;
  function phaseOf(h) {
    if (h >= 6.5 && h < 17.5) return "day";
    if (h >= 5 && h < 6.5) return "dawn";
    if (h >= 17.5 && h < 19.5) return "dusk";
    return "night";
  }
  function phaseQuery() { return autoTime ? "" : "time=" + simHour; }
  function fmt(h) {
    var hh = Math.floor(h) % 24, mm = Math.round((h - Math.floor(h)) * 60);
    return ("0" + hh).slice(-2) + ":" + ("0" + mm).slice(-2);
  }
  function applyPhase(h) {
    var ph = phaseOf(h);
    document.body.dataset.phase = ph;
    $("cmHourOut").textContent = fmt(h);
    document.body.classList.toggle("is-night", ph === "night");
  }
  function beijingNow() { var n = new Date(Date.now() + 8 * 3600000); return n.getUTCHours() + n.getUTCMinutes() / 60; }
  function tick() {
    if (autoTime) {
      var h = beijingNow();
      applyPhase(h);
      $("cmHour").value = h.toFixed(2);
      $("cmReset").classList.add("on");
      $("cmClock").textContent = fmt(h) + " 北京时间";
    }
  }
  $("cmHour").addEventListener("input", function () {
    autoTime = false; simHour = parseFloat(this.value);
    $("cmReset").classList.remove("on");
    applyPhase(simHour);
    $("cmClock").textContent = fmt(simHour) + " 演练时间";
  });
  $("cmReset").addEventListener("click", function () {
    autoTime = true; simHour = null; tick();
  });

  var q = new URLSearchParams(location.search);
  var pinned = q.get("zone");
  if (q.get("time") !== null && q.get("time") !== "") {
    autoTime = false; simHour = parseFloat(q.get("time")) || 0;
    $("cmHour").value = simHour;
    applyPhase(simHour);
    $("cmClock").textContent = fmt(simHour) + " 演练时间";
  } else {
    tick();
  }
  setInterval(tick, 20000);

  var initial = pinned && zones[pinned] ? DISTRICTS.filter(function (d) { return d.id === pinned; })[0] : null;
  if (initial) show(initial); else roll();
})();

</script>
</body>
</html>
